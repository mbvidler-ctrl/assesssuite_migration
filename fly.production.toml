# Fly.io configuration — AssessSuite PRODUCTION (launch, 13 July 2026).
#
# Differences from the demo (fly.toml / unimatter-demo), all deliberate:
#   - The image CMD runs the bounded production bootstrap before the server:
#     only approved reference catalogues are seeded idempotently; the full
#     synthetic seeder refuses to run under NODE_ENV=production. Do not add a
#     Fly [processes] override: Fly passes it as argv and does not evaluate
#     shell operators such as `&&`.
#   - A persistent volume holds server/data (SQLite WAL db) and, via
#     UPLOADS_DIR, the uploads store — state survives deploys and restarts.
#   - ALLOW_OPEN_REGISTRATION=1: self-signup is open (the image carries the
#     hardened OTP flow — random expiring codes, lockout, real email; the
#     fixed 000000 code is accepted only under SELFTEST).
#   - Registration/transcription/legal posture comes from reviewed env:
#     TRANSCRIPTION_ENABLED=1 with durable per-user API usage admission;
#     LEGAL_STATUS and LEGAL_EFFECTIVE_DATE are immutable release metadata.
#
# TOPOLOGY CONSTRAINT (do not "fix"): one machine mounts the sole active data
# volume, assesssuite_data_r12. SQLite cannot scale out (a second machine would
# get an EMPTY volume and split the data) and cannot blue-green deploy (the
# active volume is attached to the running machine). One detached legacy 3 GB
# volume named assesssuite_data is intentionally retained as a recovery
# artefact and must not be attached, renamed, deleted, or adopted by deploys.
# The immutable default-branch production workflow is the sole deployment
# corridor and proves this exact two-volume inventory; direct/local Fly
# deployment is intentionally prohibited.
#
# Required opaque secret names (values never enter this file or release logs):
#   ADMIN_PASSWORD (strong — the repo default is public), RESEND_API_KEY,
#   APP_URL and OPENAI_API_KEY. APP_URL is staged to the exact application
#   origin by the trusted workflow and checked against EXPECTED_APP_URL before
#   the production process can start; provider credentials never enter this file.
#   at go-live STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET /
#   STRIPE_PRICE_ID_MONTHLY / STRIPE_PRICE_ID_ANNUAL.
# The trusted workflow performs a names-only, exact-app preflight before every
# release. `npm run deploy:prod` fails closed; never replace it with a local Fly
# command. Fly secrets are per-app and never cross between apps.

app = "assesssuite-production"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  ALLOW_OPEN_REGISTRATION = "1"
  ADMIN_EMAIL = "admin@assesssuite.com"
  OUTBOUND_EMAIL_ENABLED = "1"
  OUTBOUND_SMS_ENABLED = "0"
  PAYMENTS_ENABLED = "1"
  EXPECTED_APP_URL = "https://app.assesssuite.com"
  UPLOADS_DIR = "/app/server/data/uploads"
  LLM_REQUIRED = "1"
  # Emergency global clinical-AI restoration authorised by Maxwell Vidler on
  # 28 July 2026. LLM_REQUIRED remains enabled so provider failures stay loud,
  # and rollback preserves this live-v31 enabled posture.
  GENERAL_CLINICAL_LLM_ENABLED = "1"
  TRANSCRIPTION_ENABLED = "1"
  OPENAI_TRANSCRIBE_MODEL = "whisper-1"
  # Durable per-user/provider-spend policy. These reviewed non-secret values
  # are forbidden from opaque secret overrides by the production preflight.
  AI_USAGE_USER_ROLLING_24H_USD = "5"
  AI_USAGE_USER_ROLLING_24H_CALLS = "100"
  AI_USAGE_GLOBAL_MONTHLY_USD = "100"
  AI_USAGE_INVOKE_FAST_ESTIMATE_USD = "0.07"
  AI_USAGE_INVOKE_QUALITY_ESTIMATE_USD = "0.33"
  AI_USAGE_TRANSCRIPTION_ESTIMATE_USD = "3.00"
  AI_USAGE_SOAP_ESTIMATE_USD = "0.33"
  AI_USAGE_DOCUMENT_EXTRACTION_ESTIMATE_USD = "0.20"
  GENERAL_CLINICAL_LLM_MAX_OUTPUT_UNITS = "32768"
  DOCUMENT_EXTRACTION_ENABLED = "1"
  OPENAI_HEALTH_DATA_TERMS_CONFIRMED = "1"
  DOCUMENT_EXTRACTION_UNDER_13_ENABLED = "0"
  # Production upload audit receipts contain metadata only. The server also
  # fails closed if an opaque runtime override attempts to change this period.
  UPLOAD_AUDIT_RETENTION_DAYS = "730"
  UPLOAD_CLEANUP_INTERVAL_MINUTES = "1"
  LEGAL_STATUS = "effective"
  LEGAL_EFFECTIVE_DATE = "19 July 2026"

[mounts]
  source = "assesssuite_data_r12"
  destination = "/app/server/data"
  # These settings govern newly created volumes. The trusted deployment
  # workflow separately verifies and pins the existing production volume.
  snapshot_retention = 5
  scheduled_snapshots = true

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
