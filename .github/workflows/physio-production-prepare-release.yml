          ORGANIZATION="$work/organization.body" PROJECT="$work/project.body" RELEASE="$work/release-readback.json" \
          REGION_URL="$REGION_URL" OUT="$packet/provider-release-readback.json" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const organization=JSON.parse(fs.readFileSync(process.env.ORGANIZATION,'utf8'));
          const project=JSON.parse(fs.readFileSync(process.env.PROJECT,'utf8'));
