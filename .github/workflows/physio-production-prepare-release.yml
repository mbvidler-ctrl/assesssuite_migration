            if [[ "$relative" == 'SHA256SUMS' || "$relative" == 'provider-current-readiness-readback.json' || \
              "$relative" == 'provider-current-readiness-request-id-hashes.json' || "$relative" == 'sentry-current-readiness.json' ]]; then
              continue
            fi
            install -d -m 0700 "$packet/$(dirname "$relative")"
            install -m 0600 "$prior/$relative" "$packet/$relative"
          done < <(find "$prior" -type f -printf '%P\n' | LC_ALL=C sort)
          for file in provider-current-readiness-readback.json provider-current-readiness-request-id-hashes.json sentry-current-readiness.json; do
            install -m 0600 "$readiness/$file" "$packet/$file"
          done
          (cd "$packet" && LC_ALL=C find . -type f ! -path './SHA256SUMS' -printf '%P\n' | sort | \
            xargs sha256sum >SHA256SUMS && sha256sum --check --strict SHA256SUMS)
          node scripts/physio-sentry-release-contract.mjs validate-release-packet \
            --packet "$packet" --application-sha "$APPLICATION_SHA" \
            --capability-intent-id "$CAPABILITY_INTENT_ID" --authority-reference "$AUTHORITY_REFERENCE" \
            --source-map-manifest-sha256 "$SOURCE_MAP_MANIFEST_SHA256" \
            --source-map-archive-sha256 "$SOURCE_MAP_ARCHIVE_SHA256"
