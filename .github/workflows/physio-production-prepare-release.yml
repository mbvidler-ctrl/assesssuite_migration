          const nextSegments = links[0].slice(links[0].indexOf(':') + 1).split(',').map((v) => v.trim()).filter((v) => /rel="next"/.test(v));
          if (nextSegments.length !== 1) throw new Error('compensation deploy next page is ambiguous');
