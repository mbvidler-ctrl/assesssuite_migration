          if(row.slug!=='unimatter'||row.links?.regionUrl!==process.env.REGION_URL) throw new Error('Sentry organization changed before compensation');
          NODE
          request project GET "$REGION_URL/api/0/projects/unimatter/assesssuite-production/"
          [[ "$(cat "$work/project.status")" == '200' ]]
          PROJECT="$work/project.body" REGION_URL="$REGION_URL" node --input-type=module <<'NODE'
          import fs from 'node:fs'; const row=JSON.parse(fs.readFileSync(process.env.PROJECT,'utf8'));
          if(String(row.id)!=='4511827129663488'||row.slug!=='assesssuite-production'||
