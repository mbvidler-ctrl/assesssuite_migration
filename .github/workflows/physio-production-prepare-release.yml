          import fs from 'node:fs';const phase=JSON.parse(fs.readFileSync(process.env.PHASE,'utf8'));const row={contract_version:'assesssuite-physio-sentry-release/1.0.0',result:'PASS',application:'assesssuite-physio-production',application_sha:process.env.APPLICATION_SHA,profession_id:'physio',sentry_org:'unimatter',sentry_project:'assesssuite-production',sentry_project_id:'4511827129663488',sentry_environment:'physio-production',release_version:phase.release_version,source_map_manifest_sha256:process.env.MAP_MANIFEST_SHA,source_map_archive_sha256:process.env.MAP_ARCHIVE_SHA,source_map_runtime_count:Number(process.env.MAP_COUNT),source_map_count:Number(process.env.MAP_COUNT),source_maps_uploaded:true,release_finalized:true,source_map_upload_stdout_sha256:process.env.STDOUT_SHA,source_map_upload_stderr_sha256:process.env.STDERR_SHA,provider_release_readback_sha256:process.env.READBACK_SHA,credential_scope:['SENTRY_AUTH_TOKEN'],provider_request_id_hashes_sha256:process.env.REQUEST_SHA,started_effect_artifact_id:process.env.STARTED_ID,started_effect_artifact_digest:process.env.STARTED_DIGEST,started_effect_receipt_sha256:process.env.STARTED_SHA,effect_reconciliation_receipt_sha256:process.env.EFFECT_SHA,fly_credential_absent:true,sentry_dsn_absent:true,completed_at:new Date().toISOString()};fs.writeFileSync(process.env.RECEIPT,JSON.stringify(row,null,2)+'\n',{flag:'wx',mode:0o600});
          NODE
          (cd "$packet" && LC_ALL=C find . -type f ! -path './SHA256SUMS' -printf '%P\n' | sort | \
            xargs sha256sum >SHA256SUMS && sha256sum --check --strict SHA256SUMS)
          node scripts/physio-sentry-release-contract.mjs validate-release-packet --packet "$packet" --application-sha "$APPLICATION_SHA" \
            --capability-intent-id "$CAPABILITY_INTENT_ID" --authority-reference "$AUTHORITY_REFERENCE" \
            --source-map-manifest-sha256 "$SOURCE_MAP_MANIFEST_SHA256" --source-map-archive-sha256 "$SOURCE_MAP_ARCHIVE_SHA256"
          echo "receipt_sha256=$(sha256sum "$packet/physio-sentry-release.json"|awk '{print $1}')" >>"$GITHUB_OUTPUT"

      - name: Upload bounded Sentry release effect evidence
        id: upload_final
        if: ${{ always() && (steps.reuse.outcome == 'success' || steps.create.outcome == 'success') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physio-sentry-release-${{ inputs.application_sha }}
          path: ${{ runner.temp }}/physio-sentry-release
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Fail closed after unresolved Sentry compensation or creation
        if: ${{ always() && steps.reuse.outcome != 'success' && steps.create.outcome != 'success' }}
        shell: bash
        run: exit 1

  seal:
    name: Seal candidate and Sentry release into one handoff packet
    needs: [gates, sentry_release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      candidate_artifact_id: ${{ steps.upload_candidate.outputs.artifact-id }}
      candidate_artifact_digest: sha256:${{ steps.upload_candidate.outputs.artifact-digest }}
      candidate_receipt_sha256: ${{ steps.seal.outputs.candidate_receipt_sha256 }}
      archive_sha256: ${{ needs.gates.outputs.archive_sha256 }}
      oci_archive_sha256: ${{ needs.gates.outputs.oci_archive_sha256 }}
      oci_manifest_digest: ${{ needs.gates.outputs.oci_manifest_digest }}
      oci_descriptor_manifest_sha256: ${{ needs.gates.outputs.oci_descriptor_manifest_sha256 }}
      local_image_id: ${{ needs.gates.outputs.local_image_id }}
      sentry_release_artifact_id: ${{ needs.sentry_release.outputs.artifact_id }}
      sentry_release_artifact_digest: ${{ needs.sentry_release.outputs.artifact_digest }}
      sentry_release_receipt_sha256: ${{ needs.sentry_release.outputs.receipt_sha256 }}
    steps:
      - name: Download exact candidate core
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.gates.outputs.core_artifact_id }}
          path: ${{ runner.temp }}/seal-input/core
          merge-multiple: true
          github-token: ${{ github.token }}

      - name: Download exact Sentry release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.sentry_release.outputs.artifact_id }}
          path: ${{ runner.temp }}/seal-input/sentry
          merge-multiple: true
          github-token: ${{ github.token }}

      - name: Seal exact candidate release handoff
        id: seal
        shell: bash
        env:
          APPLICATION_SHA: ${{ inputs.application_sha }}
          BUILD_TIMESTAMP: ${{ inputs.build_timestamp }}
          CORE_ARTIFACT_ID: ${{ needs.gates.outputs.core_artifact_id }}
          CORE_ARTIFACT_DIGEST: ${{ needs.gates.outputs.core_artifact_digest }}
          ARCHIVE_SHA256: ${{ needs.gates.outputs.archive_sha256 }}
          OCI_ARCHIVE_SHA256: ${{ needs.gates.outputs.oci_archive_sha256 }}
          OCI_MANIFEST_DIGEST: ${{ needs.gates.outputs.oci_manifest_digest }}
          OCI_DESCRIPTOR_MANIFEST_SHA256: ${{ needs.gates.outputs.oci_descriptor_manifest_sha256 }}
          LOCAL_IMAGE_ID: ${{ needs.gates.outputs.local_image_id }}
          SOURCE_MAP_MANIFEST_SHA256: ${{ needs.gates.outputs.source_map_manifest_sha256 }}
          SOURCE_MAP_ARCHIVE_SHA256: ${{ needs.gates.outputs.source_map_archive_sha256 }}
          SENTRY_RELEASE_ARTIFACT_ID: ${{ needs.sentry_release.outputs.artifact_id }}
          SENTRY_RELEASE_ARTIFACT_DIGEST: ${{ needs.sentry_release.outputs.artifact_digest }}
          SENTRY_RELEASE_RECEIPT_SHA256: ${{ needs.sentry_release.outputs.receipt_sha256 }}
          STATE_SNAPSHOT_ARTIFACT_ID: ${{ inputs.state_snapshot_artifact_id }}
          STATE_SNAPSHOT_ARTIFACT_DIGEST: ${{ inputs.state_snapshot_artifact_digest }}
          STATE_SNAPSHOT_RECEIPT_SHA256: ${{ inputs.state_snapshot_receipt_sha256 }}
          CAPABILITY_INTENT_ID: ${{ inputs.capability_intent_id }}
          AUTHORITY_REFERENCE: ${{ inputs.authority_reference }}
        run: |
          set -euo pipefail
          umask 077
          core="$RUNNER_TEMP/seal-input/core"
          sentry="$RUNNER_TEMP/seal-input/sentry"
          packet="$RUNNER_TEMP/physio-candidate"
          install -d -m 0700 "$packet"
          core_expected=$'SHA256SUMS\ncandidate-core-receipt.json\ncandidate-image.oci.tar.gz\ncandidate-image.tar.gz\ncandidate-oci-descriptors.json\nimage-inspect.json\nsentry-source-map-manifest.json\nsentry-source-maps.tar.gz\nstate-snapshot-artifact-admission.json'
          sentry_expected=$'SHA256SUMS\nphysio-sentry-release.json\nprovider-release-readback.json\nprovider-request-id-hashes.json\nsentry-phase-packet\nsentry-release-effect-reconciliation.json\nsentry-source-map-manifest.json\nsentry-started-effect.json'
          sentry_revalidated_expected=$'SHA256SUMS\nphysio-sentry-release.json\nprovider-current-readiness-readback.json\nprovider-current-readiness-request-id-hashes.json\nprovider-release-readback.json\nprovider-request-id-hashes.json\nsentry-current-readiness.json\nsentry-phase-packet\nsentry-release-effect-reconciliation.json\nsentry-source-map-manifest.json\nsentry-started-effect.json'
          [[ "$(find "$core" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)" == "$core_expected" ]]
          sentry_actual="$(find "$sentry" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)"
          [[ "$sentry_actual" == "$sentry_expected" || "$sentry_actual" == "$sentry_revalidated_expected" ]]
          (cd "$core" && sha256sum --check --strict SHA256SUMS)
          (cd "$sentry" && sha256sum --check --strict SHA256SUMS)
          node scripts/physio-sentry-release-contract.mjs validate-release-packet \
            --packet "$sentry" --application-sha "$APPLICATION_SHA" \
            --capability-intent-id "$CAPABILITY_INTENT_ID" --authority-reference "$AUTHORITY_REFERENCE" \
            --source-map-manifest-sha256 "$SOURCE_MAP_MANIFEST_SHA256" \
            --source-map-archive-sha256 "$SOURCE_MAP_ARCHIVE_SHA256"
          cmp --silent "$sentry/sentry-source-map-manifest.json" "$core/sentry-source-map-manifest.json"
          core_receipt_sha="$(sha256sum "$core/candidate-core-receipt.json" | awk '{print $1}')"
          for file in candidate-core-receipt.json candidate-image.tar.gz candidate-image.oci.tar.gz candidate-oci-descriptors.json image-inspect.json sentry-source-map-manifest.json state-snapshot-artifact-admission.json; do
            [[ -f "$core/$file" && ! -L "$core/$file" ]]
            install -m 0600 "$core/$file" "$packet/$file"
          done
          for file in physio-sentry-release.json provider-release-readback.json provider-request-id-hashes.json \
            sentry-release-effect-reconciliation.json sentry-started-effect.json; do
            [[ -f "$sentry/$file" && ! -L "$sentry/$file" ]]
            install -m 0600 "$sentry/$file" "$packet/$file"
          done
          [[ "sha256:$(sha256sum "$packet/candidate-image.tar.gz" | awk '{print $1}')" == "$ARCHIVE_SHA256" ]]
          [[ "sha256:$(sha256sum "$packet/candidate-image.oci.tar.gz" | awk '{print $1}')" == "$OCI_ARCHIVE_SHA256" ]]
          [[ "$(sha256sum "$packet/candidate-oci-descriptors.json" | awk '{print $1}')" == "$OCI_DESCRIPTOR_MANIFEST_SHA256" ]]
          [[ "$(sha256sum "$packet/sentry-source-map-manifest.json" | awk '{print $1}')" == "$SOURCE_MAP_MANIFEST_SHA256" ]]
          [[ "$(sha256sum "$packet/physio-sentry-release.json" | awk '{print $1}')" == "$SENTRY_RELEASE_RECEIPT_SHA256" ]]
          CORE="$core/candidate-core-receipt.json" APPLICATION_SHA="$APPLICATION_SHA" BUILD_TIMESTAMP="$BUILD_TIMESTAMP" \
          ARCHIVE_SHA="$ARCHIVE_SHA256" OCI_ARCHIVE_SHA="$OCI_ARCHIVE_SHA256" OCI_MANIFEST_DIGEST="$OCI_MANIFEST_DIGEST" \
          OCI_DESCRIPTOR_SHA="$OCI_DESCRIPTOR_MANIFEST_SHA256" IMAGE_ID="$LOCAL_IMAGE_ID" MAP_MANIFEST_SHA="$SOURCE_MAP_MANIFEST_SHA256" \
          MAP_ARCHIVE_SHA="$SOURCE_MAP_ARCHIVE_SHA256" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const row = JSON.parse(fs.readFileSync(process.env.CORE, 'utf8'));
          const keys = ['application','application_sha','archive_sha256','build_timestamp','completed_at','config_sha256',
            'contract_version','dockerfile_sha256','fly_resource_count','local_image_id','profession_id',
            'oci_archive_sha256','oci_descriptor_manifest_sha256','oci_manifest_digest',
            'same_build_source_maps_verified','source_branch','source_map_archive_sha256',
            'source_map_manifest_sha256','state_snapshot_artifact_digest','state_snapshot_artifact_id',
            'state_snapshot_artifact_admission_sha256','state_snapshot_receipt_sha256','result'].sort();
          if (JSON.stringify(Object.keys(row).sort()) !== JSON.stringify(keys) ||
              row.contract_version !== 'assesssuite-physio-candidate-core/2.0.0' || row.result !== 'PASS' ||
              row.application !== 'assesssuite-physio-production' || row.application_sha !== process.env.APPLICATION_SHA ||
              row.profession_id !== 'physio' || row.build_timestamp !== process.env.BUILD_TIMESTAMP ||
              row.archive_sha256 !== process.env.ARCHIVE_SHA || row.local_image_id !== process.env.IMAGE_ID ||
              row.oci_archive_sha256 !== process.env.OCI_ARCHIVE_SHA ||
              row.oci_manifest_digest !== process.env.OCI_MANIFEST_DIGEST ||
              row.oci_descriptor_manifest_sha256 !== process.env.OCI_DESCRIPTOR_SHA ||
              row.source_map_manifest_sha256 !== process.env.MAP_MANIFEST_SHA ||
              row.source_map_archive_sha256 !== process.env.MAP_ARCHIVE_SHA ||
              !/^[0-9a-f]{64}$/.test(row.state_snapshot_artifact_admission_sha256 || '') ||
              row.same_build_source_maps_verified !== true || row.fly_resource_count !== 0) {
            throw new Error('candidate-core-receipt.json identity or content differs');
          }
          NODE
          node scripts/physio-sentry-release-contract.mjs validate-release \
            --receipt "$packet/physio-sentry-release.json" --application-sha "$APPLICATION_SHA" \
            --source-map-manifest-sha256 "$SOURCE_MAP_MANIFEST_SHA256" \
            --source-map-archive-sha256 "$SOURCE_MAP_ARCHIVE_SHA256"
          RECEIPT="$packet/candidate-build-receipt.json" APPLICATION_SHA="$APPLICATION_SHA" BUILD_TIMESTAMP="$BUILD_TIMESTAMP" \
          CORE_ID="$CORE_ARTIFACT_ID" CORE_DIGEST="$CORE_ARTIFACT_DIGEST" CORE_RECEIPT_SHA="$core_receipt_sha" \
          ARCHIVE_SHA="$ARCHIVE_SHA256" OCI_ARCHIVE_SHA="$OCI_ARCHIVE_SHA256" OCI_MANIFEST_DIGEST="$OCI_MANIFEST_DIGEST" \
          OCI_DESCRIPTOR_SHA="$OCI_DESCRIPTOR_MANIFEST_SHA256" IMAGE_ID="$LOCAL_IMAGE_ID" \
          STATE_ID="$STATE_SNAPSHOT_ARTIFACT_ID" STATE_DIGEST="$STATE_SNAPSHOT_ARTIFACT_DIGEST" STATE_SHA="$STATE_SNAPSHOT_RECEIPT_SHA256" \
          STATE_ARTIFACT_ADMISSION_SHA="$(sha256sum "$packet/state-snapshot-artifact-admission.json" | awk '{print $1}')" \
          SENTRY_ID="$SENTRY_RELEASE_ARTIFACT_ID" SENTRY_DIGEST="$SENTRY_RELEASE_ARTIFACT_DIGEST" SENTRY_SHA="$SENTRY_RELEASE_RECEIPT_SHA256" \
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const row = { contract_version: 'assesssuite-physio-candidate-build/3.0.0', result: 'PASS',
            application: 'assesssuite-physio-production', application_sha: process.env.APPLICATION_SHA,
            profession_id: 'physio', build_timestamp: process.env.BUILD_TIMESTAMP, source_branch: 'main',
            state_snapshot: { artifact_id: process.env.STATE_ID, artifact_digest: process.env.STATE_DIGEST,
              receipt_sha256: process.env.STATE_SHA,
              artifact_admission_sha256: process.env.STATE_ARTIFACT_ADMISSION_SHA },
            candidate_core: { artifact_id: process.env.CORE_ID, artifact_digest: process.env.CORE_DIGEST,
              receipt_sha256: process.env.CORE_RECEIPT_SHA },
            candidate_core_receipt_sha256: process.env.CORE_RECEIPT_SHA,
            archive_sha256: process.env.ARCHIVE_SHA, oci_archive_sha256: process.env.OCI_ARCHIVE_SHA,
            oci_manifest_digest: process.env.OCI_MANIFEST_DIGEST,
            oci_descriptor_manifest_sha256: process.env.OCI_DESCRIPTOR_SHA,
            local_image_id: process.env.IMAGE_ID,
            sentry_release: { contract_version: 'assesssuite-physio-sentry-release/1.0.0',
              artifact_id: process.env.SENTRY_ID, artifact_digest: process.env.SENTRY_DIGEST,
              receipt_sha256: process.env.SENTRY_SHA },
            no_fly_resource_created: true, completed_at: new Date().toISOString() };
          fs.writeFileSync(process.env.RECEIPT, JSON.stringify(row, null, 2) + '\n', { flag: 'wx', mode: 0o600 });
          NODE
          (cd "$packet" && LC_ALL=C find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | \
            xargs sha256sum >SHA256SUMS && sha256sum --check --strict SHA256SUMS)
          echo "candidate_receipt_sha256=$(sha256sum "$packet/candidate-build-receipt.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload immutable candidate archive
        id: upload_candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physio-candidate-${{ inputs.application_sha }}
          path: ${{ runner.temp }}/physio-candidate
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
