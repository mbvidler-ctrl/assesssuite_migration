          (cd "$packet" && LC_ALL=C find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum >SHA256SUMS && sha256sum --check --strict SHA256SUMS)
          echo "bootstrap_receipt_sha256=$(sha256sum "$packet/physio-production-bootstrap.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "volume_id=$volume_id" >> "$GITHUB_OUTPUT"

      - name: Select exact new or read-only reused bootstrap result
        id: result
        if: ${{ always() }}
        shell: bash
        env:
          PROVIDER_ACTION: ${{ needs.provider.outputs.provider_action }}
          PROVIDER_STEP_OUTCOME: ${{ needs.provider.result }}
          PROVIDER_ADMISSION_ARTIFACT_ID: ${{ needs.provider.outputs.provider_artifact_id }}
          BOOTSTRAP_STEP_OUTCOME: ${{ steps.bootstrap.outcome }}
          NEW_RECEIPT_SHA256: ${{ steps.bootstrap.outputs.bootstrap_receipt_sha256 }}
          NEW_VOLUME_ID: ${{ steps.bootstrap.outputs.volume_id }}
          REUSE_RECEIPT_SHA256: ${{ steps.reuse_terminal.outputs.bootstrap_receipt_sha256 }}
          REUSE_VOLUME_ID: ${{ needs.provider.outputs.reuse_volume_id }}
          EFFECT_GENERATION: ${{ needs.start.outputs.next_effect_generation }}
        run: |
          set -euo pipefail
          [[ "$PROVIDER_STEP_OUTCOME" == success && "$PROVIDER_ADMISSION_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          packet="$RUNNER_TEMP/physio-bootstrap-receipt"
          [[ -d "$packet" && -f "$packet/SHA256SUMS" && ! -L "$packet/SHA256SUMS" ]]
          if find "$packet" -mindepth 1 -type l -print -quit | grep -q .; then exit 1; fi
          if find "$packet" -mindepth 2 -print -quit | grep -q .; then exit 1; fi
          (cd "$packet" && sha256sum --check --strict SHA256SUMS)
          receipt_sha="$(sha256sum "$packet/physio-production-bootstrap.json" | awk '{print $1}')"
          if [[ "$PROVIDER_ACTION" == MUTATE ]]; then
            [[ "$BOOTSTRAP_STEP_OUTCOME" == success && "$receipt_sha" == "$NEW_RECEIPT_SHA256" ]]
            volume_id="$NEW_VOLUME_ID"
          elif [[ "$PROVIDER_ACTION" == REUSE_COMPLETED ]]; then
            [[ "$BOOTSTRAP_STEP_OUTCOME" == skipped ]]
            [[ "$receipt_sha" == "$REUSE_RECEIPT_SHA256" ]]
            volume_id="$REUSE_VOLUME_ID"
          else
            exit 1
          fi
          [[ "$receipt_sha" =~ ^[0-9a-f]{64}$ && "$volume_id" =~ ^vol_[A-Za-z0-9]+$ ]]
          RECEIPT="$packet/physio-production-bootstrap.json" EFFECT="$packet/bootstrap-effect-reconciliation.json" \
          APPLICATION_SHA="${{ inputs.application_sha }}" VOLUME_ID="$volume_id" \
          PROVIDER_ACTION="$PROVIDER_ACTION" node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          const row = JSON.parse(fs.readFileSync(process.env.RECEIPT, 'utf8'));
          const effect = JSON.parse(fs.readFileSync(process.env.EFFECT, 'utf8'));
          const effectSha = createHash('sha256').update(fs.readFileSync(process.env.EFFECT)).digest('hex');
          if (row.contract_version !== 'assesssuite-physio-bootstrap/3.0.0' || row.result !== 'PASS' ||
              row.application !== 'assesssuite-physio-production' || row.application_sha !== process.env.APPLICATION_SHA ||
              row.profession_id !== 'physio' || row.volume_id !== process.env.VOLUME_ID || row.machine_count !== 0 ||
              row.custom_certificate_count !== 0 || row.production_ready !== false || row.webhook_secret_pending !== true ||
              row.effect_generation !== Number(process.env.EFFECT_GENERATION) || effect.effect_generation !== row.effect_generation ||
              effect.result !== 'COMPLETED' || row.bootstrap_effect_reconciliation_sha256 !== effectSha) {
            throw new Error('selected bootstrap result differs');
          }
          if (process.env.PROVIDER_ACTION === 'REUSE_COMPLETED' &&
              (row.completion_mode !== 'REUSED_EXACT_STATE_READ_ONLY' ||
               effect.completion_mode !== 'REUSED_EXACT_STATE_READ_ONLY' ||
               row.provider_mutation_occurred !== false || effect.provider_mutation_occurred !== false ||
               row.predecessor_effect_generation !== row.effect_generation - 1 ||
               effect.predecessor_effect_generation !== effect.effect_generation - 1)) {
            throw new Error('current read-only reuse generation differs');
          }
          NODE
          echo "bootstrap_receipt_sha256=$receipt_sha" >>"$GITHUB_OUTPUT"
          echo "terminal_effect_receipt_sha256=$(sha256sum "$packet/bootstrap-effect-reconciliation.json" | awk '{print $1}')" >>"$GITHUB_OUTPUT"
          echo "volume_id=$volume_id" >>"$GITHUB_OUTPUT"

      - name: Scan exact terminal packet against every provider secret value
        id: terminal_packet_scan
        if: ${{ always() && steps.result.outcome == 'success' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_ID_MONTHLY: ${{ secrets.STRIPE_PRICE_ID_MONTHLY }}
          STRIPE_PRICE_ID_ANNUAL: ${{ secrets.STRIPE_PRICE_ID_ANNUAL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          node scripts/physio-bootstrap-ledger.mjs scan-packet \
            --packet-directory "$RUNNER_TEMP/physio-bootstrap-receipt" \
            --secret-env-names GITHUB_TOKEN,FLY_API_TOKEN,ADMIN_PASSWORD,RESEND_API_KEY,OPENAI_API_KEY,STRIPE_SECRET_KEY,STRIPE_PRICE_ID_MONTHLY,STRIPE_PRICE_ID_ANNUAL,SENTRY_DSN \
            --output "$RUNNER_TEMP/bootstrap-terminal-packet-scan.json" --github-output "$GITHUB_OUTPUT"

      - if: ${{ always() }}
        name: Upload exact production bootstrap receipt
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physio-production-bootstrap-${{ inputs.application_sha }}
          path: ${{ runner.temp }}/physio-bootstrap-receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  ledger_terminal:
    name: Append terminal bootstrap receipt to the protected ledger
    needs: [start, provider, ledger_provider, bootstrap]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out exact protected-ledger client source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.application_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact terminal bootstrap packet
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.bootstrap.outputs.bootstrap_artifact_id }}
          path: ${{ runner.temp }}/physio-bootstrap-receipt
          github-token: ${{ github.token }}

      - name: Persist immutable terminal or reuse record in protected bootstrap ledger
        id: append
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          APPLICATION_SHA: ${{ inputs.application_sha }}
          EFFECT_GENERATION: ${{ needs.start.outputs.next_effect_generation }}
          ARTIFACT_ID: ${{ needs.bootstrap.outputs.bootstrap_artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.bootstrap.outputs.bootstrap_artifact_digest }}
          EXPECTED_LEDGER_HEAD_SHA: ${{ needs.ledger_provider.outputs.provider_ledger_commit_sha }}
          LEDGER_PROVISIONING_RECEIPT_SHA256: ${{ needs.start.outputs.ledger_provisioning_receipt_sha256 }}
          EXPECTED_PACKET_BUNDLE_SHA256: ${{ needs.bootstrap.outputs.terminal_packet_bundle_sha256 }}
          PACKET_SCAN_POLICY_VERSION: ${{ needs.bootstrap.outputs.terminal_packet_scan_policy_version }}
          PACKET_SECRET_SET_FINGERPRINT_SHA256: ${{ needs.bootstrap.outputs.terminal_packet_secret_set_fingerprint_sha256 }}
          PACKET_DURABLE_SECRET_NAMES: ${{ needs.bootstrap.outputs.terminal_packet_durable_secret_names }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          packet="$RUNNER_TEMP/physio-bootstrap-receipt"
          effect="$packet/bootstrap-effect-reconciliation.json"
          [[ -f "$effect" && ! -L "$effect" ]]
          read -r effect_result effect_generation < <(EFFECT="$effect" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const row = JSON.parse(fs.readFileSync(process.env.EFFECT, 'utf8'));
          process.stdout.write(`${row.result} ${row.effect_generation}`);
          NODE
          )
          [[ "$effect_generation" == "$EFFECT_GENERATION" ]]
          effect_sha="$(sha256sum "$effect" | awk '{print $1}')"
          final="$packet/physio-production-bootstrap.json"
          packet_receipt_sha=null
          if [[ -f "$final" && ! -L "$final" ]]; then packet_receipt_sha="$(sha256sum "$final" | awk '{print $1}')"; fi
          request="$RUNNER_TEMP/bootstrap-ledger-terminal-request.json"
          REQUEST="$request" EFFECT_RESULT="$effect_result" EFFECT_SHA="$effect_sha" PACKET_RECEIPT_SHA="$packet_receipt_sha" \
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const packetReceipt = process.env.PACKET_RECEIPT_SHA === 'null' ? null : process.env.PACKET_RECEIPT_SHA;
          const row = {
            repository: process.env.REPOSITORY,
            ledger_branch: 'assesssuite-physio-bootstrap-ledger',
            application_sha: process.env.APPLICATION_SHA,
            ledger_provisioning_receipt_sha256: process.env.LEDGER_PROVISIONING_RECEIPT_SHA256,
            stage: 'TERMINAL',
            effect_generation: Number(process.env.EFFECT_GENERATION),
            effect_result: process.env.EFFECT_RESULT,
            artifact: {
              id: Number(process.env.ARTIFACT_ID),
              name: `physio-production-bootstrap-${process.env.APPLICATION_SHA}`,
              digest: process.env.ARTIFACT_DIGEST,
              effect_receipt_sha256: process.env.EFFECT_SHA,
              packet_receipt_sha256: packetReceipt,
            },
            packet_scan: {
              contract_version: 'assesssuite-physio-bootstrap-ledger-packet-scan-proof/2.0.0',
              result: 'PASS', scanner_policy_version: process.env.PACKET_SCAN_POLICY_VERSION,
              packet_bundle_sha256: process.env.EXPECTED_PACKET_BUNDLE_SHA256,
              durable_secret_names: process.env.PACKET_DURABLE_SECRET_NAMES.split(',').filter(Boolean),
              durable_secret_set_fingerprint_sha256: process.env.PACKET_SECRET_SET_FINGERPRINT_SHA256,
            },
            workflow_run_id: Number(process.env.RUN_ID),
            workflow_run_attempt: Number(process.env.RUN_ATTEMPT),
          };
          fs.writeFileSync(process.env.REQUEST, JSON.stringify(row, null, 2) + '\n', { flag: 'wx', mode: 0o600 });
          NODE
          node scripts/physio-bootstrap-ledger.mjs append \
            --repository "$REPOSITORY" --application-sha "$APPLICATION_SHA" \
            --expected-head-sha "$EXPECTED_LEDGER_HEAD_SHA" --request "$request" \
            --packet-directory "$packet" \
            --secret-env-names GITHUB_TOKEN \
            --expected-packet-bundle-sha256 "$EXPECTED_PACKET_BUNDLE_SHA256" \
            --output "$RUNNER_TEMP/bootstrap-ledger-terminal-append.json" --github-output "$GITHUB_OUTPUT"
