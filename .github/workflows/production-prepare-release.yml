name: Production prepare release - exact SHA

on:
  workflow_dispatch:
    inputs:
      trusted_workflow_sha:
        description: Exact current main SHA supplying this trusted workflow; must equal github.workflow_sha and the remote main tip
        required: true
        type: string
      application_sha:
        description: Exact 40-character application commit SHA; must equal this workflow SHA and the remote main tip
        required: true
        type: string
      candidate_config_sha256:
        description: Reviewed SHA-256 of the exact candidate fly.production.toml Git blob (LF bytes)
        required: true
        type: string
      rollback_config_sha256:
        description: Reviewed SHA-256 of the exact fly.rollback.production.toml Git blob from the same main commit (LF bytes)
        required: true
        type: string
      rollback_source_sha:
        description: Exact 40-character ancestor commit encoded by the immutable rollback image
        required: true
        type: string
      expected_current_image:
        description: Current immutable registry.fly.io/assesssuite-production image digest reference; must be the rollback image
        required: true
        type: string
      expected_volume_id:
        description: Exact attached assesssuite_data_r12 Fly Volume ID from the production-state snapshot
        required: true
        type: string
      expected_legacy_volume_id:
        description: Exact detached assesssuite_data Fly Volume ID from the same production-state snapshot
        required: true
        type: string
      rollback_image:
        description: Exact dispatch-frozen current image used for automatic rollback
        required: true
        type: string
      extraction_runtime_mode:
        description: Reviewed document-extraction runtime mode in the candidate config
        required: true
        default: disabled
        type: choice
        options:
          - disabled
          - enabled
      provider_terms_attestation:
        description: Use EXTRACTION-DISABLED, or the exact terms attestation from the release runbook
        required: true
        type: string
      provider_terms_evidence_id:
        description: Durable reviewed evidence ID, or NOT-APPLICABLE-EXTRACTION-DISABLED
        required: true
        type: string
      under_age_zdr_runtime_mode:
        description: Under-13/applicable-age extraction mode; disabled unless ZDR is independently confirmed
        required: true
        default: disabled
        type: choice
        options:
          - disabled
          - enabled
      under_age_zdr_attestation:
        description: Use UNDER-AGE-ZDR-DISABLED, or the exact ZDR attestation from the release runbook
        required: true
        type: string
      under_age_zdr_evidence_id:
        description: Independent ZDR evidence ID, or NOT-APPLICABLE-UNDER-AGE-ZDR-DISABLED
        required: true
        type: string
      capability_intent_id:
        description: Workspace OS capability-broker publication intent ID with authorised and execution_ready decision
        required: true
        type: string
      authority_reference:
        description: Mission/order and approved publication-intent reference
        required: true
        type: string
      confirmation:
        description: Type PREPARE assesssuite-production EXACT SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: assesssuite-production
  cancel-in-progress: false

jobs:
  gates:
    name: Verify provenance and run release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      application_sha: ${{ steps.metadata.outputs.application_sha }}
      build_timestamp: ${{ steps.metadata.outputs.build_timestamp }}
      source_branch: ${{ steps.metadata.outputs.source_branch }}
      candidate_image_artifact_id: ${{ steps.upload_candidate.outputs.artifact-id }}
      candidate_image_artifact_digest: sha256:${{ steps.upload_candidate.outputs.artifact-digest }}
      release_control_artifact_id: ${{ steps.upload_controls.outputs.artifact-id }}
      release_control_artifact_digest: sha256:${{ steps.upload_controls.outputs.artifact-digest }}
    steps:
      - name: Validate trusted dispatch context and inputs
        shell: bash
        env:
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trusted_workflow_sha }}
          APPLICATION_SHA: ${{ inputs.application_sha }}
          CANDIDATE_CONFIG_SHA256: ${{ inputs.candidate_config_sha256 }}
          ROLLBACK_CONFIG_SHA256: ${{ inputs.rollback_config_sha256 }}
          SOURCE_BRANCH: main
          ROLLBACK_SOURCE_SHA: ${{ inputs.rollback_source_sha }}
          ROLLBACK_SOURCE_BRANCH: main
          EXPECTED_CURRENT_IMAGE: ${{ inputs.expected_current_image }}
          EXPECTED_VOLUME_ID: ${{ inputs.expected_volume_id }}
          EXPECTED_LEGACY_VOLUME_ID: ${{ inputs.expected_legacy_volume_id }}
          ROLLBACK_IMAGE: ${{ inputs.rollback_image }}
          CAPABILITY_INTENT_ID: ${{ inputs.capability_intent_id }}
          AUTHORITY_REFERENCE: ${{ inputs.authority_reference }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          IS_FORK: ${{ github.event.repository.fork }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "mbvidler-ctrl/assesssuite_migration" ]]
          [[ "$ACTOR" == "mbvidler-ctrl" ]]
          [[ "$TRIGGERING_ACTOR" == "mbvidler-ctrl" ]]
          [[ "$IS_FORK" == "false" ]]
          [[ "$EVENT_REF" == "refs/heads/main" ]]
          [[ "$WORKFLOW_REF" == "mbvidler-ctrl/assesssuite_migration/.github/workflows/production-prepare-release.yml@refs/heads/main" ]]
          [[ "$TRUSTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" == "$TRUSTED_WORKFLOW_SHA" ]]
          [[ "$EVENT_SHA" == "$TRUSTED_WORKFLOW_SHA" ]]
          [[ "$CONFIRMATION" == "PREPARE assesssuite-production EXACT SHA" ]]
          [[ "$APPLICATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_CONFIG_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ROLLBACK_CONFIG_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ROLLBACK_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_BRANCH" =~ ^[A-Za-z0-9._/-]{1,180}$ ]]
          [[ "$ROLLBACK_SOURCE_BRANCH" =~ ^[A-Za-z0-9._/-]{1,180}$ ]]
          [[ "$SOURCE_BRANCH" != *".."* && "$SOURCE_BRANCH" != /* && "$SOURCE_BRANCH" != */ ]]
          [[ "$ROLLBACK_SOURCE_BRANCH" != *".."* && "$ROLLBACK_SOURCE_BRANCH" != /* && "$ROLLBACK_SOURCE_BRANCH" != */ ]]
          [[ "$EXPECTED_CURRENT_IMAGE" =~ ^registry\.fly\.io/assesssuite-production@sha256:[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_VOLUME_ID" =~ ^vol_[A-Za-z0-9]+$ && "$EXPECTED_LEGACY_VOLUME_ID" =~ ^vol_[A-Za-z0-9]+$ ]]
          [[ "$EXPECTED_VOLUME_ID" != "$EXPECTED_LEGACY_VOLUME_ID" ]]
          [[ "$ROLLBACK_IMAGE" =~ ^registry\.fly\.io/assesssuite-production@sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_BRANCH" == "main" ]]
          [[ "$ROLLBACK_SOURCE_BRANCH" == "main" ]]
          [[ "$APPLICATION_SHA" == "$TRUSTED_WORKFLOW_SHA" ]]
          [[ "$ROLLBACK_SOURCE_SHA" != "$APPLICATION_SHA" ]]
          [[ "$ROLLBACK_IMAGE" == "$EXPECTED_CURRENT_IMAGE" ]]
          [[ "$CAPABILITY_INTENT_ID" =~ ^[A-Za-z0-9._:-]{1,160}$ ]]
          [[ "$AUTHORITY_REFERENCE" =~ ^[A-Za-z0-9._:/-]{1,240}$ ]]
          git check-ref-format "refs/heads/$SOURCE_BRANCH"
          git check-ref-format "refs/heads/$ROLLBACK_SOURCE_BRANCH"

      - name: Check out exact application SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.application_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact SHA and remote branch tip
        id: metadata
        shell: bash
        env:
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trusted_workflow_sha }}
          APPLICATION_SHA: ${{ inputs.application_sha }}
          CANDIDATE_CONFIG_SHA256: ${{ inputs.candidate_config_sha256 }}
          ROLLBACK_CONFIG_SHA256: ${{ inputs.rollback_config_sha256 }}
          ROLLBACK_SOURCE_SHA: ${{ inputs.rollback_source_sha }}
          SOURCE_BRANCH: main
          EXTRACTION_RUNTIME_MODE: ${{ inputs.extraction_runtime_mode }}
          PROVIDER_TERMS_ATTESTATION: ${{ inputs.provider_terms_attestation }}
          PROVIDER_TERMS_EVIDENCE_ID: ${{ inputs.provider_terms_evidence_id }}
          UNDER_AGE_ZDR_RUNTIME_MODE: ${{ inputs.under_age_zdr_runtime_mode }}
          UNDER_AGE_ZDR_ATTESTATION: ${{ inputs.under_age_zdr_attestation }}
          UNDER_AGE_ZDR_EVIDENCE_ID: ${{ inputs.under_age_zdr_evidence_id }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          [[ "$actual_sha" == "$APPLICATION_SHA" ]]
          remote_sha="$(timeout --signal=TERM --kill-after=10s 60s git ls-remote --exit-code origin "refs/heads/$SOURCE_BRANCH" | awk 'NR == 1 { print $1 }')"
          [[ "$remote_sha" == "$APPLICATION_SHA" ]]
          trusted_remote_sha="$(timeout --signal=TERM --kill-after=10s 60s git ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          [[ "$trusted_remote_sha" == "$TRUSTED_WORKFLOW_SHA" ]]
          timeout --signal=TERM --kill-after=10s 120s git fetch --no-tags --force origin "refs/heads/main:refs/remotes/origin/main"
          git cat-file -e "$TRUSTED_WORKFLOW_SHA^{commit}"
          git cat-file -e "$ROLLBACK_SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$ROLLBACK_SOURCE_SHA" "$APPLICATION_SHA"
          [[ -z "$(git status --porcelain --untracked-files=no)" ]]
          [[ ! -L fly.production.toml ]]
          [[ -f fly.rollback.production.toml && ! -L fly.rollback.production.toml ]]
          [[ "$(sha256sum fly.production.toml | awk '{print $1}')" == "$CANDIDATE_CONFIG_SHA256" ]]
          [[ "$(sha256sum fly.rollback.production.toml | awk '{print $1}')" == "$ROLLBACK_CONFIG_SHA256" ]]
          [[ "$(grep -Fxc '  EXPECTED_APP_URL = "https://app.assesssuite.com"' fly.production.toml)" -eq 1 ]]
          [[ "$(grep -Fxc '  EXPECTED_APP_URL = "https://app.assesssuite.com"' fly.rollback.production.toml)" -eq 1 ]]

          if grep -Eq '^[[:space:]]*DOCUMENT_EXTRACTION_ENABLED[[:space:]]*=[[:space:]]*"1"[[:space:]]*$' fly.production.toml; then
            reviewed_mode=enabled
          else
            reviewed_mode=disabled
          fi
          [[ "$reviewed_mode" == "$EXTRACTION_RUNTIME_MODE" ]]
          if [[ "$reviewed_mode" == "enabled" ]]; then
            [[ "$PROVIDER_TERMS_ATTESTATION" == "TERMS-VERIFIED-HEALTH-DATA-20260719" ]]
            [[ "$PROVIDER_TERMS_EVIDENCE_ID" == "EVD-20260719-ASSESSSUITE-OPENAI-HEALTH-TERMS-ATTESTATION" ]]
            [[ "$(grep -Ec '^[[:space:]]*OPENAI_HEALTH_DATA_TERMS_CONFIRMED[[:space:]]*=[[:space:]]*"1"[[:space:]]*$' fly.production.toml)" -eq 1 ]]
          else
            [[ "$PROVIDER_TERMS_ATTESTATION" == "EXTRACTION-DISABLED" ]]
            [[ "$PROVIDER_TERMS_EVIDENCE_ID" == "NOT-APPLICABLE-EXTRACTION-DISABLED" ]]
          fi
          [[ "$(grep -Ec '^[[:space:]]*GENERAL_CLINICAL_LLM_ENABLED[[:space:]]*=[[:space:]]*"1"[[:space:]]*$' fly.production.toml)" -eq 1 ]]
          [[ "$(grep -Ec '^[[:space:]]*TRANSCRIPTION_ENABLED[[:space:]]*=[[:space:]]*"1"[[:space:]]*$' fly.production.toml)" -eq 1 ]]
          [[ "$(grep -Ec '^[[:space:]]*GENERAL_CLINICAL_LLM_ENABLED[[:space:]]*=[[:space:]]*"1"[[:space:]]*$' fly.rollback.production.toml)" -eq 1 ]]
          [[ "$(grep -Ec '^[[:space:]]*TRANSCRIPTION_ENABLED[[:space:]]*=[[:space:]]*"0"[[:space:]]*$' fly.rollback.production.toml)" -eq 1 ]]
          [[ "$(grep -Ec '^[[:space:]]*LEGAL_STATUS[[:space:]]*=[[:space:]]*"effective"[[:space:]]*$' fly.production.toml)" -eq 1 ]]
          [[ "$(grep -Ec '^[[:space:]]*LEGAL_EFFECTIVE_DATE[[:space:]]*=[[:space:]]*"19 July 2026"[[:space:]]*$' fly.production.toml)" -eq 1 ]]
          [[ "$(grep -Ec '^[[:space:]]*LEGAL_COMPATIBILITY_ACCEPTED_VERSIONS[[:space:]]*=' fly.production.toml || true)" -eq 0 ]]

          [[ "$(grep -Ec '^[[:space:]]*OPENAI_DOCUMENT_EXTRACTION_MODEL[[:space:]]*=' fly.production.toml || true)" -eq 0 ]]

          if grep -Eq '^[[:space:]]*DOCUMENT_EXTRACTION_UNDER_13_ENABLED[[:space:]]*=[[:space:]]*"1"[[:space:]]*$' fly.production.toml; then
            reviewed_under_age_mode=enabled
          else
            reviewed_under_age_mode=disabled
          fi
          [[ "$reviewed_under_age_mode" == "$UNDER_AGE_ZDR_RUNTIME_MODE" ]]
          if [[ "$reviewed_under_age_mode" == "enabled" ]]; then
            [[ "$UNDER_AGE_ZDR_ATTESTATION" == "ZDR-VERIFIED-UNDER-AGE-20260719" ]]
            [[ "$UNDER_AGE_ZDR_EVIDENCE_ID" =~ ^EVD-[A-Za-z0-9._-]{20,100}-ZDR$ ]]
          else
            [[ "$UNDER_AGE_ZDR_ATTESTATION" == "UNDER-AGE-ZDR-DISABLED" ]]
            [[ "$UNDER_AGE_ZDR_EVIDENCE_ID" == "NOT-APPLICABLE-UNDER-AGE-ZDR-DISABLED" ]]
          fi

          build_timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "application_sha=$APPLICATION_SHA"
            echo "source_branch=$SOURCE_BRANCH"
            echo "build_timestamp=$build_timestamp"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Validate Fly and Docker credential/topology boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ -f fly.production.toml && ! -L fly.production.toml ]]
          [[ -f Dockerfile && ! -L Dockerfile ]]
          if grep -EIn '(^|[[:space:]/])(server/)?seed\.mjs([[:space:]&;]|$)|npm[[:space:]]+run[[:space:]]+seed|synthetic data reseeds on every boot' Dockerfile; then
            echo 'Candidate Docker startup must not seed or reseed the persistent production database.' >&2
            exit 1
          fi
          if grep -EIn 'FLY_API_TOKEN|\$\{?FLY_|\[\[[^]]*files[^]]*\]\]|\[[^]]*experimental[^]]*\]|local_path|secret_name|raw_value|release_command|^[[:space:]]*\[build\.(args|secrets)\]|build[_-]secret|file[_-]secret|type[[:space:]]*=[[:space:]]*secret|--secret' fly.production.toml Dockerfile; then
            echo 'Candidate build/deploy configuration contains a forbidden credential, local-file injection, build secret, or release hook.' >&2
            exit 1
          fi
          [[ "$(grep -Ec '^app = "assesssuite-production"$' fly.production.toml)" -eq 1 ]]
          [[ "$(grep -Ec '^primary_region = "syd"$' fly.production.toml)" -eq 1 ]]
          python3 -I - fly.production.toml <<'PY'
          import pathlib
          import sys
          import tomllib

          def process_entries(value, path=()):
              entries = []
              if isinstance(value, dict):
                  for key, nested in value.items():
                      next_path = path + (key,)
                      if key == 'processes':
                          entries.append((next_path, nested))
                      entries.extend(process_entries(nested, next_path))
              elif isinstance(value, list):
                  for index, nested in enumerate(value):
                      entries.extend(process_entries(nested, path + (index,)))
              return entries

          for raw_path in sys.argv[1:]:
              path = pathlib.Path(raw_path)
              try:
                  with path.open('rb') as stream:
                      document = tomllib.load(stream)
              except (OSError, UnicodeError, tomllib.TOMLDecodeError) as error:
                  raise SystemExit(f'Fly config is not valid TOML: {path.name}') from error
              if process_entries(document) != [(('http_service', 'processes'), ['app'])]:
                  raise SystemExit(f'Fly config process contract is not exact: {path.name}')
          PY
          [[ "$(grep -Ec '^  source = "assesssuite_data_r12"$' fly.production.toml)" -eq 1 ]]
          [[ "$(grep -Ec '^  destination = "/app/server/data"$' fly.production.toml)" -eq 1 ]]
          [[ "$(grep -Ec '^  snapshot_retention = 5$' fly.production.toml)" -eq 1 ]]
          [[ "$(grep -Ec '^  scheduled_snapshots = true$' fly.production.toml)" -eq 1 ]]
          [[ "$(grep -Fxc '  UPLOAD_AUDIT_RETENTION_DAYS = "730"' fly.production.toml)" -eq 1 ]]
          [[ "$(grep -Fxc '  UPLOAD_CLEANUP_INTERVAL_MINUTES = "1"' fly.production.toml)" -eq 1 ]]
          [[ "$(grep -Ec '^\[\[vm\]\]$' fly.production.toml)" -eq 1 ]]
          [[ "$(grep -Ec '^  memory = "512mb"$' fly.production.toml)" -eq 1 ]]
          [[ "$(grep -Ec '^  cpus = 1$' fly.production.toml)" -eq 1 ]]
          [[ "$(grep -Ec '^  min_machines_running = 1$' fly.production.toml)" -eq 1 ]]

      - name: Install locked dependencies
        run: npm ci

      - name: Fail-closed dependency vulnerability audit
        run: node scripts/check-dependency-audit.mjs

      - name: Validate the exact trusted workflow control
        shell: bash
        env:
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trusted_workflow_sha }}
          EXPECTED_TRUSTED_VALIDATOR_SHA256: c3a774ac6a467b446b24590f048c989a6248fae8097e1b5fc636fa19e5022f22
        run: |
          set -euo pipefail
          trusted_dir="$RUNNER_TEMP/trusted-production-control"
          cleanup() {
            git worktree remove --force "$trusted_dir" 2>/dev/null || true
          }
          trap cleanup EXIT
          git worktree add --detach "$trusted_dir" "$TRUSTED_WORKFLOW_SHA"
          echo "$EXPECTED_TRUSTED_VALIDATOR_SHA256  scripts/validate-production-deploy-workflow.mjs" \
            | (cd "$trusted_dir" && sha256sum --check --strict)
          for workflow in \
            production-deploy.yml \
            production-prepare-release.yml \
            production-prepare-rollback-image.yml \
            production-rollback.yml \
            production-parity-assurance.yml; do
            node "$trusted_dir/scripts/validate-production-deploy-workflow.mjs" \
              "$trusted_dir/.github/workflows/$workflow"
            node "$trusted_dir/scripts/validate-production-deploy-workflow.mjs" \
              "$trusted_dir/.github/workflows/$workflow" --selftest
          done

      - name: Require the referral assurance entrypoints and reviewed canary code
        shell: bash
        run: |
          set -euo pipefail
          # REVIEWED-CANDIDATE-CANARY-SHA256-BEGIN
          # Refresh this single block only after the final candidate diff is independently reviewed.
          # These are SHA-256 digests of Git blob bytes (LF), not the Windows worktree representation.
          # Refresh this block only after the final candidate index is independently reviewed.
          echo '96c8ecb24cd67df81127923c33ecaea232fe3d8dbbec52006bc7fa7ecfa7a3ae  scripts/referral-production-canary.mjs' | sha256sum --check --strict
          echo 'e244e9b332b31a14f4ca14d19fc0b7129e045674542cbb5540af3a613f68eb94  scripts/referral-production-canary-contract.mjs' | sha256sum --check --strict
          echo '55b257d0e732f83f4146b1c0dc836d4bfce730cdf81f935d696bc12adea57ab1  scripts/validate-referral-production-canary-output.mjs' | sha256sum --check --strict
          echo '8eed6357833ba8430786192e2d6be1a2bbedab3153dfef684729549e307fad80  scripts/scan-release-diff.mjs' | sha256sum --check --strict
          # REVIEWED-CANDIDATE-CANARY-SHA256-END
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import pkg from './package.json' with { type: 'json' };
          if (!pkg.scripts?.['test:assurance']) {
            throw new Error('Required package script test:assurance is absent');
          }
          if (!pkg.scripts?.['test:referral-production-canary'] || !pkg.scripts?.['canary:referral:production']) {
            throw new Error('Required referral production canary entrypoints are absent');
          }
          if (!pkg.scripts?.['test:referral-browser']) {
            throw new Error('Required rendered referral browser gate is absent');
          }
          if (!pkg.scripts?.['test:safe-html-output']) {
            throw new Error('Required rendered safe-HTML output gate is absent');
          }
          if (!pkg.scripts?.['test:forward-rollback-compatibility']) {
            throw new Error('Required exact-image forward/rollback compatibility gate is absent');
          }
          for (const script of ['build:platform', 'build:landing', 'verify:split-build', 'test:split-hosting']) {
            if (!pkg.scripts?.[script]) throw new Error(`Required split-hosting package script ${script} is absent`);
          }
          if (!fs.existsSync('server/tests/forward-rollback-compatibility.test.mjs')) {
            throw new Error('Forward/rollback shared-store proof is absent');
          }
          NODE

      - name: Build and verify split-hosting surfaces
        shell: bash
        run: |
          set -euo pipefail
          npm run build:platform
          npm run build:landing
          npm run verify:split-build
          npm run test:split-hosting

      - name: Typecheck against exact production-base differential
        shell: bash
        env:
          PRODUCTION_BASE_SHA: 145958d895aef289b9652f850e32e237f2b62f70
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PRODUCTION_BASE_SHA" HEAD
          base_dir="$RUNNER_TEMP/typecheck-base"
          reference_dir="$RUNNER_TEMP/typecheck-reviewed-reference"
          git worktree add --detach "$base_dir" "$PRODUCTION_BASE_SHA"
          git worktree add --detach "$reference_dir" "$PRODUCTION_BASE_SHA"
          npm --prefix "$base_dir" ci
          npm --prefix "$reference_dir" ci
          node scripts/compare-typecheck-baseline.mjs \
            --base-dir "$base_dir" \
            --reference-dir "$reference_dir" \
            --candidate-dir "$GITHUB_WORKSPACE"

      - name: Lint with exact legacy-baseline containment
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm run lint -- --format json --output-file "$RUNNER_TEMP/eslint.json"
          lint_status=$?
          set -e
          LINT_STATUS="$lint_status" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const allowed = new Map([
            ['src/components/assessments/AssessmentTestRunnerRouter.jsx|no-empty|Empty block statement.', 1],
            ['src/components/assessments/TestRunner.jsx|no-case-declarations|Unexpected lexical declaration in case block.', 2],
            ['src/components/assessments/TestRunnerExtras.jsx|no-empty|Empty block statement.', 1],
            ['src/components/onboarding/Consent.jsx|no-empty|Empty block statement.', 1],
            ["src/components/protocols/ImportToSOAPModal.jsx|no-undef|'today' is not defined.", 1],
            ['src/pages/Clients.jsx|no-empty|Empty block statement.', 1],
          ]);
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/eslint.json', 'utf8'));
          const seen = new Map();
          const unexpected = [];
          for (const file of report) {
            const relative = path.relative(process.cwd(), file.filePath).replaceAll('\\', '/');
            for (const message of file.messages.filter((item) => item.severity === 2)) {
              const key = `${relative}|${message.ruleId}|${message.message}`;
              const count = (seen.get(key) || 0) + 1;
              seen.set(key, count);
              if (!allowed.has(key) || count > allowed.get(key)) unexpected.push({ relative, ...message });
            }
          }
          if (unexpected.length) {
            console.error(JSON.stringify(unexpected, null, 2));
            throw new Error('Lint introduced an error outside the seven-item reviewed legacy baseline');
          }
          if (Number(process.env.LINT_STATUS) !== 0 && [...seen.values()].reduce((a, b) => a + b, 0) === 0) {
            throw new Error(`ESLint exited ${process.env.LINT_STATUS} without a reviewable error report`);
          }
          console.log(`Lint gate passed with ${[...seen.values()].reduce((a, b) => a + b, 0)} contained legacy error(s).`);
          NODE

      - name: Existing deterministic server and entry-guard gates
        shell: bash
        run: |
          set -euo pipefail
          npm run selftest
          npm run validate:entry-guards
          node scripts/clinical-selftest.mjs
          node scripts/pa-e2e-verify.mjs
          node scripts/smoke.mjs

      - name: Existing seeded launch-gate suite
        shell: bash
        run: |
          set -euo pipefail
          seed_variable="SEED_$(printf '%s' 'PASSWORD')"
          seed_value="$(node --input-type=module -e "import{randomBytes}from'node:crypto';process.stdout.write(randomBytes(24).toString('base64url'))")"
          env "$seed_variable=$seed_value" node server/seed.mjs
          env "$seed_variable=$seed_value" ASSESSSUITE_BIND_HOST=127.0.0.1 PORT=8787 LLM_REQUIRED=0 \
            node server/index.mjs >"$RUNNER_TEMP/gate-server.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:8787/api/apps/public/prod/public-settings/by-id/local-assesssuite >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 60 ]]; then
              sed -n '1,160p' "$RUNNER_TEMP/gate-server.log"
              exit 1
            fi
            sleep 0.25
          done
          env "$seed_variable=$seed_value" node scripts/gate-tests.mjs

      - name: Existing public-evidence service gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/evidence-selftest.mjs | tee "$RUNNER_TEMP/evidence-selftest.log"
          if grep -F '[SKIP]' "$RUNNER_TEMP/evidence-selftest.log"; then
            echo 'Evidence selftest skipped a network assertion; release gate remains unpassed.' >&2
            exit 1
          fi
          node scripts/medical-lookup-selftest.mjs | tee "$RUNNER_TEMP/medical-lookup-selftest.log"
          if grep -F '[SKIP]' "$RUNNER_TEMP/medical-lookup-selftest.log"; then
            echo 'Medical-lookup selftest skipped a network assertion; release gate remains unpassed.' >&2
            exit 1
          fi

      - name: Mission assurance aggregate
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install playwright install --with-deps chromium
          npm run test:assurance

      - name: Rendered referral browser journey gate
        shell: bash
        run: |
          set -euo pipefail
          npm run test:referral-browser
          npm run test:safe-html-output

      - name: Secret and high-entropy diff scan
        shell: bash

        env:
          PRODUCTION_BASE_SHA: 145958d895aef289b9652f850e32e237f2b62f70
          EXPECTED_RELEASE_SCANNER_SHA256: 8eed6357833ba8430786192e2d6be1a2bbedab3153dfef684729549e307fad80
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PRODUCTION_BASE_SHA" HEAD
          is_prohibited_release_filename() {
            local changed_file=$1
            local normalized=${changed_file,,}
            if [[ "$changed_file" == '.env.example' ]]; then
              return 1
            fi
            if [[ "$normalized" =~ (^|/)\.env($|\.) \
              || "$normalized" =~ (^|/)(credentials?|secrets?)\.(json|txt|pem|key)$ ]]; then
              return 0
            fi
            return 1
          }
          prohibited_file_list="$RUNNER_TEMP/prohibited-release-files.txt"
          : >"$prohibited_file_list"
          while IFS= read -r -d '' changed_file; do
            if is_prohibited_release_filename "$changed_file"; then
              printf '%s\n' "$changed_file" >>"$prohibited_file_list"
            fi
          done < <(git diff --name-only -z "$PRODUCTION_BASE_SHA"...HEAD)
          if [[ -s "$prohibited_file_list" ]]; then
            cat "$prohibited_file_list"
            echo 'Release diff contains a prohibited secret-bearing filename.' >&2
            exit 1
          fi
          git diff --binary "$PRODUCTION_BASE_SHA"...HEAD >"$RUNNER_TEMP/release.diff"
          actual_scanner_sha256="$(sha256sum scripts/scan-release-diff.mjs | awk '{print $1}')"
          if [[ "$actual_scanner_sha256" != "$EXPECTED_RELEASE_SCANNER_SHA256" ]]; then
            echo 'Release scanner does not match the trusted workflow digest.' >&2
            exit 1
          fi
          node scripts/scan-release-diff.mjs "$RUNNER_TEMP/release.diff"

      - name: Build exact candidate image locally without credentials
        shell: bash
        env:
          APPLICATION_SHA: ${{ steps.metadata.outputs.application_sha }}
          SOURCE_BRANCH: ${{ steps.metadata.outputs.source_branch }}
          BUILD_TIMESTAMP: ${{ steps.metadata.outputs.build_timestamp }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          set +x
          [[ -z "${SENTRY_AUTH_TOKEN:-}" && -z "${FLY_API_TOKEN:-}" && -n "$SENTRY_DSN" ]]
          if env | grep -Eq '^(SENTRY_AUTH_TOKEN|FLY_API_TOKEN|DOCKER_AUTH_CONFIG)='; then exit 1; fi
          SENTRY_DSN_VALUE="$SENTRY_DSN" node --input-type=module <<'NODE'
          const value = process.env.SENTRY_DSN_VALUE;
          let parsed;
          try {
            parsed = new URL(value);
          } catch {
            throw new Error('Sentry DSN does not match the approved production project');
          }
          if (parsed.protocol !== 'https:' || parsed.hostname !== 'o4511822688813056.ingest.us.sentry.io' ||
              parsed.port !== '' || parsed.pathname !== '/4511827129663488' || parsed.search !== '' ||
              parsed.hash !== '' || parsed.password !== '' || !/^[0-9a-f]{32}$/.test(parsed.username)) {
            throw new Error('Sentry DSN does not match the approved production project');
          }
          NODE
          rm -rf dist
          RELEASE_SHA="$APPLICATION_SHA" SOURCE_BRANCH="$SOURCE_BRANCH" BUILD_TIMESTAMP="$BUILD_TIMESTAMP" \
            VITE_BASE44_APP_ID=local-assesssuite \
            VITE_SENTRY_DSN="$SENTRY_DSN" VITE_SENTRY_RELEASE="$APPLICATION_SHA" VITE_SENTRY_ENVIRONMENT=production \
            npm run build:platform
          ./node_modules/.bin/sentry-cli sourcemaps inject dist
          source_map_manifest="$RUNNER_TEMP/sentry-source-map-manifest.json"
          SOURCE_MAP_ROOT="$GITHUB_WORKSPACE/dist" SOURCE_MAP_MANIFEST="$source_map_manifest" \
            APPLICATION_SHA="$APPLICATION_SHA" SOURCE_BRANCH="$SOURCE_BRANCH" BUILD_TIMESTAMP="$BUILD_TIMESTAMP" \
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const root = process.env.SOURCE_MAP_ROOT;
          const sha256 = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const files = [];
          const walk = (directory) => {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const absolute = path.join(directory, entry.name);
              if (entry.isSymbolicLink()) throw new Error(`Source-map build contains a symlink: ${absolute}`);
              if (entry.isDirectory()) walk(absolute);
              else if (entry.isFile()) files.push(absolute);
              else throw new Error(`Source-map build contains a non-regular file: ${absolute}`);
            }
          };
          walk(root);
          const relative = (file) => path.relative(root, file).replaceAll('\\', '/');
          const runtimeFiles = files.filter((file) => file.endsWith('.js')).sort((a, b) => relative(a).localeCompare(relative(b)));
          const mapFiles = files.filter((file) => file.endsWith('.js.map')).sort((a, b) => relative(a).localeCompare(relative(b)));
          if (runtimeFiles.length === 0 || mapFiles.length !== runtimeFiles.length) {
            throw new Error('The platform build does not contain a one-to-one JavaScript/source-map set');
          }
          const runtimePaths = new Set(runtimeFiles.map(relative));
          const sourceMaps = mapFiles.map((file) => {
            const mapPath = relative(file);
            const runtimePath = mapPath.slice(0, -4);
            if (!/^assets\/[A-Za-z0-9._-]+\.js\.map$/.test(mapPath) || !runtimePaths.has(runtimePath)) throw new Error(`Orphan or invalid source map: ${mapPath}`);
            const value = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (value?.version !== 3 || !Array.isArray(value.sources) || value.sources.length === 0 ||
                !Array.isArray(value.sourcesContent) || value.sourcesContent.length !== value.sources.length ||
                !Array.isArray(value.names) || typeof value.mappings !== 'string' || value.mappings.length === 0 ||
                !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(value.debugId) ||
                (value.file !== undefined && value.file !== runtimePath)) {
              throw new Error(`Invalid source-map structure: ${mapPath}`);
            }
            const runtimeValue = fs.readFileSync(path.join(root, runtimePath), 'utf8');
            if (!runtimeValue.includes('_sentryDebugIds') ||
                runtimeValue.split(`//# debugId=${value.debugId}`).length !== 2) {
              throw new Error(`Debug ID is not injected into the matching runtime JavaScript: ${runtimePath}`);
            }
            return { path: mapPath, runtime_path: runtimePath, bytes: fs.statSync(file).size, sha256: sha256(file) };
          });
          const runtimeJs = runtimeFiles.map((file) => {
            const value = fs.readFileSync(file, 'utf8');
            const runtimePath = relative(file);
            if (!/^assets\/[A-Za-z0-9._-]+\.js$/.test(runtimePath)) throw new Error(`Runtime JavaScript path is invalid: ${runtimePath}`);
            if (/sourceMappingURL\s*=/.test(value)) throw new Error(`Platform source map is publicly referenced: ${runtimePath}`);
            return { path: runtimePath, bytes: fs.statSync(file).size, sha256: sha256(file) };
          });
          const row = {
            schema_version: 'assesssuite.sentry-source-map-manifest.v1',
            application_sha: process.env.APPLICATION_SHA,
            source_branch: process.env.SOURCE_BRANCH,
            build_timestamp: process.env.BUILD_TIMESTAMP,
            runtime_js: runtimeJs,
            source_maps: sourceMaps,
          };
          fs.writeFileSync(process.env.SOURCE_MAP_MANIFEST, `${JSON.stringify(row)}\n`, { mode: 0o600 });
          NODE
          [[ -f "$source_map_manifest" && ! -L "$source_map_manifest" ]]
          [[ "$(wc -c <"$source_map_manifest")" -gt 0 && "$(wc -c <"$source_map_manifest")" -le 65536 ]]
          source_map_payload="$RUNNER_TEMP/sentry-source-map-payload"
          source_map_archive="$RUNNER_TEMP/sentry-source-maps.tar.gz"
          rm -rf "$source_map_payload"
          install -d -m 0700 "$source_map_payload/assets"
          SOURCE_MAP_ROOT="$GITHUB_WORKSPACE/dist" SOURCE_MAP_PAYLOAD="$source_map_payload" \
            SOURCE_MAP_MANIFEST="$source_map_manifest" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = process.env.SOURCE_MAP_ROOT;
          const payload = process.env.SOURCE_MAP_PAYLOAD;
          const manifest = JSON.parse(fs.readFileSync(process.env.SOURCE_MAP_MANIFEST, 'utf8'));
          const rows = [...manifest.runtime_js, ...manifest.source_maps];
          const paths = new Set();
          for (const row of rows) {
            if (!/^assets\/[A-Za-z0-9._-]+\.js(?:\.map)?$/.test(row.path) || paths.has(row.path)) {
              throw new Error('Source-map archive path is invalid or duplicated');
            }
            paths.add(row.path);
            const source = path.join(root, row.path);
            const destination = path.join(payload, row.path);
            if (!fs.statSync(source).isFile()) throw new Error('Source-map archive input is not a regular file');
            fs.copyFileSync(source, destination, fs.constants.COPYFILE_EXCL);
            fs.chmodSync(destination, 0o600);
          }
          NODE
          tar --sort=name --format=ustar --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$source_map_payload" -cf - assets | gzip -1 -n >"$source_map_archive"
          [[ -f "$source_map_archive" && ! -L "$source_map_archive" ]]
          [[ "$(wc -c <"$source_map_archive")" -gt 0 && "$(wc -c <"$source_map_archive")" -le 67108864 ]]
          docker build \
            --build-arg "RELEASE_SHA=$APPLICATION_SHA" \
            --build-arg "SOURCE_BRANCH=$SOURCE_BRANCH" \
            --build-arg "BUILD_TIMESTAMP=$BUILD_TIMESTAMP" \
            --build-arg "SENTRY_DSN=$SENTRY_DSN" \
            --label "org.opencontainers.image.revision=$APPLICATION_SHA" \
            --label "org.opencontainers.image.created=$BUILD_TIMESTAMP" \
            --label "org.opencontainers.image.source=https://github.com/mbvidler-ctrl/assesssuite_migration/tree/$APPLICATION_SHA" \
            --tag "assesssuite-release-gate:$APPLICATION_SHA" \
            .
          [[ "$(docker image inspect "assesssuite-release-gate:$APPLICATION_SHA" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" == "$APPLICATION_SHA" ]]
          [[ "$(docker image inspect "assesssuite-release-gate:$APPLICATION_SHA" --format '{{json .Config.Entrypoint}}')" == '["docker-entrypoint.sh"]' ]]
          [[ "$(docker image inspect "assesssuite-release-gate:$APPLICATION_SHA" --format '{{json .Config.Cmd}}')" == '["sh","-c","node server/productionBootstrap.mjs && exec node server/index.mjs"]' ]]
          docker image inspect "assesssuite-release-gate:$APPLICATION_SHA" --format '{{ range .Config.Env }}{{ println . }}{{ end }}' >"$RUNNER_TEMP/image-env.txt"
          grep -Fx "RELEASE_SHA=$APPLICATION_SHA" "$RUNNER_TEMP/image-env.txt"
          grep -Fx "SOURCE_BRANCH=$SOURCE_BRANCH" "$RUNNER_TEMP/image-env.txt"
          grep -Fx "BUILD_TIMESTAMP=$BUILD_TIMESTAMP" "$RUNNER_TEMP/image-env.txt"
          [[ "$(grep -Ec '^NODE_ENV=' "$RUNNER_TEMP/image-env.txt")" -eq 1 ]]
          [[ "$(grep -Fxc 'NODE_ENV=production' "$RUNNER_TEMP/image-env.txt")" -eq 1 ]]
          if grep -Eq '^(SELFTEST|ASSESSSUITE_DB_PATH|ASSESSSUITE_DB_PATH_ACK|DOCUMENT_EXTRACTION_TEST_BASE_URL|DOCUMENT_EXTRACTION_PROVIDER_PROBE|DOCUMENT_EXTRACTION_PROVIDER_PROBE_ACK|ALLOW_PAID_PROVIDER_PROBE|RUN_DOCUMENT_EXTRACTION_PROVIDER_PROBE|RUN_REFERRAL_PRODUCTION_CANARY)=' "$RUNNER_TEMP/image-env.txt"; then
            echo 'Candidate image contains a forbidden test, database-override, or provider-probe environment variable.' >&2
            exit 1
          fi
          image_canary_dir="$RUNNER_TEMP/built-image-canary"
          image_dist_dir="$RUNNER_TEMP/built-image-dist"
          mkdir -p "$image_canary_dir"
          image_container="$(docker create "assesssuite-release-gate:$APPLICATION_SHA")"
          cleanup_image_container() {
            docker rm --force "$image_container" >/dev/null 2>&1 || true
          }
          trap cleanup_image_container EXIT
          for relative_path in \
            scripts/referral-production-canary.mjs \
            scripts/referral-production-canary-contract.mjs \
            scripts/validate-referral-production-canary-output.mjs; do
            extracted_path="$image_canary_dir/${relative_path//\//_}"
            docker cp "$image_container:/app/$relative_path" "$extracted_path"
            cmp --silent "$relative_path" "$extracted_path"
          done
          if docker export "$image_container" | tar -tf - | grep -Eq '(^|/)[^/]+\.map$'; then
            echo 'Candidate image contains a forbidden source-map file.' >&2
            exit 1
          fi
          docker cp "$image_container:/app/dist" "$image_dist_dir"
          SOURCE_MAP_MANIFEST="$source_map_manifest" IMAGE_DIST="$image_dist_dir" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const manifest = JSON.parse(fs.readFileSync(process.env.SOURCE_MAP_MANIFEST, 'utf8'));
          const root = process.env.IMAGE_DIST;
          const files = [];
          const walk = (directory) => {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const absolute = path.join(directory, entry.name);
              if (entry.isSymbolicLink()) throw new Error(`Candidate image dist contains a symlink: ${absolute}`);
              if (entry.isDirectory()) walk(absolute);
              else if (entry.isFile()) files.push(absolute);
              else throw new Error(`Candidate image dist contains a non-regular file: ${absolute}`);
            }
          };
          walk(root);
          if (files.some((file) => file.endsWith('.map'))) throw new Error('Candidate image contains source maps');
          const runtimeJs = files.filter((file) => file.endsWith('.js')).map((file) => ({
            path: path.relative(root, file).replaceAll('\\', '/'),
            bytes: fs.statSync(file).size,
            sha256: crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex'),
          })).sort((a, b) => a.path.localeCompare(b.path));
          if (JSON.stringify(runtimeJs) !== JSON.stringify(manifest.runtime_js)) {
            throw new Error('Byte-proven JavaScript differs from the exact candidate image output');
          }
          NODE
          cleanup_image_container
          trap - EXIT
          candidate_image_id="$(docker image inspect "assesssuite-release-gate:$APPLICATION_SHA" --format '{{.Id}}')"
          [[ "$candidate_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker save "assesssuite-release-gate:$APPLICATION_SHA" | gzip -1 -n >"$RUNNER_TEMP/candidate-image.tar.gz"
          candidate_archive_sha256="$(sha256sum "$RUNNER_TEMP/candidate-image.tar.gz" | awk '{print $1}')"
          printf '%s  %s\n' "$candidate_archive_sha256" candidate-image.tar.gz >"$RUNNER_TEMP/candidate-image.tar.gz.sha256"
          source_map_manifest_sha256="$(sha256sum "$source_map_manifest" | awk '{print $1}')"
          source_map_archive_sha256="$(sha256sum "$source_map_archive" | awk '{print $1}')"
          [[ "$source_map_manifest_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$source_map_archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          APPLICATION_SHA="$APPLICATION_SHA" SOURCE_BRANCH="$SOURCE_BRANCH" BUILD_TIMESTAMP="$BUILD_TIMESTAMP" \
            CANDIDATE_IMAGE_ID="$candidate_image_id" CANDIDATE_ARCHIVE_SHA256="$candidate_archive_sha256" \
            SOURCE_MAP_MANIFEST_SHA256="$source_map_manifest_sha256" SOURCE_MAP_ARCHIVE_SHA256="$source_map_archive_sha256" \
            node --input-type=module >"$RUNNER_TEMP/candidate-build-receipt.json" <<'NODE'
          const row = {
            schema_version: 'assesssuite.candidate-build-receipt.v3',
            application_sha: process.env.APPLICATION_SHA,
            source_branch: process.env.SOURCE_BRANCH,
            build_timestamp: process.env.BUILD_TIMESTAMP,
            candidate_image_id: process.env.CANDIDATE_IMAGE_ID,
            candidate_archive_sha256: process.env.CANDIDATE_ARCHIVE_SHA256,
            source_map_manifest_sha256: process.env.SOURCE_MAP_MANIFEST_SHA256,
            source_map_archive_sha256: process.env.SOURCE_MAP_ARCHIVE_SHA256,
          };
          process.stdout.write(`${JSON.stringify(row)}\n`);
          NODE
          mkdir -p "$RUNNER_TEMP/release-control"
          install -m 0600 fly.production.toml "$RUNNER_TEMP/release-control/fly.production.toml"
          install -m 0600 fly.rollback.production.toml "$RUNNER_TEMP/release-control/fly.rollback.production.toml"
          install -m 0600 "$RUNNER_TEMP/candidate-build-receipt.json" "$RUNNER_TEMP/release-control/candidate-build-receipt.json"
          install -m 0600 "$source_map_manifest" "$RUNNER_TEMP/release-control/sentry-source-map-manifest.json"

      - name: Preserve the exact gated candidate image
        id: upload_candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-image-${{ steps.metadata.outputs.application_sha }}
          path: |
            ${{ runner.temp }}/candidate-image.tar.gz
            ${{ runner.temp }}/candidate-image.tar.gz.sha256
            ${{ runner.temp }}/candidate-build-receipt.json
            ${{ runner.temp }}/sentry-source-map-manifest.json
            ${{ runner.temp }}/sentry-source-maps.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Preserve sealed release controls
        id: upload_controls
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-control-${{ steps.metadata.outputs.application_sha }}
          path: ${{ runner.temp }}/release-control
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  upload_sentry_source_maps:
    name: Upload byte-proven source maps from a fresh data-only runner
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download exact gated source-map data by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.gates.outputs.candidate_image_artifact_id }}
          path: ${{ runner.temp }}/candidate-data
          merge-multiple: true

      - name: Validate and extract sealed source-map data without executing candidate code
        shell: bash
        env:
          APPLICATION_SHA: ${{ needs.gates.outputs.application_sha }}
          SOURCE_BRANCH: ${{ needs.gates.outputs.source_branch }}
          BUILD_TIMESTAMP: ${{ needs.gates.outputs.build_timestamp }}
          CANDIDATE_IMAGE_ARTIFACT_ID: ${{ needs.gates.outputs.candidate_image_artifact_id }}
          CANDIDATE_IMAGE_ARTIFACT_DIGEST: ${{ needs.gates.outputs.candidate_image_artifact_digest }}
        run: |
          set -euo pipefail
          [[ -z "${SENTRY_AUTH_TOKEN:-}" && -z "${SENTRY_DSN:-}" && -z "${FLY_API_TOKEN:-}" ]]
          if env | grep -Eq '^(SENTRY_AUTH_TOKEN|SENTRY_DSN|FLY_API_TOKEN|DOCKER_AUTH_CONFIG)='; then exit 1; fi
          artifact="$RUNNER_TEMP/candidate-data"
          upload_root="$RUNNER_TEMP/sentry-upload"
          [[ "$CANDIDATE_IMAGE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_IMAGE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          expected_files=$'candidate-build-receipt.json\ncandidate-image.tar.gz\ncandidate-image.tar.gz.sha256\nsentry-source-map-manifest.json\nsentry-source-maps.tar.gz'
          actual_files="$(find "$artifact" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          [[ "$actual_files" == "$expected_files" ]]
          for file in candidate-build-receipt.json candidate-image.tar.gz candidate-image.tar.gz.sha256 sentry-source-map-manifest.json sentry-source-maps.tar.gz; do
            [[ -f "$artifact/$file" && ! -L "$artifact/$file" ]]
            [[ "$(stat -c '%F' "$artifact/$file")" == 'regular file' ]]
          done
          [[ "$(wc -c <"$artifact/candidate-build-receipt.json")" -gt 0 && "$(wc -c <"$artifact/candidate-build-receipt.json")" -le 8192 ]]
          [[ "$(wc -c <"$artifact/sentry-source-map-manifest.json")" -gt 0 && "$(wc -c <"$artifact/sentry-source-map-manifest.json")" -le 65536 ]]
          [[ "$(wc -c <"$artifact/sentry-source-maps.tar.gz")" -gt 0 && "$(wc -c <"$artifact/sentry-source-maps.tar.gz")" -le 67108864 ]]
          install -d -m 0700 "$upload_root"
          ARTIFACT_ROOT="$artifact" UPLOAD_ROOT="$upload_root" APPLICATION_SHA="$APPLICATION_SHA" \
            SOURCE_BRANCH="$SOURCE_BRANCH" BUILD_TIMESTAMP="$BUILD_TIMESTAMP" python3 -I - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import shutil
          import tarfile

          artifact = pathlib.Path(os.environ['ARTIFACT_ROOT'])
          upload = pathlib.Path(os.environ['UPLOAD_ROOT'])
          receipt_path = artifact / 'candidate-build-receipt.json'
          manifest_path = artifact / 'sentry-source-map-manifest.json'
          archive_path = artifact / 'sentry-source-maps.tar.gz'

          def sha256(path):
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          def canonical(path):
              raw = path.read_text(encoding='utf-8')
              value = json.loads(raw)
              if raw != json.dumps(value, separators=(',', ':')) + '\n':
                  raise SystemExit('Source-map control JSON is not canonical')
              return value

          receipt = canonical(receipt_path)
          receipt_keys = {
              'schema_version', 'application_sha', 'source_branch', 'build_timestamp',
              'candidate_image_id', 'candidate_archive_sha256', 'source_map_manifest_sha256',
              'source_map_archive_sha256',
          }
          if set(receipt) != receipt_keys or receipt['schema_version'] != 'assesssuite.candidate-build-receipt.v3':
              raise SystemExit('Candidate build receipt contract differs')
          if (receipt['application_sha'] != os.environ['APPLICATION_SHA'] or
              receipt['source_branch'] != os.environ['SOURCE_BRANCH'] or
              receipt['build_timestamp'] != os.environ['BUILD_TIMESTAMP']):
              raise SystemExit('Candidate build receipt identity differs')
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', receipt['candidate_image_id']) or any(
              not re.fullmatch(r'[0-9a-f]{64}', receipt[key]) for key in (
                  'candidate_archive_sha256', 'source_map_manifest_sha256', 'source_map_archive_sha256'
              )
          ):
              raise SystemExit('Candidate build receipt digest differs')
          if sha256(manifest_path) != receipt['source_map_manifest_sha256'] or sha256(archive_path) != receipt['source_map_archive_sha256']:
              raise SystemExit('Source-map archive or manifest hash differs')

          manifest = canonical(manifest_path)
          if set(manifest) != {'schema_version', 'application_sha', 'source_branch', 'build_timestamp', 'runtime_js', 'source_maps'}:
              raise SystemExit('Source-map manifest keys differ')
          if (manifest['schema_version'] != 'assesssuite.sentry-source-map-manifest.v1' or
              manifest['application_sha'] != os.environ['APPLICATION_SHA'] or
              manifest['source_branch'] != os.environ['SOURCE_BRANCH'] or
              manifest['build_timestamp'] != os.environ['BUILD_TIMESTAMP']):
              raise SystemExit('Source-map manifest identity differs')
          runtime = manifest['runtime_js']
          maps = manifest['source_maps']
          if not isinstance(runtime, list) or not runtime or not isinstance(maps, list) or len(maps) != len(runtime):
              raise SystemExit('Source-map manifest is not one-to-one')
          runtime_rows = {}
          expected = {}
          for row in runtime:
              if set(row) != {'path', 'bytes', 'sha256'} or not re.fullmatch(r'assets/[A-Za-z0-9._-]+\.js', row['path']):
                  raise SystemExit('Runtime JavaScript row differs')
              if row['path'] in runtime_rows or not isinstance(row['bytes'], int) or not 0 < row['bytes'] <= 50_000_000 or not re.fullmatch(r'[0-9a-f]{64}', row['sha256']):
                  raise SystemExit('Runtime JavaScript bounds differ')
              runtime_rows[row['path']] = row
              expected[row['path']] = row
          for row in maps:
              if set(row) != {'path', 'runtime_path', 'bytes', 'sha256'} or not re.fullmatch(r'assets/[A-Za-z0-9._-]+\.js\.map', row['path']):
                  raise SystemExit('Source-map row differs')
              if (row['path'] in expected or row['runtime_path'] not in runtime_rows or row['path'] != row['runtime_path'] + '.map' or
                  not isinstance(row['bytes'], int) or not 0 < row['bytes'] <= 50_000_000 or not re.fullmatch(r'[0-9a-f]{64}', row['sha256'])):
                  raise SystemExit('Source-map relation or bounds differ')
              expected[row['path']] = row
          if sum(row['bytes'] for row in expected.values()) > 67_108_864:
              raise SystemExit('Source-map payload exceeds the reviewed bound')

          with tarfile.open(archive_path, mode='r:gz') as archive:
              members = archive.getmembers()
              files = [member for member in members if member.isfile()]
              directories = [member for member in members if member.isdir()]
              if any(not (member.isfile() or member.isdir()) for member in members):
                  raise SystemExit('Source-map archive contains a non-data member')
              if any(member.name.rstrip('/') != 'assets' for member in directories):
                  raise SystemExit('Source-map archive directory set differs')
              if {member.name for member in files} != set(expected):
                  raise SystemExit('Source-map archive file set differs')
              for member in files:
                  row = expected[member.name]
                  if member.size != row['bytes']:
                      raise SystemExit('Source-map archive byte count differs')
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit('Source-map archive member is unreadable')
                  destination = upload / member.name
                  destination.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
                  with destination.open('xb') as output:
                      shutil.copyfileobj(source, output, length=1024 * 1024)
                  destination.chmod(0o600)
                  if destination.stat().st_size != row['bytes'] or sha256(destination) != row['sha256']:
                      raise SystemExit('Extracted source-map data differs')

          uuid = re.compile(r'[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}')
          for row in maps:
              map_value = json.loads((upload / row['path']).read_text(encoding='utf-8'))
              debug_id = map_value.get('debugId')
              if not isinstance(debug_id, str) or not uuid.fullmatch(debug_id):
                  raise SystemExit('Source map does not contain a valid injected debug ID')
              runtime_value = (upload / row['runtime_path']).read_text(encoding='utf-8')
              if '_sentryDebugIds' not in runtime_value or runtime_value.count(f'//# debugId={debug_id}') != 1:
                  raise SystemExit('Runtime JavaScript debug ID does not match its source map')
              if re.search(r'sourceMappingURL\s*=', runtime_value):
                  raise SystemExit('Runtime JavaScript publicly references a source map')
          PY
          [[ -d "$upload_root/assets" && ! -L "$upload_root/assets" ]]
          if find "$upload_root" -type l -print -quit | grep -q .; then exit 1; fi

      - name: Install checksum-verified sentry-cli 3.6.2 without credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "${SENTRY_AUTH_TOKEN:-}" && -z "${SENTRY_DSN:-}" && -z "${FLY_API_TOKEN:-}" ]]
          archive="$RUNNER_TEMP/sentry-cli-Linux-x86_64"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --max-time 120 \
            --output "$archive" \
            'https://github.com/getsentry/sentry-cli/releases/download/3.6.2/sentry-cli-Linux-x86_64'
          printf '%s  %s\n' '3a4bbf2c0d06378d4e59b337647483751a0a2b1603db5fd4991847d0cfd6478c' "$archive" | sha256sum --check --strict
          install -m 0755 "$archive" "$RUNNER_TEMP/sentry-cli"
          "$RUNNER_TEMP/sentry-cli" --version | grep -Fx 'sentry-cli 3.6.2'

      - name: Upload exact release source maps with the isolated Sentry credential
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: unimatter
          SENTRY_PROJECT: assesssuite-production
          APPLICATION_SHA: ${{ needs.gates.outputs.application_sha }}
        run: |
          set -euo pipefail
          set +x
          upload_root="$RUNNER_TEMP/sentry-upload"
          sentry_cli="$RUNNER_TEMP/sentry-cli"
          cleanup_maps() { find "$upload_root" -type f -delete; }
          trap cleanup_maps EXIT
          [[ -n "$SENTRY_AUTH_TOKEN" && "$APPLICATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -z "${FLY_API_TOKEN:-}" && -z "${SENTRY_DSN:-}" ]]
          [[ -x "$sentry_cli" && -d "$upload_root/assets" && ! -L "$upload_root/assets" ]]
          if "$sentry_cli" releases info "$APPLICATION_SHA" >/dev/null 2>&1; then
            :
          else
            "$sentry_cli" releases new "$APPLICATION_SHA"
          fi
          "$sentry_cli" sourcemaps upload \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            --release "$APPLICATION_SHA" \
            --url-prefix '~/assets' \
            --validate \
            "$upload_root/assets"
          "$sentry_cli" releases finalize "$APPLICATION_SHA"
          cleanup_maps
          trap - EXIT
          ! find "$upload_root" -type f -print -quit | grep -q .

  publish_image:
    name: Publish exact candidate image without executing candidate code
    needs: [gates, upload_sentry_source_maps]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      candidate_image_ref: ${{ steps.publish.outputs.candidate_image_ref }}
      candidate_registry_digest: ${{ steps.publish.outputs.candidate_registry_digest }}
      publication_artifact_id: ${{ steps.upload_publication.outputs.artifact-id }}
      publication_artifact_digest: sha256:${{ steps.upload_publication.outputs.artifact-digest }}
    steps:
      - name: Download exact gated candidate by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.gates.outputs.candidate_image_artifact_id }}
          path: ${{ runner.temp }}/candidate-image
          merge-multiple: true

      - name: Validate and load candidate image as data only
        shell: bash
        env:
          APPLICATION_SHA: ${{ needs.gates.outputs.application_sha }}
          SOURCE_BRANCH: ${{ needs.gates.outputs.source_branch }}
          BUILD_TIMESTAMP: ${{ needs.gates.outputs.build_timestamp }}
          CANDIDATE_IMAGE_ARTIFACT_ID: ${{ needs.gates.outputs.candidate_image_artifact_id }}
          CANDIDATE_IMAGE_ARTIFACT_DIGEST: ${{ needs.gates.outputs.candidate_image_artifact_digest }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate-image"
          [[ "$CANDIDATE_IMAGE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_IMAGE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ -f candidate-image.tar.gz && ! -L candidate-image.tar.gz ]]
          [[ -f candidate-image.tar.gz.sha256 && ! -L candidate-image.tar.gz.sha256 ]]
          [[ -f candidate-build-receipt.json && ! -L candidate-build-receipt.json ]]
          [[ -f sentry-source-map-manifest.json && ! -L sentry-source-map-manifest.json ]]
          [[ -f sentry-source-maps.tar.gz && ! -L sentry-source-maps.tar.gz ]]
          sha256sum --check --strict candidate-image.tar.gz.sha256
          RECEIPT="$RUNNER_TEMP/candidate-image/candidate-build-receipt.json" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const row = JSON.parse(fs.readFileSync(process.env.RECEIPT, 'utf8'));
          const keys = ['schema_version','application_sha','source_branch','build_timestamp','candidate_image_id','candidate_archive_sha256','source_map_manifest_sha256','source_map_archive_sha256'].sort();
          if (JSON.stringify(Object.keys(row).sort()) !== JSON.stringify(keys)) throw new Error('Candidate build receipt keys differ');
          if (row.schema_version !== 'assesssuite.candidate-build-receipt.v3' || row.application_sha !== process.env.APPLICATION_SHA || row.source_branch !== process.env.SOURCE_BRANCH || row.build_timestamp !== process.env.BUILD_TIMESTAMP || !/^sha256:[0-9a-f]{64}$/.test(row.candidate_image_id) || !/^[0-9a-f]{64}$/.test(row.candidate_archive_sha256) || !/^[0-9a-f]{64}$/.test(row.source_map_manifest_sha256) || !/^[0-9a-f]{64}$/.test(row.source_map_archive_sha256)) throw new Error('Candidate build receipt identity differs');
          NODE
          source_map_manifest_sha256="$(sha256sum sentry-source-map-manifest.json | awk '{print $1}')"
          source_map_archive_sha256="$(sha256sum sentry-source-maps.tar.gz | awk '{print $1}')"
          [[ "$source_map_manifest_sha256" == "$(node --input-type=module -e "import fs from 'node:fs';process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).source_map_manifest_sha256)" candidate-build-receipt.json)" ]]
          [[ "$source_map_archive_sha256" == "$(node --input-type=module -e "import fs from 'node:fs';process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).source_map_archive_sha256)" candidate-build-receipt.json)" ]]
          gzip -dc candidate-image.tar.gz | docker load >/dev/null
          image="assesssuite-release-gate:$APPLICATION_SHA"
          candidate_image_id="$(docker image inspect "$image" --format '{{.Id}}')"
          [[ "$candidate_image_id" == "$(node --input-type=module -e "import fs from 'node:fs';process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).candidate_image_id)" candidate-build-receipt.json)" ]]
          [[ "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" == "$APPLICATION_SHA" ]]
          candidate_oci="$RUNNER_TEMP/candidate-oci"
          install -d -m 0700 "$candidate_oci"
          ARCHIVE="$RUNNER_TEMP/candidate-image/candidate-image.tar.gz" OCI_ROOT="$candidate_oci" python3 -I - <<'PY'
          import os
          import pathlib
          import shutil
          import tarfile

          archive_path = pathlib.Path(os.environ['ARCHIVE'])
          root = pathlib.Path(os.environ['OCI_ROOT']).resolve()
          with tarfile.open(archive_path, mode='r:gz') as archive:
              members = archive.getmembers()
              if not members or len(members) > 10_000:
                  raise SystemExit('Candidate OCI archive member count differs')
              seen = set()
              total = 0
              for member in members:
                  pure = pathlib.PurePosixPath(member.name)
                  normalized = pure.as_posix().rstrip('/')
                  if (not normalized or pure.is_absolute() or '..' in pure.parts or
                      normalized in seen or not (member.isdir() or member.isfile())):
                      raise SystemExit('Candidate OCI archive contains an unsafe or duplicate member')
                  seen.add(normalized)
                  if member.isfile():
                      total += member.size
                      if member.size < 0 or member.size > 8_589_934_592 or total > 8_589_934_592:
                          raise SystemExit('Candidate OCI archive exceeds the reviewed byte bound')
              for member in members:
                  pure = pathlib.PurePosixPath(member.name)
                  destination = root.joinpath(*pure.parts)
                  if member.isdir():
                      destination.mkdir(mode=0o700, parents=True, exist_ok=True)
                      destination.chmod(0o700)
                      continue
                  destination.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit('Candidate OCI archive member is unreadable')
                  with destination.open('xb') as output:
                      shutil.copyfileobj(source, output, length=1024 * 1024)
                  destination.chmod(0o600)
          PY
          [[ -f "$candidate_oci/oci-layout" && ! -L "$candidate_oci/oci-layout" ]]
          [[ -f "$candidate_oci/index.json" && ! -L "$candidate_oci/index.json" ]]
          [[ -d "$candidate_oci/blobs/sha256" && ! -L "$candidate_oci/blobs/sha256" ]]
          if find "$candidate_oci" -type l -print -quit | grep -q .; then exit 1; fi

      - name: Install checksum-verified regctl 0.11.5 without credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "${FLY_API_TOKEN:-}" ]]
          binary="$RUNNER_TEMP/regctl"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --max-time 120 \
            --output "$binary" \
            'https://github.com/regclient/regclient/releases/download/v0.11.5/regctl-linux-amd64'
          printf '%s  %s\n' 'c93aa7638749f5aaac1a8e01787321889c78f0101809bb2880343478d0ba0467' "$binary" | sha256sum --check --strict
          chmod 0755 "$binary"
          "$binary" version | grep -F 'VCSTag:     v0.11.5'

      - name: Acquire isolated registry credential
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          REGCTL_CONFIG: ${{ runner.temp }}/publication-regctl-config.json
        run: |
          set -euo pipefail
          set +x
          umask 077
          [[ -n "$FLY_API_TOKEN" && ! -e "$REGCTL_CONFIG" ]]
          printf '%s' "$FLY_API_TOKEN" | timeout --signal=TERM --kill-after=10s 60s \
            "$RUNNER_TEMP/regctl" registry login registry.fly.io -u x --pass-stdin >/dev/null
          [[ -f "$REGCTL_CONFIG" && ! -L "$REGCTL_CONFIG" ]]

      - name: Publish immutable image and seal compatibility bundle
        id: publish
        shell: bash
        env:
          REGCTL_CONFIG: ${{ runner.temp }}/publication-regctl-config.json
          APPLICATION_SHA: ${{ needs.gates.outputs.application_sha }}
          SOURCE_BRANCH: ${{ needs.gates.outputs.source_branch }}
          BUILD_TIMESTAMP: ${{ needs.gates.outputs.build_timestamp }}
          CANDIDATE_CONFIG_SHA256: ${{ inputs.candidate_config_sha256 }}
          ROLLBACK_CONFIG_SHA256: ${{ inputs.rollback_config_sha256 }}
          ROLLBACK_SOURCE_SHA: ${{ inputs.rollback_source_sha }}
          EXPECTED_VOLUME_ID: ${{ inputs.expected_volume_id }}
          EXPECTED_LEGACY_VOLUME_ID: ${{ inputs.expected_legacy_volume_id }}
          ROLLBACK_IMAGE: ${{ inputs.rollback_image }}
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trusted_workflow_sha }}
          CANDIDATE_IMAGE_ARTIFACT_ID: ${{ needs.gates.outputs.candidate_image_artifact_id }}
          CANDIDATE_IMAGE_ARTIFACT_DIGEST: ${{ needs.gates.outputs.candidate_image_artifact_digest }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          app=assesssuite-production
          regctl="$RUNNER_TEMP/regctl"
          cleanup_registry_auth() {
            "$regctl" registry logout registry.fly.io >/dev/null 2>&1 || true
            rm -f "$REGCTL_CONFIG"
          }
          trap cleanup_registry_auth EXIT
          [[ -x "$regctl" && -f "$REGCTL_CONFIG" && ! -L "$REGCTL_CONFIG" ]]
          local_image="assesssuite-release-gate:$APPLICATION_SHA"
          candidate_image_id="$(docker image inspect "$local_image" --format '{{.Id}}')"
          new_image_tag="registry.fly.io/$app:release-$APPLICATION_SHA"
          registry_repo="registry.fly.io/$app"
          candidate_oci="$RUNNER_TEMP/candidate-oci"
          local_ref="ocidir://$candidate_oci:$APPLICATION_SHA"
          candidate_registry_digest="$("$regctl" image digest "$local_ref")"
          [[ "$candidate_registry_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          local_manifest="$candidate_oci/blobs/sha256/${candidate_registry_digest#sha256:}"
          [[ -f "$local_manifest" && ! -L "$local_manifest" ]]
          [[ "sha256:$(sha256sum "$local_manifest" | awk '{print $1}')" == "$candidate_registry_digest" ]]
          MANIFEST="$local_manifest" CANDIDATE_IMAGE_ID="$candidate_image_id" node --input-type=module <<'NODE' >"$RUNNER_TEMP/candidate-descriptors.tsv"
          import fs from 'node:fs';
          const row = JSON.parse(fs.readFileSync(process.env.MANIFEST, 'utf8'));
          if (row.schemaVersion !== 2 || row.mediaType !== 'application/vnd.oci.image.manifest.v1+json' ||
              row.config?.digest !== process.env.CANDIDATE_IMAGE_ID || !Number.isSafeInteger(row.config?.size) ||
              row.config.size < 1 || !Array.isArray(row.layers) || row.layers.length < 1 || row.layers.length > 256) {
            throw new Error('Candidate OCI manifest identity differs');
          }
          for (const descriptor of [row.config, ...row.layers]) {
            if (!/^sha256:[0-9a-f]{64}$/.test(descriptor.digest) || !Number.isSafeInteger(descriptor.size) ||
                descriptor.size < 1 || descriptor.size > 8_589_934_592 || typeof descriptor.mediaType !== 'string') {
              throw new Error('Candidate OCI descriptor differs');
            }
            console.log(`${descriptor.digest}\t${descriptor.size}`);
          }
          NODE
          copy_succeeded=0
          for copy_attempt in 1 2 3; do
            if timeout --signal=TERM --kill-after=30s 600s "$regctl" image copy --force-recursive "$local_ref" "$new_image_tag" \
              >"$RUNNER_TEMP/registry-copy.stdout" 2>"$RUNNER_TEMP/registry-copy.stderr"; then
              copy_succeeded=1
              break
            fi
            echo "Candidate image copy attempt $copy_attempt of 3 failed; registry output withheld." >&2
            if [[ "$copy_attempt" -lt 3 ]]; then
              sleep "$((copy_attempt * 5))"
            fi
          done
          rm -f "$RUNNER_TEMP/registry-copy.stdout" "$RUNNER_TEMP/registry-copy.stderr"
          if [[ "$copy_succeeded" -ne 1 ]]; then
            echo 'Candidate image copy failed after three bounded attempts; registry output withheld.' >&2
            exit 1
          fi
          remote_digest="$(timeout --signal=TERM --kill-after=10s 60s "$regctl" image digest "$new_image_tag")"
          [[ "$remote_digest" == "$candidate_registry_digest" ]]
          readback_root="$RUNNER_TEMP/registry-readback"
          install -d -m 0700 "$readback_root"
          while IFS=$'\t' read -r digest size; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ && "$size" =~ ^[1-9][0-9]*$ ]]
            local_blob="$candidate_oci/blobs/sha256/${digest#sha256:}"
            remote_blob="$readback_root/${digest#sha256:}"
            [[ -f "$local_blob" && ! -L "$local_blob" && "$(wc -c <"$local_blob")" == "$size" ]]
            [[ "sha256:$(sha256sum "$local_blob" | awk '{print $1}')" == "$digest" ]]
            timeout --signal=TERM --kill-after=30s 600s "$regctl" blob get "$registry_repo" "$digest" >"$remote_blob"
            [[ -f "$remote_blob" && ! -L "$remote_blob" && "$(wc -c <"$remote_blob")" == "$size" ]]
            [[ "sha256:$(sha256sum "$remote_blob" | awk '{print $1}')" == "$digest" ]]
            cmp --silent "$local_blob" "$remote_blob"
            rm -f "$remote_blob"
          done <"$RUNNER_TEMP/candidate-descriptors.tsv"
          candidate_image_ref="registry.fly.io/$app@$candidate_registry_digest"
          rollback_image_id="$(timeout --signal=TERM --kill-after=10s 60s "$regctl" manifest get "$ROLLBACK_IMAGE" --format raw-body | \
            node --input-type=module -e "let b='';for await(const c of process.stdin)b+=c;process.stdout.write(JSON.parse(b).config.digest)")"
          [[ "$rollback_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          rollback_config="$RUNNER_TEMP/rollback-config.json"
          timeout --signal=TERM --kill-after=30s 300s "$regctl" blob get "$registry_repo" "$rollback_image_id" >"$rollback_config"
          [[ "sha256:$(sha256sum "$rollback_config" | awk '{print $1}')" == "$rollback_image_id" ]]
          [[ "$(CONFIG="$rollback_config" node --input-type=module -e "import fs from 'node:fs';process.stdout.write(JSON.parse(fs.readFileSync(process.env.CONFIG,'utf8')).config.Labels['org.opencontainers.image.revision'])")" == "$ROLLBACK_SOURCE_SHA" ]]
          mkdir -p "$RUNNER_TEMP/publication"
          timeout --signal=TERM --kill-after=30s 600s "$regctl" image export "$ROLLBACK_IMAGE" \
            "$RUNNER_TEMP/publication/rollback-image.tar" --name "assesssuite-rollback:$ROLLBACK_SOURCE_SHA"
          gzip -1 -n "$RUNNER_TEMP/publication/rollback-image.tar"
          rollback_archive_sha256="$(sha256sum "$RUNNER_TEMP/publication/rollback-image.tar.gz" | awk '{print $1}')"
          candidate_archive_sha256="$(sha256sum "$RUNNER_TEMP/candidate-image/candidate-image.tar.gz" | awk '{print $1}')"
          PUBLICATION_RECEIPT="$RUNNER_TEMP/publication/publication-receipt.json" \
            CANDIDATE_IMAGE_ID="$candidate_image_id" CANDIDATE_ARCHIVE_SHA256="$candidate_archive_sha256" \
            CANDIDATE_IMAGE_REF="$candidate_image_ref" CANDIDATE_REGISTRY_DIGEST="$candidate_registry_digest" \
            ROLLBACK_IMAGE_ID="$rollback_image_id" ROLLBACK_ARCHIVE_SHA256="$rollback_archive_sha256" \
            env -u FLY_API_TOKEN node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const row = {
            schema_version: 'assesssuite.image-publication-receipt.v2',
            application_sha: process.env.APPLICATION_SHA,
            rollback_source_sha: process.env.ROLLBACK_SOURCE_SHA,
            expected_volume_id: process.env.EXPECTED_VOLUME_ID,
            expected_legacy_volume_id: process.env.EXPECTED_LEGACY_VOLUME_ID,
            workflow_sha: process.env.TRUSTED_WORKFLOW_SHA,
            source_branch: process.env.SOURCE_BRANCH,
            build_timestamp: process.env.BUILD_TIMESTAMP,
            candidate_config_sha256: process.env.CANDIDATE_CONFIG_SHA256,
            rollback_config_sha256: process.env.ROLLBACK_CONFIG_SHA256,
            candidate_image_artifact_id: process.env.CANDIDATE_IMAGE_ARTIFACT_ID,
            candidate_image_artifact_digest: process.env.CANDIDATE_IMAGE_ARTIFACT_DIGEST,
            candidate_archive_sha256: process.env.CANDIDATE_ARCHIVE_SHA256,
            candidate_image_id: process.env.CANDIDATE_IMAGE_ID,
            candidate_registry_digest: process.env.CANDIDATE_REGISTRY_DIGEST,
            candidate_image_ref: process.env.CANDIDATE_IMAGE_REF,
            rollback_image_ref: process.env.ROLLBACK_IMAGE,
            rollback_image_id: process.env.ROLLBACK_IMAGE_ID,
            rollback_archive_sha256: process.env.ROLLBACK_ARCHIVE_SHA256,
            github_run_id: process.env.GITHUB_RUN_ID,
            github_run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            published_at: new Date().toISOString(),

          };
          fs.writeFileSync(process.env.PUBLICATION_RECEIPT, `${JSON.stringify(row)}\n`, { mode: 0o600 });
          NODE
          printf '%s  %s\n' "$rollback_archive_sha256" rollback-image.tar.gz >"$RUNNER_TEMP/publication/rollback-image.tar.gz.sha256"
          cleanup_registry_auth
          trap - EXIT
          [[ ! -e "$REGCTL_CONFIG" ]]
          printf 'candidate_image_ref=%s\n' "$candidate_image_ref" >>"$GITHUB_OUTPUT"
          printf 'candidate_registry_digest=%s\n' "$candidate_registry_digest" >>"$GITHUB_OUTPUT"

      - name: Upload sealed publication receipt and rollback image data
        id: upload_publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publication-${{ needs.gates.outputs.application_sha }}
          path: ${{ runner.temp }}/publication
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  exact_image_compatibility:
    name: Prove exact published image compatibility without secrets
    needs: [gates, publish_image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      compatibility_artifact_id: ${{ steps.upload_compatibility.outputs.artifact-id }}
      compatibility_artifact_digest: sha256:${{ steps.upload_compatibility.outputs.artifact-digest }}
      compatibility_receipt_sha256: ${{ steps.prove.outputs.compatibility_receipt_sha256 }}
      publication_receipt_sha256: ${{ steps.prove.outputs.publication_receipt_sha256 }}
      candidate_build_receipt_sha256: ${{ steps.bundle.outputs.candidate_build_receipt_sha256 }}
      deploy_bundle_artifact_id: ${{ steps.upload_deploy_bundle.outputs.artifact-id }}
      deploy_bundle_artifact_digest: sha256:${{ steps.upload_deploy_bundle.outputs.artifact-digest }}
      deploy_bundle_manifest_sha256: ${{ steps.bundle.outputs.deploy_bundle_manifest_sha256 }}
    steps:
      - name: Check out exact candidate into the no-secret proof runner
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.gates.outputs.application_sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact candidate image by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.gates.outputs.candidate_image_artifact_id }}
          path: ${{ runner.temp }}/candidate-image
          merge-multiple: true

      - name: Download exact publication bundle by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.publish_image.outputs.publication_artifact_id }}
          path: ${{ runner.temp }}/publication
          merge-multiple: true

      - name: Set up Node.js 24 for isolated compatibility proof
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify immutable handoff and run exact-image compatibility proof
        id: prove
        shell: bash
        working-directory: candidate
        env:
          APPLICATION_SHA: ${{ needs.gates.outputs.application_sha }}
          SOURCE_BRANCH: ${{ needs.gates.outputs.source_branch }}
          BUILD_TIMESTAMP: ${{ needs.gates.outputs.build_timestamp }}
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trusted_workflow_sha }}
          CANDIDATE_CONFIG_SHA256: ${{ inputs.candidate_config_sha256 }}
          ROLLBACK_CONFIG_SHA256: ${{ inputs.rollback_config_sha256 }}
          ROLLBACK_SOURCE_SHA: ${{ inputs.rollback_source_sha }}
          EXPECTED_VOLUME_ID: ${{ inputs.expected_volume_id }}
          EXPECTED_LEGACY_VOLUME_ID: ${{ inputs.expected_legacy_volume_id }}
          ROLLBACK_IMAGE: ${{ inputs.rollback_image }}
          CANDIDATE_IMAGE_REF: ${{ needs.publish_image.outputs.candidate_image_ref }}
          CANDIDATE_IMAGE_ARTIFACT_ID: ${{ needs.gates.outputs.candidate_image_artifact_id }}
          CANDIDATE_IMAGE_ARTIFACT_DIGEST: ${{ needs.gates.outputs.candidate_image_artifact_digest }}
          PUBLICATION_ARTIFACT_ID: ${{ needs.publish_image.outputs.publication_artifact_id }}
          PUBLICATION_ARTIFACT_DIGEST: ${{ needs.publish_image.outputs.publication_artifact_digest }}
          RELEASE_CONTROL_ARTIFACT_ID: ${{ needs.gates.outputs.release_control_artifact_id }}
          RELEASE_CONTROL_ARTIFACT_DIGEST: ${{ needs.gates.outputs.release_control_artifact_digest }}
        run: |
          set -euo pipefail
          [[ -z "${FLY_API_TOKEN:-}" ]]
          if env | grep -Eq '^(FLY_API_TOKEN|DOCKER_AUTH_CONFIG)='; then exit 1; fi
          publication="$RUNNER_TEMP/publication/publication-receipt.json"
          [[ -f "$publication" && ! -L "$publication" && "$(wc -c <"$publication")" -le 8192 ]]
          PUBLICATION="$publication" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const row = JSON.parse(fs.readFileSync(process.env.PUBLICATION, 'utf8'));
          const keys = ['schema_version','application_sha','rollback_source_sha','expected_volume_id','expected_legacy_volume_id','workflow_sha','source_branch','build_timestamp','candidate_config_sha256','rollback_config_sha256','candidate_image_artifact_id','candidate_image_artifact_digest','candidate_archive_sha256','candidate_image_id','candidate_registry_digest','candidate_image_ref','rollback_image_ref','rollback_image_id','rollback_archive_sha256','github_run_id','github_run_attempt','published_at'].sort();
          if (JSON.stringify(Object.keys(row).sort()) !== JSON.stringify(keys)) throw new Error('Publication receipt keys differ');
          const e = process.env;
          for (const [key, value] of [['application_sha',e.APPLICATION_SHA],['rollback_source_sha',e.ROLLBACK_SOURCE_SHA],['expected_volume_id',e.EXPECTED_VOLUME_ID],['expected_legacy_volume_id',e.EXPECTED_LEGACY_VOLUME_ID],['workflow_sha',e.TRUSTED_WORKFLOW_SHA],['source_branch',e.SOURCE_BRANCH],['build_timestamp',e.BUILD_TIMESTAMP],['candidate_config_sha256',e.CANDIDATE_CONFIG_SHA256],['rollback_config_sha256',e.ROLLBACK_CONFIG_SHA256],['candidate_image_artifact_id',e.CANDIDATE_IMAGE_ARTIFACT_ID],['candidate_image_artifact_digest',e.CANDIDATE_IMAGE_ARTIFACT_DIGEST],['candidate_image_ref',e.CANDIDATE_IMAGE_REF],['rollback_image_ref',e.ROLLBACK_IMAGE]]) if (row[key] !== value) throw new Error(`Publication ${key} differs`);
          if (!/^sha256:[0-9a-f]{64}$/.test(row.candidate_image_id) || !/^sha256:[0-9a-f]{64}$/.test(row.rollback_image_id) || !/^sha256:[0-9a-f]{64}$/.test(row.candidate_registry_digest) || !/^[0-9a-f]{64}$/.test(row.candidate_archive_sha256) || !/^[0-9a-f]{64}$/.test(row.rollback_archive_sha256)) throw new Error('Publication digest shape differs');
          NODE
          (cd "$RUNNER_TEMP/candidate-image" && sha256sum --check --strict candidate-image.tar.gz.sha256)
          (cd "$RUNNER_TEMP/publication" && sha256sum --check --strict rollback-image.tar.gz.sha256)
          gzip -dc "$RUNNER_TEMP/candidate-image/candidate-image.tar.gz" | docker load >/dev/null
          gzip -dc "$RUNNER_TEMP/publication/rollback-image.tar.gz" | docker load >/dev/null
          candidate_image_id="$(node --input-type=module -e "import fs from 'node:fs';process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).candidate_image_id)" "$publication")"
          rollback_image_id="$(node --input-type=module -e "import fs from 'node:fs';process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).rollback_image_id)" "$publication")"
          [[ "$(docker image inspect "assesssuite-release-gate:$APPLICATION_SHA" --format '{{.Id}}')" == "$candidate_image_id" ]]
          [[ "$(docker image inspect "$rollback_image_id" --format '{{.Id}}')" == "$rollback_image_id" ]]
          registry_container="$(docker run --detach --rm --name assesssuite-proof-registry -p 127.0.0.1:5000:5000 docker.io/library/registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373)"
          cleanup_registry() { docker rm --force "$registry_container" >/dev/null 2>&1 || true; }
          trap cleanup_registry EXIT
          docker tag "$candidate_image_id" 127.0.0.1:5000/assesssuite-forward:proof
          docker tag "$rollback_image_id" 127.0.0.1:5000/assesssuite-rollback:proof
          forward_push="$(docker push 127.0.0.1:5000/assesssuite-forward:proof)"
          rollback_push="$(docker push 127.0.0.1:5000/assesssuite-rollback:proof)"
          forward_digest="$(printf '%s\n' "$forward_push" | sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}) size: [0-9]+.*$/\1/p' | tail -n 1)"
          rollback_digest="$(printf '%s\n' "$rollback_push" | sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}) size: [0-9]+.*$/\1/p' | tail -n 1)"
          [[ "$forward_digest" =~ ^sha256:[0-9a-f]{64}$ && "$rollback_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          npm ci
          node scripts/check-dependency-audit.mjs
          proof_log="$RUNNER_TEMP/exact-image-forward-rollback.tap"
          proof_stderr="$RUNNER_TEMP/exact-image-forward-rollback.stderr"
          env -u FLY_API_TOKEN -u DOCKER_AUTH_CONFIG \
            FORWARD_IMAGE="127.0.0.1:5000/assesssuite-forward@$forward_digest" \
            ROLLBACK_IMAGE="127.0.0.1:5000/assesssuite-rollback@$rollback_digest" \
            timeout --signal=TERM --kill-after=30s 600s npm run test:forward-rollback-compatibility \
            >"$proof_log" 2>"$proof_stderr"
          [[ "$(wc -c <"$proof_log")" -le 524288 && "$(wc -c <"$proof_stderr")" -le 131072 ]]
          for marker in ROLLBACK_PROOF_REGISTERING_STATE ROLLBACK_PROOF_39_FIELD_PER_FILE_MERGE ROLLBACK_PROOF_AGE_QUARANTINE ROLLBACK_PROOF_REFERRAL_COMMIT_RECEIPT_REPLAY; do
            [[ "$(grep -Fxc "# $marker=PASS" "$proof_log")" -eq 1 ]]
          done
          rm -f "$proof_log" "$proof_stderr"
          mkdir -p "$RUNNER_TEMP/compatibility"
          publication_receipt_sha256="$(sha256sum "$publication" | awk '{print $1}')"
          COMPATIBILITY_RECEIPT="$RUNNER_TEMP/compatibility/compatibility-receipt.json" \
            PUBLICATION_RECEIPT_SHA256="$publication_receipt_sha256" CANDIDATE_IMAGE_ID="$candidate_image_id" \
            ROLLBACK_IMAGE_ID="$rollback_image_id" FORWARD_PROOF_DIGEST="$forward_digest" ROLLBACK_PROOF_DIGEST="$rollback_digest" \
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const row = {
            schema_version: 'assesssuite.exact-image-compatibility-receipt.v2', result: 'PASS',
            workflow_sha: process.env.TRUSTED_WORKFLOW_SHA, application_sha: process.env.APPLICATION_SHA,
            rollback_source_sha: process.env.ROLLBACK_SOURCE_SHA,
            expected_volume_id: process.env.EXPECTED_VOLUME_ID, expected_legacy_volume_id: process.env.EXPECTED_LEGACY_VOLUME_ID,
            candidate_config_sha256: process.env.CANDIDATE_CONFIG_SHA256, rollback_config_sha256: process.env.ROLLBACK_CONFIG_SHA256,
            candidate_image_ref: process.env.CANDIDATE_IMAGE_REF, rollback_image_ref: process.env.ROLLBACK_IMAGE,
            candidate_image_id: process.env.CANDIDATE_IMAGE_ID, rollback_image_id: process.env.ROLLBACK_IMAGE_ID,
            forward_proof_digest: process.env.FORWARD_PROOF_DIGEST, rollback_proof_digest: process.env.ROLLBACK_PROOF_DIGEST,
            publication_artifact_id: process.env.PUBLICATION_ARTIFACT_ID, publication_artifact_digest: process.env.PUBLICATION_ARTIFACT_DIGEST,
            release_control_artifact_id: process.env.RELEASE_CONTROL_ARTIFACT_ID, release_control_artifact_digest: process.env.RELEASE_CONTROL_ARTIFACT_DIGEST,
            publication_receipt_sha256: process.env.PUBLICATION_RECEIPT_SHA256,
            markers: ['ROLLBACK_PROOF_REGISTERING_STATE','ROLLBACK_PROOF_39_FIELD_PER_FILE_MERGE','ROLLBACK_PROOF_AGE_QUARANTINE','ROLLBACK_PROOF_REFERRAL_COMMIT_RECEIPT_REPLAY'],
            github_run_id: process.env.GITHUB_RUN_ID, github_run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            verified_at: new Date().toISOString(),
          };
          fs.writeFileSync(process.env.COMPATIBILITY_RECEIPT, `${JSON.stringify(row)}\n`, { mode: 0o600 });
          NODE
          compatibility_receipt_sha256="$(sha256sum "$RUNNER_TEMP/compatibility/compatibility-receipt.json" | awk '{print $1}')"
          [[ "$publication_receipt_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$compatibility_receipt_sha256" =~ ^[0-9a-f]{64}$ ]]
          {
            printf 'publication_receipt_sha256=%s\n' "$publication_receipt_sha256"
            printf 'compatibility_receipt_sha256=%s\n' "$compatibility_receipt_sha256"
          } >>"$GITHUB_OUTPUT"

      - name: Upload bounded compatibility proof receipt
        id: upload_compatibility
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compatibility-${{ needs.gates.outputs.application_sha }}
          path: ${{ runner.temp }}/compatibility/compatibility-receipt.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Seal bounded deploy bundle from exact regular files
        id: bundle
        shell: bash
        env:
          PUBLICATION_RUN_ID: ${{ github.run_id }}
          PUBLICATION_RUN_ATTEMPT: ${{ github.run_attempt }}
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trusted_workflow_sha }}
          APPLICATION_SHA: ${{ needs.gates.outputs.application_sha }}
          ROLLBACK_SOURCE_SHA: ${{ inputs.rollback_source_sha }}
          EXPECTED_VOLUME_ID: ${{ inputs.expected_volume_id }}
          EXPECTED_LEGACY_VOLUME_ID: ${{ inputs.expected_legacy_volume_id }}
          BUILD_TIMESTAMP: ${{ needs.gates.outputs.build_timestamp }}
          CANDIDATE_CONFIG_SHA256: ${{ inputs.candidate_config_sha256 }}
          ROLLBACK_CONFIG_SHA256: ${{ inputs.rollback_config_sha256 }}
          CANDIDATE_IMAGE_ARTIFACT_ID: ${{ needs.gates.outputs.candidate_image_artifact_id }}
          CANDIDATE_IMAGE_ARTIFACT_DIGEST: ${{ needs.gates.outputs.candidate_image_artifact_digest }}
          RELEASE_CONTROL_ARTIFACT_ID: ${{ needs.gates.outputs.release_control_artifact_id }}
          RELEASE_CONTROL_ARTIFACT_DIGEST: ${{ needs.gates.outputs.release_control_artifact_digest }}
          PUBLICATION_ARTIFACT_ID: ${{ needs.publish_image.outputs.publication_artifact_id }}
          PUBLICATION_ARTIFACT_DIGEST: ${{ needs.publish_image.outputs.publication_artifact_digest }}
          COMPATIBILITY_ARTIFACT_ID: ${{ steps.upload_compatibility.outputs.artifact-id }}
          COMPATIBILITY_ARTIFACT_DIGEST: sha256:${{ steps.upload_compatibility.outputs.artifact-digest }}
          PUBLICATION_RECEIPT_SHA256: ${{ steps.prove.outputs.publication_receipt_sha256 }}
          COMPATIBILITY_RECEIPT_SHA256: ${{ steps.prove.outputs.compatibility_receipt_sha256 }}
          CANDIDATE_IMAGE_REF: ${{ needs.publish_image.outputs.candidate_image_ref }}
          APPLICATION_IMAGE_DIGEST: ${{ needs.publish_image.outputs.candidate_registry_digest }}
          ROLLBACK_IMAGE_REF: ${{ inputs.rollback_image }}
        run: |
          set -euo pipefail
          [[ -z "${FLY_API_TOKEN:-}" ]]
          bundle="$RUNNER_TEMP/deploy-bundle"
          install -d -m 0700 "$bundle"
          copy_regular() {
            local source="$1" destination="$2" limit="$3"
            [[ -f "$source" && ! -L "$source" ]]
            [[ "$(stat -c '%F' "$source")" == 'regular file' ]]
            [[ "$(wc -c <"$source")" -gt 0 && "$(wc -c <"$source")" -le "$limit" ]]
            install -m 0600 "$source" "$bundle/$destination"
            [[ -f "$bundle/$destination" && ! -L "$bundle/$destination" ]]
            [[ "$(stat -c '%F' "$bundle/$destination")" == 'regular file' ]]
          }
          copy_regular candidate/fly.production.toml fly.production.toml 65536
          copy_regular candidate/fly.rollback.production.toml fly.rollback.production.toml 65536
          copy_regular "$RUNNER_TEMP/candidate-image/candidate-build-receipt.json" candidate-build-receipt.json 8192
          copy_regular "$RUNNER_TEMP/candidate-image/sentry-source-map-manifest.json" sentry-source-map-manifest.json 65536
          copy_regular "$RUNNER_TEMP/publication/publication-receipt.json" publication-receipt.json 8192
          copy_regular "$RUNNER_TEMP/compatibility/compatibility-receipt.json" compatibility-receipt.json 8192
          [[ "$(sha256sum "$bundle/fly.production.toml" | awk '{print $1}')" == "$CANDIDATE_CONFIG_SHA256" ]]
          [[ "$(sha256sum "$bundle/fly.rollback.production.toml" | awk '{print $1}')" == "$ROLLBACK_CONFIG_SHA256" ]]
          candidate_build_receipt_sha256="$(sha256sum "$bundle/candidate-build-receipt.json" | awk '{print $1}')"
          source_map_manifest_sha256="$(sha256sum "$bundle/sentry-source-map-manifest.json" | awk '{print $1}')"
          [[ "$(sha256sum "$bundle/publication-receipt.json" | awk '{print $1}')" == "$PUBLICATION_RECEIPT_SHA256" ]]
          [[ "$(sha256sum "$bundle/compatibility-receipt.json" | awk '{print $1}')" == "$COMPATIBILITY_RECEIPT_SHA256" ]]
          CANDIDATE_BUILD_RECEIPT_SHA256="$candidate_build_receipt_sha256" SOURCE_MAP_MANIFEST_SHA256="$source_map_manifest_sha256" \
            BUNDLE="$bundle" MANIFEST="$bundle/deploy-bundle-manifest.json" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const read = (name) => JSON.parse(fs.readFileSync(path.join(process.env.BUNDLE, name), 'utf8'));
          const build = read('candidate-build-receipt.json');
          const publication = read('publication-receipt.json');
          const compatibility = read('compatibility-receipt.json');
          const e = process.env;
          const markers = ['ROLLBACK_PROOF_REGISTERING_STATE','ROLLBACK_PROOF_39_FIELD_PER_FILE_MERGE','ROLLBACK_PROOF_AGE_QUARANTINE','ROLLBACK_PROOF_REFERRAL_COMMIT_RECEIPT_REPLAY'];
          if (build.schema_version !== 'assesssuite.candidate-build-receipt.v3' || build.application_sha !== e.APPLICATION_SHA || build.build_timestamp !== e.BUILD_TIMESTAMP || build.source_map_manifest_sha256 !== e.SOURCE_MAP_MANIFEST_SHA256 || !/^[0-9a-f]{64}$/.test(build.source_map_archive_sha256)) throw new Error('Candidate build receipt binding differs');
