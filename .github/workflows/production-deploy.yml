name: Production deploy - exact SHA

on:
  workflow_dispatch:
    inputs:
      trusted_workflow_sha:
        description: Exact current main SHA supplying this trusted workflow; must equal github.workflow_sha and the remote main tip
        required: true
        type: string
      application_sha:
        description: Exact 40-character application commit SHA; must equal this workflow SHA and the remote main tip
        required: true
        type: string
      candidate_config_sha256:
        description: Reviewed SHA-256 of the exact candidate fly.production.toml Git blob (LF bytes)
        required: true
        type: string
      rollback_config_sha256:
        description: Reviewed SHA-256 of the exact fly.rollback.production.toml Git blob from the same main commit (LF bytes)
        required: true
        type: string
      expected_current_release:
        description: Current Fly release identifier recorded immediately before dispatch
        required: true
        type: string
      expected_current_image:
        description: Current immutable registry.fly.io/assesssuite-production image digest reference
        required: true
        type: string
      expected_machine_id:
        description: Exact sole production Fly Machine ID recorded immediately before dispatch
        required: true
        type: string
      expected_volume_id:
        description: Exact attached assesssuite_data_r12 Fly Volume ID recorded immediately before dispatch
        required: true
        type: string
      expected_legacy_volume_id:
        description: Exact detached assesssuite_data Fly Volume ID from the same production-state snapshot
        required: true
        type: string
      rollback_source_sha:
        description: Exact ancestor commit encoded by the dispatch-frozen current rollback image
        required: true
        type: string
      rollback_image:
        description: Exact dispatch-frozen current image used for automatic rollback
        required: true
        type: string
      extraction_runtime_mode:
        description: Reviewed document-extraction runtime mode in the candidate config
        required: true
        default: disabled
        type: choice
        options:
          - disabled
          - enabled
      provider_terms_attestation:
        description: Use EXTRACTION-DISABLED, or the exact terms attestation from the release runbook
        required: true
        type: string
      provider_terms_evidence_id:
        description: Durable reviewed evidence ID, or NOT-APPLICABLE-EXTRACTION-DISABLED
        required: true
        type: string
      under_age_zdr_runtime_mode:
        description: Under-13/applicable-age extraction mode; disabled unless ZDR is independently confirmed
        required: true
        default: disabled
        type: choice
        options:
          - disabled
          - enabled
      under_age_zdr_attestation:
        description: Use UNDER-AGE-ZDR-DISABLED, or the exact ZDR attestation from the release runbook
        required: true
        type: string
      under_age_zdr_evidence_id:
        description: Independent ZDR evidence ID, or NOT-APPLICABLE-UNDER-AGE-ZDR-DISABLED
        required: true
        type: string
      capability_intent_id:
        description: Workspace OS capability-broker intent ID with authorised and execution_ready decision
        required: true
        type: string
      authority_reference:
        description: Mission/order and approved deployment-intent reference
        required: true
        type: string
      preparation_run_id:
        description: Successful production-prepare-release workflow run ID that sealed the exact candidate
        required: true
        type: string
      application_image_digest:
        description: Exact sha256 registry digest declared in the authorised production intent before this dispatch
        required: true
        type: string
      deploy_bundle_artifact_id:
        description: Immutable bounded deploy-bundle artifact ID from the preparation run
        required: true
        type: string
      deploy_bundle_artifact_digest:
        description: Exact deploy-bundle artifact digest from the preparation run
        required: true
        type: string
      deploy_bundle_manifest_sha256:
        description: Exact SHA-256 of the bounded deploy-bundle manifest declared in the authorised production intent
        required: true
        type: string
      confirmation:
        description: Type DEPLOY assesssuite-production EXACT SHA
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: assesssuite-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy exact SHA and verify production
    runs-on: ubuntu-24.04
    # Inner command deadlines reserve enough of this ceiling for the complete
    # automatic rollback and verification path after any late canary failure.
    timeout-minutes: 120
    steps:
      - name: Record the rollback-reserved deployment-job deadline
        shell: bash
        run: |
          set -euo pipefail
          printf 'DEPLOY_JOB_STARTED_EPOCH=%s\n' "$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Validate immutable production intent and successful preparation run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TRUSTED_VALIDATOR_SHA256: 7a17ca9a3def75193cdabbd05c695f5c89367601ce351075b0c2ec63f40d37dd
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trusted_workflow_sha }}
          APPLICATION_SHA: ${{ inputs.application_sha }}
          CANDIDATE_CONFIG_SHA256: ${{ inputs.candidate_config_sha256 }}
          ROLLBACK_CONFIG_SHA256: ${{ inputs.rollback_config_sha256 }}
          SOURCE_BRANCH: main
          EXPECTED_CURRENT_RELEASE: ${{ inputs.expected_current_release }}
          EXPECTED_CURRENT_IMAGE: ${{ inputs.expected_current_image }}
          EXPECTED_MACHINE_ID: ${{ inputs.expected_machine_id }}
          EXPECTED_VOLUME_ID: ${{ inputs.expected_volume_id }}
          EXPECTED_LEGACY_VOLUME_ID: ${{ inputs.expected_legacy_volume_id }}
          ROLLBACK_SOURCE_SHA: ${{ inputs.rollback_source_sha }}
          ROLLBACK_SOURCE_BRANCH: main
          ROLLBACK_IMAGE: ${{ inputs.rollback_image }}
          ROLLBACK_RELEASE_SHA: ${{ inputs.rollback_source_sha }}
          CAPABILITY_INTENT_ID: ${{ inputs.capability_intent_id }}
          AUTHORITY_REFERENCE: ${{ inputs.authority_reference }}
          PREPARATION_RUN_ID: ${{ inputs.preparation_run_id }}
          CANDIDATE_IMAGE_REF: registry.fly.io/assesssuite-production@${{ inputs.application_image_digest }}
          APPLICATION_IMAGE_DIGEST: ${{ inputs.application_image_digest }}
          DEPLOY_BUNDLE_ARTIFACT_ID: ${{ inputs.deploy_bundle_artifact_id }}
          DEPLOY_BUNDLE_ARTIFACT_DIGEST: ${{ inputs.deploy_bundle_artifact_digest }}
          DEPLOY_BUNDLE_MANIFEST_SHA256: ${{ inputs.deploy_bundle_manifest_sha256 }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          IS_FORK: ${{ github.event.repository.fork }}
        run: |
          set -euo pipefail
          set +x
          [[ "$REPOSITORY" == "mbvidler-ctrl/assesssuite_migration" ]]
          [[ "$ACTOR" == "mbvidler-ctrl" && "$TRIGGERING_ACTOR" == "mbvidler-ctrl" ]]
          [[ "$IS_FORK" == "false" && "$EVENT_REF" == "refs/heads/main" ]]
          [[ "$WORKFLOW_REF" == "mbvidler-ctrl/assesssuite_migration/.github/workflows/production-deploy.yml@refs/heads/main" ]]
          [[ "$WORKFLOW_SHA" == "$TRUSTED_WORKFLOW_SHA" && "$EVENT_SHA" == "$TRUSTED_WORKFLOW_SHA" ]]
          [[ "$APPLICATION_SHA" =~ ^[0-9a-f]{40}$ && "$APPLICATION_SHA" == "$TRUSTED_WORKFLOW_SHA" ]]
          [[ "$SOURCE_BRANCH" == "main" && "$ROLLBACK_SOURCE_BRANCH" == "main" ]]
          [[ "$ROLLBACK_SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$ROLLBACK_SOURCE_SHA" != "$APPLICATION_SHA" ]]
          [[ "$ROLLBACK_RELEASE_SHA" == "$ROLLBACK_SOURCE_SHA" ]]
          [[ "$CANDIDATE_CONFIG_SHA256" =~ ^[0-9a-f]{64}$ && "$ROLLBACK_CONFIG_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_CURRENT_RELEASE" =~ ^v[1-9][0-9]*$ ]]
          [[ "$EXPECTED_CURRENT_IMAGE" =~ ^registry\.fly\.io/assesssuite-production@sha256:[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_MACHINE_ID" =~ ^[0-9a-f]{14,32}$ && "$EXPECTED_VOLUME_ID" =~ ^vol_[A-Za-z0-9]+$ && "$EXPECTED_LEGACY_VOLUME_ID" =~ ^vol_[A-Za-z0-9]+$ ]]
          [[ "$EXPECTED_VOLUME_ID" != "$EXPECTED_LEGACY_VOLUME_ID" ]]
          [[ "$ROLLBACK_IMAGE" =~ ^registry\.fly\.io/assesssuite-production@sha256:[0-9a-f]{64}$ ]]
          [[ "$ROLLBACK_IMAGE" == "$EXPECTED_CURRENT_IMAGE" ]]
          [[ "$CANDIDATE_IMAGE_REF" =~ ^registry\.fly\.io/assesssuite-production@sha256:[0-9a-f]{64}$ ]]
          [[ "$APPLICATION_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$CANDIDATE_IMAGE_REF" == "registry.fly.io/assesssuite-production@$APPLICATION_IMAGE_DIGEST" ]]
          [[ "$PREPARATION_RUN_ID" =~ ^[1-9][0-9]*$ && "$PREPARATION_RUN_ID" != "$GITHUB_RUN_ID" ]]
          [[ "$DEPLOY_BUNDLE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DEPLOY_BUNDLE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$DEPLOY_BUNDLE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CAPABILITY_INTENT_ID" =~ ^[A-Za-z0-9._:-]{1,160}$ ]]
          [[ "$AUTHORITY_REFERENCE" =~ ^[A-Za-z0-9._:/-]{1,240}$ ]]
          [[ "$CONFIRMATION" == "DEPLOY assesssuite-production EXACT SHA" ]]

          trusted_validator="$RUNNER_TEMP/trusted-validator.mjs"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 60 \
            "https://raw.githubusercontent.com/$REPOSITORY/$APPLICATION_SHA/scripts/validate-production-deploy-workflow.mjs" \
            >"$trusted_validator"
          [[ -f "$trusted_validator" && ! -L "$trusted_validator" && "$(wc -c <"$trusted_validator")" -le 524288 ]]
          printf '%s  %s\n' "$EXPECTED_TRUSTED_VALIDATOR_SHA256" "$trusted_validator" | sha256sum --check --strict
          rm -f "$trusted_validator"

          run_json="$RUNNER_TEMP/preparation-run.json"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 60 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/actions/runs/$PREPARATION_RUN_ID" >"$run_json"
          [[ -s "$run_json" && "$(wc -c <"$run_json")" -le 262144 ]]
          RUN_JSON="$run_json" env -u GH_TOKEN node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const row = JSON.parse(fs.readFileSync(process.env.RUN_JSON, 'utf8'));
          const same = (a, b, label) => { if (String(a) !== String(b)) throw new Error(`Preparation run ${label} differs`); };
          if (!Number.isSafeInteger(row.id) || row.id < 1) throw new Error('Preparation run id is not a safe positive integer');
          same(row.id, process.env.PREPARATION_RUN_ID, 'id');
          if (!Number.isSafeInteger(row.run_attempt) || row.run_attempt < 1) throw new Error('Preparation run attempt is invalid');
          same(row.event, 'workflow_dispatch', 'event');
          same(row.status, 'completed', 'status');
          same(row.conclusion, 'success', 'conclusion');
          same(row.head_branch, 'main', 'branch');
          same(row.head_sha, process.env.APPLICATION_SHA, 'head SHA');
          same(row.path, '.github/workflows/production-prepare-release.yml', 'workflow path');
          same(row.repository?.full_name, process.env.REPOSITORY, 'repository');
          same(row.head_repository?.full_name, process.env.REPOSITORY, 'head repository');
          same(row.actor?.login, 'mbvidler-ctrl', 'actor');
          same(row.triggering_actor?.login, 'mbvidler-ctrl', 'triggering actor');
          fs.appendFileSync(process.env.GITHUB_ENV, `PREPARATION_RUN_ATTEMPT=${row.run_attempt}\n`);
          NODE
          rm -f "$run_json"

          compare_json="$RUNNER_TEMP/rollback-ancestor-compare.json"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 60 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/compare/$ROLLBACK_SOURCE_SHA...$APPLICATION_SHA" >"$compare_json"
          [[ -s "$compare_json" && "$(wc -c <"$compare_json")" -le 1048576 ]]
          COMPARE_JSON="$compare_json" env -u GH_TOKEN node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const row = JSON.parse(fs.readFileSync(process.env.COMPARE_JSON, 'utf8'));
          if (row.status !== 'ahead' || row.base_commit?.sha !== process.env.ROLLBACK_SOURCE_SHA ||
              row.merge_base_commit?.sha !== process.env.ROLLBACK_SOURCE_SHA ||
              !Number.isSafeInteger(row.ahead_by) || row.ahead_by < 1) {
            throw new Error('Rollback source is not a strict ancestor of the application SHA');
          }
          NODE
          rm -f "$compare_json"

          artifact_json="$RUNNER_TEMP/deploy-bundle-artifact.json"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 60 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/actions/artifacts/$DEPLOY_BUNDLE_ARTIFACT_ID" >"$artifact_json"
          [[ -s "$artifact_json" && "$(wc -c <"$artifact_json")" -le 65536 ]]
          ARTIFACT_JSON="$artifact_json" env -u GH_TOKEN node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const row = JSON.parse(fs.readFileSync(process.env.ARTIFACT_JSON, 'utf8'));
          const same = (a, b, label) => { if (String(a) !== String(b)) throw new Error(`Deploy-bundle artifact ${label} differs`); };
          if (!Number.isSafeInteger(row.id) || row.id < 1) throw new Error('Deploy-bundle artifact id is not a safe positive integer');
          same(row.id, process.env.DEPLOY_BUNDLE_ARTIFACT_ID, 'id');
          same(row.name, `deploy-bundle-${process.env.APPLICATION_SHA}`, 'name');
          same(row.digest, process.env.DEPLOY_BUNDLE_ARTIFACT_DIGEST, 'digest');
          same(row.expired, false, 'expiry state');
          same(row.workflow_run?.id, process.env.PREPARATION_RUN_ID, 'run id');
          same(row.workflow_run?.head_sha, process.env.APPLICATION_SHA, 'head SHA');
          if (!Number.isSafeInteger(row.size_in_bytes) || row.size_in_bytes < 1 || row.size_in_bytes > 1_048_576) {
            throw new Error('Deploy-bundle artifact size is invalid');
          }
          NODE
          rm -f "$artifact_json"

      - name: Download bounded deploy bundle by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ inputs.deploy_bundle_artifact_id }}
          path: ${{ runner.temp }}/deploy-bundle
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: mbvidler-ctrl/assesssuite_migration
          run-id: ${{ inputs.preparation_run_id }}

      - name: Validate sealed controls and compatibility receipt before secret injection
        shell: bash
        env:
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trusted_workflow_sha }}
          APPLICATION_SHA: ${{ inputs.application_sha }}
          SOURCE_BRANCH: main
          CANDIDATE_CONFIG_SHA256: ${{ inputs.candidate_config_sha256 }}
          ROLLBACK_CONFIG_SHA256: ${{ inputs.rollback_config_sha256 }}
          ROLLBACK_SOURCE_SHA: ${{ inputs.rollback_source_sha }}
          ROLLBACK_SOURCE_BRANCH: main
          EXPECTED_CURRENT_IMAGE: ${{ inputs.expected_current_image }}
          EXPECTED_VOLUME_ID: ${{ inputs.expected_volume_id }}
          EXPECTED_LEGACY_VOLUME_ID: ${{ inputs.expected_legacy_volume_id }}
          ROLLBACK_IMAGE: ${{ inputs.rollback_image }}
          CANDIDATE_IMAGE_REF: registry.fly.io/assesssuite-production@${{ inputs.application_image_digest }}
          APPLICATION_IMAGE_DIGEST: ${{ inputs.application_image_digest }}
          PREPARATION_RUN_ID: ${{ inputs.preparation_run_id }}
          DEPLOY_BUNDLE_ARTIFACT_ID: ${{ inputs.deploy_bundle_artifact_id }}
          DEPLOY_BUNDLE_ARTIFACT_DIGEST: ${{ inputs.deploy_bundle_artifact_digest }}
          DEPLOY_BUNDLE_MANIFEST_SHA256: ${{ inputs.deploy_bundle_manifest_sha256 }}
          EXTRACTION_RUNTIME_MODE: ${{ inputs.extraction_runtime_mode }}
          PROVIDER_TERMS_ATTESTATION: ${{ inputs.provider_terms_attestation }}
          PROVIDER_TERMS_EVIDENCE_ID: ${{ inputs.provider_terms_evidence_id }}
          UNDER_AGE_ZDR_RUNTIME_MODE: ${{ inputs.under_age_zdr_runtime_mode }}
          UNDER_AGE_ZDR_ATTESTATION: ${{ inputs.under_age_zdr_attestation }}
          UNDER_AGE_ZDR_EVIDENCE_ID: ${{ inputs.under_age_zdr_evidence_id }}
        run: |
          set -euo pipefail
          [[ -z "${FLY_API_TOKEN:-}" ]]
          if env | grep -Eq '^(FLY_API_TOKEN|DOCKER_AUTH_CONFIG)='; then exit 1; fi
          bundle="$RUNNER_TEMP/deploy-bundle"
          candidate_config="$bundle/fly.production.toml"
          rollback_config="$bundle/fly.rollback.production.toml"
          manifest="$bundle/deploy-bundle-manifest.json"
          expected_files=$'candidate-build-receipt.json\ncompatibility-receipt.json\ndeploy-bundle-manifest.json\nfly.production.toml\nfly.rollback.production.toml\npublication-receipt.json\nsentry-source-map-manifest.json'
          actual_files="$(find "$bundle" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          [[ "$actual_files" == "$expected_files" ]]
          for file in fly.production.toml fly.rollback.production.toml candidate-build-receipt.json publication-receipt.json compatibility-receipt.json deploy-bundle-manifest.json sentry-source-map-manifest.json; do
            [[ -f "$bundle/$file" && ! -L "$bundle/$file" ]]
            [[ "$(stat -c '%F' "$bundle/$file")" == 'regular file' ]]
          done
          [[ "$(wc -c <"$candidate_config")" -gt 0 && "$(wc -c <"$candidate_config")" -le 65536 ]]
          [[ "$(wc -c <"$rollback_config")" -gt 0 && "$(wc -c <"$rollback_config")" -le 65536 ]]
          for file in candidate-build-receipt.json publication-receipt.json compatibility-receipt.json deploy-bundle-manifest.json; do
            [[ "$(wc -c <"$bundle/$file")" -gt 0 && "$(wc -c <"$bundle/$file")" -le 12288 ]]
          done
          [[ "$(wc -c <"$bundle/sentry-source-map-manifest.json")" -gt 0 && "$(wc -c <"$bundle/sentry-source-map-manifest.json")" -le 65536 ]]
          [[ "$(sha256sum "$manifest" | awk '{print $1}')" == "$DEPLOY_BUNDLE_MANIFEST_SHA256" ]]
          [[ "$(sha256sum "$candidate_config" | awk '{print $1}')" == "$CANDIDATE_CONFIG_SHA256" ]]
          [[ "$(sha256sum "$rollback_config" | awk '{print $1}')" == "$ROLLBACK_CONFIG_SHA256" ]]
          [[ "$(grep -Fxc '  EXPECTED_APP_URL = "https://app.assesssuite.com"' "$candidate_config")" -eq 1 ]]
          [[ "$(grep -Fxc '  EXPECTED_APP_URL = "https://app.assesssuite.com"' "$rollback_config")" -eq 1 ]]
          BUNDLE="$bundle" MANIFEST="$manifest" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const canonical = (name) => {
            const raw = fs.readFileSync(path.join(process.env.BUNDLE, name), 'utf8');
            const value = JSON.parse(raw);
            if (raw !== `${JSON.stringify(value)}\n`) throw new Error(`${name} is not canonical single-object JSON`);
            return value;
          };
          const exactKeys = (value, expected, label) => {
            if (!value || typeof value !== 'object' || Array.isArray(value) ||
                JSON.stringify(Object.keys(value).sort()) !== JSON.stringify([...expected].sort())) {
              throw new Error(`${label} keys differ`);
            }
          };
          const digest = (name) => crypto.createHash('sha256').update(fs.readFileSync(path.join(process.env.BUNDLE, name))).digest('hex');
          const build = canonical('candidate-build-receipt.json');
          const publication = canonical('publication-receipt.json');
          const compatibility = canonical('compatibility-receipt.json');
          const manifest = canonical('deploy-bundle-manifest.json');
          const sourceMaps = canonical('sentry-source-map-manifest.json');
          const markers = ['ROLLBACK_PROOF_REGISTERING_STATE','ROLLBACK_PROOF_39_FIELD_PER_FILE_MERGE','ROLLBACK_PROOF_AGE_QUARANTINE','ROLLBACK_PROOF_REFERRAL_COMMIT_RECEIPT_REPLAY'];
          exactKeys(build, ['schema_version','application_sha','source_branch','build_timestamp','candidate_image_id','candidate_archive_sha256','source_map_manifest_sha256','source_map_archive_sha256'], 'Candidate build receipt');
          exactKeys(publication, ['schema_version','application_sha','rollback_source_sha','expected_volume_id','expected_legacy_volume_id','workflow_sha','source_branch','build_timestamp','candidate_config_sha256','rollback_config_sha256','candidate_image_artifact_id','candidate_image_artifact_digest','candidate_archive_sha256','candidate_image_id','candidate_registry_digest','candidate_image_ref','rollback_image_ref','rollback_image_id','rollback_archive_sha256','github_run_id','github_run_attempt','published_at'], 'Publication receipt');
          exactKeys(compatibility, ['schema_version','result','workflow_sha','application_sha','rollback_source_sha','expected_volume_id','expected_legacy_volume_id','candidate_config_sha256','rollback_config_sha256','candidate_image_ref','rollback_image_ref','candidate_image_id','rollback_image_id','forward_proof_digest','rollback_proof_digest','publication_artifact_id','publication_artifact_digest','release_control_artifact_id','release_control_artifact_digest','publication_receipt_sha256','markers','github_run_id','github_run_attempt','verified_at'], 'Compatibility receipt');
          exactKeys(manifest, ['schema_version','result','publication_run_id','publication_run_attempt','workflow_sha','application_sha','rollback_source_sha','expected_volume_id','expected_legacy_volume_id','build_timestamp','candidate_config_sha256','rollback_config_sha256','candidate_image_artifact_id','candidate_image_artifact_digest','release_control_artifact_id','release_control_artifact_digest','publication_artifact_id','publication_artifact_digest','compatibility_artifact_id','compatibility_artifact_digest','candidate_build_receipt_sha256','source_map_manifest_sha256','publication_receipt_sha256','compatibility_receipt_sha256','candidate_image_id','candidate_image_ref','application_image_digest','rollback_image_ref','rollback_image_id','markers'], 'Deploy bundle manifest');
          exactKeys(sourceMaps, ['schema_version','application_sha','source_branch','build_timestamp','runtime_js','source_maps'], 'Sentry source-map manifest');
          const e = process.env;
          const same = (actual, expected, label) => { if (String(actual) !== String(expected)) throw new Error(`${label} differs`); };
          same(manifest.schema_version, 'assesssuite.deploy-bundle-manifest.v2', 'Manifest schema');
          same(manifest.result, 'PASS', 'Manifest result');
          same(manifest.publication_run_id, e.PREPARATION_RUN_ID, 'Manifest run id');
          same(manifest.publication_run_attempt, e.PREPARATION_RUN_ATTEMPT, 'Manifest run attempt');
          same(manifest.workflow_sha, e.TRUSTED_WORKFLOW_SHA, 'Manifest workflow SHA');
          same(manifest.application_sha, e.APPLICATION_SHA, 'Manifest application SHA');
          same(manifest.rollback_source_sha, e.ROLLBACK_SOURCE_SHA, 'Manifest rollback source SHA');
          same(manifest.expected_volume_id, e.EXPECTED_VOLUME_ID, 'Manifest active volume ID');
          same(manifest.expected_legacy_volume_id, e.EXPECTED_LEGACY_VOLUME_ID, 'Manifest legacy volume ID');
          same(manifest.candidate_config_sha256, e.CANDIDATE_CONFIG_SHA256, 'Manifest candidate config hash');
          same(manifest.rollback_config_sha256, e.ROLLBACK_CONFIG_SHA256, 'Manifest rollback config hash');
          same(manifest.candidate_image_ref, e.CANDIDATE_IMAGE_REF, 'Manifest candidate image ref');
          same(manifest.application_image_digest, e.APPLICATION_IMAGE_DIGEST, 'Manifest application image digest');
          same(manifest.rollback_image_ref, e.ROLLBACK_IMAGE, 'Manifest rollback image ref');
          same(manifest.rollback_image_ref, e.EXPECTED_CURRENT_IMAGE, 'Manifest expected current image ref');
          same(manifest.candidate_build_receipt_sha256, digest('candidate-build-receipt.json'), 'Candidate build receipt hash');
          same(manifest.publication_receipt_sha256, digest('publication-receipt.json'), 'Publication receipt hash');
          same(manifest.compatibility_receipt_sha256, digest('compatibility-receipt.json'), 'Compatibility receipt hash');
          same(manifest.source_map_manifest_sha256, digest('sentry-source-map-manifest.json'), 'Source-map manifest hash');
