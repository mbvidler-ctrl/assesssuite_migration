          wait_for_candidate_observer_stabilization() {
            local max_attempts=5
            local required_consecutive_matches=2
            local retry_delay_seconds=10
            local command_timeout_seconds=20
            local attempt=1
            local consecutive_matches=0
            local last_matching_observation=''
            local attempt_failure=''
            local candidate_current=''
            local candidate_attempt_release=''
            local candidate_attempt_image=''

            candidate_observer_failure='not-observed'
            while (( attempt <= max_attempts )); do
              attempt_failure=''
              candidate_current=''
              candidate_attempt_release=''
              candidate_attempt_image=''
              if ! assert_volume_snapshot_policy "candidate-observer-$attempt" \
                "$production_volume_id" "$production_machine_id" "$command_timeout_seconds"; then
                attempt_failure='topology-or-volume-snapshot-policy-mismatch'
              elif ! timeout --signal=TERM --kill-after=10s "${command_timeout_seconds}s" \
                fly releases --app "$app" --image --json >"$new_json"; then
                attempt_failure='release-query-failed'
              elif ! candidate_current="$(current_release "$new_json" "$command_timeout_seconds")"; then
                attempt_failure='release-machine-image-binding-mismatch'
              else
                IFS=$'\t' read -r candidate_attempt_release candidate_attempt_image <<<"$candidate_current"
                if [[ ! "$candidate_attempt_release" =~ ^v[1-9][0-9]*$ \
                  || ! "$final_prior_release" =~ ^v[1-9][0-9]*$ ]] \
                  || (( 10#${candidate_attempt_release#v} <= 10#${final_prior_release#v} )); then
                  attempt_failure='candidate-release-not-newer-than-final-prior'
                elif [[ "$candidate_attempt_image" != "$candidate_image_ref" ]]; then
                  attempt_failure='deployed-image-mismatch'
                elif [[ "$candidate_current" == "$last_matching_observation" ]]; then
                  consecutive_matches=$((consecutive_matches + 1))
                else
                  last_matching_observation="$candidate_current"
                  consecutive_matches=1
                fi

                if [[ -z "$attempt_failure" ]]; then
                  candidate_observer_failure='exact-match-awaiting-confirmation'
                  echo "Candidate Fly observer exact match ${consecutive_matches}/${required_consecutive_matches} on attempt ${attempt}." >&2
                  if (( consecutive_matches >= required_consecutive_matches )); then
                    candidate_release="$candidate_attempt_release"
                    candidate_image="$candidate_attempt_image"
                    candidate_observer_failure=''
                    return 0
                  fi
                fi
              fi

              if [[ -n "$attempt_failure" ]]; then
                candidate_observer_failure="$attempt_failure"
                consecutive_matches=0
                last_matching_observation=''
                candidate_attempt_release=''
                candidate_attempt_image=''
                echo "Candidate Fly observer attempt ${attempt}/${max_attempts} was not exact (${attempt_failure}); waiting for control-plane convergence." >&2
              fi
              if (( attempt == max_attempts )); then
                break
              fi
              sleep "$retry_delay_seconds"
              attempt=$((attempt + 1))
            done

            candidate_observer_failure=${candidate_observer_failure:-stabilization-window-exhausted}
            echo "Candidate Fly observer failed to produce ${required_consecutive_matches} consecutive exact topology and release/image observations in ${max_attempts} attempts (${candidate_observer_failure})." >&2
            return 1
          }

          wait_for_rollback_observer_stabilization() {
            local max_attempts=5
            local required_consecutive_matches=2
            local retry_delay_seconds=10
            local command_timeout_seconds=20
            local attempt=1
            local consecutive_matches=0
            local last_matching_observation=''
            local attempt_failure=''
            local rollback_current=''

            rollback_observer_failure='not-observed'
            while (( attempt <= max_attempts )); do
              attempt_failure=''
              rollback_current=''
              if ! assert_volume_snapshot_policy "rollback-observer-$attempt" \
                "$production_volume_id" "$production_machine_id" "$command_timeout_seconds"; then
                attempt_failure='topology-or-volume-snapshot-policy-mismatch'
              elif ! timeout --signal=TERM --kill-after=10s "${command_timeout_seconds}s" \
                fly releases --app "$app" --image --json >"$rollback_json"; then
                attempt_failure='release-query-failed'
              elif ! rollback_current="$(current_release "$rollback_json" "$command_timeout_seconds")"; then
                attempt_failure='release-machine-image-binding-mismatch'
              else
                IFS=$'\t' read -r rollback_release rollback_image_actual <<<"$rollback_current"
                if [[ ! "$rollback_release" =~ ^v[1-9][0-9]*$ \
                  || ! "$candidate_release" =~ ^v[1-9][0-9]*$ \
                  || ! "$final_prior_release" =~ ^v[1-9][0-9]*$ ]] \
                  || (( 10#${rollback_release#v} <= 10#${candidate_release#v} \
                    || 10#${rollback_release#v} <= 10#${final_prior_release#v} )); then
                  attempt_failure='rollback-release-not-newer-than-candidate-and-final-prior'
                elif [[ "$rollback_image_actual" != "$ROLLBACK_IMAGE" ]]; then
                  attempt_failure='rollback-image-mismatch'
                elif [[ "$rollback_current" == "$last_matching_observation" ]]; then
                  consecutive_matches=$((consecutive_matches + 1))
                else
                  last_matching_observation="$rollback_current"
                  consecutive_matches=1
                fi

                if [[ -z "$attempt_failure" ]]; then
                  rollback_observer_failure='exact-match-awaiting-confirmation'
                  echo "Rollback Fly observer exact match ${consecutive_matches}/${required_consecutive_matches} on attempt ${attempt}." >&2
                  if (( consecutive_matches >= required_consecutive_matches )); then
                    rollback_observer_failure=''
                    return 0
                  fi
                fi
              fi

              if [[ -n "$attempt_failure" ]]; then
                rollback_observer_failure="$attempt_failure"
                consecutive_matches=0
                last_matching_observation=''
                rollback_release=''
                rollback_image_actual=''
                echo "Rollback Fly observer attempt ${attempt}/${max_attempts} was not exact (${attempt_failure}); waiting for control-plane convergence." >&2
              fi
              if (( attempt == max_attempts )); then
                break
              fi
              sleep "$retry_delay_seconds"
              attempt=$((attempt + 1))
            done

            rollback_observer_failure=${rollback_observer_failure:-stabilization-window-exhausted}
            echo "Rollback Fly observer failed to produce ${required_consecutive_matches} consecutive exact topology and release/image observations in ${max_attempts} attempts (${rollback_observer_failure})." >&2
            return 1
          }

          append_summary() {
            {
              echo "## AssessSuite production release"
              echo
              echo "- Workflow run: $GITHUB_RUN_ID"
              echo "- Capability intent: $CAPABILITY_INTENT_ID"
              echo "- Authority: $AUTHORITY_REFERENCE"
              echo "- Trusted workflow SHA: $TRUSTED_WORKFLOW_SHA"
              echo "- Candidate SHA: $APPLICATION_SHA"
              echo "- Candidate Fly config SHA-256: $CANDIDATE_CONFIG_SHA256"
              echo "- Rollback source SHA: $ROLLBACK_SOURCE_SHA"
              echo "- Rollback Fly config SHA-256: $ROLLBACK_CONFIG_SHA256"
              echo "- Source branch: $SOURCE_BRANCH"
              echo "- Build timestamp: $BUILD_TIMESTAMP"
              echo "- Extraction runtime mode: $EXTRACTION_RUNTIME_MODE"
              echo "- Provider-terms evidence: $PROVIDER_TERMS_EVIDENCE_ID"
              echo "- Under-age/ZDR runtime mode: $UNDER_AGE_ZDR_RUNTIME_MODE"
              echo "- Under-age/ZDR evidence: $UNDER_AGE_ZDR_EVIDENCE_ID"
              echo "- Real-provider full-schema differential referral probe: $provider_probe_result"
              echo "- Referral production canary: $referral_canary_result"
              echo "- Exact-image forward/rollback shared-store proof: $forward_rollback_proof_result"
              echo "- Canary fixture: AssessSuite_Demo_GP_Referral(1).pdf (repository-generated synthetic PDF; SHA-256 ${referral_canary_fixture_sha256:-not-established})"
              echo "- Production topology (content-free): exact=$volume_snapshot_policy_verified; machine_id=$production_machine_id; attached_volume_id=$production_volume_id; attached_volume_name=assesssuite_data_r12; detached_legacy_volume_id=$EXPECTED_LEGACY_VOLUME_ID; detached_legacy_volume_name=assesssuite_data; encrypted=$volume_snapshot_policy_verified; scheduled_snapshots=$volume_snapshot_policy_verified; snapshot_retention_days=5"
              echo "- Predeploy on-demand snapshot (content-free): created=$predeploy_snapshot_created; snapshot_id=$predeploy_snapshot_id; digest=$predeploy_snapshot_digest; source_volume_id=$predeploy_snapshot_source_volume_id; new_created_count=$predeploy_snapshot_created_count; created_at_utc=$predeploy_snapshot_created_at_utc"
              echo "- Automatic rollback scope: application image/config only; the predeploy volume snapshot is a separate recovery point and is not automatically restored"
              echo "- Prior release: ${prior_release:-not-established}"
              echo "- Prior image: ${prior_image:-not-established}"
              echo "- Candidate release: ${candidate_release:-not-established}"
              echo "- Candidate image: ${candidate_image:-${candidate_image_ref:-not-established}}"
              echo "- Rollback image: $ROLLBACK_IMAGE"
              echo "- Rollback release: ${rollback_release:-not-used}"
              echo "- Result: $1"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          rollback_now() {
            local reason=$1
            local rollback_command_status=0
            echo "Production verification failed ($reason); deploying the pre-verified compatibility image." >&2
            timeout --signal=TERM --kill-after=30s 420s fly deploy "$deploy_source_dir" \
              --config "$rollback_config" \
              --strategy immediate \
              --ha=false \
              --update-only \
              --remote-only \
              --skip-release-command \
              --app "$app" \
              --image "$ROLLBACK_IMAGE" \
              --yes || rollback_command_status=$?
            rollback_observer_failure=''
            if ! wait_for_rollback_observer_stabilization; then
              append_summary "FAILED; rollback command exit ${rollback_command_status}; observer stabilization exhausted (${rollback_observer_failure:-unknown}; $reason)"
              return 1
            fi
            if [[ "$rollback_command_status" -ne 0 ]]; then
              echo "Rollback command returned exit ${rollback_command_status}, but the bounded observer proved the newer exact rollback release and topology." >&2
            fi
            if ! read_version 'https://app.assesssuite.com' "$ROLLBACK_RELEASE_SHA" "$RUNNER_TEMP/rollback-apex-version.json" \
              || ! read_version 'https://assesssuite-production.fly.dev' "$ROLLBACK_RELEASE_SHA" "$RUNNER_TEMP/rollback-fly-version.json"; then
              append_summary "FAILED; rollback /api/version verification failed ($reason)"
              return 1
            fi
            if ! read_public_settings 'https://app.assesssuite.com' "$RUNNER_TEMP/rollback-apex-public-settings.json" \
              || ! read_public_settings 'https://assesssuite-production.fly.dev' "$RUNNER_TEMP/rollback-fly-public-settings.json"; then
              append_summary "FAILED; rollback legal settings verification failed ($reason)"
              return 1
            fi
            if ! read_public_surface 'https://app.assesssuite.com' 'rollback-apex' 'rollback' \
              || ! read_public_surface 'https://assesssuite-production.fly.dev' 'rollback-fly' 'rollback'; then
              append_summary "FAILED; rollback public surface verification failed ($reason)"
              return 1
            fi
            if ! assert_secret_name_boundary postrollback forbid; then
              append_summary "FAILED; postrollback names-only production secret boundary drifted ($reason)"
              return 1
            fi
            if ! assert_volume_snapshot_policy postrollback "$EXPECTED_VOLUME_ID" "$EXPECTED_MACHINE_ID"; then
              append_summary "FAILED; postrollback r12 and detached-legacy topology verification failed ($reason)"
              return 1
            fi
            rm -f "$RUNNER_TEMP/postrollback-secret-names.json"
            append_summary "FAILED; application image automatically rolled back and verified (rollback command exit ${rollback_command_status}; $reason)"
            return 0
          }

          [[ "$candidate_image_ref" == "$CANDIDATE_IMAGE_REF" ]]
          [[ "$forward_rollback_proof_result" == 'PASS (fresh no-secret exact-image receipt verified before credential injection)' ]]

          if ! assert_secret_name_boundary initial allow; then
            append_summary 'FAILED; initial names-only production secret boundary did not contain the exact reviewed migration set'
            exit 1
          fi
          initial_boundary_state="$(<"$RUNNER_TEMP/initial-secret-boundary-state")"
          [[ "$initial_boundary_state" == 'settled' || "$initial_boundary_state" == 'pre-dashboard' || "$initial_boundary_state" == 'transition-pending' || "$initial_boundary_state" == 'pre-dashboard-transition-pending' ]]
          rm -f "$RUNNER_TEMP/initial-secret-names.json"

          # Freeze the exact pre-split release before the first production
          # mutation (the on-demand volume snapshot). Both routed origins must
          # still report the dispatch-frozen rollback source SHA.
          if ! assert_volume_snapshot_policy pre-mutation "$EXPECTED_VOLUME_ID" "$EXPECTED_MACHINE_ID"; then
            append_summary 'FAILED; pre-mutation machine or volume identity drifted'
            exit 1
          fi
          pre_mutation_json="$RUNNER_TEMP/pre-mutation-releases.json"
          timeout --signal=TERM --kill-after=10s 60s \
            fly releases --app "$app" --image --json >"$pre_mutation_json"
          IFS=$'\t' read -r pre_mutation_release pre_mutation_image < <(current_release "$pre_mutation_json")
          if [[ "$pre_mutation_release" != "$EXPECTED_CURRENT_RELEASE" \
            || "$pre_mutation_image" != "$EXPECTED_CURRENT_IMAGE" \
            || "$ROLLBACK_IMAGE" != "$EXPECTED_CURRENT_IMAGE" ]]; then
            append_summary 'FAILED; dispatch-frozen pre-mutation release or rollback image drifted'
            exit 1
          fi
          if ! read_version 'https://app.assesssuite.com' "$ROLLBACK_SOURCE_SHA" "$RUNNER_TEMP/pre-mutation-app-version.json" \
            || ! read_version 'https://assesssuite-production.fly.dev' "$ROLLBACK_SOURCE_SHA" "$RUNNER_TEMP/pre-mutation-fly-version.json"; then
            append_summary 'FAILED; current /api/version did not prove the rollback source before mutation'
            exit 1
          fi
          rm -f "$pre_mutation_json"

          deployment_job_timeout_seconds=7200
          maximum_post_gate_path_seconds=4888
          maximum_gate_elapsed_seconds=1200
          (( maximum_gate_elapsed_seconds + maximum_post_gate_path_seconds <= deployment_job_timeout_seconds ))
          deploy_job_elapsed_seconds=$(( $(date -u +%s) - DEPLOY_JOB_STARTED_EPOCH ))
          if [[ "$DEPLOY_JOB_STARTED_EPOCH" -le 0 || "$deploy_job_elapsed_seconds" -lt 0 \
            || "$deploy_job_elapsed_seconds" -gt "$maximum_gate_elapsed_seconds" ]]; then
            echo 'The deployment job no longer has the reviewed time reserve for snapshot, candidate verification and automatic image rollback.' >&2
            append_summary 'FAILED; rollback-reserved deployment time gate closed before snapshot or application deployment'
            exit 1
          fi

          if ! create_predeploy_volume_snapshot; then
            echo 'The content-free on-demand predeploy volume snapshot did not reach created status within the bounded gate.' >&2
            append_summary 'FAILED; on-demand predeploy snapshot gate failed before application deployment'
            exit 1
          fi

          # Final just-in-time freeze: no branch, workflow, config, release,
          # image, secret-name, machine or volume drift is accepted between
          # the reviewed gates and the production mutation below.
          [[ "$predeploy_snapshot_created" == true ]]
          [[ "$predeploy_snapshot_source_volume_id" == "$EXPECTED_VOLUME_ID" ]]
          remote_main_sha="$(timeout --signal=TERM --kill-after=10s 60s git ls-remote --exit-code https://github.com/mbvidler-ctrl/assesssuite_migration.git refs/heads/main | awk 'NR == 1 { print $1 }')"
          [[ "$remote_main_sha" == "$APPLICATION_SHA" ]]
          [[ "$remote_main_sha" == "$TRUSTED_WORKFLOW_SHA" ]]
          [[ "$(sha256sum "$candidate_config" | awk '{print $1}')" == "$CANDIDATE_CONFIG_SHA256" ]]
          [[ "$(sha256sum "$rollback_config" | awk '{print $1}')" == "$ROLLBACK_CONFIG_SHA256" ]]
          if ! assert_volume_snapshot_policy final-predeploy "$EXPECTED_VOLUME_ID" "$EXPECTED_MACHINE_ID"; then
            append_summary 'FAILED; final predeploy machine or volume identity drifted'
            exit 1
          fi
          final_prior_json="$RUNNER_TEMP/final-prior-releases.json"
          timeout --signal=TERM --kill-after=10s 60s \
            fly releases --app "$app" --image --json >"$final_prior_json"
          final_prior_current="$(current_release "$final_prior_json")"
          IFS=$'\t' read -r final_prior_release final_prior_image <<<"$final_prior_current"
          if [[ "$final_prior_release" != "$EXPECTED_CURRENT_RELEASE" \
            || "$final_prior_image" != "$EXPECTED_CURRENT_IMAGE" ]]; then
            append_summary 'FAILED; final predeploy release or image drifted'
            exit 1
          fi
          if [[ "$initial_boundary_state" == 'transition-pending' || "$initial_boundary_state" == 'pre-dashboard-transition-pending' ]]; then
            timeout --signal=TERM --kill-after=10s 60s \
              fly secrets unset GENERAL_CLINICAL_LLM_ENABLED --stage --app "$app"
          elif [[ "$initial_boundary_state" != 'settled' && "$initial_boundary_state" != 'pre-dashboard' ]]; then
            append_summary 'FAILED; initial secret-boundary state marker was invalid'
            exit 1
          fi
          # Stage the exact application origin, Sentry DSN and dashboard token
          # immediately before the sole application deploy. --stage binds all
          # three to the candidate release without a separate restart.
          [[ -n "$SENTRY_DSN" && -n "$ASSESSSUITE_DASHBOARD_METRICS_TOKEN" ]]
          timeout --signal=TERM --kill-after=10s 60s \
            fly secrets set APP_URL=https://app.assesssuite.com SENTRY_DSN="$SENTRY_DSN" ASSESSSUITE_DASHBOARD_METRICS_TOKEN="$ASSESSSUITE_DASHBOARD_METRICS_TOKEN" --stage --app "$app"
          if ! assert_secret_name_boundary final forbid; then
            append_summary 'FAILED; final names-only production secret boundary drifted'
            exit 1
          fi
          rm -f "$RUNNER_TEMP/initial-secret-boundary-state" "$RUNNER_TEMP/final-secret-names.json" "$RUNNER_TEMP/final-secret-boundary-state" "$final_prior_json"

          deploy_status=0
          timeout --signal=TERM --kill-after=30s 420s fly deploy "$deploy_source_dir" \
            --config "$candidate_config" \
            --strategy immediate \
            --ha=false \
            --update-only \
            --remote-only \
            --skip-release-command \
            --app "$app" \
            --image "$candidate_image_ref" \
            --yes || deploy_status=$?

          if [[ "$deploy_status" -ne 0 ]]; then
            candidate_observer_failure=''
            if ! wait_for_candidate_observer_stabilization; then
              append_summary "FAILED; candidate deploy command exit ${deploy_status}; candidate release was not proved (${candidate_observer_failure:-unknown}); automatic rollback was not attempted"
              exit 1
            fi
            if ! rollback_now "fly-deploy-exit-${deploy_status};candidate-proved-at-${candidate_release}"; then
              echo 'Automatic image rollback did not verify successfully.' >&2
            fi
            exit 1
          fi

          verification_failure=''
          candidate_observer_failure=''
          if ! wait_for_candidate_observer_stabilization; then
            verification_failure="candidate-observer-stabilization-timeout:${candidate_observer_failure:-unknown}"
          elif ! assert_secret_name_boundary postactivation forbid; then
            verification_failure='postactivation-secret-boundary-mismatch'
          elif ! rm -f "$RUNNER_TEMP/postactivation-required-names.json" "$RUNNER_TEMP/postactivation-secret-boundary-state"; then
            verification_failure='postactivation-secret-boundary-evidence-cleanup-failed'
          elif ! read_version 'https://app.assesssuite.com' "$APPLICATION_SHA" "$RUNNER_TEMP/apex-version.json"; then
            verification_failure='apex-version-mismatch'
          elif ! read_version 'https://assesssuite-production.fly.dev' "$APPLICATION_SHA" "$RUNNER_TEMP/fly-version.json"; then
            verification_failure='fly-domain-version-mismatch'
          elif ! read_public_settings 'https://app.assesssuite.com' "$RUNNER_TEMP/apex-public-settings.json"; then
            verification_failure='apex-legal-settings-mismatch'
          elif ! read_public_settings 'https://assesssuite-production.fly.dev' "$RUNNER_TEMP/fly-public-settings.json"; then
            verification_failure='fly-legal-settings-mismatch'
          elif ! read_public_surface 'https://app.assesssuite.com' 'apex'; then
            verification_failure='apex-public-surface-mismatch'
          elif ! read_public_surface 'https://assesssuite-production.fly.dev' 'fly'; then
            verification_failure='fly-public-surface-mismatch'
          elif [[ "$EXTRACTION_RUNTIME_MODE" == "enabled" ]]; then
            if run_provider_probe; then
              provider_probe_result='PASS (exact 39-field schema; differential, full-field and multi-file synthetic probes; seven real provider requests; no DB/filesystem writes)'
              if ! run_referral_canary; then
                referral_canary_result='FAIL'
                verification_failure='isolated-referral-production-canary-failed'
              fi
            else
              provider_probe_result='FAIL'
              verification_failure='real-provider-probe-failed'
            fi
          fi

          if [[ -n "$verification_failure" ]]; then
            if [[ ! "$candidate_release" =~ ^v[1-9][0-9]*$ \
              || "$candidate_image" != "$candidate_image_ref" \
              || ! "$final_prior_release" =~ ^v[1-9][0-9]*$ ]] \
              || (( 10#${candidate_release#v} <= 10#${final_prior_release#v} )); then
              append_summary "FAILED; candidate release was not globally preserved after observer stabilization; automatic rollback was not attempted (${verification_failure})"
              exit 1
            fi
            if ! rollback_now "$verification_failure"; then
              echo 'Automatic rollback did not verify successfully.' >&2
            fi
            exit 1
          fi

          append_summary 'DEPLOYED AND VERIFIED'
