name: Production rollback - verified compatibility image

on:
  workflow_dispatch:
    inputs:
      trusted_workflow_sha:
        description: Exact current main SHA supplying this trusted workflow
        required: true
        type: string
      failed_application_sha:
        description: Exact failed or suspect production application SHA
        required: true
        type: string
      expected_current_release:
        description: Current Fly release identifier recorded immediately before dispatch
        required: true
        type: string
      expected_current_image:
        description: Current full registry.fly.io/assesssuite-production image reference
        required: true
        type: string
      expected_machine_id:
        description: Exact sole production Fly Machine ID recorded immediately before dispatch
        required: true
        type: string
      expected_volume_id:
        description: Exact attached assesssuite_data_r12 Fly Volume ID recorded immediately before dispatch
        required: true
        type: string
      expected_legacy_volume_id:
        description: Exact detached assesssuite_data Fly Volume ID recorded immediately before dispatch
        required: true
        type: string
      rollback_source_sha:
        description: Exact ancestor commit encoded by the immutable rollback image
        required: true
        type: string
      rollback_source_branch:
        description: Exact rollback source branch; must be main
        required: true
        type: string
      rollback_config_sha256:
        description: Reviewed SHA-256 of the exact fly.rollback.production.toml Git blob (LF bytes)
        required: true
        type: string
      rollback_image:
        description: Prebuilt and verified legal-version-compatible rollback image digest
        required: true
        type: string
      capability_intent_id:
        description: Workspace OS rollback-intent ID with authorised and execution_ready decision
        required: true
        type: string
      authority_reference:
        description: Mission/order and approved rollback-intent reference
        required: true
        type: string
      incident_reference:
        description: Non-sensitive incident or failed workflow-run reference
        required: true
        type: string
      confirmation:
        description: Type ROLLBACK assesssuite-production COMPATIBILITY IMAGE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: assesssuite-production
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back through the immutable compatibility image
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Validate trusted rollback dispatch and inputs
        shell: bash
        env:
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trusted_workflow_sha }}
          FAILED_APPLICATION_SHA: ${{ inputs.failed_application_sha }}
          EXPECTED_CURRENT_RELEASE: ${{ inputs.expected_current_release }}
          EXPECTED_CURRENT_IMAGE: ${{ inputs.expected_current_image }}
          EXPECTED_MACHINE_ID: ${{ inputs.expected_machine_id }}
          EXPECTED_VOLUME_ID: ${{ inputs.expected_volume_id }}
          EXPECTED_LEGACY_VOLUME_ID: ${{ inputs.expected_legacy_volume_id }}
          ROLLBACK_SOURCE_SHA: ${{ inputs.rollback_source_sha }}
          ROLLBACK_SOURCE_BRANCH: ${{ inputs.rollback_source_branch }}
          ROLLBACK_CONFIG_SHA256: ${{ inputs.rollback_config_sha256 }}
          ROLLBACK_IMAGE: ${{ inputs.rollback_image }}
          ROLLBACK_RELEASE_SHA: ${{ inputs.rollback_source_sha }}
          CAPABILITY_INTENT_ID: ${{ inputs.capability_intent_id }}
          AUTHORITY_REFERENCE: ${{ inputs.authority_reference }}
          INCIDENT_REFERENCE: ${{ inputs.incident_reference }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          IS_FORK: ${{ github.event.repository.fork }}
        run: |
          set -euo pipefail
          printf 'ROLLBACK_JOB_STARTED_EPOCH=%s\n' "$(date -u +%s)" >> "$GITHUB_ENV"
          [[ "$REPOSITORY" == "mbvidler-ctrl/assesssuite_migration" ]]
          [[ "$ACTOR" == "mbvidler-ctrl" ]]
          [[ "$TRIGGERING_ACTOR" == "mbvidler-ctrl" ]]
          [[ "$IS_FORK" == "false" ]]
          [[ "$EVENT_REF" == "refs/heads/main" ]]
          [[ "$WORKFLOW_REF" == "mbvidler-ctrl/assesssuite_migration/.github/workflows/production-rollback.yml@refs/heads/main" ]]
          [[ "$TRUSTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" == "$TRUSTED_WORKFLOW_SHA" ]]
          [[ "$EVENT_SHA" == "$TRUSTED_WORKFLOW_SHA" ]]
          [[ "$CONFIRMATION" == "ROLLBACK assesssuite-production COMPATIBILITY IMAGE" ]]
          [[ "$FAILED_APPLICATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ROLLBACK_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ROLLBACK_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ROLLBACK_RELEASE_SHA" == "$ROLLBACK_SOURCE_SHA" ]]
          [[ "$ROLLBACK_SOURCE_BRANCH" =~ ^[A-Za-z0-9._/-]{1,180}$ ]]
          [[ "$ROLLBACK_SOURCE_BRANCH" != *".."* && "$ROLLBACK_SOURCE_BRANCH" != /* && "$ROLLBACK_SOURCE_BRANCH" != */ ]]
          git check-ref-format "refs/heads/$ROLLBACK_SOURCE_BRANCH"
          [[ "$ROLLBACK_SOURCE_BRANCH" == "main" ]]
          [[ "$FAILED_APPLICATION_SHA" == "$TRUSTED_WORKFLOW_SHA" ]]
          [[ "$ROLLBACK_SOURCE_SHA" != "$FAILED_APPLICATION_SHA" ]]
          [[ "$ROLLBACK_CONFIG_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_CURRENT_RELEASE" =~ ^v[1-9][0-9]*$ ]]
          [[ "$EXPECTED_CURRENT_IMAGE" =~ ^registry\.fly\.io/assesssuite-production@sha256:[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_MACHINE_ID" =~ ^[0-9a-f]{14,32}$ ]]
          [[ "$EXPECTED_VOLUME_ID" =~ ^vol_[A-Za-z0-9]+$ ]]
          [[ "$EXPECTED_LEGACY_VOLUME_ID" =~ ^vol_[A-Za-z0-9]+$ ]]
          [[ "$EXPECTED_VOLUME_ID" != "$EXPECTED_LEGACY_VOLUME_ID" ]]
          [[ "$ROLLBACK_IMAGE" =~ ^registry\.fly\.io/assesssuite-production@sha256:[0-9a-f]{64}$ ]]
          [[ "$ROLLBACK_IMAGE" != "$EXPECTED_CURRENT_IMAGE" ]]
          [[ "$CAPABILITY_INTENT_ID" =~ ^[A-Za-z0-9._:-]{1,160}$ ]]
          [[ "$AUTHORITY_REFERENCE" =~ ^[A-Za-z0-9._:/-]{1,240}$ ]]
          [[ "$INCIDENT_REFERENCE" =~ ^[A-Za-z0-9._:/-]{1,240}$ ]]

      - name: Check out trusted rollback controls and complete history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.trusted_workflow_sha }}
          path: rollback-source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify rollback provenance and compatibility configuration
        shell: bash
        env:
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trusted_workflow_sha }}
          FAILED_APPLICATION_SHA: ${{ inputs.failed_application_sha }}
          ROLLBACK_SOURCE_SHA: ${{ inputs.rollback_source_sha }}
          ROLLBACK_SOURCE_BRANCH: ${{ inputs.rollback_source_branch }}
          ROLLBACK_CONFIG_SHA256: ${{ inputs.rollback_config_sha256 }}
        run: |
          set -euo pipefail
          source_dir=rollback-source
          config="$source_dir/fly.rollback.production.toml"
          [[ "$(git -C "$source_dir" rev-parse --verify 'HEAD^{commit}')" == "$TRUSTED_WORKFLOW_SHA" ]]
          [[ "$(timeout --signal=TERM --kill-after=10s 60s git -C "$source_dir" ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 { print $1 }')" == "$TRUSTED_WORKFLOW_SHA" ]]
          git -C "$source_dir" cat-file -e "$ROLLBACK_SOURCE_SHA^{commit}"
          git -C "$source_dir" merge-base --is-ancestor "$ROLLBACK_SOURCE_SHA" "$FAILED_APPLICATION_SHA"
          [[ -z "$(git -C "$source_dir" status --porcelain --untracked-files=no)" ]]
          [[ -f "$config" && ! -L "$config" ]]
          [[ -f "$source_dir/Dockerfile" && ! -L "$source_dir/Dockerfile" ]]
          [[ -f "$source_dir/server/productionBootstrap.mjs" && ! -L "$source_dir/server/productionBootstrap.mjs" ]]
          [[ "$(sha256sum "$config" | awk '{print $1}')" == "$ROLLBACK_CONFIG_SHA256" ]]
          [[ "$(grep -Ec '^app = "assesssuite-production"$' "$config")" -eq 1 ]]
          [[ "$(grep -Ec '^primary_region = "syd"$' "$config")" -eq 1 ]]
          python3 -I - "$config" <<'PY'
          import pathlib
          import sys
          import tomllib

          def process_entries(value, path=()):
              entries = []
              if isinstance(value, dict):
                  for key, nested in value.items():
                      next_path = path + (key,)
                      if key == 'processes':
                          entries.append((next_path, nested))
                      entries.extend(process_entries(nested, next_path))
              elif isinstance(value, list):
                  for index, nested in enumerate(value):
                      entries.extend(process_entries(nested, path + (index,)))
              return entries

          for raw_path in sys.argv[1:]:
              path = pathlib.Path(raw_path)
              try:
                  with path.open('rb') as stream:
                      document = tomllib.load(stream)
              except (OSError, UnicodeError, tomllib.TOMLDecodeError) as error:
                  raise SystemExit(f'Fly config is not valid TOML: {path.name}') from error
              if process_entries(document) != [(('http_service', 'processes'), ['app'])]:
                  raise SystemExit(f'Fly config process contract is not exact: {path.name}')
          PY
          [[ "$(grep -Ec '^  source = "assesssuite_data_r12"$' "$config")" -eq 1 ]]
          [[ "$(grep -Ec '^  destination = "/app/server/data"$' "$config")" -eq 1 ]]
          [[ "$(grep -Ec '^  snapshot_retention = 5$' "$config")" -eq 1 ]]
          [[ "$(grep -Ec '^  scheduled_snapshots = true$' "$config")" -eq 1 ]]
          [[ "$(grep -Fxc '  UPLOAD_AUDIT_RETENTION_DAYS = "730"' "$config")" -eq 1 ]]
          [[ "$(grep -Fxc '  UPLOAD_CLEANUP_INTERVAL_MINUTES = "1"' "$config")" -eq 1 ]]
          [[ "$(grep -Fxc '  EXPECTED_APP_URL = "https://app.assesssuite.com"' "$config")" -eq 1 ]]
          [[ "$(grep -Ec '^\[\[vm\]\]$' "$config")" -eq 1 ]]
          [[ "$(grep -Ec '^  memory = "512mb"$' "$config")" -eq 1 ]]
          [[ "$(grep -Ec '^  cpus = 1$' "$config")" -eq 1 ]]
          [[ "$(grep -Ec '^  min_machines_running = 1$' "$config")" -eq 1 ]]
          if grep -EIn 'FLY_API_TOKEN|\$\{?FLY_|\[\[[^]]*files[^]]*\]\]|\[[^]]*experimental[^]]*\]|local_path|secret_name|raw_value|release_command|^[[:space:]]*\[build\.(args|secrets)\]|build[_-]secret|file[_-]secret|type[[:space:]]*=[[:space:]]*secret|--secret' \
            "$config" "$source_dir/Dockerfile"; then
            echo 'Rollback configuration contains a forbidden credential, local-file injection, build secret, or release hook.' >&2
            exit 1
          fi
          if grep -EIn '(^|[[:space:]/])(server/)?seed\.mjs([[:space:]&;]|$)|npm[[:space:]]+run[[:space:]]+seed|synthetic data reseeds on every boot' "$source_dir/Dockerfile"; then
            echo 'Rollback Docker startup must not invoke the full synthetic seed.' >&2
            exit 1
          fi
          if grep -Eq '^[[:space:]]*DOCUMENT_EXTRACTION(_UNDER_13)?_ENABLED[[:space:]]*=[[:space:]]*"1"[[:space:]]*$' "$config"; then
            echo 'Rollback configuration must keep adult and under-age document extraction disabled.' >&2
            exit 1
          fi
          [[ "$(grep -Ec '^[[:space:]]*GENERAL_CLINICAL_LLM_ENABLED[[:space:]]*=[[:space:]]*"1"[[:space:]]*$' "$config")" -eq 1 ]]
          [[ "$(grep -Ec '^[[:space:]]*TRANSCRIPTION_ENABLED[[:space:]]*=[[:space:]]*"0"[[:space:]]*$' "$config")" -eq 1 ]]
          [[ "$(grep -Ec '^[[:space:]]*LEGAL_STATUS[[:space:]]*=[[:space:]]*"effective"[[:space:]]*$' "$config")" -eq 1 ]]
          [[ "$(grep -Ec '^[[:space:]]*LEGAL_EFFECTIVE_DATE[[:space:]]*=[[:space:]]*"19 July 2026"[[:space:]]*$' "$config")" -eq 1 ]]
          [[ "$(grep -Ec '^[[:space:]]*LEGAL_COMPATIBILITY_ACCEPTED_VERSIONS[[:space:]]*=[[:space:]]*"RC-2026.07.11,RC-2026.07.19"[[:space:]]*$' "$config")" -eq 1 ]]

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate exact trusted release controls
        shell: bash
        env:
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trusted_workflow_sha }}
          EXPECTED_TRUSTED_VALIDATOR_SHA256: 9188ecf7414b1f44e6b8e9e01e0ec2bc6316435f3a0c2e7c59706b0d26d8af1d
        run: |
          set -euo pipefail
          trusted_dir="$RUNNER_TEMP/trusted-production-control"
          cleanup() {
            git -C rollback-source worktree remove --force "$trusted_dir" 2>/dev/null || true
          }
          trap cleanup EXIT
          git -C rollback-source worktree add --detach "$trusted_dir" "$TRUSTED_WORKFLOW_SHA"
          echo "$EXPECTED_TRUSTED_VALIDATOR_SHA256  scripts/validate-production-deploy-workflow.mjs" \
            | (cd "$trusted_dir" && sha256sum --check --strict)
          for workflow in \
            production-deploy.yml \
            production-prepare-release.yml \
            production-prepare-rollback-image.yml \
            production-rollback.yml \
            production-parity-assurance.yml; do
            node "$trusted_dir/scripts/validate-production-deploy-workflow.mjs" \
              "$trusted_dir/.github/workflows/$workflow"
            node "$trusted_dir/scripts/validate-production-deploy-workflow.mjs" \
              "$trusted_dir/.github/workflows/$workflow" --selftest
          done

      - name: Install checksum-verified flyctl 0.4.71
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/flyctl_0.4.71_Linux_x86_64.tar.gz"
          bin_dir="$RUNNER_TEMP/flyctl-bin"
          curl --fail --location --silent --show-error --max-time 120 \
            'https://github.com/superfly/flyctl/releases/download/v0.4.71/flyctl_0.4.71_Linux_x86_64.tar.gz' \
            --output "$archive"
          echo 'a782dceed173d215c000ab94e2b08623c22267edff6d90ebe3010b3f9b671dc2  '"$archive" | sha256sum --check --strict
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" flyctl
          chmod 0755 "$bin_dir/flyctl"
          ln -s "$bin_dir/flyctl" "$bin_dir/fly"
          echo "$bin_dir" >>"$GITHUB_PATH"
          "$bin_dir/flyctl" version | grep -F '0.4.71'

      - name: Final secret-bearing immutable rollback and verification
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_EP_DEPLOY_TOKEN }}
          TRUSTED_WORKFLOW_SHA: ${{ inputs.trusted_workflow_sha }}
          FAILED_APPLICATION_SHA: ${{ inputs.failed_application_sha }}
          EXPECTED_CURRENT_RELEASE: ${{ inputs.expected_current_release }}
          EXPECTED_CURRENT_IMAGE: ${{ inputs.expected_current_image }}
          EXPECTED_MACHINE_ID: ${{ inputs.expected_machine_id }}
          EXPECTED_VOLUME_ID: ${{ inputs.expected_volume_id }}
          EXPECTED_LEGACY_VOLUME_ID: ${{ inputs.expected_legacy_volume_id }}
          ROLLBACK_SOURCE_SHA: ${{ inputs.rollback_source_sha }}
          ROLLBACK_SOURCE_BRANCH: ${{ inputs.rollback_source_branch }}
          ROLLBACK_CONFIG_SHA256: ${{ inputs.rollback_config_sha256 }}
          ROLLBACK_IMAGE: ${{ inputs.rollback_image }}
          ROLLBACK_RELEASE_SHA: ${{ inputs.rollback_source_sha }}
          CAPABILITY_INTENT_ID: ${{ inputs.capability_intent_id }}
          AUTHORITY_REFERENCE: ${{ inputs.authority_reference }}
          INCIDENT_REFERENCE: ${{ inputs.incident_reference }}
        run: |
          set -euo pipefail
          set +x
          app=assesssuite-production
          rollback_dir="$GITHUB_WORKSPACE/rollback-source"
          rollback_config="$rollback_dir/fly.rollback.production.toml"
          prior_json="$RUNNER_TEMP/prior-releases.json"

          current_release() {
            local releases_json=$1
            local command_timeout_seconds=${2:-60}
            local machine_json="${releases_json%.json}-machine.json"
            local current=''
            [[ "$command_timeout_seconds" =~ ^([1-9]|[1-5][0-9]|60)$ ]] || return 1
            rm -f "$machine_json"
            if ! timeout --signal=TERM --kill-after=10s "${command_timeout_seconds}s" \
              fly machines list --app "$app" --json >"$machine_json"; then
              rm -f "$machine_json"
              return 1
            fi
            if ! current="$(env -u FLY_API_TOKEN node --input-type=module - "$releases_json" "$machine_json" <<'NODE'
          import fs from 'node:fs';
          const parsed = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const machines = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const rows = Array.isArray(parsed) ? parsed : (parsed.releases || parsed.Releases || parsed.data || []);
          if (!Array.isArray(rows) || rows.length === 0) throw new Error('Fly returned no release rows');
          const status = (row) => String(row.Status ?? row.status ?? '').toLowerCase();
          const completeStatuses = new Set(['complete', 'completed', 'success', 'succeeded']);
          const terminalFailureStatuses = new Set(['failed', 'failure', 'cancelled', 'canceled']);
          const seenVersions = new Set();
          const releases = rows.map((row) => {
            const rawId = row.Version ?? row.version ?? row.ID ?? row.id ?? row.ReleaseId ?? row.releaseId ?? row.release_id;
            const match = /^v?([1-9][0-9]*)$/.exec(String(rawId));
            if (!match) throw new Error('Fly release identifier is not a positive numeric version');
            const version = Number(match[1]);
            if (!Number.isSafeInteger(version)) throw new Error('Fly release version is outside the safe integer range');
            if (seenVersions.has(version)) throw new Error('Fly returned duplicate numeric release versions');
            seenVersions.add(version);
            const releaseStatus = status(row);
            const inProgress = row.InProgress ?? row.inProgress ?? row.in_progress;
            if (inProgress !== undefined && typeof inProgress !== 'boolean') {
              throw new Error('Fly release InProgress state is not boolean');
            }
            return { row, version, releaseStatus, inProgress };
          });
          const completed = releases.filter((item) => completeStatuses.has(item.releaseStatus));
          if (completed.length === 0) throw new Error('Fly returned no completed release rows');
          const latest = completed.reduce((current, item) => item.version > current.version ? item : current);
          if (latest.inProgress === true) throw new Error('Latest completed Fly release is still marked in progress');
          for (const item of releases.filter((candidate) => candidate.version > latest.version)) {
            if (item.inProgress === true || !terminalFailureStatuses.has(item.releaseStatus)) {
              throw new Error('A higher Fly release is in progress or has an unknown nonterminal state');
            }
          }
          const row = latest.row;
          const releaseImage = row.ImageRef ?? row.imageRef ?? row.image_ref ?? row.Image ?? row.image ?? row.DockerImage ?? row.docker_image;
          if (!Array.isArray(machines) || machines.length !== 1) throw new Error('Fly returned a non-sole Machine inventory');
          const machine = machines[0];
          const machineId = machine.id ?? machine.ID;
          const machineState = String(machine.state ?? machine.State ?? '').toLowerCase();
          const imageRef = machine.image_ref ?? machine.imageRef ?? machine.ImageRef;
          const registry = imageRef?.registry ?? imageRef?.Registry;
          const repository = imageRef?.repository ?? imageRef?.Repository;
          const digest = imageRef?.digest ?? imageRef?.Digest;
          const configuredImage = machine.config?.image ?? machine.Config?.image;
          if (machineId !== process.env.EXPECTED_MACHINE_ID || machineState !== 'started' ||
              registry !== 'registry.fly.io' || repository !== 'assesssuite-production' ||
              !/^sha256:[0-9a-f]{64}$/.test(String(digest))) {
            throw new Error('Fly current Machine identity, state, or image_ref is invalid');
          }
          const immutableImage = `${registry}/${repository}@${digest}`;
          if (configuredImage !== immutableImage || releaseImage !== immutableImage) {
            throw new Error('Fly release, Machine config.image and Machine image_ref digest do not bind');
          }
          process.stdout.write(`v${latest.version}\t${immutableImage}`);
          NODE
            )"; then
              rm -f "$machine_json"
              return 1
            fi
            rm -f "$machine_json"
            printf '%s\n' "$current"
          }

          assert_topology() {
            local label=$1
            local command_timeout_seconds=${2:-60}
            [[ "$command_timeout_seconds" =~ ^([1-9]|[1-5][0-9]|60)$ ]] || return 1
            if ! timeout --signal=TERM --kill-after=10s "${command_timeout_seconds}s" \
              fly machines list --app "$app" --json >"$RUNNER_TEMP/$label-machines.json"; then
              rm -f "$RUNNER_TEMP/$label-machines.json" "$RUNNER_TEMP/$label-volumes.json"
              return 1
            fi
            if ! timeout --signal=TERM --kill-after=10s "${command_timeout_seconds}s" \
              fly volumes list --app "$app" --json >"$RUNNER_TEMP/$label-volumes.json"; then
              rm -f "$RUNNER_TEMP/$label-machines.json" "$RUNNER_TEMP/$label-volumes.json"
              return 1
            fi
            local topology_status=0
            LABEL="$label" env -u FLY_API_TOKEN node --input-type=module <<'NODE' || topology_status=$?
          import fs from 'node:fs';
          const root = process.env.RUNNER_TEMP;
          const label = process.env.LABEL;
          const machines = JSON.parse(fs.readFileSync(root + '/' + label + '-machines.json', 'utf8'));
          const volumes = JSON.parse(fs.readFileSync(root + '/' + label + '-volumes.json', 'utf8'));
          if (!Array.isArray(machines) || machines.length !== 1 || !Array.isArray(volumes) || volumes.length !== 2) {
            throw new Error('Expected exact one-machine/two-volume production topology');
          }
          const machine = machines[0];
          if (new Set(volumes.map((row) => row?.id)).size !== 2 ||
              new Set(volumes.map((row) => row?.name)).size !== 2) {
            throw new Error('Production volume IDs and names must be unique');
          }
          const volume = volumes.find((row) => row?.name === 'assesssuite_data_r12');
          const legacyVolume = volumes.find((row) => row?.name === 'assesssuite_data');
          if (!volume || !legacyVolume) throw new Error('Required active and legacy production volumes are not both present');
          const guest = machine.config?.guest || machine.Config?.guest || {};
          if (machine.id !== process.env.EXPECTED_MACHINE_ID || !/^[0-9a-f]{14,32}$/.test(machine.id) ||
              (machine.region ?? machine.Region) !== 'syd' || machine.state !== 'started' || Number(guest.cpus) !== 1 ||
              Number(guest.memory_mb ?? guest.memoryMb) !== 512 || (guest.cpu_kind ?? guest.cpuKind) !== 'shared') {
            throw new Error('Production machine identity, state, or resources drifted');
          }
          if (volume.id !== process.env.EXPECTED_VOLUME_ID || volume.name !== 'assesssuite_data_r12' ||
              volume.region !== 'syd' || volume.state !== 'created' || volume.size_gb !== 3 ||
              volume.encrypted !== true || volume.attached_machine_id !== machine.id ||
              volume.snapshot_retention !== 5 || volume.auto_backup_enabled !== true) {
            throw new Error('Production volume identity, attachment, encryption, or snapshot policy drifted');
          }
          if (legacyVolume.id !== process.env.EXPECTED_LEGACY_VOLUME_ID || legacyVolume.name !== 'assesssuite_data' ||
              legacyVolume.region !== 'syd' || legacyVolume.state !== 'created' || legacyVolume.size_gb !== 3 ||
              legacyVolume.encrypted !== true || legacyVolume.attached_machine_id !== null ||
              legacyVolume.attached_alloc_id !== null || legacyVolume.snapshot_retention !== 5 ||
              legacyVolume.auto_backup_enabled !== true) {
            throw new Error('Legacy assesssuite_data volume is not the exact detached preserved recovery volume');
          }
          const mounts = machine.config?.mounts;
          if (!Array.isArray(mounts) || mounts.length !== 1 || mounts[0]?.volume !== volume.id ||
              mounts[0]?.name !== volume.name || mounts[0]?.path !== '/app/server/data' ||
              mounts[0]?.encrypted !== true || mounts[0]?.size_gb !== 3) {
            throw new Error('Production data-volume mount drifted');
          }
          NODE
            rm -f "$RUNNER_TEMP/$label-machines.json" "$RUNNER_TEMP/$label-volumes.json"
            return "$topology_status"
          }

          assert_secret_name_boundary() {
            local label=$1
            local legacy_mode=$2
            local payload="$RUNNER_TEMP/$label-secret-names.json"
            local boundary_state_path="$RUNNER_TEMP/$label-secret-boundary-state"
            rm -f "$boundary_state_path"
            timeout --signal=TERM --kill-after=10s 60s fly secrets list --app "$app" --json >"$payload"
            REQUIRED_NAMES_JSON="$payload" ROLLBACK_CONFIG="$rollback_config" LEGACY_MODE="$legacy_mode" \
              BOUNDARY_STATE_PATH="$boundary_state_path" \
              env -u FLY_API_TOKEN node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows = JSON.parse(fs.readFileSync(process.env.REQUIRED_NAMES_JSON, 'utf8'));
          if (!Array.isArray(rows) || rows.length === 0) throw new Error('Fly secret metadata is not a non-empty array');
          const names = [];
          for (const row of rows) {
            if (!row || typeof row !== 'object' || Array.isArray(row) ||
                Object.keys(row).some((key) => /^(?:value|raw_value|secret_value)$/i.test(key))) {
              throw new Error('Fly secret metadata is not names-only');
            }
            const name = row.Name ?? row.name;
            if (typeof name !== 'string' || !/^[A-Z][A-Z0-9_]{1,127}$/.test(name)) {
              throw new Error('Fly secret metadata contains an invalid name');
            }
            names.push(name);
          }
          if (new Set(names).size !== names.length) throw new Error('Fly secret metadata contains duplicate names');
          const present = new Set(names);
          const required = [
            'ADMIN_PASSWORD', 'APP_URL', 'RESEND_API_KEY', 'STRIPE_SECRET_KEY',
            'STRIPE_WEBHOOK_SECRET', 'STRIPE_PRICE_ID_MONTHLY', 'STRIPE_PRICE_ID_ANNUAL',
            'OPENAI_API_KEY', 'SENTRY_DSN', 'ASSESSSUITE_DASHBOARD_METRICS_TOKEN',
            'ASSESSSUITE_INTEGRATION_ENCRYPTION_KEY',
          ];
          const missing = required.filter((name) => !present.has(name));
          if (missing.length) throw new Error('Required production secret name(s) absent: ' + missing.join(', '));
          const observed = JSON.stringify([...present].sort());
          const settled = JSON.stringify([...required].sort());
          const transitionPending = JSON.stringify([...required, 'GENERAL_CLINICAL_LLM_ENABLED'].sort());
          let boundaryState;
          const configText = fs.readFileSync(process.env.ROLLBACK_CONFIG, 'utf8').replaceAll('\r\n', '\n');
          const forbidden = new Set([
            'NODE_ENV', 'SELFTEST', 'RELEASE_SHA', 'SOURCE_BRANCH', 'BUILD_TIMESTAMP',
            'ASSESSSUITE_DB_PATH', 'ASSESSSUITE_DB_PATH_ACK',
            'DOCUMENT_EXTRACTION_TEST_BASE_URL', 'OPENAI_DOCUMENT_EXTRACTION_MODEL',
            'DOCUMENT_EXTRACTION_PROVIDER_PROBE', 'DOCUMENT_EXTRACTION_PROVIDER_PROBE_ACK',
            'ALLOW_PAID_PROVIDER_PROBE', 'RUN_DOCUMENT_EXTRACTION_PROVIDER_PROBE',
            'RUN_REFERRAL_PRODUCTION_CANARY', 'LEGAL_COMPATIBILITY_ACCEPTED_VERSIONS',
          ]);
          for (const match of configText.matchAll(/^\s{2}([A-Z][A-Z0-9_]*)\s*=/gm)) forbidden.add(match[1]);
          if (process.env.LEGACY_MODE === 'allow') {
            forbidden.delete('GENERAL_CLINICAL_LLM_ENABLED');
            if (observed === settled) {
              boundaryState = 'settled';
            } else if (observed === transitionPending) {
              boundaryState = 'transition-pending';
            } else {
              throw new Error('Production secret-name allowlist differs for allow mode');
            }
          } else if (process.env.LEGACY_MODE !== 'forbid') {
            throw new Error('Secret-boundary legacy mode is invalid');
          } else if (observed !== settled) {
            throw new Error('Production secret-name allowlist differs for forbid mode');
          } else {
            boundaryState = 'exact-eleven';
          }
          const opaqueOverrides = [...forbidden].filter((name) => present.has(name)).sort();
          if (opaqueOverrides.length) throw new Error('Forbidden opaque production secret name(s) present: ' + opaqueOverrides.join(', '));
          fs.writeFileSync(process.env.BOUNDARY_STATE_PATH, `${boundaryState}\n`, { encoding: 'utf8', mode: 0o600 });
          NODE
          }

          read_version() {
            local url=$1
            local expected_sha=$2
            local body=$3
            for attempt in $(seq 1 20); do
              if curl --fail --silent --show-error --max-time 10 \
                -H 'Cache-Control: no-cache' "$url/api/version" -o "$body" \
                && jq -e --arg sha "$expected_sha" \
                  '.release_sha == $sha and (.build_timestamp | type == "string" and length > 0)' "$body" >/dev/null; then
                return 0
              fi
              sleep 3
            done
            return 1
          }

          read_public_settings() {
            local url=$1
            local body=$2
            curl --fail --silent --show-error --max-time 10 \
              -H 'Cache-Control: no-cache' \
              "$url/api/apps/public/prod/public-settings/by-id/local-assesssuite" \
              -o "$body"
            jq -e \
              '.public_settings.legal.status == "effective" and .public_settings.legal.effective_date == "19 July 2026"' \
              "$body" >/dev/null
          }

          read_public_surface() {
            local url=$1
            local label=$2
            local html="$RUNNER_TEMP/$label-index.html"
            local bundle="$RUNNER_TEMP/$label-bundle.js"
            curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' "$url/" -o "$html" || return 1
            local asset_path
            asset_path="$(HTML_PATH="$html" env -u FLY_API_TOKEN node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync(process.env.HTML_PATH, 'utf8');
          const match = html.match(/<script[^>]+type=["']module["'][^>]+src=["']([^"']+)["']/i)
            || html.match(/<script[^>]+src=["']([^"']+)["'][^>]+type=["']module["']/i);
          if (!match || !match[1].startsWith('/assets/')) throw new Error('Production HTML did not reference a local module asset');
          process.stdout.write(match[1]);
          NODE
            )" || return 1
            curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$url$asset_path" -o "$bundle" || return 1
            HTML_PATH="$html" BUNDLE_PATH="$bundle" env -u FLY_API_TOKEN node --input-type=module <<'NODE' || return 1
          import fs from 'node:fs';
          const html = fs.readFileSync(process.env.HTML_PATH, 'utf8');
          const bundle = fs.readFileSync(process.env.BUNDLE_PATH, 'utf8');
          if (!/<!doctype html>/i.test(html) || bundle.length < 10_000) throw new Error('Production static assets are incomplete');
          for (const required of [
            'I have read and agree to the',
            'Optional: send me product updates and marketing by email',
            'Accredited Exercise Physiologist (AEP)',
          ]) {
            if (!bundle.includes(required)) throw new Error('Production bundle is missing required signup wording: ' + required);
          }
          for (const forbidden of [
            'Country of Practice',
            "I confirm this practice's use of AssessSuite is limited to adult patients",
            'adult patients (18 and over)',
          ]) {
            if (bundle.toLowerCase().includes(forbidden.toLowerCase())) {
              throw new Error('Production bundle retains forbidden signup wording: ' + forbidden);
            }
          }
          for (const required of [
            'Exercise Physiology at its Clinical Best.',
            'AssessSuite Privacy Policy',
            'Terms & Conditions',
          ]) {
            if (!bundle.includes(required)) throw new Error('Rollback bundle is missing the pre-split surface marker: ' + required);
          }
          NODE
            local route_html
            for route in legal/privacy login; do
              route_html="$RUNNER_TEMP/${label}-${route//\//-}.html"
              curl --fail --silent --show-error --max-time 15 \
                -H 'Cache-Control: no-cache' "$url/$route" -o "$route_html" || return 1
              grep -Eqi '<!doctype html>' "$route_html" || return 1
            done
            local status
            status="$(curl --silent --show-error --max-time 10 -o "$RUNNER_TEMP/$label-register-invalid.json" -w '%{http_code}' \
              -H 'Content-Type: application/json' -X POST --data '{}' "$url/api/apps/prod/auth/register")" || return 1
            [[ "$status" == '400' ]] || return 1
            status="$(curl --silent --show-error --max-time 10 -o "$RUNNER_TEMP/$label-anonymous-upload.json" -w '%{http_code}' \
              -X POST "$url/api/apps/prod/integration-endpoints/Core/UploadFile")" || return 1
            [[ "$status" == '401' ]] || return 1
            status="$(curl --silent --show-error --max-time 10 -o "$RUNNER_TEMP/$label-anonymous-extraction.json" -w '%{http_code}' \
              -H 'Content-Type: application/json' -X POST --data '{}' \
              "$url/api/apps/prod/integration-endpoints/Core/ExtractDataFromUploadedFile")" || return 1
            [[ "$status" == '401' ]] || return 1
            status="$(curl --silent --show-error --max-time 10 -o "$RUNNER_TEMP/$label-anonymous-file.json" -w '%{http_code}' \
              "$url/uploads/00000000-0000-4000-8000-000000000000")" || return 1
            [[ "$status" == '401' ]] || return 1
          }

          wait_for_rollback_observer_stabilization() {
            local max_attempts=5
            local required_consecutive_matches=2
            local retry_delay_seconds=10
            local command_timeout_seconds=20
            local attempt=1
            local consecutive_matches=0
            local last_matching_observation=''
            local attempt_failure=''
            local rollback_current=''
            local observer_releases_json="$RUNNER_TEMP/rollback-observer-releases.json"

            rollback_observer_failure='not-observed'
            while (( attempt <= max_attempts )); do
              attempt_failure=''
              rollback_current=''
              if ! assert_topology "rollback-observer-$attempt" "$command_timeout_seconds"; then
                attempt_failure='topology-or-volume-snapshot-policy-mismatch'
              elif ! timeout --signal=TERM --kill-after=10s "${command_timeout_seconds}s" \
                fly releases --app "$app" --image --json >"$observer_releases_json"; then
                attempt_failure='release-query-failed'
              elif ! rollback_current="$(current_release "$observer_releases_json" "$command_timeout_seconds")"; then
                attempt_failure='release-machine-image-binding-mismatch'
              else
                IFS=$'\t' read -r rollback_release rollback_image_actual <<<"$rollback_current"
                if [[ ! "$rollback_release" =~ ^v[1-9][0-9]*$ \
                  || ! "$final_prior_release" =~ ^v[1-9][0-9]*$ ]] \
                  || (( 10#${rollback_release#v} <= 10#${final_prior_release#v} )); then
                  attempt_failure='rollback-release-not-newer-than-final-prior'
                elif [[ "$rollback_image_actual" != "$ROLLBACK_IMAGE" ]]; then
                  attempt_failure='rollback-image-mismatch'
                elif [[ "$rollback_current" == "$last_matching_observation" ]]; then
                  consecutive_matches=$((consecutive_matches + 1))
                else
                  last_matching_observation="$rollback_current"
                  consecutive_matches=1
                fi

                if [[ -z "$attempt_failure" ]]; then
                  rollback_observer_failure='exact-match-awaiting-confirmation'
                  echo "Rollback Fly observer exact match ${consecutive_matches}/${required_consecutive_matches} on attempt ${attempt}." >&2
                  if (( consecutive_matches >= required_consecutive_matches )); then
                    rollback_observer_failure=''
                    return 0
                  fi
                fi
              fi

              if [[ -n "$attempt_failure" ]]; then
                rollback_observer_failure="$attempt_failure"
                consecutive_matches=0
                last_matching_observation=''
                rollback_release=''
                rollback_image_actual=''
                echo "Rollback Fly observer attempt ${attempt}/${max_attempts} was not exact (${attempt_failure}); waiting for control-plane convergence." >&2
              fi
              if (( attempt == max_attempts )); then
                break
              fi
              sleep "$retry_delay_seconds"
              attempt=$((attempt + 1))
            done

            rollback_observer_failure=${rollback_observer_failure:-stabilization-window-exhausted}
            echo "Rollback Fly observer failed to produce ${required_consecutive_matches} consecutive exact topology and release/image observations in ${max_attempts} attempts (${rollback_observer_failure})." >&2
            return 1
          }

          write_summary() {
            {
              echo '## AssessSuite production rollback'
              echo
              echo "- Workflow run: $GITHUB_RUN_ID"
              echo "- Capability intent: $CAPABILITY_INTENT_ID"
              echo "- Authority: $AUTHORITY_REFERENCE"
              echo "- Incident: $INCIDENT_REFERENCE"
              echo "- Trusted workflow SHA: $TRUSTED_WORKFLOW_SHA"
              echo "- Failed/suspect SHA: $FAILED_APPLICATION_SHA"
              echo "- Rollback source SHA: $ROLLBACK_SOURCE_SHA"
              echo "- Rollback Fly config SHA-256: $ROLLBACK_CONFIG_SHA256"
              echo "- Prior release: ${prior_release:-not-established}"
              echo "- Prior image: ${prior_image:-not-established}"
              echo "- Rollback release: ${rollback_release:-not-established}"
              echo "- Rollback image: ${rollback_image_actual:-$ROLLBACK_IMAGE}"
              echo '- Rollback proof: registering state; exact 39-field per-file schema and merge; age quarantine; referral_commit_receipt replay'
              echo "- Production topology: machine_id=$EXPECTED_MACHINE_ID; attached_volume_id=$EXPECTED_VOLUME_ID; attached_volume_name=assesssuite_data_r12; detached_legacy_volume_id=$EXPECTED_LEGACY_VOLUME_ID; detached_legacy_volume_name=assesssuite_data; encrypted=true; scheduled_snapshots=true; snapshot_retention_days=5"
              echo "- Result: $1"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          timeout --signal=TERM --kill-after=10s 60s fly auth docker
          timeout --signal=TERM --kill-after=30s 300s docker pull "$ROLLBACK_IMAGE"
          [[ "$(docker image inspect "$ROLLBACK_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" == "$ROLLBACK_SOURCE_SHA" ]]
          [[ "$(docker image inspect "$ROLLBACK_IMAGE" --format '{{json .Config.Entrypoint}}')" == '["docker-entrypoint.sh"]' ]]
          [[ "$(docker image inspect "$ROLLBACK_IMAGE" --format '{{json .Config.Cmd}}')" == '["sh","-c","node server/productionBootstrap.mjs && exec node server/index.mjs"]' ]]
          docker image inspect "$ROLLBACK_IMAGE" --format '{{ range .Config.Env }}{{ println . }}{{ end }}' >"$RUNNER_TEMP/rollback-image-env.txt"
          grep -Fx "RELEASE_SHA=$ROLLBACK_SOURCE_SHA" "$RUNNER_TEMP/rollback-image-env.txt"
          grep -Fx "SOURCE_BRANCH=$ROLLBACK_SOURCE_BRANCH" "$RUNNER_TEMP/rollback-image-env.txt"
          [[ "$(grep -Fxc 'NODE_ENV=production' "$RUNNER_TEMP/rollback-image-env.txt")" -eq 1 ]]
          if grep -Eq '^(SELFTEST|ASSESSSUITE_DB_PATH|ASSESSSUITE_DB_PATH_ACK|DOCUMENT_EXTRACTION_TEST_BASE_URL|DOCUMENT_EXTRACTION_PROVIDER_PROBE|DOCUMENT_EXTRACTION_PROVIDER_PROBE_ACK|ALLOW_PAID_PROVIDER_PROBE|RUN_DOCUMENT_EXTRACTION_PROVIDER_PROBE|RUN_REFERRAL_PRODUCTION_CANARY)=' "$RUNNER_TEMP/rollback-image-env.txt"; then
            echo 'Rollback image contains a forbidden test, database-override, or provider-probe environment variable.' >&2
            exit 1
          fi

          [[ "$(git -C "$rollback_dir" rev-parse --verify 'HEAD^{commit}')" == "$TRUSTED_WORKFLOW_SHA" ]]
          [[ "$(timeout --signal=TERM --kill-after=10s 60s git -C "$rollback_dir" ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 { print $1 }')" == "$TRUSTED_WORKFLOW_SHA" ]]
          git -C "$rollback_dir" cat-file -e "$ROLLBACK_SOURCE_SHA^{commit}"
          git -C "$rollback_dir" merge-base --is-ancestor "$ROLLBACK_SOURCE_SHA" "$FAILED_APPLICATION_SHA"
          [[ "$(sha256sum "$rollback_config" | awk '{print $1}')" == "$ROLLBACK_CONFIG_SHA256" ]]
          assert_topology prior
          timeout --signal=TERM --kill-after=10s 60s fly releases --app "$app" --image --json >"$prior_json"
          IFS=$'\t' read -r prior_release prior_image < <(current_release "$prior_json")
          [[ "$prior_release" == "$EXPECTED_CURRENT_RELEASE" ]]
          [[ "$prior_image" == "$EXPECTED_CURRENT_IMAGE" ]]
          assert_secret_name_boundary initial allow
          rollback_initial_boundary_state="$(<"$RUNNER_TEMP/initial-secret-boundary-state")"
          [[ "$rollback_initial_boundary_state" == 'settled' || "$rollback_initial_boundary_state" == 'transition-pending' ]]
          rm -f "$RUNNER_TEMP/initial-secret-names.json"

          # Final just-in-time freeze immediately before the sole application mutation.
          [[ "$(git -C "$rollback_dir" rev-parse --verify 'HEAD^{commit}')" == "$TRUSTED_WORKFLOW_SHA" ]]
          [[ "$(timeout --signal=TERM --kill-after=10s 60s git -C "$rollback_dir" ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 { print $1 }')" == "$TRUSTED_WORKFLOW_SHA" ]]
          git -C "$rollback_dir" cat-file -e "$ROLLBACK_SOURCE_SHA^{commit}"
          git -C "$rollback_dir" merge-base --is-ancestor "$ROLLBACK_SOURCE_SHA" "$FAILED_APPLICATION_SHA"
          [[ "$(sha256sum "$rollback_config" | awk '{print $1}')" == "$ROLLBACK_CONFIG_SHA256" ]]
          assert_topology final-predeploy
          final_prior_json="$RUNNER_TEMP/final-prior-releases.json"
          timeout --signal=TERM --kill-after=10s 60s fly releases --app "$app" --image --json >"$final_prior_json"
          IFS=$'\t' read -r final_prior_release final_prior_image < <(current_release "$final_prior_json")
          [[ "$final_prior_release" == "$EXPECTED_CURRENT_RELEASE" ]]
          [[ "$final_prior_image" == "$EXPECTED_CURRENT_IMAGE" ]]
          if ! read_version 'https://app.assesssuite.com' "$FAILED_APPLICATION_SHA" "$RUNNER_TEMP/pre-mutation-app-version.json" \
            || ! read_version 'https://assesssuite-production.fly.dev' "$FAILED_APPLICATION_SHA" "$RUNNER_TEMP/pre-mutation-fly-version.json"; then
            write_summary 'CURRENT /api/version VERIFICATION FAILED BEFORE MUTATION'
            exit 1
          fi
          rollback_job_timeout_seconds=4200
          maximum_bounded_rollback_path_seconds=2624
          maximum_pre_mutation_elapsed_seconds=1200
          (( maximum_pre_mutation_elapsed_seconds + maximum_bounded_rollback_path_seconds <= rollback_job_timeout_seconds ))
          rollback_job_started_epoch=${ROLLBACK_JOB_STARTED_EPOCH:-0}
          rollback_job_elapsed_seconds=$(( $(date -u +%s) - rollback_job_started_epoch ))
          if [[ "$rollback_job_started_epoch" -le 0 || "$rollback_job_elapsed_seconds" -lt 0 \
            || "$rollback_job_elapsed_seconds" -gt "$maximum_pre_mutation_elapsed_seconds" ]]; then
            write_summary 'ROLLBACK TIME RESERVE EXHAUSTED BEFORE THE FIRST PRODUCTION MUTATION'
            exit 1
          fi
          if [[ "$rollback_initial_boundary_state" == 'transition-pending' ]]; then
            timeout --signal=TERM --kill-after=10s 60s \
              fly secrets unset GENERAL_CLINICAL_LLM_ENABLED --stage --app "$app"
          elif [[ "$rollback_initial_boundary_state" != 'settled' ]]; then
            exit 1
          fi
          timeout --signal=TERM --kill-after=10s 60s \
            fly secrets set APP_URL=https://app.assesssuite.com --stage --app "$app"
          assert_secret_name_boundary final forbid
          rm -f "$RUNNER_TEMP/initial-secret-boundary-state" "$RUNNER_TEMP/final-secret-names.json" "$RUNNER_TEMP/final-secret-boundary-state" "$final_prior_json"

          rollback_status=0
          timeout --signal=TERM --kill-after=30s 420s fly deploy "$rollback_dir" \
            --config "$rollback_config" \
            --strategy immediate \
            --ha=false \
            --update-only \
            --app "$app" \
            --image "$ROLLBACK_IMAGE" \
            --yes || rollback_status=$?

          rollback_observer_failure=''
          if ! wait_for_rollback_observer_stabilization; then
            write_summary "ROLLBACK COMMAND EXIT ${rollback_status}; OBSERVER STABILIZATION FAILED (${rollback_observer_failure:-unknown})"
            exit 1
          fi
          if [[ "$rollback_status" -ne 0 ]]; then
            echo "Rollback command returned exit ${rollback_status}, but the bounded observer proved the newer exact rollback release and topology." >&2
          fi
          assert_secret_name_boundary postrollback forbid
          rm -f "$RUNNER_TEMP/postrollback-secret-names.json"
          if ! read_version 'https://app.assesssuite.com' "$ROLLBACK_RELEASE_SHA" "$RUNNER_TEMP/rollback-apex-version.json" \
            || ! read_version 'https://assesssuite-production.fly.dev' "$ROLLBACK_RELEASE_SHA" "$RUNNER_TEMP/rollback-fly-version.json"; then
            write_summary 'ROLLBACK /api/version VERIFICATION FAILED'
            exit 1
          fi
          if ! read_public_settings 'https://app.assesssuite.com' "$RUNNER_TEMP/rollback-apex-public-settings.json" \
              || ! read_public_settings 'https://assesssuite-production.fly.dev' "$RUNNER_TEMP/rollback-fly-public-settings.json"; then
            write_summary 'ROLLBACK LEGAL SETTINGS VERIFICATION FAILED'
            exit 1
          fi
          if ! read_public_surface 'https://app.assesssuite.com' 'rollback-apex' \
              || ! read_public_surface 'https://assesssuite-production.fly.dev' 'rollback-fly'; then
            write_summary 'ROLLBACK PUBLIC SURFACE VERIFICATION FAILED'
            exit 1
          fi
          if ! assert_topology postrollback; then
            write_summary 'POSTROLLBACK r12 AND DETACHED-LEGACY TOPOLOGY VERIFICATION FAILED'
            exit 1
          fi

          write_summary "ROLLED BACK AND VERIFIED (rollback command exit ${rollback_status})"
