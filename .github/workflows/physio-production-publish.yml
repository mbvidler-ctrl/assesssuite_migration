        run: |
          set -euo pipefail
          [[ -z "${FLY_API_TOKEN:-}" ]]
          candidate="$RUNNER_TEMP/candidate"
          started="$RUNNER_TEMP/started"
          (cd "$candidate" && sha256sum --check --strict SHA256SUMS)
          (cd "$started" && sha256sum --check --strict SHA256SUMS)
          [[ "$(sha256sum "$candidate/candidate-build-receipt.json" | awk '{print $1}')" == "$CANDIDATE_SHA" ]]
          [[ "sha256:$(sha256sum "$candidate/candidate-image.tar.gz" | awk '{print $1}')" == "$ARCHIVE_SHA" ]]
          [[ "sha256:$(sha256sum "$candidate/candidate-image.oci.tar.gz" | awk '{print $1}')" == "$OCI_ARCHIVE_SHA" ]]
          [[ "$(sha256sum "$candidate/candidate-oci-descriptors.json" | awk '{print $1}')" == "$OCI_DESCRIPTOR_SHA" ]]
          [[ "$(sha256sum "$started/publication-effect-reconciliation.json" | awk '{print $1}')" == "$STARTED_SHA" ]]
          gzip -dc "$candidate/candidate-image.tar.gz" | docker load >"$RUNNER_TEMP/docker-load.stdout"
          [[ "$(docker image inspect "assesssuite-physio-candidate:$APPLICATION_SHA" --format '{{.Id}}')" == "$LOCAL_IMAGE_ID" ]]
          [[ "$(docker image inspect "$LOCAL_IMAGE_ID" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" == "$APPLICATION_SHA" ]]
          oci="$RUNNER_TEMP/candidate-oci"
          install -d -m 0700 "$oci"
          ARCHIVE="$candidate/candidate-image.oci.tar.gz" DESTINATION="$oci" DESCRIPTORS="$candidate/candidate-oci-descriptors.json" \
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import tarfile

          archive_path = pathlib.Path(os.environ['ARCHIVE']).resolve()
          destination = pathlib.Path(os.environ['DESTINATION']).resolve()
          descriptor = json.loads(pathlib.Path(os.environ['DESCRIPTORS']).read_text(encoding='utf-8'))
          digests = {descriptor['manifest_digest'][7:], descriptor['config']['digest'][7:]}
          digests.update(row['digest'][7:] for row in descriptor['layers'])
          expected_files = {'oci-layout', 'index.json', *(f'blobs/sha256/{digest}' for digest in digests)}
          seen = set()
          total = 0
          with tarfile.open(archive_path, mode='r:gz') as archive:
              for member in archive.getmembers():
                  name = member.name.removeprefix('./').rstrip('/')
                  if not name:
                      continue
                  if member.isdir() and name in {'blobs', 'blobs/sha256'}:
                      continue
                  if not member.isfile() or name not in expected_files or name in seen:
                      raise SystemExit('OCI archive member set, type, or uniqueness differs')
                  if member.size <= 0 or member.size > 2_000_000_000:
                      raise SystemExit('OCI archive member size differs')
                  total += member.size
                  if total > 4_000_000_000:
                      raise SystemExit('OCI archive total size differs')
                  target = (destination / name).resolve()
                  if os.path.commonpath([str(destination), str(target)]) != str(destination):
                      raise SystemExit('OCI archive member escapes destination')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit('OCI archive member has no bytes')
                  with target.open('xb') as output:
                      while chunk := source.read(1024 * 1024):
                          output.write(chunk)
                  seen.add(name)
          if seen != expected_files:
              raise SystemExit('OCI archive exact file set differs')
          PY
          [[ "$(node scripts/physio-oci-image.mjs verify-descriptors --layout "$oci" --tag "$APPLICATION_SHA" \
            --application-sha "$APPLICATION_SHA" --local-image-id "$LOCAL_IMAGE_ID" \
            --receipt "$candidate/candidate-oci-descriptors.json")" == "$OCI_MANIFEST_DIGEST" ]]

      - name: Publish exact archive bytes and prove immutable registry digest
        id: publish
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APPLICATION_SHA: ${{ inputs.application_sha }}
          CANDIDATE_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_DIGEST: ${{ inputs.candidate_artifact_digest }}
          CANDIDATE_SHA: ${{ inputs.candidate_receipt_sha256 }}
          ARCHIVE_SHA: ${{ inputs.archive_sha256 }}
          OCI_ARCHIVE_SHA: ${{ inputs.oci_archive_sha256 }}
          OCI_MANIFEST_DIGEST: ${{ inputs.oci_manifest_digest }}
          OCI_DESCRIPTOR_SHA: ${{ inputs.oci_descriptor_manifest_sha256 }}
          LOCAL_IMAGE_ID: ${{ inputs.local_image_id }}
          CANARY_SHA: ${{ inputs.canary_receipt_sha256 }}
          CANARY_CAPABILITY_BINDING_SHA: ${{ inputs.canary_capability_binding_sha256 }}
          CANARY_CAPABILITY_INTENT_ID: ${{ needs.admit.outputs.canary_capability_intent_id }}
          CANARY_AUTHORITY_REFERENCE: ${{ needs.admit.outputs.canary_authority_reference }}
          BOOTSTRAP_SHA: ${{ inputs.bootstrap_receipt_sha256 }}
          WEBHOOK_ARCHIVE_SHA: ${{ inputs.stripe_webhook_archive_receipt_sha256 }}
          WEBHOOK_ID: ${{ inputs.stripe_webhook_archive_artifact_id }}
          WEBHOOK_DIGEST: ${{ inputs.stripe_webhook_archive_artifact_digest }}
          STARTED_SHA: ${{ needs.admit.outputs.started_receipt_sha256 }}
          INTENT: ${{ inputs.capability_intent_id }}
          AUTHORITY: ${{ inputs.authority_reference }}
          RESUME_ID: ${{ inputs.resume_started_effect_artifact_id }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          [[ -n "$FLY_API_TOKEN" ]]
          packet="$RUNNER_TEMP/publication-receipt"
          work="$RUNNER_TEMP/publication-work"
          install -d -m 0700 "$packet" "$work"
          reconciliation="$packet/publication-effect-reconciliation.json"
          install -m 0600 "$RUNNER_TEMP/started/publication-effect-reconciliation.json" "$reconciliation"
          WEBHOOK_SHA="$(RECONCILIATION="$reconciliation" node -e \
            "const r=require(process.env.RECONCILIATION);process.stdout.write(r.stripe_webhook_receipt_sha256)")"
          [[ "$WEBHOOK_SHA" =~ ^[0-9a-f]{64}$ && "$WEBHOOK_ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]]
          install -m 0600 "$RUNNER_TEMP/started/publication-predecessor-artifact-admission.json" "$packet/publication-predecessor-artifact-admission.json"
          STARTED="$reconciliation" STARTED_SHA="$STARTED_SHA" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const row = JSON.parse(fs.readFileSync(process.env.STARTED, 'utf8'));
          if (row.result !== 'STARTED') throw new Error('publication STARTED receipt differs');
          row.started_effect_receipt_sha256 = process.env.STARTED_SHA;
          fs.writeFileSync(process.env.STARTED, JSON.stringify(row, null, 2) + '\n', { mode: 0o600 });
          NODE
          preserve_publication_evidence() {
            local status=$?
            trap - EXIT
            if [[ "$status" -ne 0 && ! -f "$work/provider-effect-completed" ]]; then
              rm -f "$packet/physio-production-publication.json" "$packet/registry-descriptor-readback.json" "$packet/registry-provider-result.json" "$packet/SHA256SUMS"
              RECONCILIATION="$reconciliation" WORK="$work" STATUS="$status" node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          const row = JSON.parse(fs.readFileSync(process.env.RECONCILIATION, 'utf8'));
          const hashes = {};
          for (const name of ['registry-prestate-head.headers','registry-prestate-head.stderr','registry-prestate-get.headers',
            'registry-prestate-get.body','registry-prestate-get.stderr','registry-copy.stdout','registry-copy.stderr',
            'registry-final-head.headers','registry-final-head.stderr','registry-final-get.headers','registry-final-get.stderr',
            'registry-manifest.raw']) {
            const file = path.join(process.env.WORK, name);
            if (fs.existsSync(file) && fs.statSync(file).isFile()) hashes[name] = createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          }
          row.result = fs.existsSync(path.join(process.env.WORK, 'registry-mutation-started')) ? 'STARTED_UNRESOLVED' : 'FAILED';
          row.process_exit_code = Number(process.env.STATUS); row.provider_result_sha256 = hashes;
          row.failed_at = new Date().toISOString();
          fs.writeFileSync(process.env.RECONCILIATION, JSON.stringify(row, null, 2) + '\n', { mode: 0o600 });
          NODE
              (cd "$packet" && LC_ALL=C find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum >SHA256SUMS && sha256sum --check --strict SHA256SUMS)
            elif [[ "$status" -ne 0 ]]; then
              rm -f "$packet/physio-production-publication.json" "$packet/registry-provider-result.json" "$packet/SHA256SUMS"
              (cd "$packet" && LC_ALL=C find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum >SHA256SUMS && sha256sum --check --strict SHA256SUMS)
            fi
            "$RUNNER_TEMP/regctl" registry logout registry.fly.io >/dev/null 2>&1 || true
            rm -f "$work/regctl-config.json" "$work/curl-auth.cfg"
            unset FLY_API_TOKEN
            exit "$status"
          }
          trap preserve_publication_evidence EXIT
          registry_tag="registry.fly.io/assesssuite-physio-production:physio-$APPLICATION_SHA"
          registry_repo='registry.fly.io/assesssuite-physio-production'
          local_ref="ocidir://$RUNNER_TEMP/candidate-oci:$APPLICATION_SHA"
          export REGCTL_CONFIG="$work/regctl-config.json"
          printf '%s' "$FLY_API_TOKEN" | "$RUNNER_TEMP/regctl" registry login registry.fly.io -u x --pass-stdin \
            >"$work/registry-login.stdout" 2>"$work/registry-login.stderr"
          CURL_AUTH="$work/curl-auth.cfg" FLY_TOKEN="$FLY_API_TOKEN" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          if (!process.env.FLY_TOKEN || /["\\\r\n]/.test(process.env.FLY_TOKEN)) throw new Error('Fly registry credential shape differs');
          fs.writeFileSync(process.env.CURL_AUTH, `user = "x:${process.env.FLY_TOKEN}"\n`, { flag: 'wx', mode: 0o600 });
          NODE
          manifest_url="https://registry.fly.io/v2/assesssuite-physio-production/manifests/physio-$APPLICATION_SHA"
          accept='Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
          set +e
          head_status="$(curl --config "$work/curl-auth.cfg" --proto '=https' --tlsv1.2 --silent --show-error --max-time 60 --max-redirs 0 \
            --head --header "$accept" --dump-header "$work/registry-prestate-head.headers" --output /dev/null \
            --write-out '%{http_code}' "$manifest_url" 2>"$work/registry-prestate-head.stderr")"
          head_exit=$?
          get_status="$(curl --config "$work/curl-auth.cfg" --proto '=https' --tlsv1.2 --silent --show-error --max-time 60 --max-redirs 0 \
            --max-filesize 4194304 \
            --header "$accept" --dump-header "$work/registry-prestate-get.headers" --output "$work/registry-prestate-get.body" \
            --write-out '%{http_code}' "$manifest_url" 2>"$work/registry-prestate-get.stderr")"
          get_exit=$?
          set -e
          [[ "$head_exit" -eq 0 && "$get_exit" -eq 0 && "$head_status" =~ ^[0-9]{3}$ && "$get_status" =~ ^[0-9]{3}$ ]]
          if [[ "$head_status" == '200' && "$get_status" == '200' ]]; then
            node scripts/physio-oci-image.mjs verify-registry-readback \
              --head-headers "$work/registry-prestate-head.headers" --head-status "$head_status" \
              --get-headers "$work/registry-prestate-get.headers" --get-status "$get_status" \
              --body "$work/registry-prestate-get.body" --descriptors "$RUNNER_TEMP/candidate/candidate-oci-descriptors.json" \
              --receipt "$packet/registry-prestate.json" --mode present
            [[ "$RESUME_ID" != '0' ]]
            resume_result="$(STARTED="$reconciliation" env -u FLY_API_TOKEN node --input-type=module -e \
              "import fs from 'node:fs';process.stdout.write(JSON.parse(fs.readFileSync(process.env.STARTED,'utf8')).resume_started_effect_result)")"
            [[ "$resume_result" == 'STARTED' || "$resume_result" == 'STARTED_UNRESOLVED' || "$resume_result" == 'COMPLETED' ]]
            RECONCILIATION="$reconciliation" PRESTATE_SHA="$(sha256sum "$packet/registry-prestate.json" | awk '{print $1}')" \
              env -u FLY_API_TOKEN node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const row = JSON.parse(fs.readFileSync(process.env.RECONCILIATION, 'utf8'));
          row.prior_effect_resolution = 'COMMITTED_EXACT';
          row.prior_effect_readback_sha256 = process.env.PRESTATE_SHA;
          fs.writeFileSync(process.env.RECONCILIATION, JSON.stringify(row, null, 2) + '\n', { mode: 0o600 });
          NODE
            : >"$work/registry-copy.stdout"; : >"$work/registry-copy.stderr"
            copy_exit_code=0
          elif [[ "$head_status" == '404' && "$get_status" == '404' ]]; then
            node scripts/physio-oci-image.mjs verify-registry-readback \
              --head-headers "$work/registry-prestate-head.headers" --head-status "$head_status" \
              --get-headers "$work/registry-prestate-get.headers" --get-status "$get_status" \
              --body "$work/registry-prestate-get.body" --descriptors "$RUNNER_TEMP/candidate/candidate-oci-descriptors.json" \
              --receipt "$packet/registry-prestate.json" --mode absent
            if [[ "$RESUME_ID" != '0' ]]; then
              RECONCILIATION="$reconciliation" PRESTATE_SHA="$(sha256sum "$packet/registry-prestate.json" | awk '{print $1}')" \
                env -u FLY_API_TOKEN node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const row = JSON.parse(fs.readFileSync(process.env.RECONCILIATION, 'utf8'));
          if (!Number.isSafeInteger(row.effect_generation) || row.effect_generation < 1 ||
              !/^[0-9a-f]{64}$/.test(row.prior_effect_receipt_sha256 || '')) {
            throw new Error('publication predecessor generation differs');
          }
          row.prior_effect_resolution = 'NOT_COMMITTED_BY_AUTHORITATIVE_ABSENCE';
          row.prior_effect_readback_sha256 = process.env.PRESTATE_SHA;
          fs.writeFileSync(process.env.RECONCILIATION, JSON.stringify(row, null, 2) + '\n', { mode: 0o600 });
          NODE
            fi
            : >"$work/registry-mutation-started"
            set +e
            "$RUNNER_TEMP/regctl" image copy --force-recursive "$local_ref" "$registry_tag" \
              >"$work/registry-copy.stdout" 2>"$work/registry-copy.stderr"
            copy_exit_code=$?
            set -e
          else
            echo 'Registry prestate is mixed, redirected, unauthorised, throttled, or unavailable.' >&2
            exit 1
          fi
          set +e
          final_head_status="$(curl --config "$work/curl-auth.cfg" --proto '=https' --tlsv1.2 --silent --show-error --max-time 60 --max-redirs 0 \
            --head --header "$accept" --dump-header "$work/registry-final-head.headers" --output /dev/null \
            --write-out '%{http_code}' "$manifest_url" 2>"$work/registry-final-head.stderr")"
          final_head_exit=$?
          final_get_status="$(curl --config "$work/curl-auth.cfg" --proto '=https' --tlsv1.2 --silent --show-error --max-time 60 --max-redirs 0 \
            --max-filesize 4194304 \
            --header "$accept" --dump-header "$work/registry-final-get.headers" --output "$work/registry-manifest.raw" \
            --write-out '%{http_code}' "$manifest_url" 2>"$work/registry-final-get.stderr")"
          final_get_exit=$?
          set -e
          [[ "$final_head_exit" -eq 0 && "$final_get_exit" -eq 0 && "$final_head_status" == '200' && "$final_get_status" == '200' ]]
          node scripts/physio-oci-image.mjs verify-registry-readback \
            --head-headers "$work/registry-final-head.headers" --head-status "$final_head_status" \
            --get-headers "$work/registry-final-get.headers" --get-status "$final_get_status" \
            --body "$work/registry-manifest.raw" --descriptors "$RUNNER_TEMP/candidate/candidate-oci-descriptors.json" \
            --receipt "$packet/registry-protocol-final.json" --mode present
          image_digest="$OCI_MANIFEST_DIGEST"
          local_manifest="$RUNNER_TEMP/candidate-oci/blobs/sha256/${OCI_MANIFEST_DIGEST#sha256:}"
          cmp --silent "$local_manifest" "$work/registry-manifest.raw"
          descriptors="$RUNNER_TEMP/candidate/candidate-oci-descriptors.json"
          install -d -m 0700 "$work/registry-blobs"
          DESCRIPTORS="$descriptors" node --input-type=module <<'NODE' >"$work/descriptor-list.tsv"
          import fs from 'node:fs';
          const row = JSON.parse(fs.readFileSync(process.env.DESCRIPTORS, 'utf8'));
          for (const item of [row.config, ...row.layers]) console.log(`${item.digest}\t${item.size}`);
          NODE
          while IFS=$'\t' read -r digest size; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ && "$size" =~ ^[1-9][0-9]*$ ]]
            blob="$work/registry-blobs/${digest#sha256:}"
            "$RUNNER_TEMP/regctl" blob get "$registry_repo" "$digest" >"$blob"
            [[ "sha256:$(sha256sum "$blob" | awk '{print $1}')" == "$digest" && "$(wc -c <"$blob")" == "$size" ]]
          done <"$work/descriptor-list.tsv"
          immutable_image="registry.fly.io/assesssuite-physio-production@$image_digest"
          DESCRIPTORS="$descriptors" RECEIPT="$packet/registry-descriptor-readback.json" IMMUTABLE_IMAGE="$immutable_image" \
          MANIFEST_SHA="$(sha256sum "$work/registry-manifest.raw" | awk '{print $1}')" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = JSON.parse(fs.readFileSync(process.env.DESCRIPTORS, 'utf8'));
          fs.writeFileSync(process.env.RECEIPT, JSON.stringify({
            contract_version: 'assesssuite-registry-descriptor-readback/1.0.0', result: 'PASS',
            immutable_image: process.env.IMMUTABLE_IMAGE, manifest_digest: source.manifest_digest,
            manifest_raw_sha256: process.env.MANIFEST_SHA, config: source.config, layers: source.layers,
            exact_manifest_and_all_blobs_verified: true,
          }, null, 2) + '\n', { flag: 'wx', mode: 0o600 });
          NODE
          rm -f "$work/regctl-config.json" "$work/curl-auth.cfg"
          unset FLY_API_TOKEN
          RECONCILIATION="$reconciliation" PRESTATE_SHA="$(sha256sum "$packet/registry-prestate.json" | awk '{print $1}')" \
          COPY_EXIT="$copy_exit_code" READBACK_SHA="$(sha256sum "$packet/registry-descriptor-readback.json" | awk '{print $1}')" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const row = JSON.parse(fs.readFileSync(process.env.RECONCILIATION, 'utf8'));
          row.result = 'COMPLETED'; row.registry_prestate_sha256 = process.env.PRESTATE_SHA;
          row.copy_exit_code = Number(process.env.COPY_EXIT); row.registry_readback_sha256 = process.env.READBACK_SHA;
          row.completed_at = new Date().toISOString();
          fs.writeFileSync(process.env.RECONCILIATION, JSON.stringify(row, null, 2) + '\n', { mode: 0o600 });
          NODE
          : >"$work/provider-effect-completed"
          reconciliation_sha="$(sha256sum "$reconciliation" | awk '{print $1}')"
          RECEIPT="$packet/physio-production-publication.json" APPLICATION_SHA="$APPLICATION_SHA" CANDIDATE_ID="$CANDIDATE_ID" \
          CANDIDATE_DIGEST="$CANDIDATE_DIGEST" CANDIDATE_SHA="$CANDIDATE_SHA" ARCHIVE_SHA="$ARCHIVE_SHA" \
          OCI_ARCHIVE_SHA="$OCI_ARCHIVE_SHA" OCI_MANIFEST_DIGEST="$OCI_MANIFEST_DIGEST" OCI_DESCRIPTOR_SHA="$OCI_DESCRIPTOR_SHA" \
          LOCAL_IMAGE_ID="$LOCAL_IMAGE_ID" CANARY_SHA="$CANARY_SHA" BOOTSTRAP_SHA="$BOOTSTRAP_SHA" \
          WEBHOOK_SHA="$WEBHOOK_SHA" WEBHOOK_ARCHIVE_SHA="$WEBHOOK_ARCHIVE_SHA" \
          CANARY_CAPABILITY_BINDING_SHA="$CANARY_CAPABILITY_BINDING_SHA" \
          CANARY_INTENT="$CANARY_CAPABILITY_INTENT_ID" CANARY_AUTHORITY="$CANARY_AUTHORITY_REFERENCE" \
          WEBHOOK_ID="$WEBHOOK_ID" WEBHOOK_DIGEST="$WEBHOOK_DIGEST" RECONCILIATION="$reconciliation" \
          STARTED_SHA="$STARTED_SHA" RECONCILIATION_SHA="$reconciliation_sha" IMMUTABLE_IMAGE="$immutable_image" IMAGE_DIGEST="$image_digest" \
          REGISTRY_TAG="$registry_tag" READBACK_SHA="$(sha256sum "$packet/registry-descriptor-readback.json" | awk '{print $1}')" \
          PROTOCOL_SHA="$(sha256sum "$packet/registry-protocol-final.json" | awk '{print $1}')" \
          CANDIDATE_RECEIPT="$RUNNER_TEMP/candidate/candidate-build-receipt.json" \
          INTENT="$INTENT" AUTHORITY="$AUTHORITY" node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          const sha = (file) => createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const effect = JSON.parse(fs.readFileSync(process.env.RECONCILIATION, 'utf8'));
          const candidate = JSON.parse(fs.readFileSync(process.env.CANDIDATE_RECEIPT, 'utf8'));
          const row = { contract_version: 'assesssuite-physio-image-publication/3.0.0', result: 'PASS',
            application: 'assesssuite-physio-production', application_sha: process.env.APPLICATION_SHA, profession_id: 'physio',
            candidate_artifact_id: process.env.CANDIDATE_ID, candidate_artifact_digest: process.env.CANDIDATE_DIGEST,
            candidate_receipt_sha256: process.env.CANDIDATE_SHA, archive_sha256: process.env.ARCHIVE_SHA,
            oci_archive_sha256: process.env.OCI_ARCHIVE_SHA, oci_manifest_digest: process.env.OCI_MANIFEST_DIGEST,
            oci_descriptor_manifest_sha256: process.env.OCI_DESCRIPTOR_SHA,
            local_image_id: process.env.LOCAL_IMAGE_ID, canary_receipt_sha256: process.env.CANARY_SHA,
            canary_artifact_id: effect.canary_artifact_id,
            canary_artifact_digest: effect.canary_artifact_digest,
            canary_capability_intent_id: process.env.CANARY_INTENT,
            canary_authority_reference: process.env.CANARY_AUTHORITY,
            canary_capability_binding_sha256: process.env.CANARY_CAPABILITY_BINDING_SHA,
            bootstrap_artifact_id: effect.bootstrap_artifact_id,
            bootstrap_artifact_digest: effect.bootstrap_artifact_digest,
            bootstrap_receipt_sha256: process.env.BOOTSTRAP_SHA,
            bootstrap_capability_intent_id: effect.bootstrap_capability_intent_id,
            bootstrap_authority_reference: effect.bootstrap_authority_reference,
            bootstrap_capability_binding_sha256: effect.bootstrap_capability_binding_sha256,
            sentry_release_artifact_id: candidate.sentry_release.artifact_id,
            sentry_release_artifact_digest: candidate.sentry_release.artifact_digest,
            sentry_release_receipt_sha256: candidate.sentry_release.receipt_sha256,
            stripe_webhook_archive_artifact_id: process.env.WEBHOOK_ID,
            stripe_webhook_archive_artifact_digest: process.env.WEBHOOK_DIGEST,
            stripe_webhook_archive_receipt_sha256: process.env.WEBHOOK_ARCHIVE_SHA,
            stripe_webhook_receipt_sha256: process.env.WEBHOOK_SHA,
            stripe_webhook_source_artifact_id: effect.stripe_webhook_source_artifact_id,
            stripe_webhook_source_artifact_digest: effect.stripe_webhook_source_artifact_digest,
            stripe_webhook_ledger_commit_sha: effect.stripe_webhook_ledger_commit_sha,
            stripe_webhook_ledger_record_sha256: effect.stripe_webhook_ledger_record_sha256,
            stripe_webhook_ledger_packet_manifest_sha256: effect.stripe_webhook_ledger_packet_manifest_sha256,
            stripe_webhook_capability_intent_id: effect.stripe_webhook_capability_intent_id,
            stripe_webhook_authority_reference: effect.stripe_webhook_authority_reference,
            stripe_webhook_capability_binding_sha256: effect.stripe_webhook_capability_binding_sha256,
            stripe_webhook_endpoint: effect.stripe_webhook_endpoint, stripe_webhook_endpoint_id: effect.stripe_webhook_endpoint_id,
            stripe_api_version: effect.stripe_api_version, stripe_webhook_enabled_events: effect.enabled_events,
            stripe_signing_secret_sha256: effect.stripe_signing_secret_sha256,
