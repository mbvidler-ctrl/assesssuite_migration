name: Physio production restricted-owner provisioning

on:
  workflow_dispatch:
    inputs:
      application_sha:
        description: Exact deployed main SHA containing the restricted access implementation
        required: true
        type: string
      confirmation:
        description: Type PROVISION PHYSIO MAXWELL AND BRENTON OWNERS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: assesssuite-physio-production-access
  cancel-in-progress: false

jobs:
  provision:
    name: Activate Maxwell and invite Brenton as independent owners
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: physio-production
    env:
      APP: assesssuite-physio-production
      APP_URL: https://physio.app.assesssuite.com
      MAXWELL_EMAIL: mb.vidler@gmail.com
      BRENTON_EMAIL: brenton@primehealthclinics.com
      ORGANIZATION_NAME: AssessSuite Physio
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Validate exact bounded provisioning request
        shell: bash
        env:
          APPLICATION_SHA: ${{ inputs.application_sha }}
        run: |
          set -euo pipefail
          [[ "${{ github.ref }}" == "refs/heads/main" ]]
          [[ "${{ github.actor }}" == "mbvidler-ctrl" ]]
          [[ "${{ github.triggering_actor }}" == "mbvidler-ctrl" ]]
          [[ "${{ inputs.confirmation }}" == "PROVISION PHYSIO MAXWELL AND BRENTON OWNERS" ]]
          [[ "$APPLICATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$FLY_API_TOKEN" ]]
          [[ "$MAXWELL_EMAIL" == "mb.vidler@gmail.com" ]]
          [[ "$BRENTON_EMAIL" == "brenton@primehealthclinics.com" ]]

      - name: Check out exact deployed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.application_sha }}
          persist-credentials: false

      - name: Set up locked Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Prove source and restricted-access contracts
        shell: bash
        env:
          APPLICATION_SHA: ${{ inputs.application_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$APPLICATION_SHA" ]]
          test -f scripts/provision-physio-restricted-owners.mjs
          node --test server/tests/physio-organization-access-contract.test.mjs
          node --test server/tests/physio-public-entry.test.mjs

      - name: Install checksum-verified Fly CLI 0.4.71
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/flyctl_0.4.71_Linux_x86_64.tar.gz"
          bin_dir="$RUNNER_TEMP/flyctl-bin"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive" \
            'https://github.com/superfly/flyctl/releases/download/v0.4.71/flyctl_0.4.71_Linux_x86_64.tar.gz'
          printf '%s  %s\n' 'a782dceed173d215c000ab94e2b08623c22267edff6d90ebe3010b3f9b671dc2' "$archive" | sha256sum --check --strict
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" flyctl
          install -m 0755 "$bin_dir/flyctl" "$bin_dir/fly"
          echo "$bin_dir" >>"$GITHUB_PATH"
          "$bin_dir/flyctl" version | grep -F '0.4.71'

      - name: Prove the exact deployed R3 machine before access mutation
        shell: bash
        env:
          APPLICATION_SHA: ${{ inputs.application_sha }}
        run: |
          set -euo pipefail
          flyctl status --app "$APP" --json >physio-owner-prestate.json
          jq -e --arg sha "$APPLICATION_SHA" '
            .Deployed == true and
            ([.Machines[] | select(.state == "started")] | length) == 1 and
            .Machines[0].image_ref.labels.GH_SHA == $sha and
            .Machines[0].config.env.ALLOW_OPEN_REGISTRATION == "0"
          ' physio-owner-prestate.json >/dev/null
          version="$(curl --fail --silent --show-error --max-time 20 "$APP_URL/api/version")"
          jq -e --arg sha "$APPLICATION_SHA" 'tostring | contains($sha)' <<<"$version" >/dev/null

      - name: Preview exact owner transition without mutation
        shell: bash
        run: |
          set -euo pipefail
          command="node /app/scripts/provision-physio-restricted-owners.mjs --owner-email $MAXWELL_EMAIL --owner-email $BRENTON_EMAIL --organization-name '$ORGANIZATION_NAME'"
          flyctl ssh console --app "$APP" --command "$command" >physio-owner-preview.json
          jq -e --arg maxwell "$MAXWELL_EMAIL" --arg brenton "$BRENTON_EMAIL" '
            .status == "dry-run" and
            .organization == "AssessSuite Physio" and
            ([.owners[].email] | sort) == ([$maxwell, $brenton] | sort)
          ' physio-owner-preview.json >/dev/null

      - name: Activate Maxwell and issue Brenton owner invitation
        shell: bash
        run: |
          set -euo pipefail
          command="node /app/scripts/provision-physio-restricted-owners.mjs --apply --owner-email $MAXWELL_EMAIL --owner-email $BRENTON_EMAIL --organization-name '$ORGANIZATION_NAME'"
          flyctl ssh console --app "$APP" --command "$command" >physio-owner-provisioning.json
          jq -e --arg maxwell "$MAXWELL_EMAIL" --arg brenton "$BRENTON_EMAIL" '
            .status == "applied" and
            .organization.name == "AssessSuite Physio" and
            ([.active_owners[].email] | index($maxwell)) != null and
            (
              ([.active_owners[].email] | index($brenton)) != null or
              ([.invitations[] | select(.email == $brenton and (.status == "sent" or .status == "already-pending"))] | length) == 1
            )
          ' physio-owner-provisioning.json >/dev/null

      - name: Inspect persisted owner and invitation state
        shell: bash
        run: |
          set -euo pipefail
          command="node /app/scripts/provision-physio-restricted-owners.mjs --inspect --owner-email $MAXWELL_EMAIL --owner-email $BRENTON_EMAIL --organization-name '$ORGANIZATION_NAME'"
          flyctl ssh console --app "$APP" --command "$command" >physio-owner-inspection.json
          jq -e --arg maxwell "$MAXWELL_EMAIL" --arg brenton "$BRENTON_EMAIL" '
            .status == "inspection" and
            .organization.name == "AssessSuite Physio" and
            .organization.subscription_status == "active" and
            .organization_count == 1 and
            .all_targets_accounted_for == true and
            ([.targets[] | select(.email == $maxwell and .state == "active-owner")] | length) == 1 and
            ([.targets[] | select(.email == $brenton and (.state == "active-owner" or .state == "invited-owner"))] | length) == 1 and
            .access_event_count >= 2
          ' physio-owner-inspection.json >/dev/null

      - name: Prove public registration remains unavailable
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output physio-public-registration-response.json \
            --write-out '%{http_code}' --max-time 20 \
            --request POST --header 'content-type: application/json' \
            --data '{"email":"unauthorised-registration@invalid.test","password":"NoPublicRegistration-2026!"}' \
            "$APP_URL/api/apps/local-assesssuite-physio/auth/register")"
          [[ "$status" == "403" ]]
          jq -e '.error == "registration_disabled" or (.message | test("self-registration is disabled"; "i"))' \
            physio-public-registration-response.json >/dev/null

      - name: Upload restricted-access provisioning evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physio-restricted-owners-${{ inputs.application_sha }}
          path: |
            physio-owner-prestate.json
            physio-owner-preview.json
            physio-owner-provisioning.json
            physio-owner-inspection.json
            physio-public-registration-response.json
          if-no-files-found: warn
          retention-days: 90
