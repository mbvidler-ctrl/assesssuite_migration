          expected_data_manifest_sha256="$(LIVE="$input/rollback-readback-04-LIVE_MUTATION_STARTED.json" node --input-type=module -e \
            "import fs from'node:fs';const r=JSON.parse(fs.readFileSync(process.env.LIVE,'utf8'));process.stdout.write('sha256:'+r.observed_config_sha256)")"
