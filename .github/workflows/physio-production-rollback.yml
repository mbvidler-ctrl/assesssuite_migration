          )
          read_live_identity() {
            MACHINES="$1" MACHINE="$EXPECTED_MACHINE_ID" CURRENT="$CURRENT_IMMUTABLE_IMAGE" TARGET="$ROLLBACK_IMMUTABLE_IMAGE" \
              MODE="$ROLLBACK_MODE" node --input-type=module <<'NODE'
          import fs from'node:fs';import{canonicalizePhysioFlyImageReference}from'./scripts/physio-release-contract.mjs';
          const p=JSON.parse(fs.readFileSync(process.env.MACHINES,'utf8'));const rows=Array.isArray(p)?p:p.machines||p.data||[];
          const r=rows.find((x)=>x?.id===process.env.MACHINE);if(!r||!['started','stopped'].includes(r.state))throw Error('live machine identity differs');
          const image=canonicalizePhysioFlyImageReference(r.image_ref??r.imageRef??r.config?.image??r.Config?.image);
          const allowed=process.env.MODE==='exact-image'?[process.env.CURRENT,process.env.TARGET]:[process.env.CURRENT];
