            throw Error('rollback live mutation exact full config readback differs');
          NODE
          fly volumes snapshots list "$EXPECTED_VOLUME_ID" --app "$app" --json >"$work/snapshots-final.json"
          MACHINES_FILE="$work/machines-final.json" VOLUMES_FILE="$work/volumes-final.json" \
          SNAPSHOTS_FILE="$work/snapshots-final.json" OBSERVED_CONFIG_SHA256="${expected_data_manifest_sha256#sha256:}" \
          MACHINE_CONFIG_OPERATION_RECEIPT="${transition_operation:-}" \
          OBSERVED_MACHINE_ID="$EXPECTED_MACHINE_ID" OBSERVED_MACHINE_STATE="$result_state" OBSERVED_IMAGE="$result_image" \
          OBSERVED_VOLUME_ID="$EXPECTED_VOLUME_ID" OBSERVED_RESTORE_VOLUME_ID="$restore_volume_id" \
          OBSERVED_SNAPSHOT_ID="$rollback_snapshot_id" node "$RUNNER_TEMP/rollback-phase-helper.mjs" readback \
