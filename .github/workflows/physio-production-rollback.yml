          [[ "$rollback_snapshot_id" =~ ^[A-Za-z0-9_-]{6,160}$ && "$restore_volume_id" =~ ^vol_[A-Za-z0-9]+$ ]]
          result_image="$CURRENT_IMMUTABLE_IMAGE"
          result_sha=NOT-AVAILABLE
          expected_state=stopped
          if [[ "$ROLLBACK_MODE" == 'exact-image' ]]; then
            result_image="$ROLLBACK_IMMUTABLE_IMAGE"
            result_sha="$ROLLBACK_RELEASE_SHA"
            expected_state=started
          fi
          read_post_identity() {
            MACHINES="$1" MACHINE="$EXPECTED_MACHINE_ID" node --input-type=module <<'NODE'
          import fs from'node:fs';import{canonicalizePhysioFlyImageReference}from'./scripts/physio-release-contract.mjs';
          const p=JSON.parse(fs.readFileSync(process.env.MACHINES,'utf8'));const rows=Array.isArray(p)?p:p.machines||p.data||[];
          const r=rows.find((x)=>x?.id===process.env.MACHINE);if(!r||!['started','stopped'].includes(r.state))process.exit(1);
