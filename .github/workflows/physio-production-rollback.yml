          import fs from'node:fs';const r=JSON.parse(fs.readFileSync(process.env.RAW,'utf8'));
          for(const v of [r.response_received?'true':'false',r.http_status??'',r.response_body_sha256??'',r.response_headers_sha256??'',r.error_sha256??''])console.log(v);
          NODE
            )
            response_received="${mutation_fields[0]}"; http_status="${mutation_fields[1]}"
            accepted=false; [[ "$http_status" =~ ^(200|202|204)$ ]] && accepted=true
            if [[ "$cleanup_applied" == '1' && ( "$response_received" == 'false' || "$accepted" == 'true' ) ]]; then
              disposition=APPLIED
            elif [[ "$cleanup_applied" == '0' && ( "$response_received" == 'false' || "$accepted" == 'false' ) ]]; then
              disposition=NOT_APPLIED
            else
              disposition=AMBIGUOUS
            fi
            current_calls=1; [[ "$restore_exists" == 'false' ]] && current_calls=0
            write_cleanup_receipt "$disposition" "$current_calls" "${mutation_fields[0]}" "${mutation_fields[1]}" \
              "${mutation_fields[2]}" "${mutation_fields[3]}" "${mutation_fields[4]}" "$work/volumes-after.json"
          fi
          [[ "$disposition" == 'APPLIED' ]]
          fly machines list --app "$app" --json >"$work/machines-after.json"
          fly volumes list --app "$app" --json >"$work/volumes-after-final.json"
          fly volumes snapshots list "$EXPECTED_VOLUME_ID" --app "$app" --json >"$work/snapshots-after.json"
          env -u FLY_API_TOKEN node scripts/physio-release-contract.mjs inspect-topology \
            --machines "$work/machines-after.json" --volumes "$work/volumes-after-final.json" \
            --mode recovery-admission --volume-id "$EXPECTED_VOLUME_ID" --machine-id "$EXPECTED_MACHINE_ID" \
            --image "$result_image" | grep -F "\"machineState\":\"$expected_state\""
          MACHINES_FILE="$work/machines-after.json" VOLUMES_FILE="$work/volumes-after-final.json" \
          SNAPSHOTS_FILE="$work/snapshots-after.json" OBSERVED_CONFIG_SHA256="$manifest_sha" \
          OBSERVED_MACHINE_ID="$EXPECTED_MACHINE_ID" OBSERVED_MACHINE_STATE="$expected_state" OBSERVED_IMAGE="$result_image" \
          OBSERVED_VOLUME_ID="$EXPECTED_VOLUME_ID" OBSERVED_RESTORE_VOLUME_ID="$restore_volume_id" \
          OBSERVED_SNAPSHOT_ID="$rollback_snapshot_id" ROLLBACK_PACKET_INPUT="$input" \
          RESTORE_VOLUME_CLEANUP_RECEIPT="$cleanup_receipt" node "$RUNNER_TEMP/rollback-phase-helper.mjs" readback \
            --phase RESTORE_VOLUME_CLEANUP --result PASS --output "$work/readback.json"
          RESULT_MACHINE_ID="$EXPECTED_MACHINE_ID" RESULT_VOLUME_ID="$EXPECTED_VOLUME_ID" \
          RESTORE_VOLUME_CLEANUP_RECEIPT="$cleanup_receipt" node "$RUNNER_TEMP/rollback-phase-helper.mjs" seal \
            --input "$input" --output "$output" --phase RESTORE_VOLUME_CLEANUP --result COMPLETED \
            --provider-calls 1 --readback "$work/readback.json"
          trap - EXIT

      - name: Upload rollback RESTORE_VOLUME_CLEANUP receipt before terminal finalization
        id: upload_restore_volume_cleanup
        if: ${{ always() && steps.restore_volume_cleanup_effect.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physio-rollback-phase-${{ inputs.failed_application_sha }}-RESTORE-VOLUME-CLEANUP-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rollback-phase-06-result
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Prepare rollback COMPLETED terminal intent
        id: prepare_completed
        if: ${{ steps.restore_volume_cleanup_effect.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "${FLY_API_TOKEN:-}" ]]
          node "$RUNNER_TEMP/rollback-phase-helper.mjs" advance \
            --input "$RUNNER_TEMP/rollback-phase-06-result" \
            --output "$RUNNER_TEMP/rollback-phase-07-started" --phase COMPLETED

      - name: Upload rollback COMPLETED STARTED terminal effect before finalization
        if: ${{ always() && steps.prepare_completed.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physio-rollback-phase-${{ inputs.failed_application_sha }}-COMPLETED-started-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rollback-phase-07-started
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Finalize rollback COMPLETED as a credential-free read-only phase
        id: completed_effect
        shell: bash
        env:
          EXECUTE_PHASE: ${{ steps.prepare_completed.outputs.execute }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          [[ -z "${FLY_API_TOKEN:-}" ]]
          input="$RUNNER_TEMP/rollback-phase-07-started"
          output="$RUNNER_TEMP/rollback-phase-07-result"
          receipt_dir="$RUNNER_TEMP/rollback-final-receipt"
          install -d -m 0700 "$receipt_dir"
          if [[ "$EXECUTE_PHASE" != 'true' ]]; then cp -R "$input" "$output"; exit 0; fi
          rollback_snapshot_id="$(POST="$input/rollback-readback-05-POST_RESTART_VERIFIED.json" node --input-type=module -e \
            "import fs from'node:fs';const r=JSON.parse(fs.readFileSync(process.env.POST,'utf8'));process.stdout.write(r.observed_snapshot_id||'')")"
          restore_volume_id="$(POST="$input/rollback-readback-05-POST_RESTART_VERIFIED.json" node --input-type=module -e \
            "import fs from'node:fs';const r=JSON.parse(fs.readFileSync(process.env.POST,'utf8'));process.stdout.write(r.observed_restore_volume_id||'')")"
          manifest_sha="$(POST="$input/rollback-readback-05-POST_RESTART_VERIFIED.json" node --input-type=module -e \
            "import fs from'node:fs';const r=JSON.parse(fs.readFileSync(process.env.POST,'utf8'));process.stdout.write(r.observed_config_sha256)")"
          expected_state=stopped
          result_image="$CURRENT_IMMUTABLE_IMAGE"
          result_sha=NOT-AVAILABLE
          if [[ "$ROLLBACK_MODE" == 'exact-image' ]]; then
            expected_state=started
            result_image="$ROLLBACK_IMMUTABLE_IMAGE"
            result_sha="$ROLLBACK_RELEASE_SHA"
          fi
          OBSERVED_CONFIG_SHA256="$manifest_sha" OBSERVED_MACHINE_ID="$EXPECTED_MACHINE_ID" \
          OBSERVED_MACHINE_STATE="$expected_state" OBSERVED_IMAGE="$result_image" \
          OBSERVED_VOLUME_ID="$EXPECTED_VOLUME_ID" OBSERVED_RESTORE_VOLUME_ID="$restore_volume_id" \
          OBSERVED_SNAPSHOT_ID="$rollback_snapshot_id" node "$RUNNER_TEMP/rollback-phase-helper.mjs" readback \
            --phase COMPLETED --result PASS --output "$RUNNER_TEMP/rollback-completed-readback.json"
          RESULT_MACHINE_ID="$EXPECTED_MACHINE_ID" RESULT_VOLUME_ID="$EXPECTED_VOLUME_ID" \
          node "$RUNNER_TEMP/rollback-phase-helper.mjs" seal --input "$input" --output "$output" \
            --phase COMPLETED --result COMPLETED --provider-calls 0 \
            --readback "$RUNNER_TEMP/rollback-completed-readback.json"
          node "$RUNNER_TEMP/rollback-phase-helper.mjs" state --packet "$output" >"$receipt_dir/rollback-phase-ledger-admission.json"

          install -m 0600 "$output/rollback-readback-01-SNAPSHOT_COMPLETED.json" \
            "$receipt_dir/physio-rollback-presnapshot-manifest.json"
          install -m 0600 "$output/rollback-readback-02-RESTORE_VERIFIED.json" \
            "$receipt_dir/physio-rollback-restore-verification.json"
          install -m 0600 "$output/rollback-readback-02-RESTORE_VERIFIED.json" \
            "$receipt_dir/rollback-restore-verifier-provider-readback.json"
          receipt_files=(physio-rollback-presnapshot-manifest.json physio-rollback-restore-verification.json rollback-restore-verifier-provider-readback.json)
          if [[ "$ROLLBACK_MODE" == 'exact-image' ]]; then
            install -m 0600 "$output/rollback-readback-03-TARGET_VERIFIED.json" \
              "$receipt_dir/physio-rollback-target-verification.json"
            install -m 0600 "$output/rollback-readback-03-TARGET_VERIFIED.json" \
              "$receipt_dir/rollback-target-verifier-provider-readback.json"
            install -m 0600 "$output/rollback-readback-05-POST_RESTART_VERIFIED.json" \
              "$receipt_dir/physio-rollback-post-restart-proof.json"
            for name in live ready version capabilities; do
              install -m 0600 "$output/rollback-readback-05-POST_RESTART_VERIFIED.json" \
                "$receipt_dir/runtime-$name-post-restart.json"
            done
            install -m 0600 "$output/rollback-readback-05-POST_RESTART_VERIFIED.json" \
              "$receipt_dir/provider-machines-post-restart.json"
            install -m 0600 "$output/rollback-readback-05-POST_RESTART_VERIFIED.json" \
              "$receipt_dir/provider-volumes-post-restart.json"
            receipt_files+=(physio-rollback-target-verification.json rollback-target-verifier-provider-readback.json \
              physio-rollback-post-restart-proof.json runtime-live-post-restart.json runtime-ready-post-restart.json \
              runtime-version-post-restart.json runtime-capabilities-post-restart.json \
              provider-machines-post-restart.json provider-volumes-post-restart.json)
          fi
          snapshot_phase_sha="$(sha256sum "$output/rollback-phase-01-SNAPSHOT_COMPLETED.json" | awk '{print $1}')"
          restore_phase_sha="$(sha256sum "$output/rollback-phase-02-RESTORE_VERIFIED.json" | awk '{print $1}')"
          target_phase_sha="$(sha256sum "$output/rollback-phase-03-TARGET_VERIFIED.json" | awk '{print $1}')"
          post_phase_sha="$(sha256sum "$output/rollback-phase-05-POST_RESTART_VERIFIED.json" | awk '{print $1}')"
          cleanup_phase_sha="$(sha256sum "$output/rollback-phase-06-RESTORE_VOLUME_CLEANUP.json" | awk '{print $1}')"
          final_phase_sha="$(sha256sum "$output/rollback-phase-07-COMPLETED.json" | awk '{print $1}')"
          source_machine_initial_state="$(PHASE="$output/rollback-phase-01-SNAPSHOT_COMPLETED.json" node --input-type=module -e \
            "import fs from'node:fs';const r=JSON.parse(fs.readFileSync(process.env.PHASE,'utf8'));if(!['started','stopped'].includes(r.initial_machine_state))throw Error('source initial state differs');process.stdout.write(r.initial_machine_state)")"
          restore_verifier_machine_id="$(PHASE="$output/rollback-phase-02-RESTORE_VERIFIED.json" node --input-type=module -e \
            "import fs from'node:fs';const r=JSON.parse(fs.readFileSync(process.env.PHASE,'utf8'));if(!/^[0-9a-f]{14,32}$/i.test(r.verifier_machine_id||''))throw Error('restore verifier lineage differs');process.stdout.write(r.verifier_machine_id)")"
          restore_verifier_machine_id_sha="$(printf '%s' "$restore_verifier_machine_id" | sha256sum | awk '{print $1}')"
          target_verifier_machine_id_sha=''
          if [[ "$ROLLBACK_MODE" == 'exact-image' ]]; then
            target_verifier_machine_id="$(PHASE="$output/rollback-phase-03-TARGET_VERIFIED.json" node --input-type=module -e \
              "import fs from'node:fs';const r=JSON.parse(fs.readFileSync(process.env.PHASE,'utf8'));if(!/^[0-9a-f]{14,32}$/i.test(r.verifier_machine_id||''))throw Error('target verifier lineage differs');process.stdout.write(r.verifier_machine_id)")"
            target_verifier_machine_id_sha="$(printf '%s' "$target_verifier_machine_id" | sha256sum | awk '{print $1}')"
          fi
          snapshot_sentinel="$(printf '%s' "$FAILED_APPLICATION_SHA|$CAPABILITY_INTENT_ID|rollback-snapshot" | sha256sum | awk '{print $1}')"
          snapshot_sentinel_sha="$(printf '%s' "$snapshot_sentinel" | sha256sum | awk '{print $1}')"
          RECEIPT="$receipt_dir/physio-production-rollback.json" MODE="$ROLLBACK_MODE" FAILED_SHA="$FAILED_APPLICATION_SHA" \
          CURRENT_IMAGE="$CURRENT_IMMUTABLE_IMAGE" RESULT_SHA="$result_sha" RESULT_IMAGE="$result_image" \
          VOLUME="$EXPECTED_VOLUME_ID" MACHINE="$EXPECTED_MACHINE_ID" SNAPSHOT="$rollback_snapshot_id" \
          SERVICE_STATE="$expected_state" MANIFEST_SHA="$manifest_sha" SNAPSHOT_PHASE_SHA="$snapshot_phase_sha" \
          RESTORE_PHASE_SHA="$restore_phase_sha" TARGET_PHASE_SHA="$target_phase_sha" POST_PHASE_SHA="$post_phase_sha" \
          CLEANUP_PHASE_SHA="$cleanup_phase_sha" \
          SOURCE_INITIAL_STATE="$source_machine_initial_state" SNAPSHOT_SENTINEL_SHA="$snapshot_sentinel_sha" \
          RESTORE_VERIFIER_MACHINE_SHA="$restore_verifier_machine_id_sha" TARGET_VERIFIER_MACHINE_SHA="$target_verifier_machine_id_sha" \
          POST_RESTART_PROOF_SHA="$post_phase_sha" \
          FINAL_PHASE_SHA="$final_phase_sha" INTENT="$CAPABILITY_INTENT_ID" AUTHORITY="$AUTHORITY_REFERENCE" \
          node --input-type=module <<'NODE'
          import fs from'node:fs';const exactImageMode=process.env.MODE==='exact-image';
          const row={contract_version: 'assesssuite-physio-rollback/3.0.0', result: 'PASS',mode:process.env.MODE,
            application:'assesssuite-physio-production',failed_application_sha:process.env.FAILED_SHA,
            failed_image:process.env.CURRENT_IMAGE,resulting_release_sha:process.env.RESULT_SHA,
            resulting_image:process.env.RESULT_IMAGE,service_state:process.env.SERVICE_STATE,
            volume_id:process.env.VOLUME,machine_id:process.env.MACHINE,recovery_snapshot_id:process.env.SNAPSHOT,
            source_machine_initial_state:process.env.SOURCE_INITIAL_STATE,source_http_identity_verified:false,provider_identity_admission_verified:true,
            production_machine_stopped_before_snapshot:true,presnapshot_manifest_contract_version:'assesssuite-physio-presnapshot-manifest/1.0.0',
            presnapshot_manifest_receipt_sha256:process.env.SNAPSHOT_PHASE_SHA,
            logical_data_manifest_contract_version:'assesssuite-physio-logical-data-manifest/1.0.0',
            logical_data_manifest_sha256:`sha256:${process.env.MANIFEST_SHA}`,logical_data_table_count:36,
            snapshot_sentinel_sha256:process.env.SNAPSHOT_SENTINEL_SHA,sqlite_schema_contract_version:'assesssuite-physio-sqlite-schema/1.0.0',
            sqlite_schema_digest:'phase-ledger-bound',sqlite_schema_object_count:106,sqlite_schema_table_count:36,sqlite_user_version:0,
            restore_clone_created:true,restore_clone_mounted:true,restore_database_verified:true,
            restore_verifier_machine_destroyed:true,restore_clone_destroyed:true,
            restore_volume_cleanup_phase_sha256:process.env.CLEANUP_PHASE_SHA,
            primary_topology_and_recovery_reserve_verified_before_rollback:true,
            restore_verification_contract_version:'assesssuite-physio-restore-verification/2.0.0',
            restore_verification_receipt_sha256:process.env.RESTORE_PHASE_SHA,
            restore_verifier_machine_id_sha256:process.env.RESTORE_VERIFIER_MACHINE_SHA,
            rollback_target_clone_preflight_verified:exactImageMode,
            rollback_target_verification_receipt_sha256:exactImageMode?process.env.TARGET_PHASE_SHA:null,
            rollback_target_verifier_machine_id_sha256:exactImageMode?process.env.TARGET_VERIFIER_MACHINE_SHA:null,
            recovery_reserve_seconds:900,failed_rollback_recovery_path_armed:exactImageMode,
            post_restart_runtime_verified: exactImageMode,post_restart_identity_verified: exactImageMode,
            post_restart_topology_verified:true,post_restart_proof_contract_version:exactImageMode?'assesssuite-physio-rollback-post-restart/2.0.0':null,
            post_restart_proof_sha256: exactImageMode ? process.env.POST_RESTART_PROOF_SHA : null,
            durable_post_restart_evidence_preserved:true,phase_ledger_terminal_sha256:process.env.FINAL_PHASE_SHA,
            data_action: 'preserved-isolated-volume',fly_hostname_is_verification_route:true,
            dns_action: 'separate-capability-not-performed',capability_intent_id:process.env.INTENT,
            authority_reference:process.env.AUTHORITY,completed_at:new Date().toISOString()};
          fs.writeFileSync(process.env.RECEIPT,JSON.stringify(row,null,2)+'\n',{flag:'wx',mode:0o600});
          NODE
          receipt_files+=(physio-production-rollback.json rollback-phase-ledger-admission.json)
          (cd "$receipt_dir" && sha256sum "${receipt_files[@]}" | LC_ALL=C sort -k2,2 >SHA256SUMS && sha256sum --check --strict SHA256SUMS)

      - if: ${{ always() && steps.completed_effect.outcome != 'skipped' }}
        name: Upload rollback COMPLETED terminal effect and final receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physio-rollback-terminal-${{ inputs.failed_application_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rollback-phase-07-result
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload rollback final human-readable evidence
        if: ${{ success() && steps.completed_effect.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physio-rollback-final-evidence-${{ inputs.failed_application_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rollback-final-receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Seal and upload rollback failure diagnostics
        if: ${{ failure() && steps.restore_volume_cleanup_effect.outcome != 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          failure_dir="$RUNNER_TEMP/rollback-failure-receipt"
          install -d -m 0700 "$failure_dir"
          latest_readback=''
          for candidate in "$RUNNER_TEMP"/rollback-phase-??-result/rollback-provider-readback.json; do
            if [[ -f "$candidate" && ! -L "$candidate" ]]; then latest_readback="$candidate"; fi
          done
          provider_readback_complete=false
          service_stopped=false
          if [[ -n "$latest_readback" ]]; then
            provider_readback_complete=true
            service_stopped="$(READBACK="$latest_readback" node --input-type=module -e \
              "import fs from'node:fs';const r=JSON.parse(fs.readFileSync(process.env.READBACK,'utf8'));process.stdout.write(r.observed_machine_state==='stopped'?'true':'false')")"
            install -m 0600 "$latest_readback" "$failure_dir/rollback-failure-provider-readback.json"
          fi
          recovery_status=NOT_ATTEMPTED
          recovery_proof_sha256=''
          if [[ -f "$RUNNER_TEMP/rollback-live-mutation-phase/physio-rollback-recovery.json" ]]; then
            recovery_status=RECOVERED
            install -m 0600 "$RUNNER_TEMP/rollback-live-mutation-phase/physio-rollback-recovery.json" \
              "$failure_dir/physio-rollback-recovery.json"
            recovery_proof_sha256="$(sha256sum "$failure_dir/physio-rollback-recovery.json" | awk '{print $1}')"
          elif [[ -f "$RUNNER_TEMP/rollback-live-mutation-phase/recovery-attempted" ]]; then
            recovery_status=RECOVERY_FAILED
          fi
          RECEIPT="$failure_dir/physio-production-rollback.json" MODE="$ROLLBACK_MODE" FAILED_SHA="$FAILED_APPLICATION_SHA" \
          CURRENT_IMAGE="$CURRENT_IMMUTABLE_IMAGE" VOLUME="$EXPECTED_VOLUME_ID" \
          SERVICE_STOPPED="$service_stopped" PROVIDER_COMPLETE="$provider_readback_complete" \
          RECOVERY_STATUS="$recovery_status" RECOVERY_PROOF_SHA="$recovery_proof_sha256" node --input-type=module <<'NODE'
          import fs from'node:fs';const serviceStopped=process.env.SERVICE_STOPPED==='true';
          const providerReadbackComplete=process.env.PROVIDER_COMPLETE==='true';
          const row={contract_version: 'assesssuite-physio-rollback/3.0.0', result: 'FAILED',mode:process.env.MODE,
            failed_application_sha:process.env.FAILED_SHA,automatic_current_image_recovery_attempted:process.env.RECOVERY_STATUS!=='NOT_ATTEMPTED',
            recovery_status:process.env.RECOVERY_STATUS,recovery_proof_sha256:process.env.RECOVERY_PROOF_SHA||null,
            current_image:process.env.CURRENT_IMAGE,original_volume_id:process.env.VOLUME,
            service_stopped: serviceStopped, provider_readback_complete: providerReadbackComplete,
            failed_at:new Date().toISOString()};fs.writeFileSync(process.env.RECEIPT,JSON.stringify(row,null,2)+'\n',{flag:'wx',mode:0o600});
          NODE
          mapfile -t failure_receipts < <(find "$failure_dir" -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort)
          (cd "$failure_dir" && sha256sum "${failure_receipts[@]}" | LC_ALL=C sort -k2,2 >SHA256SUMS)

      - name: Upload rollback failure receipt
        if: ${{ failure() && steps.restore_volume_cleanup_effect.outcome != 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physio-rollback-failure-${{ inputs.failed_application_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rollback-failure-receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: ${{ always() }}
        name: Upload guard for rollback terminal or unresolved effect receipt
        shell: bash
        env:
          DURABLE_STARTED_ARTIFACT_ID: ${{ needs.rollback_start.outputs.started_artifact_id }}
          DURABLE_STARTED_ARTIFACT_DIGEST: ${{ needs.rollback_start.outputs.started_artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$DURABLE_STARTED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DURABLE_STARTED_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Select exact append-only rollback transition for automatic continuation
        id: transition_artifact
        if: ${{ always() }}
        shell: bash
        env:
          POST_ARTIFACT_ID: ${{ steps.upload_post_restart.outputs.artifact-id }}
          POST_ARTIFACT_DIGEST: ${{ steps.upload_post_restart.outputs.artifact-digest }}
          CLEANUP_ARTIFACT_ID: ${{ steps.upload_restore_volume_cleanup.outputs.artifact-id }}
          CLEANUP_ARTIFACT_DIGEST: ${{ steps.upload_restore_volume_cleanup.outputs.artifact-digest }}
          COMPLETED_OUTCOME: ${{ steps.completed_effect.outcome }}
        run: |
          set -euo pipefail
          [[ -z "${FLY_API_TOKEN:-}" ]]
          if [[ "$COMPLETED_OUTCOME" == 'success' ]]; then
            printf '%s\n' 'continuation_required=false' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          packet="$RUNNER_TEMP/rollback-phase-05-result"
          artifact_id="$POST_ARTIFACT_ID"; artifact_digest="$POST_ARTIFACT_DIGEST"
          if [[ -d "$RUNNER_TEMP/rollback-phase-06-result" && -n "$CLEANUP_ARTIFACT_ID" ]]; then
            packet="$RUNNER_TEMP/rollback-phase-06-result"
            artifact_id="$CLEANUP_ARTIFACT_ID"; artifact_digest="$CLEANUP_ARTIFACT_DIGEST"
          fi
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ && "$artifact_digest" =~ ^[0-9a-f]{64}$ ]]
          receipt_sha="$(sha256sum "$packet/rollback-effect-reconciliation.json" | awk '{print $1}')"
          phase="$(PHASE="$packet/rollback-effect-reconciliation.json" node --input-type=module -e \
            "import fs from'node:fs';const r=JSON.parse(fs.readFileSync(process.env.PHASE,'utf8'));if(!['POST_RESTART_VERIFIED','RESTORE_VOLUME_CLEANUP'].includes(r.phase))throw Error('continuation phase differs');if(r.phase==='RESTORE_VOLUME_CLEANUP'){const p=JSON.parse(fs.readFileSync(process.env.PHASE.replace('rollback-effect-reconciliation.json','rollback-provider-readback.json'),'utf8'));if(r.result!=='STARTED_UNRESOLVED'||!Array.isArray(p.restore_volume_cleanup_receipt_sha256s)||p.restore_volume_cleanup_receipt_sha256s.length>=3)throw Error('bounded cleanup continuation exhausted');}process.stdout.write(r.phase)")"
          {
            echo 'continuation_required=true'
            echo "artifact_id=$artifact_id"
            echo "artifact_digest=sha256:$artifact_digest"
            echo "receipt_sha256=$receipt_sha"
            echo "phase=$phase"
          } >>"$GITHUB_OUTPUT"

      - name: Emit rollback result
        if: ${{ success() && steps.completed_effect.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Physio production rollback'
            echo '- Result: PASS'
            echo "- Mode: $ROLLBACK_MODE"
            echo "- Service state: $(if [[ "$ROLLBACK_MODE" == 'exact-image' ]]; then echo started; else echo stopped; fi)"
            echo "- Machine: $EXPECTED_MACHINE_ID"
            echo '- Every provider phase is bound to an uploaded append-only receipt'
            echo '- Isolated data volume preserved; DNS is a separately controlled action'
          } >>"$GITHUB_STEP_SUMMARY"

  rollback_continue:
    name: Dispatch exact provider-free rollback continuation
    needs: [rollback_start, rollback_phases]
    if: ${{ always() && needs.rollback_phases.outputs.continuation_required == 'true' }}
    permissions:
      contents: read
      actions: write
