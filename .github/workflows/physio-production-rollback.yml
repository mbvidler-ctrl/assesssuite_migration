          VOLUMES="$work/volumes-post-restart.json" PRIMARY="$EXPECTED_VOLUME_ID" RECOVERY="$restore_volume_id" \
          OUT="$work/volumes-post-restart-primary.json" node --input-type=module <<'NODE'
          import fs from'node:fs';const p=JSON.parse(fs.readFileSync(process.env.VOLUMES,'utf8'));const rows=Array.isArray(p)?p:p.volumes||p.data||[];
          const primary=rows.find((r)=>r?.id===process.env.PRIMARY),recovery=rows.find((r)=>r?.id===process.env.RECOVERY);
          if(!primary||rows.some((r)=>![process.env.PRIMARY,process.env.RECOVERY].includes(r?.id))||
            !recovery||recovery.attached_machine_id!==null||rows.length!==2)
            throw Error('post-restart reserve topology differs');
          fs.writeFileSync(process.env.OUT,JSON.stringify([primary])+'\n');
          NODE
          env -u FLY_API_TOKEN node scripts/physio-release-contract.mjs inspect-topology \
