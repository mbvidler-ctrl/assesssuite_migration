          import fs from'node:fs';fs.writeFileSync(process.env.RAW,JSON.stringify({response_received:false,http_status:null,
            response_body_sha256:null,response_headers_sha256:null,error_sha256:null},null,2)+'\n',{flag:'wx',mode:0o600});
          NODE
          fi
          cleanup_applied=0
