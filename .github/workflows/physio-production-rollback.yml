            if [[ "$observed_state" == 'started' ]]; then
              provider_calls=1
              timeout --signal=TERM --kill-after=10s 120s fly machine stop "$EXPECTED_MACHINE_ID" \
                --app "$app" --wait-timeout 90s
            fi
            result_image="$CURRENT_IMMUTABLE_IMAGE"
            result_state=stopped
          else
            [[ "$observed_state" == 'started' ]]
            prestate_source_image="$(PRESTATE="$LIVE_MUTATION_PRESTATE" node -e \
              "const r=require(process.env.PRESTATE);process.stdout.write(r.config.image)")"
            [[ "$prestate_source_image" == "$CURRENT_IMMUTABLE_IMAGE" || "$prestate_source_image" == "$ROLLBACK_IMMUTABLE_IMAGE" ]]
            transition_operation="$work/rollback-machine-config-transition-operation.json"
            set +e
            execute_config_transition "$LIVE_MUTATION_PRESTATE" "$ROLLBACK_TARGET_MACHINE_CONFIG" \
