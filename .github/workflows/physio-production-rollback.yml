          import fs from'node:fs';const response=await fetch(process.env.URL,{method:'GET',redirect:'error',
            signal:AbortSignal.timeout(60_000),headers:{Authorization:`Bearer ${process.env.FLY_API_TOKEN}`,Accept:'application/json'}});
          const text=await response.text();if(response.status!==200||Buffer.byteLength(text)>1_048_576)
