            RECOVERY="$work/physio-rollback-recovery.json" MACHINE="$recovery_machine_id" \
            IMAGE="$CURRENT_IMMUTABLE_IMAGE" SHA="$FAILED_APPLICATION_SHA" VOLUME="$EXPECTED_VOLUME_ID" \
            OPERATION="$recovery_operation" EXACT_MACHINE="$recovery_final_exact" CONFIG="$CURRENT_MACHINE_CONFIG" \
            node --input-type=module <<'NODE'
          import{createHash}from'node:crypto';import fs from'node:fs';const h=(file)=>createHash('sha256').update(fs.readFileSync(file)).digest('hex');fs.writeFileSync(process.env.RECOVERY,JSON.stringify({
            contract_version: 'assesssuite-physio-rollback-recovery/1.0.0', result: 'PASS',
            recovery_status:'RECOVERED',restored_current_image:process.env.IMAGE,
            restored_application_sha:process.env.SHA,replacement_machine_id:process.env.MACHINE,
            promoted_recovery_volume_id:process.env.VOLUME,runtime_readiness_verified:true,
            runtime_identity_verified:true,exact_topology_verified:true,
            machine_config_operation_receipt_sha256:h(process.env.OPERATION),
            final_exact_machine_readback_sha256:h(process.env.EXACT_MACHINE),
            restored_machine_config_sha256:h(process.env.CONFIG),verified_at:new Date().toISOString(),
