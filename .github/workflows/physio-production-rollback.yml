            RESULT_MACHINE_ID="$EXPECTED_MACHINE_ID" RESULT_VOLUME_ID="$EXPECTED_VOLUME_ID" \
            RESTORE_VOLUME_CLEANUP_RECEIPT="$cleanup_receipt" node "$RUNNER_TEMP/rollback-phase-helper.mjs" seal \
              --input "$input" --output "$output" --phase RESTORE_VOLUME_CLEANUP --result STARTED_UNRESOLVED \
              --provider-calls "$cleanup_provider_calls" --readback "$work/unresolved-readback.json"
            exit "$status"
          }
          trap seal_cleanup_unresolved EXIT

          fly machines list --app "$app" --json >"$work/machines-before.json"
          fly volumes list --app "$app" --json >"$work/volumes-before.json"
          VOLUMES="$work/volumes-before.json" PRIMARY="$EXPECTED_VOLUME_ID" RESTORE="$restore_volume_id" \
          RESUME_RESULT="$resume_result" PRIOR_CALLS="$prior_calls" OUT="$work/primary-before.json" node --input-type=module <<'NODE'
          import fs from'node:fs';const p=JSON.parse(fs.readFileSync(process.env.VOLUMES,'utf8'));const rows=Array.isArray(p)?p:p.volumes||p.data||[];
          if(rows.some((r)=>![process.env.PRIMARY,process.env.RESTORE].includes(r?.id)))throw Error('cleanup volume topology drift');
          const primary=rows.find((r)=>r?.id===process.env.PRIMARY),restore=rows.find((r)=>r?.id===process.env.RESTORE);
          if(!primary||rows.length<1||rows.length>2||(restore&&restore.attached_machine_id!==null))throw Error('cleanup volume binding differs');
          if(!restore&&(process.env.RESUME_RESULT!=='STARTED_UNRESOLVED'||process.env.PRIOR_CALLS!=='1'||rows.length!==1))
            throw Error('fresh cleanup cannot adopt an absent restore volume');
          fs.writeFileSync(process.env.OUT,JSON.stringify([primary])+'\n');
          NODE
          env -u FLY_API_TOKEN node scripts/physio-release-contract.mjs inspect-topology \
            --machines "$work/machines-before.json" --volumes "$work/primary-before.json" \
            --mode recovery-admission --volume-id "$EXPECTED_VOLUME_ID" --machine-id "$EXPECTED_MACHINE_ID" \
            --image "$result_image" | grep -F "\"machineState\":\"$expected_state\""
          restore_exists="$(VOLUMES="$work/volumes-before.json" RESTORE="$restore_volume_id" node --input-type=module -e \
            "import fs from'node:fs';const p=JSON.parse(fs.readFileSync(process.env.VOLUMES,'utf8'));const r=Array.isArray(p)?p:p.volumes||p.data||[];process.stdout.write(r.some(x=>x?.id===process.env.RESTORE)?'true':'false')")"
          disposition=APPLIED
          if [[ "$restore_exists" == 'true' ]]; then
            cleanup_provider_calls=1
            REQUEST_URL="https://api.machines.dev/v1/apps/$app/volumes/$restore_volume_id?force=false" \
            RAW="$work/mutation-raw.json" node --input-type=module <<'NODE'
          import{createHash}from'node:crypto';import fs from'node:fs';const h=(v)=>createHash('sha256').update(v).digest('hex');
          const row={response_received:false,http_status:null,response_body_sha256:null,response_headers_sha256:null,error_sha256:null};
          try{const response=await fetch(process.env.REQUEST_URL,{method:'DELETE',redirect:'error',signal:AbortSignal.timeout(90_000),
            headers:{Authorization:`Bearer ${process.env.FLY_API_TOKEN}`,Accept:'application/json'}});
            const body=await response.text();if(Buffer.byteLength(body)>1_048_576)throw Error('cleanup response exceeds bound');
            row.response_received=true;row.http_status=response.status;row.response_body_sha256=h(body);
            row.response_headers_sha256=h(JSON.stringify([...response.headers.entries()].sort()));
          }catch(error){row.error_sha256=h(String(error?.message||error));}
          fs.writeFileSync(process.env.RAW,JSON.stringify(row,null,2)+'\n',{flag:'wx',mode:0o600});
          NODE
          else
