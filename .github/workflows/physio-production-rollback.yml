          MACHINE="$work/machine-final-exact.json" IMAGE="$result_image" STATE="$result_state" \
            env -u FLY_API_TOKEN node --input-type=module <<'NODE'
          import fs from'node:fs';import{machineConfigSha256,validateMachineForConfigTransition}from'./scripts/physio-fly-machine-config-transition.mjs';
          const machine=JSON.parse(fs.readFileSync(process.env.MACHINE,'utf8'));
          const expected=JSON.parse(fs.readFileSync(process.env.EXPECTED_CONFIG,'utf8'));
