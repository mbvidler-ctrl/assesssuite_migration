            fly volumes list --app "$app" --json >"$work/volumes-unresolved.json" 2>/dev/null || printf '[]\n' >"$work/volumes-unresolved.json"
            fly volumes snapshots list "$EXPECTED_VOLUME_ID" --app "$app" --json >"$work/snapshots-unresolved.json" 2>/dev/null || printf '[]\n' >"$work/snapshots-unresolved.json"
            unresolved_identity="$(read_post_identity "$work/machines-unresolved.json" 2>/dev/null || true)"
            unresolved_image="${unresolved_identity%%|*}"; unresolved_state="${unresolved_identity#*|}"
            if [[ -z "$unresolved_identity" || "$unresolved_identity" != *'|'* ]]; then unresolved_image=''; unresolved_state=''; fi
            MACHINES_FILE="$work/machines-unresolved.json" VOLUMES_FILE="$work/volumes-unresolved.json" \
            SNAPSHOTS_FILE="$work/snapshots-unresolved.json" OBSERVED_CONFIG_SHA256="${expected_data_manifest_sha256#sha256:}" \
            OBSERVED_MACHINE_ID="$EXPECTED_MACHINE_ID" OBSERVED_MACHINE_STATE="$unresolved_state" OBSERVED_IMAGE="$unresolved_image" \
            OBSERVED_VOLUME_ID="$EXPECTED_VOLUME_ID" OBSERVED_RESTORE_VOLUME_ID="$restore_volume_id" \
            OBSERVED_SNAPSHOT_ID="$rollback_snapshot_id" node "$RUNNER_TEMP/rollback-phase-helper.mjs" readback \
