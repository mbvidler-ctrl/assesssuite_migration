            OBSERVED_SNAPSHOT_ID="$rollback_snapshot_id" ROLLBACK_PACKET_INPUT="$input" \
            RESTORE_VOLUME_CLEANUP_RECEIPT="$cleanup_receipt" node "$RUNNER_TEMP/rollback-phase-helper.mjs" readback \
