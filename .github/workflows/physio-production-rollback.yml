            MACHINE_CONFIG_RECOVERY_RECEIPT="$([[ -f "$work/recovery-machine-config-operation.json" ]] && printf '%s' "$work/recovery-machine-config-operation.json" || true)" \
            OBSERVED_MACHINE_ID="$EXPECTED_MACHINE_ID" OBSERVED_MACHINE_STATE="$final_state" OBSERVED_IMAGE="$final_image" \
            OBSERVED_VOLUME_ID="$EXPECTED_VOLUME_ID" OBSERVED_RESTORE_VOLUME_ID="$restore_volume_id" \
            OBSERVED_SNAPSHOT_ID="$rollback_snapshot_id" node "$RUNNER_TEMP/rollback-phase-helper.mjs" readback \
              --phase LIVE_MUTATION_STARTED --result STARTED_UNRESOLVED --output "$work/unresolved-readback.json"
            RESULT_MACHINE_ID="$EXPECTED_MACHINE_ID" RESULT_VOLUME_ID="$EXPECTED_VOLUME_ID" \
            MACHINE_CONFIG_OPERATION_RECEIPT="${transition_operation:-}" \
            MACHINE_CONFIG_RECOVERY_PRESTATE="$([[ -f "$work/recovery-machine-prestate.json" ]] && printf '%s' "$work/recovery-machine-prestate.json" || true)" \
            MACHINE_CONFIG_RECOVERY_RECEIPT="$([[ -f "$work/recovery-machine-config-operation.json" ]] && printf '%s' "$work/recovery-machine-config-operation.json" || true)" \
            node "$RUNNER_TEMP/rollback-phase-helper.mjs" seal --input "$input" --output "$output" \
              --phase LIVE_MUTATION_STARTED --result STARTED_UNRESOLVED --provider-calls "${provider_calls:-0}" \
              --readback "$work/unresolved-readback.json"
            exit "$status"
          }
          trap seal_live_unresolved EXIT

          fly machines list --app "$app" --json >"$work/machines-before.json"
          fly volumes list --app "$app" --json >"$work/volumes-before.json"
          identity="$(read_live_identity "$work/machines-before.json")"
          observed_image="${identity%%|*}"; observed_state="${identity#*|}"
          elapsed_seconds=$SECONDS
          workflow_budget_seconds=5400
          recovery_reserved_seconds=900
          remaining_seconds=$((workflow_budget_seconds - elapsed_seconds))
          [[ "$remaining_seconds" -ge "$recovery_reserved_seconds" ]]
