          RESULT_MACHINE_ID="$EXPECTED_MACHINE_ID" RESULT_VOLUME_ID="$EXPECTED_VOLUME_ID" \
          MACHINE_CONFIG_OPERATION_RECEIPT="${transition_operation:-}" \
          node "$RUNNER_TEMP/rollback-phase-helper.mjs" seal --input "$input" --output "$output" \
            --phase LIVE_MUTATION_STARTED --result COMPLETED --provider-calls "$provider_calls" --readback "$work/readback.json"
