                --sha "$ROLLBACK_RELEASE_SHA"; then post_restart_ready=1; break; fi
              sleep 5
            done
            [[ "$post_restart_ready" == '1' ]]
            post_restart_database="$work/physio-rollback-post-restart-database.json"
            fly machine exec "$result_machine_id" \
              "env -u ADMIN_PASSWORD -u OPENAI_API_KEY -u RESEND_API_KEY -u SENTRY_DSN -u STRIPE_SECRET_KEY -u STRIPE_WEBHOOK_SECRET -u STRIPE_PRICE_ID_MONTHLY -u STRIPE_PRICE_ID_ANNUAL -u OPENAI_CHAT_TEST_BASE_URL -u OPENAI_CHAT_TEST_TIMEOUT_MS -u DOCUMENT_EXTRACTION_TEST_BASE_URL -u DOCUMENT_EXTRACTION_PROVIDER_PROBE_ACK -u RUN_DOCUMENT_EXTRACTION_PROVIDER_PROBE -u RUN_PHYSIO_EXACT_IMAGE_CANARY LLM_REQUIRED=0 GENERAL_CLINICAL_LLM_ENABLED=0 TRANSCRIPTION_ENABLED=0 DOCUMENT_EXTRACTION_ENABLED=0 DOCUMENT_EXTRACTION_UNDER_13_ENABLED=0 DOCUMENT_EXTRACTION_PROVIDER_PROBE=0 OUTBOUND_EMAIL_ENABLED=0 OUTBOUND_SMS_ENABLED=0 PAYMENTS_ENABLED=0 SELFTEST=0 PARITY_ASSURANCE_MODE=0 ALLOW_PAID_PROVIDER_PROBE=0 node /app/scripts/physio-restore-verify.mjs verify --database /app/server/data/physio.db --application-sha '$ROLLBACK_RELEASE_SHA' --immutable-image '$ROLLBACK_IMMUTABLE_IMAGE' --volume-id '$EXPECTED_VOLUME_ID' --snapshot-id '$rollback_snapshot_id' --machine-id '$result_machine_id' --snapshot-sentinel '$snapshot_sentinel' --expected-data-manifest-sha256 '$expected_data_manifest_sha256'" \
              --app "$app" --timeout 180 >"$post_restart_database"
            POST_DB="$post_restart_database" MANIFEST="$expected_data_manifest_sha256" node --input-type=module <<'NODE'
          import fs from'node:fs';const r=JSON.parse(fs.readFileSync(process.env.POST_DB,'utf8'));
          if(r.contract_version!=='assesssuite-physio-restore-verification/2.0.0'||r.result!=='PASS'||
            r.data_manifest_sha256!==process.env.MANIFEST||r.database_read_only!==true||r.provider_switches_disabled!==true||
            r.provider_credentials_absent!==true||r.test_provider_settings_absent!==true)throw Error('post-restart database persistence differs');
