            fly volumes list --app "$app" --json >"$work/volumes-after.json"
            if VOLUMES="$work/volumes-after.json" RESTORE="$restore_volume_id" node --input-type=module <<'NODE'
          import fs from'node:fs';const p=JSON.parse(fs.readFileSync(process.env.VOLUMES,'utf8'));const rows=Array.isArray(p)?p:p.volumes||p.data||[];
          if(rows.some((r)=>r?.id===process.env.RESTORE))process.exit(1);
          NODE
            then cleanup_applied=1; break; fi
            sleep 3
          done
          if [[ ! -f "$cleanup_receipt" ]]; then
