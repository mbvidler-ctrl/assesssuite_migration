            capture_exact_machine "$recovery_final_exact"
            MACHINE="$recovery_final_exact" EXPECTED_CONFIG="$CURRENT_MACHINE_CONFIG" \
              env -u FLY_API_TOKEN node --input-type=module <<'NODE'
          import fs from'node:fs';import{machineConfigSha256,validateMachineForConfigTransition}from'./scripts/physio-fly-machine-config-transition.mjs';
          const machine=JSON.parse(fs.readFileSync(process.env.MACHINE,'utf8'));
          const expected=JSON.parse(fs.readFileSync(process.env.EXPECTED_CONFIG,'utf8'));
          validateMachineForConfigTransition(machine,{machineId:process.env.EXPECTED_MACHINE_ID,
            immutableImage:process.env.CURRENT_IMMUTABLE_IMAGE,expectedVolumeId:process.env.EXPECTED_VOLUME_ID,
            expectedState:'started'});
          if(machineConfigSha256(machine.config)!==machineConfigSha256(expected))
            throw Error('rollback recovery final exact config differs');
