          NODE
          post_restart_proof="$work/physio-rollback-post-restart-proof.json"
          PROOF="$post_restart_proof" MODE="$ROLLBACK_MODE" FAILED_SHA="$FAILED_APPLICATION_SHA" RESULT_SHA="$result_sha" \
            IMAGE="$result_image" VOLUME="$EXPECTED_VOLUME_ID" MACHINE="$result_machine_id" \
            MACHINES="$work/machines-post-restart.json" VOLUMES="$work/volumes-post-restart.json" \
            EXACT_MACHINE="$final_exact_machine" EXPECTED_CONFIG="$EXPECTED_CONFIG" \
          LIVE="$work/live-post-restart.json" READY="$work/ready-post-restart.json" \
          VERSION="$work/version-post-restart.json" CAPABILITIES="$work/capabilities-post-restart.json" node --input-type=module <<'NODE'
          import{createHash}from'node:crypto';import fs from'node:fs';const h=(f)=>f&&fs.existsSync(f)?createHash('sha256').update(fs.readFileSync(f)).digest('hex'):null;
          const row={contract_version: 'assesssuite-physio-rollback-post-restart/2.0.0', result: 'PASS',application:'assesssuite-physio-production',
            mode:process.env.MODE,previous_failed_application_sha:process.env.FAILED_SHA,resulting_release_sha:process.env.RESULT_SHA,
            resulting_image:process.env.IMAGE,volume_id:process.env.VOLUME,machine_id:process.env.MACHINE,
            runtime_live_sha256:h(process.env.LIVE),runtime_ready_sha256:h(process.env.READY),runtime_version_sha256:h(process.env.VERSION),
            runtime_capabilities_sha256:h(process.env.CAPABILITIES),machines_readback_sha256:h(process.env.MACHINES),
            volumes_readback_sha256:h(process.env.VOLUMES),exact_machine_readback_sha256:h(process.env.EXACT_MACHINE),
            expected_machine_config_sha256:h(process.env.EXPECTED_CONFIG),runtime_readiness_verified:process.env.MODE==='exact-image',
            runtime_identity_verified:process.env.MODE==='exact-image',topology_verified:true,durable_raw_evidence_preserved:true,
            verified_at:new Date().toISOString()};fs.writeFileSync(process.env.PROOF,JSON.stringify(row,null,2)+'\n',{flag:'wx',mode:0o600});
          NODE
          post_restart_proof_sha256="$(sha256sum "$post_restart_proof" | awk '{print $1}')"
          fly volumes snapshots list "$EXPECTED_VOLUME_ID" --app "$app" --json >"$work/snapshots-final.json"
          MACHINES_FILE="$work/machines-post-restart.json" VOLUMES_FILE="$work/volumes-post-restart.json" \
          SNAPSHOTS_FILE="$work/snapshots-final.json" OBSERVED_CONFIG_SHA256="${expected_data_manifest_sha256#sha256:}" \
          OBSERVED_MACHINE_ID="$EXPECTED_MACHINE_ID" OBSERVED_MACHINE_STATE="$expected_state" OBSERVED_IMAGE="$result_image" \
          OBSERVED_VOLUME_ID="$EXPECTED_VOLUME_ID" OBSERVED_RESTORE_VOLUME_ID="$restore_volume_id" \
          OBSERVED_SNAPSHOT_ID="$rollback_snapshot_id" node "$RUNNER_TEMP/rollback-phase-helper.mjs" readback \
            --phase POST_RESTART_VERIFIED --result PASS --output "$work/readback.json"
          RESULT_MACHINE_ID="$EXPECTED_MACHINE_ID" RESULT_VOLUME_ID="$EXPECTED_VOLUME_ID" \
          node "$RUNNER_TEMP/rollback-phase-helper.mjs" seal --input "$input" --output "$output" \
            --phase POST_RESTART_VERIFIED --result COMPLETED --provider-calls 0 --readback "$work/readback.json"
          trap - EXIT

      - name: Upload rollback POST_RESTART_VERIFIED receipt before terminal finalization
        id: upload_post_restart
        if: ${{ always() && steps.post_restart_effect.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physio-rollback-phase-${{ inputs.failed_application_sha }}-POST-RESTART-VERIFIED-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rollback-phase-05-result
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Prepare rollback RESTORE_VOLUME_CLEANUP phase intent
        id: prepare_restore_volume_cleanup
        if: ${{ needs.rollback_start.outputs.resume_phase == 'POST_RESTART_VERIFIED' || needs.rollback_start.outputs.resume_phase == 'RESTORE_VOLUME_CLEANUP' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "${FLY_API_TOKEN:-}" ]]
          node "$RUNNER_TEMP/rollback-phase-helper.mjs" advance \
            --input "$RUNNER_TEMP/rollback-phase-05-result" \
            --output "$RUNNER_TEMP/rollback-phase-06-started" --phase RESTORE_VOLUME_CLEANUP

      - name: Upload rollback RESTORE_VOLUME_CLEANUP STARTED effect before provider mutation
        if: ${{ always() && steps.prepare_restore_volume_cleanup.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physio-rollback-phase-${{ inputs.failed_application_sha }}-RESTORE-VOLUME-CLEANUP-started-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rollback-phase-06-started
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Execute isolated rollback RESTORE_VOLUME_CLEANUP transition
        id: restore_volume_cleanup_effect
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          EXECUTE_PHASE: ${{ steps.prepare_restore_volume_cleanup.outputs.execute }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          input="$RUNNER_TEMP/rollback-phase-06-started"
          output="$RUNNER_TEMP/rollback-phase-06-result"
          if [[ "$EXECUTE_PHASE" != 'true' ]]; then cp -R "$input" "$output"; exit 0; fi
          app="$PHYSIO_FLY_APP"
          work="$RUNNER_TEMP/rollback-restore-volume-cleanup-phase"
          install -d -m 0700 "$work"
          cleanup_receipt="$work/rollback-restore-volume-cleanup-operation.json"
          post="$input/rollback-readback-05-POST_RESTART_VERIFIED.json"
          rollback_snapshot_id="$(POST="$post" node --input-type=module -e \
            "import fs from'node:fs';const r=JSON.parse(fs.readFileSync(process.env.POST,'utf8'));process.stdout.write(r.observed_snapshot_id||'')")"
          restore_volume_id="$(POST="$post" node --input-type=module -e \
            "import fs from'node:fs';const r=JSON.parse(fs.readFileSync(process.env.POST,'utf8'));process.stdout.write(r.observed_restore_volume_id||'')")"
          manifest_sha="$(POST="$post" node --input-type=module -e \
            "import fs from'node:fs';const r=JSON.parse(fs.readFileSync(process.env.POST,'utf8'));process.stdout.write(r.observed_config_sha256||'')")"
          [[ "$rollback_snapshot_id" =~ ^[A-Za-z0-9_-]{6,160}$ && "$restore_volume_id" =~ ^vol_[A-Za-z0-9]+$ ]]
          result_image="$CURRENT_IMMUTABLE_IMAGE"; expected_state=stopped
          if [[ "$ROLLBACK_MODE" == 'exact-image' ]]; then result_image="$ROLLBACK_IMMUTABLE_IMAGE"; expected_state=started; fi
          resume_result="$(PHASE="$input/rollback-effect-reconciliation.json" node --input-type=module -e \
            "import fs from'node:fs';process.stdout.write(JSON.parse(fs.readFileSync(process.env.PHASE,'utf8')).result)")"
          prior_calls="$(PHASE="$input/rollback-effect-reconciliation.json" node --input-type=module -e \
            "import fs from'node:fs';const n=JSON.parse(fs.readFileSync(process.env.PHASE,'utf8')).provider_calls_executed;if(![0,1].includes(n))throw Error('cleanup prior calls differ');process.stdout.write(String(n))")"
          cleanup_provider_calls="$prior_calls"

          write_cleanup_receipt() {
            local disposition="$1" calls="$2" response_received="$3" status="$4" body_sha="$5" headers_sha="$6" error_sha="$7" post_volumes="$8"
            RECEIPT="$cleanup_receipt" DISPOSITION="$disposition" CALLS="$calls" RESPONSE_RECEIVED="$response_received" \
            HTTP_STATUS="$status" BODY_SHA="$body_sha" HEADERS_SHA="$headers_sha" ERROR_SHA="$error_sha" \
            RESTORE_VOLUME_ID="$restore_volume_id" PRE_VOLUMES="$work/volumes-before.json" POST_VOLUMES="$post_volumes" \
            node --input-type=module <<'NODE'
          import{createHash}from'node:crypto';import fs from'node:fs';const nullable=(value)=>value===''?null:value;
          const hash=(file)=>file&&fs.existsSync(file)?createHash('sha256').update(fs.readFileSync(file)).digest('hex'):null;
          const payload=process.env.POST_VOLUMES&&fs.existsSync(process.env.POST_VOLUMES)?JSON.parse(fs.readFileSync(process.env.POST_VOLUMES,'utf8')):[];
          const rows=Array.isArray(payload)?payload:payload.volumes||payload.data||[];
          const row={contract_version:'assesssuite-physio-rollback-volume-cleanup/1.0.0',
            application:'assesssuite-physio-production',disposition:process.env.DISPOSITION,
            restore_volume_id:process.env.RESTORE_VOLUME_ID,request_method:'DELETE',
            request_url:`https://api.machines.dev/v1/apps/assesssuite-physio-production/volumes/${process.env.RESTORE_VOLUME_ID}?force=false`,
            force:false,provider_mutation_calls_attempted:Number(process.env.CALLS),
            response_received:process.env.RESPONSE_RECEIVED==='true',
            http_status:process.env.HTTP_STATUS===''?null:Number(process.env.HTTP_STATUS),
            pre_volumes_sha256:hash(process.env.PRE_VOLUMES),post_volumes_sha256:hash(process.env.POST_VOLUMES),
            restore_volume_absent:!rows.some((item)=>item?.id===process.env.RESTORE_VOLUME_ID),
            response_body_sha256:nullable(process.env.BODY_SHA),response_headers_sha256:nullable(process.env.HEADERS_SHA),
            error_sha256:nullable(process.env.ERROR_SHA),attempted_at:new Date().toISOString()};
          fs.writeFileSync(process.env.RECEIPT,JSON.stringify(row,null,2)+'\n',{flag:'wx',mode:0o600});
          NODE
          }
          seal_cleanup_unresolved() {
            local status=$?
            set +e
            fly machines list --app "$app" --json >"$work/machines-unresolved.json" 2>/dev/null || printf '[]\n' >"$work/machines-unresolved.json"
            fly volumes list --app "$app" --json >"$work/volumes-unresolved.json" 2>/dev/null || printf '[]\n' >"$work/volumes-unresolved.json"
            fly volumes snapshots list "$EXPECTED_VOLUME_ID" --app "$app" --json >"$work/snapshots-unresolved.json" 2>/dev/null || printf '[]\n' >"$work/snapshots-unresolved.json"
            if [[ ! -f "$cleanup_receipt" ]]; then
