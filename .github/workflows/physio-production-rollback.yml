      - name: Upload rollback LIVE_MUTATION_STARTED receipt before restart verification phase
        if: ${{ always() && steps.live_mutation_effect.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
