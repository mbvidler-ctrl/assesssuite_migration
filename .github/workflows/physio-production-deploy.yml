          const receipt={ contract_version: 'assesssuite-physio-deploy/3.0.0', result: 'PASS', application:'assesssuite-physio-production',
            application_sha:process.env.APPLICATION_SHA,immutable_image:process.env.IMMUTABLE_IMAGE,region:'syd',
            volume_id:process.env.EXPECTED_VOLUME_ID,volume_name:'assesssuite_physio_data',machine_id:process.env.MACHINE,
            machine_count: 1, volume_count: 1,predeploy_snapshot_id:process.env.PRE,postdeploy_snapshot_id:process.env.POST,
            publication_receipt_sha256:process.env.PUBLICATION_RECEIPT_SHA256,
            exact_image_canary_receipt_sha256:process.env.CANARY_RECEIPT_SHA256,
            production_bootstrap_receipt_sha256:process.env.PRODUCTION_BOOTSTRAP_RECEIPT_SHA256,
            stripe_webhook_archive_artifact_id:process.env.WEBHOOK_ID,
            stripe_webhook_archive_artifact_digest:process.env.WEBHOOK_DIGEST,
            stripe_webhook_archive_receipt_sha256:process.env.PHYSIO_STRIPE_WEBHOOK_ARCHIVE_RECEIPT_SHA256,
            stripe_webhook_receipt_sha256:process.env.PHYSIO_STRIPE_WEBHOOK_RECEIPT_SHA256,
            stripe_webhook_source_artifact_id:Number(process.env.PHYSIO_STRIPE_WEBHOOK_SOURCE_ARTIFACT_ID),
            stripe_webhook_source_artifact_digest:process.env.PHYSIO_STRIPE_WEBHOOK_SOURCE_ARTIFACT_DIGEST,
            stripe_webhook_ledger_commit_sha:process.env.PHYSIO_STRIPE_WEBHOOK_LEDGER_COMMIT_SHA,
            stripe_webhook_ledger_record_sha256:process.env.PHYSIO_STRIPE_WEBHOOK_LEDGER_RECORD_SHA256,
            stripe_webhook_ledger_packet_manifest_sha256:process.env.PHYSIO_STRIPE_WEBHOOK_LEDGER_PACKET_MANIFEST_SHA256,
            sentry_release_artifact_id:process.env.SENTRY_ID,sentry_release_artifact_digest:process.env.SENTRY_DIGEST,
            sentry_release_receipt_sha256:process.env.SENTRY_RELEASE_RECEIPT_SHA256,
            archive_sha256:process.env.PHYSIO_DEPLOY_ARCHIVE_SHA256,oci_archive_sha256:process.env.PHYSIO_DEPLOY_OCI_ARCHIVE_SHA256,
            oci_manifest_digest:process.env.PHYSIO_DEPLOY_OCI_MANIFEST_DIGEST,
            oci_descriptor_manifest_sha256:process.env.PHYSIO_DEPLOY_OCI_DESCRIPTOR_MANIFEST_SHA256,
            local_image_id:process.env.PHYSIO_DEPLOY_LOCAL_IMAGE_ID,
            upstream_artifact_metadata_sha256:process.env.PHYSIO_UPSTREAM_ARTIFACT_METADATA_SHA256,
            started_effect_receipt_sha256:process.env.STARTED_HASH,deploy_effect_reconciliation_sha256:process.env.EFFECT_HASH,
            deploy_phase_packet_manifest_sha256:process.env.PHASE_PACKET_MANIFEST_HASH,
            rollback_target_config_sha256:process.env.CONFIG_HASH,
            rollback_target_machine_config_sha256:process.env.MACHINE_CONFIG_HASH,
            capability_intent_id:process.env.CAPABILITY_INTENT_ID,authority_reference:process.env.AUTHORITY_REFERENCE,
            publication_capability_intent_id:process.env.PHYSIO_DEPLOY_PUBLICATION_CAPABILITY_INTENT_ID,
            publication_authority_reference:process.env.PHYSIO_DEPLOY_PUBLICATION_AUTHORITY_REFERENCE,
            canary_capability_intent_id:process.env.PHYSIO_DEPLOY_CANARY_CAPABILITY_INTENT_ID,
            canary_authority_reference:process.env.PHYSIO_DEPLOY_CANARY_AUTHORITY_REFERENCE,
            bootstrap_capability_intent_id:process.env.PHYSIO_DEPLOY_BOOTSTRAP_CAPABILITY_INTENT_ID,
            bootstrap_authority_reference:process.env.PHYSIO_DEPLOY_BOOTSTRAP_AUTHORITY_REFERENCE,
            stripe_webhook_capability_intent_id:process.env.PHYSIO_DEPLOY_STRIPE_WEBHOOK_CAPABILITY_INTENT_ID,
            stripe_webhook_authority_reference:process.env.PHYSIO_DEPLOY_STRIPE_WEBHOOK_AUTHORITY_REFERENCE,
            sentry_capability_intent_id:process.env.PHYSIO_DEPLOY_SENTRY_CAPABILITY_INTENT_ID,
            sentry_authority_reference:process.env.PHYSIO_DEPLOY_SENTRY_AUTHORITY_REFERENCE,
            catalogue_count: catalogueCount,catalogue_checksum: catalogueChecksum,
            persistence_restart_verified:true,required_capabilities_ready:true,fly_hostname_verified:'https://assesssuite-physio-production.fly.dev',
            custom_certificate_count:0,custom_dns_deferred_until_after_fly_hostname: true,completed_at:new Date().toISOString()};
          fs.writeFileSync(process.env.RECEIPT,JSON.stringify(receipt,null,2)+'\n',{flag:'wx',mode:0o600});
          NODE
          (cd "$result" && mapfile -d '' payloads < <(find . -type f ! -path './SHA256SUMS' -printf '%P\0' | sort -z) && \
            [[ "${#payloads[@]}" -gt 0 ]] && sha256sum -- "${payloads[@]}" >SHA256SUMS && \
            sha256sum --check --strict SHA256SUMS)
          echo "deploy_receipt_sha256=$(sha256sum "$result/physio-production-deploy.json"|awk '{print $1}')" >>"$GITHUB_OUTPUT"
          echo "machine_id=$machine_id" >>"$GITHUB_OUTPUT"
          echo "phase_receipt_sha256=$effect_hash" >>"$GITHUB_OUTPUT"

      - name: Seal exact deploy phase handoff for Sentry association or completed reuse
        id: phase_handoff
        if: ${{ steps.select_transition.outputs.action == 'finalize_deploy' || steps.deploy_resume.outputs.fly_completed == 'true' }}
        shell: bash
        env:
          SENTRY_RESULT_REUSE: ${{ steps.deploy_resume.outputs.sentry_result_reuse }}
        run: |
          set -euo pipefail
          packet="$RUNNER_TEMP/physio-deploy-current"
          result="$RUNNER_TEMP/physio-deploy-result"
          [[ -d "$packet" && -f "$packet/SHA256SUMS" && ! -L "$packet/SHA256SUMS" ]]
          if find "$packet" -type l -print -quit | grep -q .; then exit 1; fi
          (cd "$packet" && sha256sum --check --strict SHA256SUMS)
          [[ -d "$result" && -f "$result/SHA256SUMS" && ! -L "$result/SHA256SUMS" ]]
          if find "$result" -type l -print -quit | grep -q .; then exit 1; fi
          (cd "$result" && sha256sum --check --strict SHA256SUMS)
          envelope="$RUNNER_TEMP/physio-deploy-sentry-handoff"
          install -d -m 0700 "$envelope/phase" "$envelope/deploy-result"
          cp -a -- "$packet/." "$envelope/phase/"
          cp -a -- "$result/." "$envelope/deploy-result/"
          (cd "$envelope/phase" && sha256sum --check --strict SHA256SUMS)
          (cd "$envelope/deploy-result" && sha256sum --check --strict SHA256SUMS)
          sentry_result="$RUNNER_TEMP/physio-sentry-result"
          if [[ "$SENTRY_RESULT_REUSE" == true ]]; then
            [[ -d "$sentry_result" && -f "$sentry_result/SHA256SUMS" && ! -L "$sentry_result/SHA256SUMS" ]]
            if find "$sentry_result" -type l -print -quit | grep -q .; then exit 1; fi
            (cd "$sentry_result" && sha256sum --check --strict SHA256SUMS)
            install -d -m 0700 "$envelope/sentry-result"
            cp -a -- "$sentry_result/." "$envelope/sentry-result/"
            (cd "$envelope/sentry-result" && sha256sum --check --strict SHA256SUMS)
          else
            [[ ! -e "$sentry_result" && ! -e "$envelope/sentry-result" ]]
          fi
          EFFECT="$packet/deploy-effect-reconciliation.json" OUTPUT="$GITHUB_OUTPUT" \
          SENTRY_RESULT_REUSE="$SENTRY_RESULT_REUSE" \
            env -u FLY_API_TOKEN -u SENTRY_AUTH_TOKEN node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          const bytes = fs.readFileSync(process.env.EFFECT);
          const row = JSON.parse(bytes);
          if (!['DEPLOY_COMPLETED','SENTRY_ASSOCIATION_STARTED','COMPLETED'].includes(row.phase) ||
              !['STARTED','COMPLETED','STARTED_UNRESOLVED'].includes(row.result)) {
            throw new Error('deploy phase is not eligible for exact Sentry handoff');
          }
          if ((process.env.SENTRY_RESULT_REUSE === 'true') !== (row.phase === 'COMPLETED' && row.result === 'COMPLETED')) {
            throw new Error('Sentry result reuse does not match the completed deploy phase');
          }
          fs.appendFileSync(process.env.OUTPUT,
            `phase=${row.phase}\nresult=${row.result}\nphase_receipt_sha256=${createHash('sha256').update(bytes).digest('hex')}\n`);
          NODE

      - name: Upload deploy DEPLOY_COMPLETED or Sentry-resume phase packet before association
        id: upload_deploy_completed_phase
        if: ${{ steps.select_transition.outputs.action == 'finalize_deploy' || steps.deploy_resume.outputs.fly_completed == 'true' }}
        uses: ./.github/actions/upload-deploy-ledger-packet
        with:
          name: physio-deploy-phase-${{ inputs.application_sha }}-sentry-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/physio-deploy-sentry-handoff
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload exact deploy PASS and rollback target artifact
        id: upload_deploy_v2
        if: ${{ steps.select_transition.outputs.action == 'finalize_deploy' || steps.deploy_resume.outputs.deploy_result_reuse == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physio-deploy-${{ inputs.application_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/physio-deploy-result
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload exact completed deploy packet read-only on resume
        id: upload_deploy_completed_reuse
        if: ${{ steps.deploy_resume.outputs.resume_completed == 'true' }}
        uses: ./.github/actions/upload-deploy-ledger-packet
        with:
          name: physio-deploy-completed-reuse-${{ inputs.application_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/physio-deploy-sentry-handoff
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload exact Sentry completion read-only on completed resume
        id: upload_sentry_completed_reuse
        if: ${{ steps.deploy_resume.outputs.sentry_result_reuse == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physio-sentry-deployment-${{ inputs.application_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/physio-sentry-result
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Verify completed reuse performed zero provider calls
        if: ${{ steps.deploy_resume.outputs.resume_completed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "${FLY_API_TOKEN:-}" && -z "${SENTRY_AUTH_TOKEN:-}" ]]
          CALLS="$RUNNER_TEMP/physio-deploy-current/deploy-effect-reconciliation.json" node --input-type=module <<'NODE'
          import fs from'node:fs';const r=JSON.parse(fs.readFileSync(process.env.CALLS,'utf8'));
          if(r.phase!=='COMPLETED'||r.result!=='COMPLETED'||!Number.isSafeInteger(r.provider_calls_attempted)||
              !Number.isSafeInteger(r.provider_calls_confirmed)||r.provider_calls_confirmed>r.provider_calls_attempted)
            throw new Error('completed reuse provider counters differ');
          NODE
          exit 0

      - name: Select the one maximal transition artifact for isolated protected archival
        id: transition_artifact
        if: ${{ always() && steps.deploy_resume.outcome == 'success' }}
        shell: bash
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          RESUME_COMPLETED: ${{ steps.deploy_resume.outputs.resume_completed }}
          FLY_COMPLETED: ${{ steps.deploy_resume.outputs.fly_completed }}
        run: |
          set -euo pipefail
          STEPS_JSON="$STEPS_JSON" PACKET="$RUNNER_TEMP/physio-deploy-current/deploy-effect-reconciliation.json" \
            OUTPUT="$GITHUB_OUTPUT" RESUME_COMPLETED="$RESUME_COMPLETED" node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          const steps = JSON.parse(process.env.STEPS_JSON);
          const candidates = Object.entries(steps).flatMap(([id, step]) => {
            if (!(id.startsWith('upload_phase_') || id === 'upload_deploy_completed_phase' ||
                id === 'upload_deploy_completed_reuse')) return [];
            const artifactId = step?.outputs?.['artifact-id'];
            const artifactDigest = step?.outputs?.['artifact-digest'];
            return artifactId && artifactDigest ? [{ id, artifactId: Number(artifactId), artifactDigest }] : [];
          }).sort((left, right) => left.artifactId - right.artifactId);
          if (process.env.RESUME_COMPLETED === 'true' || process.env.FLY_COMPLETED === 'true') {
            fs.appendFileSync(process.env.OUTPUT, 'produced=false\ncontinuation_required=false\n');
            process.exit(0);
          }
          if (candidates.length !== 1) throw new Error(`exactly one deploy transition artifact was required: ${JSON.stringify(candidates)}`);
          const selected = candidates[0];
          const bytes = fs.readFileSync(process.env.PACKET);
          const effect = JSON.parse(bytes);
          fs.appendFileSync(process.env.OUTPUT,
            `produced=true\ncontinuation_required=${effect.phase === 'DEPLOY_COMPLETED' ? 'false' : 'true'}\n` +
            `artifact_id=${selected.artifactId}\nartifact_digest=sha256:${selected.artifactDigest}\n` +
            `effect_receipt_sha256=${createHash('sha256').update(bytes).digest('hex')}\n`);
          NODE

  archive_deploy_transition:
    name: Durably append the exact Fly transition from a provider-free reusable job
    needs: deploy
    if: ${{ always() && needs.deploy.outputs.transition_produced == 'true' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/physio-deploy-ledger-archive.yml
    with:
      application_sha: ${{ inputs.application_sha }}
      source_artifact_id: ${{ needs.deploy.outputs.transition_artifact_id }}
      source_artifact_digest: ${{ needs.deploy.outputs.transition_artifact_digest }}
      source_run_id: ${{ github.run_id }}
      source_run_attempt: ${{ github.run_attempt }}
      confirmation: ARCHIVE DEPLOY PACKET ${{ inputs.application_sha }} ${{ needs.deploy.outputs.transition_artifact_id }}

  continue_fly_transition:
    name: Continue only from the exact protected Fly transition tip
    needs: [deploy, archive_deploy_transition]
    if: ${{ needs.deploy.outputs.continuation_required == 'true' && needs.archive_deploy_transition.result == 'success' }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/physio-deploy-continuation.yml
    with:
      application_sha: ${{ inputs.application_sha }}
      immutable_image: ${{ inputs.immutable_image }}
      publication_artifact_id: ${{ inputs.publication_artifact_id }}
      publication_artifact_digest: ${{ inputs.publication_artifact_digest }}
      publication_receipt_sha256: ${{ inputs.publication_receipt_sha256 }}
      canary_artifact_id: ${{ inputs.canary_artifact_id }}
      canary_artifact_digest: ${{ inputs.canary_artifact_digest }}
      canary_receipt_sha256: ${{ inputs.canary_receipt_sha256 }}
      production_bootstrap_artifact_id: ${{ inputs.production_bootstrap_artifact_id }}
      production_bootstrap_artifact_digest: ${{ inputs.production_bootstrap_artifact_digest }}
      production_bootstrap_receipt_sha256: ${{ inputs.production_bootstrap_receipt_sha256 }}
      stripe_webhook_archive_artifact_id: ${{ inputs.stripe_webhook_archive_artifact_id }}
      stripe_webhook_archive_artifact_digest: ${{ inputs.stripe_webhook_archive_artifact_digest }}
      stripe_webhook_archive_receipt_sha256: ${{ inputs.stripe_webhook_archive_receipt_sha256 }}
      sentry_release_artifact_id: ${{ inputs.sentry_release_artifact_id }}
      sentry_release_artifact_digest: ${{ inputs.sentry_release_artifact_digest }}
      sentry_release_receipt_sha256: ${{ inputs.sentry_release_receipt_sha256 }}
      expected_volume_id: ${{ inputs.expected_volume_id }}
      config_sha256: ${{ inputs.config_sha256 }}
      capability_intent_id: ${{ inputs.capability_intent_id }}
      authority_reference: ${{ inputs.authority_reference }}
      continuation_ledger_commit_sha: ${{ needs.archive_deploy_transition.outputs.ledger_commit_sha }}
      continuation_ledger_record_sha256: ${{ needs.archive_deploy_transition.outputs.ledger_record_sha256 }}
      confirmation: ${{ inputs.confirmation }}

  sentry_deployment:
    name: Associate only the exact admitted deploy phase with Sentry after Fly PASS
    permissions:
      contents: read
      actions: read
    needs: [deploy, archive_deploy_transition]
    if: ${{ needs.deploy.result == 'success' && ((needs.deploy.outputs.deploy_phase == 'DEPLOY_COMPLETED' && needs.archive_deploy_transition.result == 'success') || (needs.deploy.outputs.deploy_phase == 'SENTRY_ASSOCIATION_STARTED' && needs.archive_deploy_transition.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: physio-production
    env:
      SENTRY_RELEASE_VERSION: physio-production@${{ inputs.application_sha }}
    outputs:
      sentry_deployment_artifact_id: ${{ steps.upload_final_v2.outputs.artifact-id }}
      sentry_deployment_artifact_digest: sha256:${{ steps.upload_final_v2.outputs.artifact-digest }}
      sentry_deployment_receipt_sha256: ${{ steps.final_v2.outputs.receipt_sha256 }}
      terminal_deploy_phase_artifact_id: ${{ steps.upload_sentry_success_envelope.outputs.artifact-id || steps.upload_sentry_terminal.outputs.artifact-id }}
      terminal_deploy_phase_artifact_digest: ${{ steps.upload_sentry_success_envelope.outputs.artifact-digest && format('sha256:{0}', steps.upload_sentry_success_envelope.outputs.artifact-digest) || format('sha256:{0}', steps.upload_sentry_terminal.outputs.artifact-digest) }}
      terminal_deploy_phase_receipt_sha256: ${{ steps.final_v2.outputs.terminal_phase_receipt_sha256 }}
      transition_artifact_id: ${{ steps.sentry_transition_artifact.outputs.artifact_id }}
      transition_artifact_digest: ${{ steps.sentry_transition_artifact.outputs.artifact_digest }}
      transition_effect_receipt_sha256: ${{ steps.sentry_transition_artifact.outputs.effect_receipt_sha256 }}
      transition_produced: ${{ steps.sentry_transition_artifact.outputs.produced }}
      continuation_required: ${{ steps.sentry_transition_artifact.outputs.continuation_required }}
    steps:
      - name: Check out exact trusted deployment and Sentry contracts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.application_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact same-run deploy PASS and rollback target evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.deploy.outputs.deploy_artifact_id }}
          path: ${{ runner.temp }}/deploy-result
          merge-multiple: true
          github-token: ${{ github.token }}

      - name: Download exact same-run deploy phase handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.deploy.outputs.deploy_phase_artifact_id }}
          path: ${{ runner.temp }}/deploy-phase-handoff
          merge-multiple: true
          github-token: ${{ github.token }}

      - name: Download exact prepared Sentry release packet
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ inputs.sentry_release_artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.deploy.outputs.sentry_release_run_id }}
          path: ${{ runner.temp }}/sentry-release-v2
          merge-multiple: true
          github-token: ${{ github.token }}

      - name: Admit exact deploy PASS phase and build credential-free Sentry phase runtime
        id: sentry_admit
        shell: bash
        env:
          APPLICATION_SHA: ${{ inputs.application_sha }}
          IMMUTABLE_IMAGE: ${{ inputs.immutable_image }}
          PUBLICATION_RECEIPT_SHA256: ${{ inputs.publication_receipt_sha256 }}
          CANARY_RECEIPT_SHA256: ${{ inputs.canary_receipt_sha256 }}
          PRODUCTION_BOOTSTRAP_RECEIPT_SHA256: ${{ inputs.production_bootstrap_receipt_sha256 }}
          STRIPE_WEBHOOK_RECEIPT_SHA256: ${{ needs.deploy.outputs.stripe_webhook_receipt_sha256 }}
          STRIPE_WEBHOOK_ARCHIVE_ARTIFACT_ID: ${{ inputs.stripe_webhook_archive_artifact_id }}
          STRIPE_WEBHOOK_ARCHIVE_ARTIFACT_DIGEST: ${{ inputs.stripe_webhook_archive_artifact_digest }}
          STRIPE_WEBHOOK_ARCHIVE_RECEIPT_SHA256: ${{ needs.deploy.outputs.stripe_webhook_archive_receipt_sha256 }}
          STRIPE_WEBHOOK_SOURCE_ARTIFACT_ID: ${{ needs.deploy.outputs.stripe_webhook_source_artifact_id }}
          STRIPE_WEBHOOK_SOURCE_ARTIFACT_DIGEST: ${{ needs.deploy.outputs.stripe_webhook_source_artifact_digest }}
          STRIPE_WEBHOOK_LEDGER_COMMIT_SHA: ${{ needs.deploy.outputs.stripe_webhook_ledger_commit_sha }}
          STRIPE_WEBHOOK_LEDGER_RECORD_SHA256: ${{ needs.deploy.outputs.stripe_webhook_ledger_record_sha256 }}
          STRIPE_WEBHOOK_LEDGER_PACKET_MANIFEST_SHA256: ${{ needs.deploy.outputs.stripe_webhook_ledger_packet_manifest_sha256 }}
          SENTRY_RELEASE_RECEIPT_SHA256: ${{ inputs.sentry_release_receipt_sha256 }}
          EXPECTED_VOLUME_ID: ${{ inputs.expected_volume_id }}
          CONFIG_SHA256: ${{ inputs.config_sha256 }}
          CAPABILITY_INTENT_ID: ${{ inputs.capability_intent_id }}
          AUTHORITY_REFERENCE: ${{ inputs.authority_reference }}
          UPSTREAM_ARTIFACT_METADATA_SHA256: ${{ needs.deploy.outputs.upstream_artifact_metadata_sha256 }}
          PUBLICATION_CAPABILITY_INTENT_ID: ${{ needs.deploy.outputs.publication_capability_intent_id }}
          PUBLICATION_AUTHORITY_REFERENCE: ${{ needs.deploy.outputs.publication_authority_reference }}
          CANARY_CAPABILITY_INTENT_ID: ${{ needs.deploy.outputs.canary_capability_intent_id }}
          CANARY_AUTHORITY_REFERENCE: ${{ needs.deploy.outputs.canary_authority_reference }}
          BOOTSTRAP_CAPABILITY_INTENT_ID: ${{ needs.deploy.outputs.bootstrap_capability_intent_id }}
          BOOTSTRAP_AUTHORITY_REFERENCE: ${{ needs.deploy.outputs.bootstrap_authority_reference }}
          STRIPE_WEBHOOK_CAPABILITY_INTENT_ID: ${{ needs.deploy.outputs.stripe_webhook_capability_intent_id }}
          STRIPE_WEBHOOK_AUTHORITY_REFERENCE: ${{ needs.deploy.outputs.stripe_webhook_authority_reference }}
          SENTRY_CAPABILITY_INTENT_ID: ${{ needs.deploy.outputs.sentry_capability_intent_id }}
          SENTRY_AUTHORITY_REFERENCE: ${{ needs.deploy.outputs.sentry_authority_reference }}
          DEPLOY_PHASE_RECEIPT_SHA256: ${{ needs.deploy.outputs.deploy_phase_receipt_sha256 }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          [[ -z "${FLY_API_TOKEN:-}" && -z "${SENTRY_AUTH_TOKEN:-}" && -z "${SENTRY_DSN:-}" ]]
          handoff="$RUNNER_TEMP/deploy-phase-handoff"
          phase_input="$handoff/phase"
          handoff_result="$handoff/deploy-result"
          deploy_result="$RUNNER_TEMP/deploy-result"
          sentry_release="$RUNNER_TEMP/sentry-release-v2"
          mapfile -t handoff_members < <(find "$handoff" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          [[ "${#handoff_members[@]}" == 2 && "${handoff_members[0]}" == deploy-result && "${handoff_members[1]}" == phase ]]
          for root in "$phase_input" "$handoff_result" "$deploy_result" "$sentry_release"; do
            [[ -d "$root" && -f "$root/SHA256SUMS" && ! -L "$root/SHA256SUMS" ]]
            if find "$root" -type l -print -quit | grep -q .; then exit 1; fi
            (cd "$root" && sha256sum --check --strict SHA256SUMS)
          done
          diff --no-dereference --recursive --brief "$handoff_result" "$deploy_result"
          current="$RUNNER_TEMP/physio-deploy-sentry-current"
          cp -a -- "$phase_input" "$current"
          [[ "$(sha256sum "$current/deploy-effect-reconciliation.json"|awk '{print $1}')" == "$DEPLOY_PHASE_RECEIPT_SHA256" ]]
          contract_args=(
            --application-sha "$APPLICATION_SHA" --immutable-image "$IMMUTABLE_IMAGE"
            --publication-receipt-sha256 "$PUBLICATION_RECEIPT_SHA256" --canary-receipt-sha256 "$CANARY_RECEIPT_SHA256"
            --bootstrap-receipt-sha256 "$PRODUCTION_BOOTSTRAP_RECEIPT_SHA256"
            --stripe-webhook-receipt-sha256 "$STRIPE_WEBHOOK_RECEIPT_SHA256"
            --sentry-release-receipt-sha256 "$SENTRY_RELEASE_RECEIPT_SHA256" --config-sha256 "$CONFIG_SHA256"
            --upstream-artifact-metadata-sha256 "$UPSTREAM_ARTIFACT_METADATA_SHA256" --expected-volume-id "$EXPECTED_VOLUME_ID"
            --capability-intent-id "$CAPABILITY_INTENT_ID" --authority-reference "$AUTHORITY_REFERENCE"
            --publication-capability-intent-id "$PUBLICATION_CAPABILITY_INTENT_ID"
            --publication-authority-reference "$PUBLICATION_AUTHORITY_REFERENCE"
            --canary-capability-intent-id "$CANARY_CAPABILITY_INTENT_ID" --canary-authority-reference "$CANARY_AUTHORITY_REFERENCE"
            --bootstrap-capability-intent-id "$BOOTSTRAP_CAPABILITY_INTENT_ID" --bootstrap-authority-reference "$BOOTSTRAP_AUTHORITY_REFERENCE"
            --stripe-webhook-capability-intent-id "$STRIPE_WEBHOOK_CAPABILITY_INTENT_ID"
            --stripe-webhook-authority-reference "$STRIPE_WEBHOOK_AUTHORITY_REFERENCE"
            --sentry-capability-intent-id "$SENTRY_CAPABILITY_INTENT_ID" --sentry-authority-reference "$SENTRY_AUTHORITY_REFERENCE"
          )
          validation="$(node scripts/physio-release-contract.mjs validate-deploy-resume-packet --packet "$current" "${contract_args[@]}")"
          VALIDATION="$validation" env -u FLY_API_TOKEN -u SENTRY_AUTH_TOKEN node --input-type=module <<'NODE'
          const row=JSON.parse(process.env.VALIDATION);
          if(!['DEPLOY_COMPLETED','SENTRY_ASSOCIATION_STARTED'].includes(row.phase)||
              !['STARTED','COMPLETED','STARTED_UNRESOLVED'].includes(row.result)||row.resumeCompleted)
            throw new Error('Sentry handoff deploy phase differs');
          NODE
          nested_phase="$deploy_result/deploy-phase-packet"
          nested_validation="$(node scripts/physio-release-contract.mjs validate-deploy-resume-packet \
            --packet "$nested_phase" "${contract_args[@]}")"
          NESTED_VALIDATION="$nested_validation" env -u FLY_API_TOKEN -u SENTRY_AUTH_TOKEN node -e \
            "const r=JSON.parse(process.env.NESTED_VALIDATION);if(r.phase!=='DEPLOY_COMPLETED'||r.result!=='COMPLETED')throw Error('deploy result sealed phase differs')"
          deploy_receipt="$deploy_result/physio-production-deploy.json"
          rollback_config="$deploy_result/rollback-target-config.toml"
          rollback_machine="$deploy_result/rollback-target-machine-config.json"
          for file in "$deploy_receipt" "$rollback_config" "$rollback_machine"; do [[ -f "$file" && ! -L "$file" ]]; done
          deploy_receipt_sha="$(sha256sum "$deploy_receipt"|awk '{print $1}')"
          RECEIPT="$deploy_receipt" CONFIG="$rollback_config" MACHINE_CONFIG="$rollback_machine" PHASE_ROOT="$current" \
          RESULT_PHASE_ROOT="$nested_phase" \
          SHA="$APPLICATION_SHA" IMAGE="$IMMUTABLE_IMAGE" VOLUME="$EXPECTED_VOLUME_ID" env -u FLY_API_TOKEN -u SENTRY_AUTH_TOKEN node --input-type=module <<'NODE'
          import{createHash}from'node:crypto';import fs from'node:fs';import path from'node:path';
          const hash=(file)=>createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const row=JSON.parse(fs.readFileSync(process.env.RECEIPT,'utf8'));
          const phases=fs.readdirSync(process.env.PHASE_ROOT).filter((name)=>/^deploy-phase-[0-9]{4}-DEPLOY_COMPLETED-r00\.json$/.test(name));
          if(phases.length!==1||row.contract_version!=='assesssuite-physio-deploy/3.0.0'||row.result!=='PASS'||
              row.application!=='assesssuite-physio-production'||row.application_sha!==process.env.SHA||
              row.immutable_image!==process.env.IMAGE||row.volume_id!==process.env.VOLUME||row.machine_count!==1||row.volume_count!==1||
              row.catalogue_count !== Number(process.env.PHYSIO_EXPECTED_CATALOGUE_COUNT)||
              row.catalogue_checksum !== process.env.PHYSIO_EXPECTED_CATALOGUE_CHECKSUM||
              String(row.stripe_webhook_archive_artifact_id)!==process.env.STRIPE_WEBHOOK_ARCHIVE_ARTIFACT_ID||
              row.stripe_webhook_archive_artifact_digest!==process.env.STRIPE_WEBHOOK_ARCHIVE_ARTIFACT_DIGEST||
              row.stripe_webhook_archive_receipt_sha256!==process.env.STRIPE_WEBHOOK_ARCHIVE_RECEIPT_SHA256||
              row.stripe_webhook_receipt_sha256!==process.env.STRIPE_WEBHOOK_RECEIPT_SHA256||
              String(row.stripe_webhook_source_artifact_id)!==process.env.STRIPE_WEBHOOK_SOURCE_ARTIFACT_ID||
              row.stripe_webhook_source_artifact_digest!==process.env.STRIPE_WEBHOOK_SOURCE_ARTIFACT_DIGEST||
              row.stripe_webhook_ledger_commit_sha!==process.env.STRIPE_WEBHOOK_LEDGER_COMMIT_SHA||
              row.stripe_webhook_ledger_record_sha256!==process.env.STRIPE_WEBHOOK_LEDGER_RECORD_SHA256||
              row.stripe_webhook_ledger_packet_manifest_sha256!==process.env.STRIPE_WEBHOOK_LEDGER_PACKET_MANIFEST_SHA256||
              row.persistence_restart_verified!==true||row.required_capabilities_ready!==true||
              row.fly_hostname_verified!=='https://assesssuite-physio-production.fly.dev'||
              row.rollback_target_config_sha256!==hash(process.env.CONFIG)||
              row.rollback_target_machine_config_sha256!==hash(process.env.MACHINE_CONFIG)||
              row.deploy_phase_packet_manifest_sha256!==hash(path.join(process.env.RESULT_PHASE_ROOT,'SHA256SUMS'))||
              row.deploy_effect_reconciliation_sha256!==hash(path.join(process.env.RESULT_PHASE_ROOT,'deploy-effect-reconciliation.json'))||
              row.deploy_effect_reconciliation_sha256!==hash(path.join(process.env.PHASE_ROOT,phases[0])))
            throw new Error('deploy PASS and rollback target evidence differ from the admitted deploy phase');
          NODE
          sentry_receipt="$sentry_release/physio-sentry-release.json"
          [[ -f "$sentry_receipt" && ! -L "$sentry_receipt" && "$(sha256sum "$sentry_receipt"|awk '{print $1}')" == "$SENTRY_RELEASE_RECEIPT_SHA256" ]]
          node scripts/physio-sentry-release-contract.mjs validate-release --receipt "$sentry_receipt" --application-sha "$APPLICATION_SHA"
          static="$RUNNER_TEMP/physio-sentry-deploy-static.env"
          for name in APPLICATION_SHA IMMUTABLE_IMAGE PUBLICATION_RECEIPT_SHA256 CANARY_RECEIPT_SHA256 \
            PRODUCTION_BOOTSTRAP_RECEIPT_SHA256 STRIPE_WEBHOOK_RECEIPT_SHA256 SENTRY_RELEASE_RECEIPT_SHA256 \
            EXPECTED_VOLUME_ID CONFIG_SHA256 CAPABILITY_INTENT_ID AUTHORITY_REFERENCE UPSTREAM_ARTIFACT_METADATA_SHA256 \
            PUBLICATION_CAPABILITY_INTENT_ID PUBLICATION_AUTHORITY_REFERENCE CANARY_CAPABILITY_INTENT_ID CANARY_AUTHORITY_REFERENCE \
            BOOTSTRAP_CAPABILITY_INTENT_ID BOOTSTRAP_AUTHORITY_REFERENCE STRIPE_WEBHOOK_CAPABILITY_INTENT_ID \
            STRIPE_WEBHOOK_AUTHORITY_REFERENCE SENTRY_CAPABILITY_INTENT_ID SENTRY_AUTHORITY_REFERENCE; do
            printf '%s=%q\n' "$name" "${!name}" >>"$static"
          done
          printf 'DEPLOY_RECEIPT_SHA256=%q\n' "$deploy_receipt_sha" >>"$static"
          runtime="$RUNNER_TEMP/physio-sentry-deploy-phase-runtime.sh"
          cat >"$runtime" <<'RUNTIME'
          set -euo pipefail
          set +x
          umask 077
          set -a; source "$RUNNER_TEMP/physio-sentry-deploy-static.env"; set +a
          DEPLOY_PACKET="$RUNNER_TEMP/physio-deploy-sentry-current"
          DEPLOY_WORK="$RUNNER_TEMP/physio-sentry-deploy-work"
          install -d -m 0700 "$DEPLOY_WORK"
          deploy_contract_args() {
            DEPLOY_CONTRACT_ARGS=(--application-sha "$APPLICATION_SHA" --immutable-image "$IMMUTABLE_IMAGE"
              --publication-receipt-sha256 "$PUBLICATION_RECEIPT_SHA256" --canary-receipt-sha256 "$CANARY_RECEIPT_SHA256"
              --bootstrap-receipt-sha256 "$PRODUCTION_BOOTSTRAP_RECEIPT_SHA256"
              --stripe-webhook-receipt-sha256 "$STRIPE_WEBHOOK_RECEIPT_SHA256"
              --sentry-release-receipt-sha256 "$SENTRY_RELEASE_RECEIPT_SHA256" --config-sha256 "$CONFIG_SHA256"
              --upstream-artifact-metadata-sha256 "$UPSTREAM_ARTIFACT_METADATA_SHA256" --expected-volume-id "$EXPECTED_VOLUME_ID"
              --capability-intent-id "$CAPABILITY_INTENT_ID" --authority-reference "$AUTHORITY_REFERENCE"
              --publication-capability-intent-id "$PUBLICATION_CAPABILITY_INTENT_ID"
              --publication-authority-reference "$PUBLICATION_AUTHORITY_REFERENCE"
              --canary-capability-intent-id "$CANARY_CAPABILITY_INTENT_ID" --canary-authority-reference "$CANARY_AUTHORITY_REFERENCE"
              --bootstrap-capability-intent-id "$BOOTSTRAP_CAPABILITY_INTENT_ID" --bootstrap-authority-reference "$BOOTSTRAP_AUTHORITY_REFERENCE"
              --stripe-webhook-capability-intent-id "$STRIPE_WEBHOOK_CAPABILITY_INTENT_ID"
              --stripe-webhook-authority-reference "$STRIPE_WEBHOOK_AUTHORITY_REFERENCE"
              --sentry-capability-intent-id "$SENTRY_CAPABILITY_INTENT_ID" --sentry-authority-reference "$SENTRY_AUTHORITY_REFERENCE")
          }
          packet_fields() { PACKET="$DEPLOY_PACKET/deploy-effect-reconciliation.json" env -u SENTRY_AUTH_TOKEN node --input-type=module <<'NODE'
          import fs from'node:fs';const r=JSON.parse(fs.readFileSync(process.env.PACKET,'utf8'));const e=r.provider_subeffects.at(-1)||{};
          process.stdout.write([r.phase,r.result,e.kind||'',e.state||'',e.effect_id||'',e.request_sha256||'',e.intended_resource_id||''].join('\t')+'\n');
          NODE
          }
          latest_started_hash() { ROOT="$DEPLOY_PACKET" env -u SENTRY_AUTH_TOKEN node --input-type=module <<'NODE'
          import{createHash}from'node:crypto';import fs from'node:fs';import path from'node:path';
          const names=fs.readdirSync(process.env.ROOT).filter(n=>/^deploy-phase-[0-9]{4}-SENTRY_ASSOCIATION_STARTED-r[0-9]{2}\.json$/.test(n)).sort().reverse();
          const name=names.find(n=>JSON.parse(fs.readFileSync(path.join(process.env.ROOT,n),'utf8')).result==='STARTED');
          if(!name)throw new Error('Sentry STARTED phase bytes are absent');process.stdout.write(createHash('sha256').update(fs.readFileSync(path.join(process.env.ROOT,name))).digest('hex'));
          NODE
          }
          next_packet() { local out="$RUNNER_TEMP/physio-sentry-next-${RANDOM}-${RANDOM}"; [[ ! -e "$out" ]]; printf '%s' "$out"; }
          replace_packet() { local next="$1" old="$RUNNER_TEMP/physio-sentry-old-${RANDOM}-${RANDOM}"; mv "$DEPLOY_PACKET" "$old"; mv "$next" "$DEPLOY_PACKET"; find "$old" -depth -delete; }
          make_request() { local argv="$1" output="$2" ordinal; ordinal="$(PACKET="$DEPLOY_PACKET/deploy-effect-reconciliation.json" node -e "const r=require(process.env.PACKET);process.stdout.write(String(r.provider_subeffect_requests.length))")";
            deploy_contract_args; env -u SENTRY_AUTH_TOKEN node scripts/physio-release-contract.mjs write-deploy-provider-request --output "$output" \
              --kind SENTRY_DEPLOYMENT_ASSOCIATE --effect-ordinal "$ordinal" --intended-resource-id "physio-production@$APPLICATION_SHA" \
              --argv "$argv" "${DEPLOY_CONTRACT_ARGS[@]}" >/dev/null; }
          derived_readback() { local phase="$1" result="$2" disposition="$3" effect="$4" request="$5" resource="$6" receipt="${7:-}" request_id="${8:-}" sentry_id="${9:-}" output="${10}";
            deploy_contract_args; local args=(--source-packet "$DEPLOY_PACKET" --output "$output" --phase "$phase" --result "$result"
              --operation-kind SENTRY_DEPLOYMENT_ASSOCIATE --operation-effect-id "$effect" --operation-request-sha256 "$request"
              --operation-resource-id "$resource" --operation-disposition "$disposition" "${DEPLOY_CONTRACT_ARGS[@]}");
            [[ -z "$receipt" ]]||args+=(--operation-receipt "$receipt"); [[ -z "$request_id" ]]||args+=(--operation-provider-request-id-sha256 "$request_id");
            [[ -z "$sentry_id" ]]||args+=(--observed-sentry-deployment-id-sha256 "$sentry_id");
            env -u SENTRY_AUTH_TOKEN node scripts/physio-release-contract.mjs write-deploy-derived-provider-readback "${args[@]}" >/dev/null; }
          advance() { local phase="$1" result="$2" readback="$3" exit_code="${4:-}" resource="${5:-}" disposition="${6:-}" receipt="${7:-}"; local next; next="$(next_packet)";deploy_contract_args;
            local args=(--source-packet "$DEPLOY_PACKET" --output-packet "$next" --phase "$phase" --result "$result" --provider-readback "$readback" "${DEPLOY_CONTRACT_ARGS[@]}");
            [[ -z "$exit_code" ]]||args+=(--provider-exit-code "$exit_code"); [[ -z "$resource" ]]||args+=(--observed-resource-id "$resource");
            [[ -z "$disposition" ]]||args+=(--reconciliation-disposition "$disposition"); [[ -z "$receipt" ]]||args+=(--operation-receipt "$receipt");
            env -u SENTRY_AUTH_TOKEN node scripts/physio-release-contract.mjs advance-deploy-packet "${args[@]}" >/dev/null;replace_packet "$next"; }
          RUNTIME
          chmod 0700 "$runtime"
          echo "deploy_receipt_sha256=$deploy_receipt_sha" >>"$GITHUB_OUTPUT"

      - name: Select exactly one Sentry transition for this provider job
        id: select_sentry_transition
        shell: bash
        env:
          DEPLOY_PHASE: ${{ needs.deploy.outputs.deploy_phase }}
          DEPLOY_RESULT: ${{ needs.deploy.outputs.deploy_phase_result }}
        run: |
          set -euo pipefail
          case "$DEPLOY_PHASE/$DEPLOY_RESULT" in
            DEPLOY_COMPLETED/COMPLETED) action=prepare ;;
            SENTRY_ASSOCIATION_STARTED/STARTED) action=effect ;;
            SENTRY_ASSOCIATION_STARTED/STARTED_UNRESOLVED|SENTRY_ASSOCIATION_STARTED/COMPLETED) action=reconcile ;;
            *) echo "unsupported Sentry transition $DEPLOY_PHASE/$DEPLOY_RESULT" >&2; exit 1 ;;
          esac
          echo "action=$action" >>"$GITHUB_OUTPUT"

      - name: Validate the frozen direct Sentry deployment API helper
        if: ${{ steps.select_sentry_transition.outputs.action == 'effect' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "${SENTRY_AUTH_TOKEN:-}" && -z "${SENTRY_DSN:-}" && -z "${FLY_API_TOKEN:-}" ]]
          node --check scripts/physio-sentry-deployment-api.mjs

      - name: Reconcile Sentry provider prestate and persist association STARTED before mutation
        id: sentry_plan
        if: ${{ steps.select_sentry_transition.outputs.action == 'prepare' || steps.select_sentry_transition.outputs.action == 'reconcile' }}
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: unimatter
          SENTRY_PROJECT: assesssuite-production
        run: |
          set -euo pipefail
          set +x
          source "$RUNNER_TEMP/physio-sentry-deploy-phase-runtime.sh"
          [[ -n "$SENTRY_AUTH_TOKEN" && -z "${FLY_API_TOKEN:-}" && -z "${SENTRY_DSN:-}" ]]
          [[ "$SENTRY_RELEASE_VERSION" == "physio-production@$APPLICATION_SHA" ]]
          release="$SENTRY_RELEASE_VERSION"; deployment_name="assesssuite-physio-production-${APPLICATION_SHA:0:12}"
          deployment_url='https://assesssuite-physio-production.fly.dev'; encoded_release="$(RELEASE="$release" node -e "process.stdout.write(encodeURIComponent(process.env.RELEASE))")"
          deployments_url="https://sentry.io/api/0/organizations/$SENTRY_ORG/releases/$encoded_release/deploys/"
          release_url="https://sentry.io/api/0/organizations/$SENTRY_ORG/releases/$encoded_release/"
          release_http="$(curl --proto '=https' --tlsv1.2 --silent --show-error --max-time 60 --max-filesize 1048576 --max-redirs 0 \
            --header "Authorization: Bearer $SENTRY_AUTH_TOKEN" --dump-header "$DEPLOY_WORK/release.headers" \
            --output "$DEPLOY_WORK/release.raw.json" --write-out '%{http_code}' "$release_url")"
          [[ "$release_http" == 200 ]]
          RAW="$DEPLOY_WORK/release.raw.json" OUT="$DEPLOY_WORK/provider-release-readback.json" \
          SENTRY_RELEASE_VERSION="$SENTRY_RELEASE_VERSION" env -u SENTRY_AUTH_TOKEN node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync(process.env.RAW,'utf8'));
          const projects=Array.isArray(row.projects)?row.projects.map(({id,slug})=>({id:String(id),slug})).sort((a,b)=>a.slug.localeCompare(b.slug)):[];
          if(row.version !== process.env.SENTRY_RELEASE_VERSION ||
              !projects.some((project)=>project.id==='4511827129663488'&&project.slug==='assesssuite-production'))
            throw new Error('qualified Sentry release provider readback differs');
          fs.writeFileSync(process.env.OUT,JSON.stringify({version:row.version,projects},null,2)+'\n',{flag:'wx',mode:0o600});
          NODE
          read_deployments() {
            local prefix="$1"
            node scripts/physio-sentry-deployment-api.mjs list \
              --url "$deployments_url" --token-env SENTRY_AUTH_TOKEN \
              --environment physio-production --name "$deployment_name" --deployment-url "$deployment_url" \
              --evidence-directory "$DEPLOY_WORK/$prefix-pages" --output "$DEPLOY_WORK/$prefix.sanitized.json"
          }
          read_deployments prestate
          IFS=$'\t' read -r count provider_id < <(READBACK="$DEPLOY_WORK/prestate.sanitized.json" node -e "const r=require(process.env.READBACK);process.stdout.write([r.exact_count,r.deployments[0]?.id||''].join('\\t'))")
          IFS=$'\t' read -r phase result kind state effect request resource < <(packet_fields)
          argv="$DEPLOY_WORK/sentry-association.argv"; printf '%s\n' POST "$deployments_url" \
            environment=physio-production name="$deployment_name" url="$deployment_url" >"$argv"
          if [[ "$phase" == DEPLOY_COMPLETED ]]; then
            [[ "$result" == COMPLETED && "$count" == 0 ]]
            request_file="$DEPLOY_WORK/sentry-association-request.json"; make_request "$argv" "$request_file"
            readarray -t identity < <(REQUEST="$request_file" node --input-type=module <<'NODE'
          import{createHash}from'node:crypto';import fs from'node:fs';const r=JSON.parse(fs.readFileSync(process.env.REQUEST,'utf8'));const c=v=>Array.isArray(v)?`[${v.map(c).join(',')}]`:v&&typeof v==='object'?`{${Object.keys(v).sort().map(k=>`${JSON.stringify(k)}:${c(v[k])}`).join(',')}}`:JSON.stringify(v);process.stdout.write(`${r.effect_id}\n${createHash('sha256').update(c(r)+'\n').digest('hex')}\n`);
          NODE
            )
            derived_readback SENTRY_ASSOCIATION_STARTED PASS PRESTATE "${identity[0]}" "${identity[1]}" "$release" '' '' '' "$DEPLOY_WORK/sentry-prestate-readback.json"
            deploy_contract_args; next="$(next_packet)"; env -u SENTRY_AUTH_TOKEN node scripts/physio-release-contract.mjs advance-deploy-packet \
              --source-packet "$DEPLOY_PACKET" --output-packet "$next" --phase SENTRY_ASSOCIATION_STARTED --result STARTED \
              --provider-readback "$DEPLOY_WORK/sentry-prestate-readback.json" --provider-request "$request_file" \
              --prestate-sha256 "$(sha256sum "$DEPLOY_WORK/sentry-prestate-readback.json"|awk '{print $1}')" "${DEPLOY_CONTRACT_ARGS[@]}" >/dev/null
            replace_packet "$next"; echo 'call_needed=true' >>"$GITHUB_OUTPUT"; echo 'upload_started=true' >>"$GITHUB_OUTPUT"
            echo "started_receipt_sha256=$(sha256sum "$DEPLOY_PACKET/deploy-effect-reconciliation.json"|awk '{print $1}')" >>"$GITHUB_OUTPUT"; exit 0
          fi
          [[ "$phase" == SENTRY_ASSOCIATION_STARTED ]]
          if [[ "$result" == COMPLETED ]]; then [[ "$count" == 1 ]]; else [[ "$result" =~ ^(STARTED|STARTED_UNRESOLVED)$ ]]; fi
          if [[ "$count" == 1 ]]; then
            provider_id_sha="$(printf '%s' "$provider_id"|sha256sum|awk '{print $1}')"; operation="$DEPLOY_WORK/sentry-reconciled-operation.json"
            PROVIDER="$DEPLOY_WORK/prestate.sanitized.json" OUTPUT="$operation" EXIT_CODE=124 node --input-type=module <<'NODE'
          import{createHash}from'node:crypto';import fs from'node:fs';const h=f=>createHash('sha256').update(fs.readFileSync(f)).digest('hex');
          const inventory=JSON.parse(fs.readFileSync(process.env.PROVIDER,'utf8'));
          fs.writeFileSync(process.env.OUTPUT,JSON.stringify({contract_version:'assesssuite-physio-sentry-deployment-operation/3.0.0',result:'PASS',provider_deployments_readback_sha256:h(process.env.PROVIDER),provider_mutation_http_receipt_sha256:null,provider_mutation_exit_code:Number(process.env.EXIT_CODE),provider_mutation_calls_attempted:0,provider_mutation_calls_confirmed:0,provider_inventory_calls_attempted:inventory.inventory_calls_attempted,provider_inventory_calls_confirmed:inventory.inventory_calls_confirmed,reconciled_response_loss:true,completed_at:new Date().toISOString()},null,2)+'\n',{flag:'wx',mode:0o600});
