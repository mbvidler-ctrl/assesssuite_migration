name: Physio production deploy - exact digest first release
run-name: Physio deploy ${{ inputs.application_sha }} after ${{ inputs.continuation_ledger_record_sha256 || 'initial' }}

on:
  workflow_dispatch:
    inputs:
      application_sha:
        description: Exact current main application SHA encoded by the candidate image
        required: true
        type: string
      immutable_image:
        description: Exact registry.fly.io/assesssuite-physio-production@sha256:... digest reference
        required: true
        type: string
      publication_artifact_id:
        description: Exact immutable publication receipt artifact ID
        required: true
        type: string
      publication_artifact_digest:
        description: Exact SHA-256 GitHub artifact digest for publication evidence
        required: true
        type: string
      publication_receipt_sha256:
        description: SHA-256 of physio-production-publication.json
        required: true
        type: string
      canary_artifact_id:
        description: Exact artifact ID for the isolated exact-image Physio provider canary
        required: true
        type: string
      canary_artifact_digest:
        description: Exact SHA-256 GitHub artifact digest for the canary evidence
        required: true
        type: string
      canary_receipt_sha256:
        description: SHA-256 of physio-exact-image-canary.json
        required: true
        type: string
      production_bootstrap_artifact_id:
        description: Exact production-stage bootstrap receipt artifact ID
        required: true
        type: string
      production_bootstrap_artifact_digest:
        description: Exact SHA-256 GitHub artifact digest for bootstrap evidence
        required: true
        type: string
      production_bootstrap_receipt_sha256:
        description: SHA-256 of the production-ready physio-production-bootstrap.json
        required: true
        type: string
      stripe_webhook_archive_artifact_id:
        description: Exact protected webhook archive artifact ID
        required: true
        type: string
      stripe_webhook_archive_artifact_digest:
        description: Exact SHA-256 GitHub artifact digest for protected webhook archive evidence
        required: true
        type: string
      stripe_webhook_archive_receipt_sha256:
        description: Raw-byte SHA-256 of physio-webhook-archive-receipt.json
        required: true
        type: string
      sentry_release_artifact_id:
        description: Exact prepared Sentry release/source-map artifact ID
        required: true
        type: string
      sentry_release_artifact_digest:
        description: Exact SHA-256 GitHub artifact digest for prepared Sentry evidence
        required: true
        type: string
      sentry_release_receipt_sha256:
        description: Raw-byte SHA-256 of physio-sentry-release.json
        required: true
        type: string
      expected_volume_id:
        description: Exact isolated Physio volume ID
        required: true
        type: string
      config_sha256:
        description: Reviewed LF-normalised SHA-256 of fly.physio.production.toml
        required: true
        type: string
      capability_intent_id:
        description: Authorised exact-digest first-release deployment capability intent
        required: true
        type: string
      authority_reference:
        description: Mission/order reference authorising this action
        required: true
        type: string
      continuation_ledger_commit_sha:
        description: Exact protected deploy-ledger commit authorising an automatic continuation, or zero initially
        required: false
        default: '0'
        type: string
      continuation_ledger_record_sha256:
        description: Exact protected deploy-ledger record authorising an automatic continuation, or zero initially
        required: false
        default: '0'
        type: string
      confirmation:
        description: Type DEPLOY assesssuite-physio-production FIRST RELEASE EXACT DIGEST
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: assesssuite-physio-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Snapshot restore-gate deploy verify restart and preserve rollback point
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: physio-production
    outputs:
      deploy_artifact_id: ${{ steps.upload_deploy_v2.outputs.artifact-id }}
      deploy_artifact_digest: sha256:${{ steps.upload_deploy_v2.outputs.artifact-digest }}
      deploy_receipt_sha256: ${{ steps.deploy_v2_result.outputs.deploy_receipt_sha256 || steps.deploy_resume.outputs.deploy_receipt_sha256 }}
      deploy_phase_artifact_id: ${{ steps.upload_deploy_completed_phase.outputs.artifact-id }}
      deploy_phase_artifact_digest: sha256:${{ steps.upload_deploy_completed_phase.outputs.artifact-digest }}
      deploy_phase_receipt_sha256: ${{ steps.phase_handoff.outputs.phase_receipt_sha256 }}
      deploy_phase: ${{ steps.phase_handoff.outputs.phase }}
      deploy_phase_result: ${{ steps.phase_handoff.outputs.result }}
      sentry_release_run_id: ${{ steps.artifacts.outputs.sentry_release_run_id }}
      upstream_artifact_metadata_sha256: ${{ steps.deploy_resume.outputs.upstream_artifact_metadata_sha256 }}
      publication_capability_intent_id: ${{ steps.deploy_resume.outputs.publication_capability_intent_id }}
      publication_authority_reference: ${{ steps.deploy_resume.outputs.publication_authority_reference }}
      canary_capability_intent_id: ${{ steps.deploy_resume.outputs.canary_capability_intent_id }}
      canary_authority_reference: ${{ steps.deploy_resume.outputs.canary_authority_reference }}
      bootstrap_capability_intent_id: ${{ steps.deploy_resume.outputs.bootstrap_capability_intent_id }}
      bootstrap_authority_reference: ${{ steps.deploy_resume.outputs.bootstrap_authority_reference }}
      stripe_webhook_capability_intent_id: ${{ steps.deploy_resume.outputs.stripe_webhook_capability_intent_id }}
      stripe_webhook_authority_reference: ${{ steps.deploy_resume.outputs.stripe_webhook_authority_reference }}
      sentry_capability_intent_id: ${{ steps.deploy_resume.outputs.sentry_capability_intent_id }}
      sentry_authority_reference: ${{ steps.deploy_resume.outputs.sentry_authority_reference }}
      stripe_webhook_archive_receipt_sha256: ${{ steps.webhook_archive.outputs.archive_receipt_sha256 }}
      stripe_webhook_receipt_sha256: ${{ steps.webhook_archive.outputs.original_receipt_sha256 }}
      stripe_webhook_source_artifact_id: ${{ steps.webhook_archive.outputs.source_artifact_id }}
      stripe_webhook_source_artifact_digest: ${{ steps.webhook_archive.outputs.source_artifact_digest }}
      stripe_webhook_ledger_commit_sha: ${{ steps.webhook_archive.outputs.ledger_commit_sha }}
      stripe_webhook_ledger_record_sha256: ${{ steps.webhook_archive.outputs.ledger_record_sha256 }}
      stripe_webhook_ledger_packet_manifest_sha256: ${{ steps.webhook_archive.outputs.ledger_packet_manifest_sha256 }}
      transition_artifact_id: ${{ steps.transition_artifact.outputs.artifact_id }}
      transition_artifact_digest: ${{ steps.transition_artifact.outputs.artifact_digest }}
      transition_effect_receipt_sha256: ${{ steps.transition_artifact.outputs.effect_receipt_sha256 }}
      transition_produced: ${{ steps.transition_artifact.outputs.produced }}
      continuation_required: ${{ steps.transition_artifact.outputs.continuation_required }}
    steps:
      - name: Validate trusted first-release dispatch
        shell: bash
        env:
          TRUSTED_WORKFLOW_SHA: ${{ inputs.application_sha }}
          APPLICATION_SHA: ${{ inputs.application_sha }}
          SENTRY_RELEASE_VERSION: physio-production@${{ inputs.application_sha }}
          IMMUTABLE_IMAGE: ${{ inputs.immutable_image }}
          PUBLICATION_ARTIFACT_ID: ${{ inputs.publication_artifact_id }}
          PUBLICATION_ARTIFACT_DIGEST: ${{ inputs.publication_artifact_digest }}
          PUBLICATION_RECEIPT_SHA256: ${{ inputs.publication_receipt_sha256 }}
          CANARY_ARTIFACT_ID: ${{ inputs.canary_artifact_id }}
          CANARY_ARTIFACT_DIGEST: ${{ inputs.canary_artifact_digest }}
          CANARY_RECEIPT_SHA256: ${{ inputs.canary_receipt_sha256 }}
          PRODUCTION_BOOTSTRAP_ARTIFACT_ID: ${{ inputs.production_bootstrap_artifact_id }}
          PRODUCTION_BOOTSTRAP_ARTIFACT_DIGEST: ${{ inputs.production_bootstrap_artifact_digest }}
          PRODUCTION_BOOTSTRAP_RECEIPT_SHA256: ${{ inputs.production_bootstrap_receipt_sha256 }}
          STRIPE_WEBHOOK_ARTIFACT_ID: ${{ inputs.stripe_webhook_archive_artifact_id }}
          STRIPE_WEBHOOK_ARTIFACT_DIGEST: ${{ inputs.stripe_webhook_archive_artifact_digest }}
          STRIPE_WEBHOOK_ARCHIVE_RECEIPT_SHA256: ${{ inputs.stripe_webhook_archive_receipt_sha256 }}
          SENTRY_RELEASE_ARTIFACT_ID: ${{ inputs.sentry_release_artifact_id }}
          SENTRY_RELEASE_ARTIFACT_DIGEST: ${{ inputs.sentry_release_artifact_digest }}
          SENTRY_RELEASE_RECEIPT_SHA256: ${{ inputs.sentry_release_receipt_sha256 }}
          EXPECTED_VOLUME_ID: ${{ inputs.expected_volume_id }}
          CONFIG_SHA256: ${{ inputs.config_sha256 }}
          CAPABILITY_INTENT_ID: ${{ inputs.capability_intent_id }}
          AUTHORITY_REFERENCE: ${{ inputs.authority_reference }}
          CONTINUATION_LEDGER_COMMIT_SHA: ${{ inputs.continuation_ledger_commit_sha }}
          CONTINUATION_LEDGER_RECORD_SHA256: ${{ inputs.continuation_ledger_record_sha256 }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          IS_FORK: ${{ github.event.repository.fork }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "mbvidler-ctrl/assesssuite_migration" ]]
          [[ "$ACTOR" == "mbvidler-ctrl" && "$TRIGGERING_ACTOR" == "mbvidler-ctrl" ]]
          [[ "$IS_FORK" == "false" && "$EVENT_REF" == "refs/heads/main" ]]
          [[ "$WORKFLOW_REF" == "mbvidler-ctrl/assesssuite_migration/.github/workflows/physio-production-deploy.yml@refs/heads/main" ]]
          [[ "$TRUSTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ && "$APPLICATION_SHA" == "$TRUSTED_WORKFLOW_SHA" ]]
          [[ "$WORKFLOW_SHA" == "$TRUSTED_WORKFLOW_SHA" && "$EVENT_SHA" == "$TRUSTED_WORKFLOW_SHA" ]]
          [[ "$IMMUTABLE_IMAGE" =~ ^registry\.fly\.io/assesssuite-physio-production@sha256:[0-9a-f]{64}$ ]]
          [[ "$PUBLICATION_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$PUBLICATION_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CANARY_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$CANARY_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PRODUCTION_BOOTSTRAP_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$PRODUCTION_BOOTSTRAP_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$STRIPE_WEBHOOK_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$STRIPE_WEBHOOK_ARCHIVE_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SENTRY_RELEASE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$SENTRY_RELEASE_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          for digest in "$PUBLICATION_ARTIFACT_DIGEST" "$CANARY_ARTIFACT_DIGEST" "$PRODUCTION_BOOTSTRAP_ARTIFACT_DIGEST" \
            "$STRIPE_WEBHOOK_ARTIFACT_DIGEST" "$SENTRY_RELEASE_ARTIFACT_DIGEST"; do [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; done
          [[ "$EXPECTED_VOLUME_ID" =~ ^vol_[A-Za-z0-9]+$ && "$CONFIG_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CAPABILITY_INTENT_ID" =~ ^[A-Za-z0-9._:-]{1,160}$ ]]
          [[ "$AUTHORITY_REFERENCE" =~ ^[A-Za-z0-9._:/-]{1,240}$ ]]
          [[ "$CONTINUATION_LEDGER_COMMIT_SHA" == 0 || "$CONTINUATION_LEDGER_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONTINUATION_LEDGER_RECORD_SHA256" == 0 || "$CONTINUATION_LEDGER_RECORD_SHA256" =~ ^[0-9a-f]{64}$ ]]
          if [[ "$CONTINUATION_LEDGER_COMMIT_SHA" == 0 ]]; then
            [[ "$CONTINUATION_LEDGER_RECORD_SHA256" == 0 ]]
          else
            [[ "$CONTINUATION_LEDGER_RECORD_SHA256" != 0 ]]
          fi
          [[ "$CONFIRMATION" == "DEPLOY assesssuite-physio-production FIRST RELEASE EXACT DIGEST" ]]

      - name: Check out exact trusted release controls
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.application_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Load frozen catalogue contract from exact SHA
        shell: bash
        run: |
          set -euo pipefail
          node scripts/physio-release-contract.mjs write-catalogue-environment --github-env "$GITHUB_ENV"

      - name: Admit bounded predecessor artifact metadata before download
        id: artifacts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLICATION_SHA: ${{ inputs.application_sha }}
          PUBLICATION_ARTIFACT_ID: ${{ inputs.publication_artifact_id }}
          PUBLICATION_ARTIFACT_DIGEST: ${{ inputs.publication_artifact_digest }}
          CANARY_ARTIFACT_ID: ${{ inputs.canary_artifact_id }}
          CANARY_ARTIFACT_DIGEST: ${{ inputs.canary_artifact_digest }}
          PRODUCTION_BOOTSTRAP_ARTIFACT_ID: ${{ inputs.production_bootstrap_artifact_id }}
          PRODUCTION_BOOTSTRAP_ARTIFACT_DIGEST: ${{ inputs.production_bootstrap_artifact_digest }}
          STRIPE_WEBHOOK_ARTIFACT_ID: ${{ inputs.stripe_webhook_archive_artifact_id }}
          STRIPE_WEBHOOK_ARTIFACT_DIGEST: ${{ inputs.stripe_webhook_archive_artifact_digest }}
          SENTRY_RELEASE_ARTIFACT_ID: ${{ inputs.sentry_release_artifact_id }}
          SENTRY_RELEASE_ARTIFACT_DIGEST: ${{ inputs.sentry_release_artifact_digest }}
        run: |
          set -euo pipefail
          umask 077
          spec="$RUNNER_TEMP/deploy-predecessor-artifact-spec.json"
          SPEC="$spec" APPLICATION_SHA="$APPLICATION_SHA" PUBLICATION_ID="$PUBLICATION_ARTIFACT_ID" PUBLICATION_DIGEST="$PUBLICATION_ARTIFACT_DIGEST" \
          CANARY_ID="$CANARY_ARTIFACT_ID" CANARY_DIGEST="$CANARY_ARTIFACT_DIGEST" \
          BOOTSTRAP_ID="$PRODUCTION_BOOTSTRAP_ARTIFACT_ID" BOOTSTRAP_DIGEST="$PRODUCTION_BOOTSTRAP_ARTIFACT_DIGEST" \
          WEBHOOK_ID="$STRIPE_WEBHOOK_ARTIFACT_ID" WEBHOOK_DIGEST="$STRIPE_WEBHOOK_ARTIFACT_DIGEST" \
          SENTRY_ID="$SENTRY_RELEASE_ARTIFACT_ID" SENTRY_DIGEST="$SENTRY_RELEASE_ARTIFACT_DIGEST" \
          env -u FLY_API_TOKEN -u SENTRY_AUTH_TOKEN node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const sha = process.env.APPLICATION_SHA;
          const artifacts = [
            { key: 'publication', id: process.env.PUBLICATION_ID, expected_digest: process.env.PUBLICATION_DIGEST,
              maximum_bytes: 33554432, name_patterns: [`^physio-production-publication-${sha}$`],
              workflow_path: '.github/workflows/physio-production-publish.yml', allowed_conclusions: ['success'] },
            { key: 'canary', id: process.env.CANARY_ID, expected_digest: process.env.CANARY_DIGEST,
              maximum_bytes: 33554432, name_patterns: [`^physio-exact-image-canary-${sha}$`],
              workflow_path: '.github/workflows/physio-production-exact-image-canary.yml', allowed_conclusions: ['success'] },
            { key: 'production_bootstrap', id: process.env.BOOTSTRAP_ID, expected_digest: process.env.BOOTSTRAP_DIGEST,
              maximum_bytes: 33554432, name_patterns: [`^physio-production-bootstrap-${sha}$`],
              workflow_path: '.github/workflows/physio-production-bootstrap.yml', allowed_conclusions: ['success'] },
            { key: 'stripe_webhook_archive', id: process.env.WEBHOOK_ID, expected_digest: process.env.WEBHOOK_DIGEST,
              maximum_bytes: 67108864, name_patterns: [`^physio-webhook-archive-${sha}$`],
              workflow_path: '.github/workflows/physio-production-webhook-archive.yml', allowed_conclusions: ['success'] },
            { key: 'sentry_release', id: process.env.SENTRY_ID, expected_digest: process.env.SENTRY_DIGEST,
              maximum_bytes: 536870912, name_patterns: [`^physio-sentry-release-${sha}$`],
              workflow_path: '.github/workflows/physio-production-prepare-release.yml', allowed_conclusions: ['success'] },
          ];
          const row = { repository: 'mbvidler-ctrl/assesssuite_migration', application_sha: sha, artifacts };
          fs.writeFileSync(process.env.SPEC, JSON.stringify(row, null, 2) + '\n', { flag: 'wx', mode: 0o600 });
          NODE
          node scripts/github-artifact-admission.mjs --spec "$spec" \
            --output "$RUNNER_TEMP/upstream-artifact-admission.json" --github-output "$GITHUB_OUTPUT"

      - name: Download exact publication receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ inputs.publication_artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifacts.outputs.publication_run_id }}
          path: ${{ runner.temp }}/physio-publication-input
          merge-multiple: true
          github-token: ${{ github.token }}

      - name: Download exact immutable-image provider canary receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ inputs.canary_artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifacts.outputs.canary_run_id }}
          path: ${{ runner.temp }}/physio-canary-input
          merge-multiple: true
          github-token: ${{ github.token }}

      - name: Download exact production-ready bootstrap receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ inputs.production_bootstrap_artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifacts.outputs.production_bootstrap_run_id }}
          path: ${{ runner.temp }}/physio-production-bootstrap-input
          merge-multiple: true
          github-token: ${{ github.token }}

      - name: Download exact protected Stripe webhook archive transport
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ inputs.stripe_webhook_archive_artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifacts.outputs.stripe_webhook_archive_run_id }}
          path: ${{ runner.temp }}/physio-stripe-webhook-archive-input
          merge-multiple: true
          github-token: ${{ github.token }}

      - name: Download exact prepared Sentry release receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ inputs.sentry_release_artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifacts.outputs.sentry_release_run_id }}
          path: ${{ runner.temp }}/physio-sentry-release-input
          merge-multiple: true
          github-token: ${{ github.token }}

      - name: Re-admit protected webhook archive and materialize exact original packet from ledger
        id: webhook_archive
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLICATION_SHA: ${{ inputs.application_sha }}
          WEBHOOK_ARCHIVE_ARTIFACT_ID: ${{ inputs.stripe_webhook_archive_artifact_id }}
          WEBHOOK_ARCHIVE_ARTIFACT_DIGEST: ${{ inputs.stripe_webhook_archive_artifact_digest }}
          WEBHOOK_ARCHIVE_RECEIPT_SHA256: ${{ inputs.stripe_webhook_archive_receipt_sha256 }}
          BOOTSTRAP_RECEIPT_SHA256: ${{ inputs.production_bootstrap_receipt_sha256 }}
          CANARY_RECEIPT_SHA256: ${{ inputs.canary_receipt_sha256 }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          archive="$RUNNER_TEMP/physio-stripe-webhook-archive-input"
          transport="$archive/packet"
          receipt="$archive/physio-webhook-archive-receipt.json"
          materialized="$RUNNER_TEMP/physio-stripe-webhook-input"
          mapfile -t archive_members < <(find "$archive" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)
          [[ "${#archive_members[@]}" == 2 && "${archive_members[0]}" == packet && \
             "${archive_members[1]}" == physio-webhook-archive-receipt.json ]]
          [[ -f "$receipt" && ! -L "$receipt" && -d "$transport" && ! -L "$transport" ]]
          if find "$archive" -type l -o ! -type d ! -type f | grep -q .; then exit 1; fi
          [[ "$(du -sb "$archive" | awk '{print $1}')" -le 67108864 ]]
          [[ "$(sha256sum "$receipt" | awk '{print $1}')" == "$WEBHOOK_ARCHIVE_RECEIPT_SHA256" ]]
          [[ -f "$transport/SHA256SUMS" && ! -L "$transport/SHA256SUMS" ]]
          (cd "$transport" && sha256sum --check --strict SHA256SUMS)
          ARCHIVE_RECEIPT="$receipt" TRANSPORT_PACKET="$transport" MATERIALIZED_PACKET="$materialized" \
          ARTIFACT_ADMISSION="$RUNNER_TEMP/upstream-artifact-admission.json" \
          GITHUB_ENV_PATH="$GITHUB_ENV" GITHUB_OUTPUT_PATH="$GITHUB_OUTPUT" REPOSITORY="$GITHUB_REPOSITORY" \
            env -u FLY_API_TOKEN -u SENTRY_AUTH_TOKEN -u SENTRY_DSN node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          import { validateCompletedStripeWebhookPacket } from './scripts/physio-stripe-webhook-evidence.mjs';
          import { createWebhookLedgerGitHubClient, materializeWebhookPacketFromLedger,
            validateWebhookArchiveReceipt } from './scripts/physio-webhook-ledger.mjs';
          const hash = (file) => createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const receipt = JSON.parse(fs.readFileSync(process.env.ARCHIVE_RECEIPT, 'utf8'));
          const admission = JSON.parse(fs.readFileSync(process.env.ARTIFACT_ADMISSION, 'utf8'));
          const admitted = admission.artifacts?.stripe_webhook_archive;
          validateWebhookArchiveReceipt(receipt, {
            repository: process.env.REPOSITORY,
            applicationSha: process.env.APPLICATION_SHA,
            archiveArtifactId: Number(process.env.WEBHOOK_ARCHIVE_ARTIFACT_ID),
            archiveArtifactDigest: process.env.WEBHOOK_ARCHIVE_ARTIFACT_DIGEST,
            archiveArtifactName: `physio-webhook-archive-${process.env.APPLICATION_SHA}`,
            archiveReceiptSha256: process.env.WEBHOOK_ARCHIVE_RECEIPT_SHA256,
          });
          if (!admitted || admitted.id !== Number(process.env.WEBHOOK_ARCHIVE_ARTIFACT_ID) ||
              admitted.digest !== process.env.WEBHOOK_ARCHIVE_ARTIFACT_DIGEST ||
              admitted.workflow_run_path !== '.github/workflows/physio-production-webhook-archive.yml') {
            throw new Error('protected webhook archive transport admission differs');
          }
          const webhookFile = path.join(process.env.TRANSPORT_PACKET, 'physio-production-stripe-webhook.json');
          const webhook = JSON.parse(fs.readFileSync(webhookFile, 'utf8'));
          if (receipt.source_artifact_receipt_sha256 !== hash(webhookFile) ||
              webhook.application_sha !== process.env.APPLICATION_SHA ||
              webhook.bootstrap_receipt_sha256 !== process.env.BOOTSTRAP_RECEIPT_SHA256 ||
              webhook.exact_image_canary_receipt_sha256 !== process.env.CANARY_RECEIPT_SHA256) {
            throw new Error('archived original webhook receipt identity differs');
          }
          const expectation = {
            applicationSha: process.env.APPLICATION_SHA,
            authorityReference: webhook.authority_reference,
            bootstrapReceiptSha256: process.env.BOOTSTRAP_RECEIPT_SHA256,
            canaryReceiptSha256: process.env.CANARY_RECEIPT_SHA256,
            capabilityIntentId: webhook.capability_intent_id,
            effectReceiptSha256: webhook.effect_reconciliation_receipt_sha256,
          };
          validateCompletedStripeWebhookPacket(process.env.TRANSPORT_PACKET, expectation);
          await materializeWebhookPacketFromLedger({
            client: createWebhookLedgerGitHubClient({ repository: process.env.REPOSITORY,
              token: process.env.GITHUB_TOKEN }),
            repository: process.env.REPOSITORY,
            applicationSha: process.env.APPLICATION_SHA,
            archiveReceipt: receipt,
            outputDirectory: process.env.MATERIALIZED_PACKET,
            expectation,
          });
          const transportNames = fs.readdirSync(process.env.TRANSPORT_PACKET).sort();
          const materializedNames = fs.readdirSync(process.env.MATERIALIZED_PACKET).sort();
          if (JSON.stringify(transportNames) !== JSON.stringify(materializedNames) ||
              transportNames.some((name) => hash(path.join(process.env.TRANSPORT_PACKET, name)) !==
                hash(path.join(process.env.MATERIALIZED_PACKET, name)))) {
            throw new Error('protected webhook ledger readback differs byte-for-byte from transport packet');
          }
          const environment = {
            PHYSIO_STRIPE_WEBHOOK_ARCHIVE_RECEIPT_SHA256: process.env.WEBHOOK_ARCHIVE_RECEIPT_SHA256,
            PHYSIO_STRIPE_WEBHOOK_RECEIPT_SHA256: receipt.source_artifact_receipt_sha256,
            PHYSIO_STRIPE_WEBHOOK_SOURCE_ARTIFACT_ID: String(receipt.source_artifact_id),
            PHYSIO_STRIPE_WEBHOOK_SOURCE_ARTIFACT_DIGEST: receipt.source_artifact_digest,
            PHYSIO_STRIPE_WEBHOOK_LEDGER_COMMIT_SHA: receipt.ledger_commit_sha,
            PHYSIO_STRIPE_WEBHOOK_LEDGER_RECORD_SHA256: receipt.ledger_record_sha256,
            PHYSIO_STRIPE_WEBHOOK_LEDGER_PACKET_MANIFEST_SHA256: receipt.ledger_packet_manifest_sha256,
          };
          for (const [key, value] of Object.entries(environment)) {
            if (/\r|\n/u.test(value)) throw new Error(`${key} contains a newline`);
            fs.appendFileSync(process.env.GITHUB_ENV_PATH, `${key}=${value}\n`);
          }
          const outputs = {
            archive_receipt_sha256: environment.PHYSIO_STRIPE_WEBHOOK_ARCHIVE_RECEIPT_SHA256,
            original_receipt_sha256: environment.PHYSIO_STRIPE_WEBHOOK_RECEIPT_SHA256,
            source_artifact_id: environment.PHYSIO_STRIPE_WEBHOOK_SOURCE_ARTIFACT_ID,
            source_artifact_digest: environment.PHYSIO_STRIPE_WEBHOOK_SOURCE_ARTIFACT_DIGEST,
            ledger_commit_sha: environment.PHYSIO_STRIPE_WEBHOOK_LEDGER_COMMIT_SHA,
            ledger_record_sha256: environment.PHYSIO_STRIPE_WEBHOOK_LEDGER_RECORD_SHA256,
            ledger_packet_manifest_sha256: environment.PHYSIO_STRIPE_WEBHOOK_LEDGER_PACKET_MANIFEST_SHA256,
          };
          for (const [key, value] of Object.entries(outputs))
            fs.appendFileSync(process.env.GITHUB_OUTPUT_PATH, `${key}=${value}\n`);
          NODE

      - name: Inventory and materialize the exact maximal protected deploy-ledger tip
        id: deploy_ledger_resume
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLICATION_SHA: ${{ inputs.application_sha }}
          PROVISIONING_RECEIPT_SHA256: ${{ vars.PHYSIO_DEPLOY_LEDGER_PROVISIONING_RECEIPT_SHA256 }}
        run: |
          set -euo pipefail
          [[ -z "${FLY_API_TOKEN:-}" && -z "${SENTRY_AUTH_TOKEN:-}" ]]
          [[ "$PROVISIONING_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          inventory="$RUNNER_TEMP/deploy-ledger-inventory.json"
          node scripts/physio-deploy-ledger.mjs inventory \
            --repository "$GITHUB_REPOSITORY" --application-sha "$APPLICATION_SHA" \
            --provisioning-receipt-sha256 "$PROVISIONING_RECEIPT_SHA256" \
            --output "$inventory" --github-output "$GITHUB_OUTPUT"
          record_count="$(INVENTORY="$inventory" env -u GITHUB_TOKEN node -e \
            "const r=require(process.env.INVENTORY);process.stdout.write(String(r.record_count))")"
          if [[ "$record_count" != 0 ]]; then
            node scripts/physio-deploy-ledger.mjs materialize-remote \
              --repository "$GITHUB_REPOSITORY" --application-sha "$APPLICATION_SHA" \
              --provisioning-receipt-sha256 "$PROVISIONING_RECEIPT_SHA256" \
              --output-directory "$RUNNER_TEMP/physio-deploy-resume-input" \
              --output "$RUNNER_TEMP/deploy-ledger-materialization.json"
          fi

      - name: Reject every retained deploy artifact newer than the exact protected tip
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLICATION_SHA: ${{ inputs.application_sha }}
          LEDGER_ARTIFACT_ID: ${{ steps.deploy_ledger_resume.outputs.deploy_ledger_latest_artifact_id }}
        run: |
          set -euo pipefail
          [[ -z "${FLY_API_TOKEN:-}" && -z "${SENTRY_AUTH_TOKEN:-}" ]]
          env -u FLY_API_TOKEN -u SENTRY_AUTH_TOKEN node --input-type=module <<'NODE'
          const base = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}`;
          const headers = { accept: 'application/vnd.github+json', authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'x-github-api-version': '2022-11-28' };
          const rows = [];
          let total = null;
          for (let page = 1; page <= 1000; page += 1) {
            const response = await fetch(`${base}/actions/artifacts?per_page=100&page=${page}`, {
              headers, redirect: 'error', signal: AbortSignal.timeout(30000) });
            const text = await response.text();
            if (response.status !== 200 || text.length > 4194304) throw new Error('deploy retained history response differs');
            const value = JSON.parse(text);
            if (!Number.isSafeInteger(value.total_count) || !Array.isArray(value.artifacts) || value.artifacts.length > 100 ||
                (total !== null && total !== value.total_count)) throw new Error('deploy retained history pagination differs');
            total = value.total_count;
            rows.push(...value.artifacts);
            if (rows.length >= total) break;
            if (value.artifacts.length !== 100) throw new Error('deploy retained history terminated early');
          }
          if (total === null || rows.length < total) throw new Error('deploy retained history is incomplete');
          const sha = process.env.APPLICATION_SHA.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const family = new RegExp(`^physio-deploy-(?:phase-${sha}-(?:[0-9]{3}-[a-z0-9-]+|sentry-handoff)-[0-9]+-[0-9]+|terminal-${sha}-sentry-[0-9]+-[0-9]+|completed-reuse-${sha}(?:-sentry)?-[0-9]+-[0-9]+)$`);
          const ledgerId = Number(process.env.LEDGER_ARTIFACT_ID);
          if (!Number.isSafeInteger(ledgerId) || ledgerId < 0) throw new Error('deploy ledger artifact tip differs');
          const unarchived = rows.filter((row) => row?.expired === false && family.test(row?.name || '') && row.id > ledgerId)
            .map((row) => ({ id: row.id, name: row.name, digest: row.digest })).sort((a, b) => a.id - b.id);
          if (unarchived.length) throw new Error(`protected deploy ledger archive pending: ${JSON.stringify(unarchived)}`);
          NODE

      - name: Bind an automatic continuation to the exact protected tip that authorised it
        if: ${{ inputs.continuation_ledger_record_sha256 != '0' }}
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.continuation_ledger_commit_sha }}
          EXPECTED_RECORD: ${{ inputs.continuation_ledger_record_sha256 }}
          ACTUAL_COMMIT: ${{ steps.deploy_ledger_resume.outputs.deploy_ledger_latest_record_commit_sha }}
          ACTUAL_RECORD: ${{ steps.deploy_ledger_resume.outputs.deploy_ledger_latest_record_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" == "$ACTUAL_COMMIT" && "$EXPECTED_RECORD" == "$ACTUAL_RECORD" ]]

      - name: Read back exact upstream GitHub artifact identities before providers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          APPLICATION_SHA: ${{ inputs.application_sha }}
          PUBLICATION_ARTIFACT_ID: ${{ inputs.publication_artifact_id }}
          PUBLICATION_ARTIFACT_DIGEST: ${{ inputs.publication_artifact_digest }}
          CANARY_ARTIFACT_ID: ${{ inputs.canary_artifact_id }}
          CANARY_ARTIFACT_DIGEST: ${{ inputs.canary_artifact_digest }}
          PRODUCTION_BOOTSTRAP_ARTIFACT_ID: ${{ inputs.production_bootstrap_artifact_id }}
          PRODUCTION_BOOTSTRAP_ARTIFACT_DIGEST: ${{ inputs.production_bootstrap_artifact_digest }}
          STRIPE_WEBHOOK_ARTIFACT_ID: ${{ inputs.stripe_webhook_archive_artifact_id }}
          STRIPE_WEBHOOK_ARTIFACT_DIGEST: ${{ inputs.stripe_webhook_archive_artifact_digest }}
          SENTRY_RELEASE_ARTIFACT_ID: ${{ inputs.sentry_release_artifact_id }}
          SENTRY_RELEASE_ARTIFACT_DIGEST: ${{ inputs.sentry_release_artifact_digest }}
        run: |
          set -euo pipefail
          set +x
          work="$RUNNER_TEMP/upstream-artifact-metadata-work"
          packet="$RUNNER_TEMP/physio-upstream-artifact-metadata"
          install -d -m 0700 "$work" "$packet"
          read_artifact() {
            local key="$1" id="$2"
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 60 \
              --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/actions/artifacts/$id" >"$work/$key.raw.json"
            [[ -s "$work/$key.raw.json" && "$(wc -c <"$work/$key.raw.json")" -le 65536 ]]
          }
          read_artifact publication "$PUBLICATION_ARTIFACT_ID"
          read_artifact canary "$CANARY_ARTIFACT_ID"
          read_artifact bootstrap "$PRODUCTION_BOOTSTRAP_ARTIFACT_ID"
          read_artifact stripe_webhook_archive "$STRIPE_WEBHOOK_ARTIFACT_ID"
          read_artifact sentry_release "$SENTRY_RELEASE_ARTIFACT_ID"
          WORK="$work" OUT="$packet/upstream-artifact-metadata.json" APPLICATION_SHA="$APPLICATION_SHA" \
          PUBLICATION_ID="$PUBLICATION_ARTIFACT_ID" PUBLICATION_DIGEST="$PUBLICATION_ARTIFACT_DIGEST" \
          CANARY_ID="$CANARY_ARTIFACT_ID" CANARY_DIGEST="$CANARY_ARTIFACT_DIGEST" \
          BOOTSTRAP_ID="$PRODUCTION_BOOTSTRAP_ARTIFACT_ID" BOOTSTRAP_DIGEST="$PRODUCTION_BOOTSTRAP_ARTIFACT_DIGEST" \
          WEBHOOK_ID="$STRIPE_WEBHOOK_ARTIFACT_ID" WEBHOOK_DIGEST="$STRIPE_WEBHOOK_ARTIFACT_DIGEST" \
          SENTRY_ID="$SENTRY_RELEASE_ARTIFACT_ID" SENTRY_DIGEST="$SENTRY_RELEASE_ARTIFACT_DIGEST" \
            env -u GH_TOKEN node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const specifications = {
            publication: { id: process.env.PUBLICATION_ID, digest: process.env.PUBLICATION_DIGEST,
              name: `physio-production-publication-${process.env.APPLICATION_SHA}`, maximum: 33_554_432 },
            canary: { id: process.env.CANARY_ID, digest: process.env.CANARY_DIGEST,
              name: `physio-exact-image-canary-${process.env.APPLICATION_SHA}`, maximum: 33_554_432 },
            bootstrap: { id: process.env.BOOTSTRAP_ID, digest: process.env.BOOTSTRAP_DIGEST,
              name: `physio-production-bootstrap-${process.env.APPLICATION_SHA}`, maximum: 33_554_432 },
            stripe_webhook_archive: { id: process.env.WEBHOOK_ID, digest: process.env.WEBHOOK_DIGEST,
              name: `physio-webhook-archive-${process.env.APPLICATION_SHA}`, maximum: 67_108_864 },
            sentry_release: { id: process.env.SENTRY_ID, digest: process.env.SENTRY_DIGEST,
              name: `physio-sentry-release-${process.env.APPLICATION_SHA}`, maximum: 536_870_912 },
          };
          const output = {};
          for (const [key, expected] of Object.entries(specifications)) {
            const row = JSON.parse(fs.readFileSync(path.join(process.env.WORK, `${key}.raw.json`), 'utf8'));
            if (!Number.isSafeInteger(row.id) || String(row.id) !== expected.id || row.name !== expected.name ||
                row.digest !== expected.digest || row.expired !== false || !Number.isSafeInteger(row.workflow_run?.id) ||
                row.workflow_run.id < 1 || row.workflow_run.head_sha !== process.env.APPLICATION_SHA ||
                !Number.isSafeInteger(row.size_in_bytes) || row.size_in_bytes < 1 || row.size_in_bytes > expected.maximum) {
              throw new Error(`upstream ${key} artifact metadata differs`);
            }
            output[key] = { id: String(row.id), name: row.name, digest: row.digest, expired: row.expired,
              workflow_run_id: String(row.workflow_run.id), workflow_run_head_sha: row.workflow_run.head_sha };
          }
          fs.writeFileSync(process.env.OUT, JSON.stringify(output, null, 2) + '\n', { flag: 'wx', mode: 0o600 });
          NODE
          unset GH_TOKEN
          echo "PHYSIO_UPSTREAM_ARTIFACT_METADATA_SHA256=$(sha256sum "$packet/upstream-artifact-metadata.json" | awk '{print $1}')" >>"$GITHUB_ENV"

      - name: Verify main source config and publication handoff before credentials
        shell: bash
        env:
          APPLICATION_SHA: ${{ inputs.application_sha }}
          IMMUTABLE_IMAGE: ${{ inputs.immutable_image }}
          PUBLICATION_RECEIPT_SHA256: ${{ inputs.publication_receipt_sha256 }}
          PUBLICATION_ARTIFACT_ID: ${{ inputs.publication_artifact_id }}
          PUBLICATION_ARTIFACT_DIGEST: ${{ inputs.publication_artifact_digest }}
          CANARY_RECEIPT_SHA256: ${{ inputs.canary_receipt_sha256 }}
          CANARY_ARTIFACT_ID: ${{ inputs.canary_artifact_id }}
          CANARY_ARTIFACT_DIGEST: ${{ inputs.canary_artifact_digest }}
          PRODUCTION_BOOTSTRAP_RECEIPT_SHA256: ${{ inputs.production_bootstrap_receipt_sha256 }}
          PRODUCTION_BOOTSTRAP_ARTIFACT_ID: ${{ inputs.production_bootstrap_artifact_id }}
          PRODUCTION_BOOTSTRAP_ARTIFACT_DIGEST: ${{ inputs.production_bootstrap_artifact_digest }}
          STRIPE_WEBHOOK_RECEIPT_SHA256: ${{ env.PHYSIO_STRIPE_WEBHOOK_RECEIPT_SHA256 }}
          STRIPE_WEBHOOK_ARCHIVE_RECEIPT_SHA256: ${{ env.PHYSIO_STRIPE_WEBHOOK_ARCHIVE_RECEIPT_SHA256 }}
