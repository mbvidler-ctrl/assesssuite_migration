          EFFECT_HASH="$effect_hash" STARTED_HASH="$started_hash" \
          WEBHOOK_ID="$STRIPE_WEBHOOK_ARTIFACT_ID" WEBHOOK_DIGEST="$STRIPE_WEBHOOK_ARTIFACT_DIGEST" \
          SENTRY_ID="$SENTRY_RELEASE_ARTIFACT_ID" SENTRY_DIGEST="$SENTRY_RELEASE_ARTIFACT_DIGEST" \
            env -u FLY_API_TOKEN node --input-type=module <<'NODE'
          import fs from'node:fs';
          const catalogueCount=Number(process.env.PHYSIO_EXPECTED_CATALOGUE_COUNT);
          const catalogueChecksum=process.env.PHYSIO_EXPECTED_CATALOGUE_CHECKSUM;
          if(!Number.isSafeInteger(catalogueCount)||catalogueCount<=0||!/^[0-9a-f]{64}$/.test(catalogueChecksum||''))
