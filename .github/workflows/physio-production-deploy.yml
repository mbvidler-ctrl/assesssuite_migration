          done
          publication="$RUNNER_TEMP/physio-publication-input/physio-production-publication.json"
          readarray -t candidate_identity < <(PUBLICATION="$publication" APPLICATION_SHA="$APPLICATION_SHA" \
            IMMUTABLE_IMAGE="$IMMUTABLE_IMAGE" node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          const sha = (file) => createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const row = JSON.parse(fs.readFileSync(process.env.PUBLICATION, 'utf8'));
