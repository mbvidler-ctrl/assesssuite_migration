              advance COMPLETED COMPLETED "$DEPLOY_WORK/sentry-direct-completed-readback.json" 124 "$release" '' "$operation"
            else
              derived_readback SENTRY_ASSOCIATION_STARTED PASS APPLIED "$effect" "$request" "$release" "$operation" '' "$provider_id_sha" "$DEPLOY_WORK/sentry-reconciled-readback.json"
              if [[ "$result" == STARTED_UNRESOLVED ]]; then disposition=APPLIED; else disposition=''; fi
              if [[ "$result" != COMPLETED ]]; then
                advance SENTRY_ASSOCIATION_STARTED COMPLETED "$DEPLOY_WORK/sentry-reconciled-readback.json" 124 "$release" "$disposition" "$operation"
              fi
              derived_readback COMPLETED PASS APPLIED "$effect" "$request" "$release" "$operation" '' "$provider_id_sha" "$DEPLOY_WORK/sentry-final-milestone-readback.json"
              advance COMPLETED COMPLETED "$DEPLOY_WORK/sentry-final-milestone-readback.json" '' '' '' "$operation"
            fi
            echo 'call_needed=false' >>"$GITHUB_OUTPUT"; echo 'upload_started=false' >>"$GITHUB_OUTPUT"; echo 'association_completed=true' >>"$GITHUB_OUTPUT"
            echo "started_receipt_sha256=$started_hash" >>"$GITHUB_OUTPUT"; echo 'deployment_state=preexisting' >>"$GITHUB_OUTPUT"; exit 0
          fi
          [[ "$count" == 0 ]]
          if [[ "$result" == STARTED ]]; then
            derived_readback SENTRY_ASSOCIATION_STARTED STARTED_UNRESOLVED AMBIGUOUS "$effect" "$request" "$release" '' '' '' "$DEPLOY_WORK/sentry-ambiguous-readback.json"
            advance SENTRY_ASSOCIATION_STARTED STARTED_UNRESOLVED "$DEPLOY_WORK/sentry-ambiguous-readback.json" 124 "$release"
          fi
          IFS=$'\t' read -r _ result _ _ effect request resource < <(packet_fields); [[ "$result" == STARTED_UNRESOLVED ]]
          derived_readback SENTRY_ASSOCIATION_STARTED PASS NOT_APPLIED "$effect" "$request" "$release" '' '' '' "$DEPLOY_WORK/sentry-absent-readback.json"
          advance SENTRY_ASSOCIATION_STARTED STARTED "$DEPLOY_WORK/sentry-absent-readback.json" '' "$release" NOT_APPLIED
          echo 'call_needed=true' >>"$GITHUB_OUTPUT"; echo 'upload_started=true' >>"$GITHUB_OUTPUT"; echo 'association_completed=false' >>"$GITHUB_OUTPUT"
          echo "started_receipt_sha256=$(sha256sum "$DEPLOY_PACKET/deploy-effect-reconciliation.json"|awk '{print $1}')" >>"$GITHUB_OUTPUT"

      - name: Seal durable Sentry association STARTED resume envelope
        id: seal_sentry_started
        if: ${{ steps.sentry_plan.outputs.upload_started == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          phase="$RUNNER_TEMP/physio-deploy-sentry-current"
          result="$RUNNER_TEMP/deploy-result"
          envelope="$RUNNER_TEMP/physio-deploy-sentry-started-envelope"
          install -d -m 0700 "$envelope/phase" "$envelope/deploy-result"
          for root in "$phase" "$result"; do
            [[ -f "$root/SHA256SUMS" && ! -L "$root/SHA256SUMS" ]]
            if find "$root" -type l -print -quit | grep -q .; then exit 1; fi
            (cd "$root" && sha256sum --check --strict SHA256SUMS)
          done
          cp -a -- "$phase/." "$envelope/phase/"
          cp -a -- "$result/." "$envelope/deploy-result/"
          (cd "$envelope/phase" && sha256sum --check --strict SHA256SUMS)
          (cd "$envelope/deploy-result" && sha256sum --check --strict SHA256SUMS)

      - name: Upload durable Sentry association STARTED or RETRY_STARTED deploy phase
        id: upload_sentry_started
        if: ${{ steps.sentry_plan.outputs.upload_started == 'true' }}
        uses: ./.github/actions/upload-deploy-ledger-packet
        with:
          name: physio-deploy-phase-${{ inputs.application_sha }}-027-sentry-started-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/physio-deploy-sentry-started-envelope
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Execute one exact Sentry association and reconcile authoritative readback
        id: sentry_effect
        if: ${{ steps.select_sentry_transition.outputs.action == 'effect' }}
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: unimatter
        run: |
          set -euo pipefail
          set +x
          source "$RUNNER_TEMP/physio-sentry-deploy-phase-runtime.sh"
          [[ -n "$SENTRY_AUTH_TOKEN" && -z "${FLY_API_TOKEN:-}" && -z "${SENTRY_DSN:-}" ]]
          [[ "$SENTRY_RELEASE_VERSION" == "physio-production@$APPLICATION_SHA" ]]
          release="$SENTRY_RELEASE_VERSION"; deployment_name="assesssuite-physio-production-${APPLICATION_SHA:0:12}"; deployment_url='https://assesssuite-physio-production.fly.dev'
          encoded_release="$(RELEASE="$release" node -e "process.stdout.write(encodeURIComponent(process.env.RELEASE))")"; deployments_url="https://sentry.io/api/0/organizations/$SENTRY_ORG/releases/$encoded_release/deploys/"
          mutation_request="$DEPLOY_WORK/sentry-mutation-request.json"
          REQUEST="$mutation_request" NAME="$deployment_name" URL="$deployment_url" env -u SENTRY_AUTH_TOKEN node --input-type=module <<'NODE'
          import fs from'node:fs';fs.writeFileSync(process.env.REQUEST,JSON.stringify({environment:'physio-production',name:process.env.NAME,url:process.env.URL},null,2)+'\n',{flag:'wx',mode:0o600});
          NODE
          set +e
          node scripts/physio-sentry-deployment-api.mjs create \
            --url "$deployments_url" --token-env SENTRY_AUTH_TOKEN --request "$mutation_request" \
            --evidence-directory "$DEPLOY_WORK/sentry-mutation-http" --output "$DEPLOY_WORK/sentry-mutation-result.json" \
            >"$DEPLOY_WORK/sentry-create.stdout" 2>"$DEPLOY_WORK/sentry-create.stderr"
          exit_code=$?
          set -e
          [[ "$(wc -c <"$DEPLOY_WORK/sentry-create.stdout")" -le 1048576 && "$(wc -c <"$DEPLOY_WORK/sentry-create.stderr")" -le 1048576 ]]
          node scripts/physio-sentry-deployment-api.mjs list \
            --url "$deployments_url" --token-env SENTRY_AUTH_TOKEN --environment physio-production \
            --name "$deployment_name" --deployment-url "$deployment_url" \
            --evidence-directory "$DEPLOY_WORK/final-pages" --output "$DEPLOY_WORK/final.sanitized.json"
          FINAL="$DEPLOY_WORK/final.sanitized.json" env -u SENTRY_AUTH_TOKEN node -e \
            "const r=require(process.env.FINAL);if(r.exact_count!==1)throw Error('Sentry final exact deployment identity differs')"
          provider_id="$(READBACK="$DEPLOY_WORK/final.sanitized.json" node -e "const r=require(process.env.READBACK);process.stdout.write(r.deployments[0].id)")"; provider_id_sha="$(printf '%s' "$provider_id"|sha256sum|awk '{print $1}')"
          operation="$DEPLOY_WORK/sentry-create-operation.json"
          PROVIDER="$DEPLOY_WORK/final.sanitized.json" MUTATION="$DEPLOY_WORK/sentry-mutation-result.json" \
          MUTATION_HTTP="$DEPLOY_WORK/sentry-mutation-http/mutation.http-receipt.json" STDOUT="$DEPLOY_WORK/sentry-create.stdout" STDERR="$DEPLOY_WORK/sentry-create.stderr" \
          OUTPUT="$operation" EXIT_CODE="$exit_code" node --input-type=module <<'NODE'
          import{createHash}from'node:crypto';import fs from'node:fs';const h=f=>createHash('sha256').update(fs.readFileSync(f)).digest('hex');
          const inventory=JSON.parse(fs.readFileSync(process.env.PROVIDER,'utf8'));
          const mutation=fs.existsSync(process.env.MUTATION)?JSON.parse(fs.readFileSync(process.env.MUTATION,'utf8')):null;
          const httpReceipt=fs.existsSync(process.env.MUTATION_HTTP)?JSON.parse(fs.readFileSync(process.env.MUTATION_HTTP,'utf8')):null;
          const row={contract_version:'assesssuite-physio-sentry-deployment-operation/3.0.0',result:'PASS',provider_deployments_readback_sha256:h(process.env.PROVIDER),provider_mutation_http_receipt_sha256:httpReceipt?h(process.env.MUTATION_HTTP):null,provider_mutation_exit_code:Number(process.env.EXIT_CODE),provider_mutation_calls_attempted:1,provider_mutation_calls_confirmed:inventory.exact_count===1?1:0,provider_inventory_calls_attempted:inventory.inventory_calls_attempted,provider_inventory_calls_confirmed:inventory.inventory_calls_confirmed,provider_stdout_sha256:h(process.env.STDOUT),provider_stderr_sha256:h(process.env.STDERR),mutation_x_sentry_request_id_sha256:mutation?.mutation_x_sentry_request_id_sha256??null,reconciled_response_loss:Number(process.env.EXIT_CODE)!==0,completed_at:new Date().toISOString()};
          if(row.provider_mutation_calls_confirmed!==1||row.provider_inventory_calls_attempted!==row.provider_inventory_calls_confirmed)throw Error('Sentry provider call reconciliation differs');
          fs.writeFileSync(process.env.OUTPUT,JSON.stringify(row,null,2)+'\n',{flag:'wx',mode:0o600});
          NODE
          request_id="$(OPERATION="$operation" node -e "const r=require(process.env.OPERATION);process.stdout.write(r.mutation_x_sentry_request_id_sha256||'')")"
          IFS=$'\t' read -r phase result kind state effect request resource < <(packet_fields); [[ "$phase" == SENTRY_ASSOCIATION_STARTED && "$result" == STARTED ]]
          if [[ "$state" == STARTED ]]; then
            derived_readback COMPLETED PASS APPLIED "$effect" "$request" "$release" "$operation" "$request_id" "$provider_id_sha" "$DEPLOY_WORK/sentry-direct-completed-readback.json"
            advance COMPLETED COMPLETED "$DEPLOY_WORK/sentry-direct-completed-readback.json" "$exit_code" "$release" '' "$operation"
          else
            [[ "$state" == RETRY_STARTED ]]
            derived_readback SENTRY_ASSOCIATION_STARTED PASS APPLIED "$effect" "$request" "$release" "$operation" "$request_id" "$provider_id_sha" "$DEPLOY_WORK/sentry-applied-readback.json"
            advance SENTRY_ASSOCIATION_STARTED COMPLETED "$DEPLOY_WORK/sentry-applied-readback.json" "$exit_code" "$release" '' "$operation"
            derived_readback COMPLETED PASS APPLIED "$effect" "$request" "$release" "$operation" "$request_id" "$provider_id_sha" "$DEPLOY_WORK/sentry-completed-readback.json"
            advance COMPLETED COMPLETED "$DEPLOY_WORK/sentry-completed-readback.json" '' '' '' "$operation"
          fi
          echo 'association_completed=true' >>"$GITHUB_OUTPUT"; echo 'deployment_state=created' >>"$GITHUB_OUTPUT"

      - if: ${{ always() && steps.select_sentry_transition.outputs.action == 'effect' && steps.sentry_effect.outputs.association_completed != 'true' }}
        name: Seal Sentry association terminal or unresolved resume envelope
        id: seal_sentry_terminal
        shell: bash
        run: |
          set -euo pipefail
          phase="$RUNNER_TEMP/physio-deploy-sentry-current"
          result="$RUNNER_TEMP/deploy-result"
          envelope="$RUNNER_TEMP/physio-deploy-sentry-terminal-envelope"
          install -d -m 0700 "$envelope/phase" "$envelope/deploy-result"
          for root in "$phase" "$result"; do
            [[ -f "$root/SHA256SUMS" && ! -L "$root/SHA256SUMS" ]]
            if find "$root" -type l -print -quit | grep -q .; then exit 1; fi
            (cd "$root" && sha256sum --check --strict SHA256SUMS)
          done
          cp -a -- "$phase/." "$envelope/phase/"
          cp -a -- "$result/." "$envelope/deploy-result/"
          (cd "$envelope/phase" && sha256sum --check --strict SHA256SUMS)
          (cd "$envelope/deploy-result" && sha256sum --check --strict SHA256SUMS)

      - if: ${{ always() && steps.select_sentry_transition.outputs.action == 'effect' && steps.sentry_effect.outputs.association_completed != 'true' }}
        name: Upload Sentry association terminal or unresolved deploy phase
        id: upload_sentry_terminal
        uses: ./.github/actions/upload-deploy-ledger-packet
        with:
          name: physio-deploy-terminal-${{ inputs.application_sha }}-sentry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/physio-deploy-sentry-terminal-envelope
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Build exact Sentry deployment receipt from terminal deploy phase
        id: final_v2
        if: ${{ steps.sentry_plan.outputs.association_completed == 'true' || steps.sentry_effect.outputs.association_completed == 'true' }}
        shell: bash
        env:
          APPLICATION_SHA: ${{ inputs.application_sha }}
          IMMUTABLE_IMAGE: ${{ inputs.immutable_image }}
          SENTRY_RELEASE_RECEIPT_SHA256: ${{ inputs.sentry_release_receipt_sha256 }}
          DEPLOY_RECEIPT_SHA256: ${{ steps.sentry_admit.outputs.deploy_receipt_sha256 }}
          STARTED_RECEIPT_SHA256: ${{ steps.sentry_plan.outputs.started_receipt_sha256 }}
          STARTED_ARTIFACT_ID: ${{ steps.upload_sentry_started.outputs.artifact-id || needs.deploy.outputs.deploy_phase_artifact_id }}
          STARTED_ARTIFACT_DIGEST: ${{ steps.upload_sentry_started.outputs.artifact-digest && format('sha256:{0}', steps.upload_sentry_started.outputs.artifact-digest) || needs.deploy.outputs.deploy_phase_artifact_digest }}
          DEPLOYMENT_STATE: ${{ steps.sentry_effect.outputs.deployment_state || steps.sentry_plan.outputs.deployment_state }}
        run: |
          set -euo pipefail
          set +x
          packet="$RUNNER_TEMP/physio-deploy-sentry-current"; result="$RUNNER_TEMP/sentry-deployment-final-v2"; install -d -m 0700 "$result"
          EFFECT="$packet/deploy-effect-reconciliation.json" env -u SENTRY_AUTH_TOKEN node -e "const r=require(process.env.EFFECT);if(r.phase!=='COMPLETED'||r.result!=='COMPLETED')throw Error('terminal Sentry deploy phase differs')"
          operation="$(find "$packet" -maxdepth 1 -type f -name 'deploy-operation-receipt-*.bin' -print | sort | tail -n 1)"; [[ -n "$operation" && -s "$operation" ]]
          install -m 0600 "$operation" "$result/sentry-deployment-operation.json"
          latest_readback="$(find "$packet" -maxdepth 1 -type f -name 'deploy-readback-*-COMPLETED-r00.json' -print | sort | tail -n 1)"; [[ -n "$latest_readback" ]]
          install -m 0600 "$latest_readback" "$result/sentry-deployments-readback.json"
          release_readback="$RUNNER_TEMP/physio-sentry-deploy-work/provider-release-readback.json"; [[ -f "$release_readback" && ! -L "$release_readback" ]]
          install -m 0600 "$release_readback" "$result/sentry-release-readback.json"
          deployment_id_sha="$(READBACK="$latest_readback" node -e "const r=require(process.env.READBACK);process.stdout.write(r.observed_sentry_deployment_id_sha256)")"
          RECEIPT="$result/physio-sentry-deployment.json" OPERATION="$result/sentry-deployment-operation.json" \
          DEPLOYMENT_ID_SHA="$deployment_id_sha" RELEASE_READBACK_SHA="$(sha256sum "$result/sentry-release-readback.json"|awk '{print $1}')" \
          DEPLOYMENTS_READBACK_SHA="$(sha256sum "$result/sentry-deployments-readback.json"|awk '{print $1}')" node --input-type=module <<'NODE'
          import fs from'node:fs';const sha=process.env.APPLICATION_SHA;const operation=JSON.parse(fs.readFileSync(process.env.OPERATION,'utf8'));
          if(operation.contract_version!=='assesssuite-physio-sentry-deployment-operation/3.0.0'||operation.result!=='PASS'||
              operation.provider_inventory_calls_attempted!==operation.provider_inventory_calls_confirmed||
              operation.provider_inventory_calls_attempted<1||operation.provider_mutation_calls_confirmed>operation.provider_mutation_calls_attempted)
            throw new Error('Sentry operation counters differ');
          const row={ contract_version: 'assesssuite-physio-sentry-deployment/2.0.0', result: 'PASS',
            application:'assesssuite-physio-production',application_sha:sha,profession_id:'physio',sentry_org:'unimatter',sentry_project:'assesssuite-production',
            sentry_project_id:'4511827129663488',sentry_environment:'physio-production',release_version: process.env.SENTRY_RELEASE_VERSION,immutable_image:process.env.IMMUTABLE_IMAGE,
            release_receipt_sha256:process.env.SENTRY_RELEASE_RECEIPT_SHA256,deploy_receipt_sha256:process.env.DEPLOY_RECEIPT_SHA256,
            started_effect_artifact_id:process.env.STARTED_ARTIFACT_ID,started_effect_artifact_digest:process.env.STARTED_ARTIFACT_DIGEST,
            started_effect_receipt_sha256:process.env.STARTED_RECEIPT_SHA256,exact_live_deploy_receipt_bound:true,deployment_environment:'physio-production',
            deployment_name:`assesssuite-physio-production-${sha.slice(0,12)}`,deployment_url:'https://assesssuite-physio-production.fly.dev',
            deployment_state:process.env.DEPLOYMENT_STATE,deployment_provider_id_sha256:process.env.DEPLOYMENT_ID_SHA,
            provider_release_readback_sha256:process.env.RELEASE_READBACK_SHA,deployments_provider_readback_sha256:process.env.DEPLOYMENTS_READBACK_SHA,
            provider_mutation_calls_attempted:operation.provider_mutation_calls_attempted,
            provider_mutation_calls_confirmed:operation.provider_mutation_calls_confirmed,
            provider_inventory_calls_attempted:operation.provider_inventory_calls_attempted,
            provider_inventory_calls_confirmed:operation.provider_inventory_calls_confirmed,
            provider_mutation_http_receipt_sha256:operation.provider_mutation_http_receipt_sha256,
            mutation_response_lost:operation.reconciled_response_loss===true,
            mutation_x_sentry_request_id_sha256:operation.mutation_x_sentry_request_id_sha256??null,
            credential_scope:['SENTRY_AUTH_TOKEN'],fly_credential_absent:true,sentry_dsn_absent:true,completed_at:new Date().toISOString()};
          fs.writeFileSync(process.env.RECEIPT,JSON.stringify(row,null,2)+'\n',{flag:'wx',mode:0o600});
          NODE
          node scripts/physio-sentry-release-contract.mjs validate-deployment --receipt "$result/physio-sentry-deployment.json" \
            --application-sha "$APPLICATION_SHA" --immutable-image "$IMMUTABLE_IMAGE" \
            --release-receipt-sha256 "$SENTRY_RELEASE_RECEIPT_SHA256" --deploy-receipt-sha256 "$DEPLOY_RECEIPT_SHA256"
          (cd "$result" && LC_ALL=C find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum >SHA256SUMS && sha256sum --check --strict SHA256SUMS)
          echo "receipt_sha256=$(sha256sum "$result/physio-sentry-deployment.json"|awk '{print $1}')" >>"$GITHUB_OUTPUT"
          echo "terminal_phase_receipt_sha256=$(sha256sum "$packet/deploy-effect-reconciliation.json"|awk '{print $1}')" >>"$GITHUB_OUTPUT"

      - name: Upload exact Sentry deployment completion evidence
        id: upload_final_v2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physio-sentry-deployment-${{ inputs.application_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sentry-deployment-final-v2
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Seal exact completed deploy and Sentry result resume envelope
        id: seal_sentry_success_envelope
        if: ${{ steps.upload_final_v2.outputs.artifact-id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          phase="$RUNNER_TEMP/physio-deploy-sentry-current"
          deploy_result="$RUNNER_TEMP/deploy-result"
          sentry_result="$RUNNER_TEMP/sentry-deployment-final-v2"
          envelope="$RUNNER_TEMP/physio-deploy-sentry-success-envelope"
          install -d -m 0700 "$envelope/phase" "$envelope/deploy-result" "$envelope/sentry-result"
          for root in "$phase" "$deploy_result" "$sentry_result"; do
            [[ -d "$root" && -f "$root/SHA256SUMS" && ! -L "$root/SHA256SUMS" ]]
            if find "$root" -type l -print -quit | grep -q .; then exit 1; fi
            (cd "$root" && sha256sum --check --strict SHA256SUMS)
          done
          EFFECT="$phase/deploy-effect-reconciliation.json" DEPLOY_RECEIPT="$deploy_result/physio-production-deploy.json" \
          SENTRY_RECEIPT="$sentry_result/physio-sentry-deployment.json" env -u FLY_API_TOKEN -u SENTRY_AUTH_TOKEN node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          const h = (file) => createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const effect = JSON.parse(fs.readFileSync(process.env.EFFECT, 'utf8'));
          const deploy = JSON.parse(fs.readFileSync(process.env.DEPLOY_RECEIPT, 'utf8'));
          const sentry = JSON.parse(fs.readFileSync(process.env.SENTRY_RECEIPT, 'utf8'));
          if (effect.contract_version !== 'assesssuite-physio-deploy-effect-reconciliation/2.0.0' ||
              effect.phase !== 'COMPLETED' || effect.result !== 'COMPLETED' ||
              deploy.contract_version !== 'assesssuite-physio-deploy/3.0.0' || deploy.result !== 'PASS' ||
              sentry.contract_version !== 'assesssuite-physio-sentry-deployment/2.0.0' || sentry.result !== 'PASS' ||
              sentry.application_sha !== deploy.application_sha || sentry.immutable_image !== deploy.immutable_image ||
              sentry.deploy_receipt_sha256 !== h(process.env.DEPLOY_RECEIPT)) {
            throw new Error('completed deploy and Sentry resume envelope identity differs');
          }
          NODE
          cp -a -- "$phase/." "$envelope/phase/"
          cp -a -- "$deploy_result/." "$envelope/deploy-result/"
          cp -a -- "$sentry_result/." "$envelope/sentry-result/"
          for root in "$envelope/phase" "$envelope/deploy-result" "$envelope/sentry-result"; do
            (cd "$root" && sha256sum --check --strict SHA256SUMS)
          done

      - name: Upload exact completed deploy and Sentry result resume envelope
        id: upload_sentry_success_envelope
        if: ${{ steps.seal_sentry_success_envelope.outcome == 'success' }}
        uses: ./.github/actions/upload-deploy-ledger-packet
        with:
          name: physio-deploy-completed-reuse-${{ inputs.application_sha }}-sentry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/physio-deploy-sentry-success-envelope
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Select the one maximal Sentry transition artifact for isolated protected archival
        id: sentry_transition_artifact
        if: ${{ always() && steps.sentry_admit.outcome == 'success' }}
        shell: bash
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          STEPS_JSON="$STEPS_JSON" PACKET="$RUNNER_TEMP/physio-deploy-sentry-current/deploy-effect-reconciliation.json" \
            OUTPUT="$GITHUB_OUTPUT" node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          const steps = JSON.parse(process.env.STEPS_JSON);
          const ids = ['upload_sentry_started','upload_sentry_terminal','upload_sentry_success_envelope'];
          const candidates = ids.flatMap((id) => {
            const step = steps[id];
            const artifactId = step?.outputs?.['artifact-id'];
            const artifactDigest = step?.outputs?.['artifact-digest'];
            return artifactId && artifactDigest ? [{ id, artifactId: Number(artifactId), artifactDigest }] : [];
          }).sort((left, right) => left.artifactId - right.artifactId);
          if (candidates.length !== 1) throw new Error(`exactly one Sentry transition artifact was required: ${JSON.stringify(candidates)}`);
          const selected = candidates[0];
          const bytes = fs.readFileSync(process.env.PACKET);
          const effect = JSON.parse(bytes);
          fs.appendFileSync(process.env.OUTPUT,
            `produced=true\ncontinuation_required=${effect.phase === 'COMPLETED' ? 'false' : 'true'}\n` +
            `artifact_id=${selected.artifactId}\nartifact_digest=sha256:${selected.artifactDigest}\n` +
            `effect_receipt_sha256=${createHash('sha256').update(bytes).digest('hex')}\n`);
          NODE

  archive_sentry_transition:
    name: Durably append the exact Sentry transition from a provider-free reusable job
    needs: sentry_deployment
    if: ${{ always() && needs.sentry_deployment.outputs.transition_produced == 'true' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/physio-deploy-ledger-archive.yml
    with:
      application_sha: ${{ inputs.application_sha }}
      source_artifact_id: ${{ needs.sentry_deployment.outputs.transition_artifact_id }}
      source_artifact_digest: ${{ needs.sentry_deployment.outputs.transition_artifact_digest }}
      source_run_id: ${{ github.run_id }}
      source_run_attempt: ${{ github.run_attempt }}
      confirmation: ARCHIVE DEPLOY PACKET ${{ inputs.application_sha }} ${{ needs.sentry_deployment.outputs.transition_artifact_id }}

  continue_sentry_transition:
    name: Continue only from the exact protected Sentry transition tip
    needs: [sentry_deployment, archive_sentry_transition]
    if: ${{ needs.sentry_deployment.result == 'success' && needs.sentry_deployment.outputs.continuation_required == 'true' && needs.archive_sentry_transition.result == 'success' }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/physio-deploy-continuation.yml
    with:
      application_sha: ${{ inputs.application_sha }}
      immutable_image: ${{ inputs.immutable_image }}
      publication_artifact_id: ${{ inputs.publication_artifact_id }}
      publication_artifact_digest: ${{ inputs.publication_artifact_digest }}
      publication_receipt_sha256: ${{ inputs.publication_receipt_sha256 }}
      canary_artifact_id: ${{ inputs.canary_artifact_id }}
      canary_artifact_digest: ${{ inputs.canary_artifact_digest }}
      canary_receipt_sha256: ${{ inputs.canary_receipt_sha256 }}
      production_bootstrap_artifact_id: ${{ inputs.production_bootstrap_artifact_id }}
      production_bootstrap_artifact_digest: ${{ inputs.production_bootstrap_artifact_digest }}
      production_bootstrap_receipt_sha256: ${{ inputs.production_bootstrap_receipt_sha256 }}
      stripe_webhook_archive_artifact_id: ${{ inputs.stripe_webhook_archive_artifact_id }}
      stripe_webhook_archive_artifact_digest: ${{ inputs.stripe_webhook_archive_artifact_digest }}
      stripe_webhook_archive_receipt_sha256: ${{ inputs.stripe_webhook_archive_receipt_sha256 }}
      sentry_release_artifact_id: ${{ inputs.sentry_release_artifact_id }}
      sentry_release_artifact_digest: ${{ inputs.sentry_release_artifact_digest }}
      sentry_release_receipt_sha256: ${{ inputs.sentry_release_receipt_sha256 }}
      expected_volume_id: ${{ inputs.expected_volume_id }}
      config_sha256: ${{ inputs.config_sha256 }}
      capability_intent_id: ${{ inputs.capability_intent_id }}
      authority_reference: ${{ inputs.authority_reference }}
      continuation_ledger_commit_sha: ${{ needs.archive_sentry_transition.outputs.ledger_commit_sha }}
      continuation_ledger_record_sha256: ${{ needs.archive_sentry_transition.outputs.ledger_record_sha256 }}
      confirmation: ${{ inputs.confirmation }}
