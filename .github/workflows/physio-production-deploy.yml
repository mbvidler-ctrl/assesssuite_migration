          SENTRY="$RUNNER_TEMP/physio-sentry-release-input/physio-sentry-release.json" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const bootstrap = JSON.parse(fs.readFileSync(process.env.BOOTSTRAP, 'utf8'));
          const webhook = JSON.parse(fs.readFileSync(process.env.WEBHOOK, 'utf8'));
          const sentry = JSON.parse(fs.readFileSync(process.env.SENTRY, 'utf8'));
          if (bootstrap.contract_version !== 'assesssuite-physio-bootstrap/3.0.0' ||
              webhook.contract_version !== 'assesssuite-physio-stripe-webhook-bootstrap/1.0.0' ||
              sentry.contract_version !== 'assesssuite-physio-sentry-release/1.0.0') {
            throw new Error('deploy upstream contract version differs');
          }
          NODE
          node scripts/physio-sentry-release-contract.mjs validate-release \
            --receipt "$RUNNER_TEMP/physio-sentry-release-input/physio-sentry-release.json" \
            --application-sha "$APPLICATION_SHA"
          PUBLICATION_PACKET="$RUNNER_TEMP/physio-publication-input" \
          CANARY_PACKET="$RUNNER_TEMP/physio-canary-input" \
          BOOTSTRAP_PACKET="$RUNNER_TEMP/physio-production-bootstrap-input" \
          WEBHOOK_PACKET="$RUNNER_TEMP/physio-stripe-webhook-input" \
          SENTRY_PACKET="$RUNNER_TEMP/physio-sentry-release-input" \
          GITHUB_ENV_PATH="$GITHUB_ENV" env -u FLY_API_TOKEN -u SENTRY_AUTH_TOKEN \
            node scripts/physio-deploy-admission.mjs

      - name: Admit exact prior deploy phase or deny unresolved fresh history
        id: deploy_resume
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          APPLICATION_SHA: ${{ inputs.application_sha }}
          IMMUTABLE_IMAGE: ${{ inputs.immutable_image }}
          PUBLICATION_RECEIPT_SHA256: ${{ inputs.publication_receipt_sha256 }}
          CANARY_RECEIPT_SHA256: ${{ inputs.canary_receipt_sha256 }}
          PRODUCTION_BOOTSTRAP_RECEIPT_SHA256: ${{ inputs.production_bootstrap_receipt_sha256 }}
          STRIPE_WEBHOOK_RECEIPT_SHA256: ${{ env.PHYSIO_STRIPE_WEBHOOK_RECEIPT_SHA256 }}
          SENTRY_RELEASE_RECEIPT_SHA256: ${{ inputs.sentry_release_receipt_sha256 }}
          EXPECTED_VOLUME_ID: ${{ inputs.expected_volume_id }}
          CONFIG_SHA256: ${{ inputs.config_sha256 }}
          CAPABILITY_INTENT_ID: ${{ inputs.capability_intent_id }}
          AUTHORITY_REFERENCE: ${{ inputs.authority_reference }}
          RESUME_DEPLOY_EFFECT_ARTIFACT_ID: ${{ steps.deploy_ledger_resume.outputs.deploy_ledger_latest_artifact_id }}
          RESUME_DEPLOY_EFFECT_RECEIPT_SHA256: ${{ steps.deploy_ledger_resume.outputs.deploy_ledger_latest_effect_receipt_sha256 }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          [[ -z "${FLY_API_TOKEN:-}" && -z "${SENTRY_AUTH_TOKEN:-}" ]]
          contract_args=(
            --application-sha "$APPLICATION_SHA"
            --immutable-image "$IMMUTABLE_IMAGE"
            --publication-receipt-sha256 "$PUBLICATION_RECEIPT_SHA256"
            --canary-receipt-sha256 "$CANARY_RECEIPT_SHA256"
            --bootstrap-receipt-sha256 "$PRODUCTION_BOOTSTRAP_RECEIPT_SHA256"
            --stripe-webhook-receipt-sha256 "$STRIPE_WEBHOOK_RECEIPT_SHA256"
            --sentry-release-receipt-sha256 "$SENTRY_RELEASE_RECEIPT_SHA256"
            --config-sha256 "$CONFIG_SHA256"
            --upstream-artifact-metadata-sha256 "$PHYSIO_UPSTREAM_ARTIFACT_METADATA_SHA256"
            --expected-volume-id "$EXPECTED_VOLUME_ID"
            --capability-intent-id "$CAPABILITY_INTENT_ID"
            --authority-reference "$AUTHORITY_REFERENCE"
            --publication-capability-intent-id "$PHYSIO_DEPLOY_PUBLICATION_CAPABILITY_INTENT_ID"
            --publication-authority-reference "$PHYSIO_DEPLOY_PUBLICATION_AUTHORITY_REFERENCE"
            --bootstrap-capability-intent-id "$PHYSIO_DEPLOY_BOOTSTRAP_CAPABILITY_INTENT_ID"
            --bootstrap-authority-reference "$PHYSIO_DEPLOY_BOOTSTRAP_AUTHORITY_REFERENCE"
            --canary-capability-intent-id "$PHYSIO_DEPLOY_CANARY_CAPABILITY_INTENT_ID"
            --canary-authority-reference "$PHYSIO_DEPLOY_CANARY_AUTHORITY_REFERENCE"
            --stripe-webhook-capability-intent-id "$PHYSIO_DEPLOY_STRIPE_WEBHOOK_CAPABILITY_INTENT_ID"
            --stripe-webhook-authority-reference "$PHYSIO_DEPLOY_STRIPE_WEBHOOK_AUTHORITY_REFERENCE"
            --sentry-capability-intent-id "$PHYSIO_DEPLOY_SENTRY_CAPABILITY_INTENT_ID"
            --sentry-authority-reference "$PHYSIO_DEPLOY_SENTRY_AUTHORITY_REFERENCE"
          )
          current="$RUNNER_TEMP/physio-deploy-current"
          admission="$RUNNER_TEMP/physio-deploy-admission.json"
          if [[ "$RESUME_DEPLOY_EFFECT_ARTIFACT_ID" != '0' ]]; then
            prior_download="$RUNNER_TEMP/physio-deploy-resume-input"
            prior="$prior_download"
            prior_result=''
            prior_sentry_result=''
            if [[ -d "$prior_download/phase" && -d "$prior_download/deploy-result" ]]; then
              mapfile -t envelope_members < <(find "$prior_download" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
              [[ "${#envelope_members[@]}" == 2 || "${#envelope_members[@]}" == 3 ]]
              [[ "${envelope_members[0]}" == deploy-result && "${envelope_members[1]}" == phase ]]
              if [[ "${#envelope_members[@]}" == 3 ]]; then
                [[ "${envelope_members[2]}" == sentry-result ]]
                prior_sentry_result="$prior_download/sentry-result"
              fi
              prior="$prior_download/phase"
              prior_result="$prior_download/deploy-result"
            fi
            [[ -d "$prior" && -f "$prior/deploy-effect-reconciliation.json" ]]
            [[ "$(sha256sum "$prior/deploy-effect-reconciliation.json" | awk '{print $1}')" == "$RESUME_DEPLOY_EFFECT_RECEIPT_SHA256" ]]
            result="$(env -u GH_TOKEN node scripts/physio-release-contract.mjs validate-deploy-resume-packet \
              --packet "$prior" "${contract_args[@]}")"
            RESUME_RESULT="$result" env -u GH_TOKEN node --input-type=module <<'NODE'
          const row = JSON.parse(process.env.RESUME_RESULT);
          if (row.contractVersion !== 'assesssuite-physio-deploy-effect-reconciliation/2.0.0' ||
              !Number.isSafeInteger(row.packetOrdinal) || row.packetOrdinal < 0 ||
              !Number.isSafeInteger(row.phaseOrdinal) || row.phaseOrdinal < 0 ||
              !['STARTED','COMPLETED','STARTED_UNRESOLVED'].includes(row.result) ||
              !/^[0-9a-f]{64}$/.test(row.effectReceiptSha256 || '')) {
            throw new Error('deploy resume result differs');
          }
          NODE
            cp -a -- "$prior" "$current"
            RESUME_RESULT="$result" OUTPUT="$GITHUB_OUTPUT" env -u GH_TOKEN node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const row = JSON.parse(process.env.RESUME_RESULT);
            const flyCompleted = ['DEPLOY_COMPLETED','SENTRY_ASSOCIATION_STARTED','COMPLETED'].includes(row.phase);
            fs.appendFileSync(process.env.OUTPUT,
              `resume_completed=${row.resumeCompleted}\nfly_completed=${flyCompleted}\nresume_phase=${row.phase}\nresume_result=${row.result}\n`);
          NODE
            fly_completed="$(RESUME_RESULT="$result" env -u GH_TOKEN node -e "const r=JSON.parse(process.env.RESUME_RESULT);process.stdout.write(String(['DEPLOY_COMPLETED','SENTRY_ASSOCIATION_STARTED','COMPLETED'].includes(r.phase)))")"
            deploy_result_reuse=false
            sentry_result_reuse=false
            deploy_receipt_sha=''
            if [[ "$fly_completed" == true ]]; then
              [[ -n "$prior_result" && -d "$prior_result/deploy-phase-packet" ]]
              if find "$prior_result" -type l -print -quit | grep -q .; then exit 1; fi
              (cd "$prior_result" && sha256sum --check --strict SHA256SUMS)
              nested="$prior_result/deploy-phase-packet"
              nested_result="$(env -u GH_TOKEN node scripts/physio-release-contract.mjs validate-deploy-resume-packet \
                --packet "$nested" "${contract_args[@]}")"
              NESTED_RESULT="$nested_result" env -u GH_TOKEN node -e \
                "const r=JSON.parse(process.env.NESTED_RESULT);if(r.phase!=='DEPLOY_COMPLETED'||r.result!=='COMPLETED')throw Error('sealed deploy result phase differs')"
              RECEIPT="$prior_result/physio-production-deploy.json" CONFIG="$prior_result/rollback-target-config.toml" \
              MACHINE_CONFIG="$prior_result/rollback-target-machine-config.json" NESTED="$nested" OUTER="$prior" \
              SHA="$APPLICATION_SHA" IMAGE="$IMMUTABLE_IMAGE" VOLUME="$EXPECTED_VOLUME_ID" env -u GH_TOKEN node --input-type=module <<'NODE'
          import{createHash}from'node:crypto';import fs from'node:fs';import path from'node:path';
          const h=f=>createHash('sha256').update(fs.readFileSync(f)).digest('hex');
          const row=JSON.parse(fs.readFileSync(process.env.RECEIPT,'utf8'));
          const phaseNames=fs.readdirSync(process.env.OUTER).filter(n=>/^deploy-phase-[0-9]{4}-DEPLOY_COMPLETED-r00\.json$/.test(n));
          if(phaseNames.length!==1||row.contract_version!=='assesssuite-physio-deploy/3.0.0'||row.result!=='PASS'||
            row.application!=='assesssuite-physio-production'||row.application_sha!==process.env.SHA||
            row.immutable_image!==process.env.IMAGE||row.volume_id!==process.env.VOLUME||
            String(row.stripe_webhook_archive_artifact_id)!==process.env.STRIPE_WEBHOOK_ARTIFACT_ID||
            row.stripe_webhook_archive_artifact_digest!==process.env.STRIPE_WEBHOOK_ARTIFACT_DIGEST||
            row.stripe_webhook_archive_receipt_sha256!==process.env.PHYSIO_STRIPE_WEBHOOK_ARCHIVE_RECEIPT_SHA256||
            row.stripe_webhook_receipt_sha256!==process.env.PHYSIO_STRIPE_WEBHOOK_RECEIPT_SHA256||
            String(row.stripe_webhook_source_artifact_id)!==process.env.PHYSIO_STRIPE_WEBHOOK_SOURCE_ARTIFACT_ID||
            row.stripe_webhook_source_artifact_digest!==process.env.PHYSIO_STRIPE_WEBHOOK_SOURCE_ARTIFACT_DIGEST||
            row.stripe_webhook_ledger_commit_sha!==process.env.PHYSIO_STRIPE_WEBHOOK_LEDGER_COMMIT_SHA||
            row.stripe_webhook_ledger_record_sha256!==process.env.PHYSIO_STRIPE_WEBHOOK_LEDGER_RECORD_SHA256||
            row.stripe_webhook_ledger_packet_manifest_sha256!==process.env.PHYSIO_STRIPE_WEBHOOK_LEDGER_PACKET_MANIFEST_SHA256||
            row.rollback_target_config_sha256!==h(process.env.CONFIG)||
            row.rollback_target_machine_config_sha256!==h(process.env.MACHINE_CONFIG)||
            row.deploy_phase_packet_manifest_sha256!==h(path.join(process.env.NESTED,'SHA256SUMS'))||
            row.deploy_effect_reconciliation_sha256!==h(path.join(process.env.NESTED,'deploy-effect-reconciliation.json'))||
            row.deploy_effect_reconciliation_sha256!==h(path.join(process.env.OUTER,phaseNames[0])))
            throw new Error('sealed deploy result identity or phase joins differ');
          NODE
              canonical_result="$RUNNER_TEMP/physio-deploy-result"
              cp -a -- "$prior_result" "$canonical_result"
              deploy_result_reuse=true
              deploy_receipt_sha="$(sha256sum "$canonical_result/physio-production-deploy.json" | awk '{print $1}')"
              resume_phase="$(RESUME_RESULT="$result" env -u GH_TOKEN node -e "process.stdout.write(JSON.parse(process.env.RESUME_RESULT).phase)")"
              if [[ "$resume_phase" == COMPLETED ]]; then
                [[ -n "$prior_sentry_result" && -f "$prior_sentry_result/physio-sentry-deployment.json" ]]
                if find "$prior_sentry_result" -type l -print -quit | grep -q .; then exit 1; fi
                (cd "$prior_sentry_result" && sha256sum --check --strict SHA256SUMS)
                env -u GH_TOKEN node scripts/physio-sentry-release-contract.mjs validate-deployment \
                  --receipt "$prior_sentry_result/physio-sentry-deployment.json" --application-sha "$APPLICATION_SHA" \
                  --immutable-image "$IMMUTABLE_IMAGE" --release-receipt-sha256 "$SENTRY_RELEASE_RECEIPT_SHA256" \
                  --deploy-receipt-sha256 "$deploy_receipt_sha"
                cp -a -- "$prior_sentry_result" "$RUNNER_TEMP/physio-sentry-result"
                sentry_result_reuse=true
              else
                [[ -z "$prior_sentry_result" ]]
              fi
            else
              [[ -z "$prior_result" && -z "$prior_sentry_result" ]]
            fi
            {
              echo "deploy_result_reuse=$deploy_result_reuse"
              echo "sentry_result_reuse=$sentry_result_reuse"
              echo "deploy_receipt_sha256=$deploy_receipt_sha"
            } >>"$GITHUB_OUTPUT"
          else
            history="$RUNNER_TEMP/physio-deploy-prior-artifact-history"
            install -d -m 0700 "$history"
            page=1
            observed=0
            total=-1
            while (( page <= 1000 )); do
              response="$history/page-${page}.json"
              curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 60 --max-filesize 4194304 \
                --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/$REPOSITORY/actions/artifacts?per_page=100&page=$page" >"$response"
              readarray -t counts < <(PAGE="$response" env -u GH_TOKEN node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const row = JSON.parse(fs.readFileSync(process.env.PAGE, 'utf8'));
          if (!Number.isSafeInteger(row.total_count) || row.total_count < 0 || !Array.isArray(row.artifacts) || row.artifacts.length > 100) {
            throw new Error('deploy artifact history page differs');
          }
          process.stdout.write(`${row.total_count}\n${row.artifacts.length}\n`);
          NODE
              )
              [[ "${#counts[@]}" == 2 ]]
              if (( total < 0 )); then total="${counts[0]}"; else [[ "$total" == "${counts[0]}" ]]; fi
              observed=$((observed + counts[1]))
              if (( observed >= total )); then break; fi
              [[ "${counts[1]}" == 100 ]]
              page=$((page + 1))
            done
            [[ "$total" -ge 0 && "$observed" -ge "$total" && "$page" -le 1000 ]]
            HISTORY="$history" SHA="$APPLICATION_SHA" env -u GH_TOKEN node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const rows = fs.readdirSync(process.env.HISTORY).sort().flatMap((name) => {
            const value = JSON.parse(fs.readFileSync(path.join(process.env.HISTORY, name), 'utf8'));
            return value.artifacts;
          });
          const escaped = process.env.SHA.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const exact = new RegExp(`^physio-deploy-(?:started|phase|terminal|completed-reuse|effect)-${escaped}(?:-|$)`);
          const prior = rows.filter((row) => exact.test(row?.name || ''));
          if (prior.length !== 0) {
            const states = prior.map((row) => ({ id: row.id, name: row.name, expired: row.expired })).sort((a,b) => a.id - b.id);
            throw new Error(`fresh deploy is blocked by prior effect history (including expired evidence): ${JSON.stringify(states)}`);
          }
          NODE
            echo 'resume_completed=false' >>"$GITHUB_OUTPUT"
            echo 'fly_completed=false' >>"$GITHUB_OUTPUT"
            echo 'resume_phase=FRESH' >>"$GITHUB_OUTPUT"
            echo 'resume_result=FRESH' >>"$GITHUB_OUTPUT"
            echo 'deploy_result_reuse=false' >>"$GITHUB_OUTPUT"
            echo 'sentry_result_reuse=false' >>"$GITHUB_OUTPUT"
            echo 'deploy_receipt_sha256=' >>"$GITHUB_OUTPUT"
          fi
          env -u GH_TOKEN node scripts/physio-release-contract.mjs write-deploy-admission \
            --output "$admission" --config "$GITHUB_WORKSPACE/fly.physio.production.toml" \
            "${contract_args[@]}"
          {
            echo "publication_capability_intent_id=$PHYSIO_DEPLOY_PUBLICATION_CAPABILITY_INTENT_ID"
            echo "publication_authority_reference=$PHYSIO_DEPLOY_PUBLICATION_AUTHORITY_REFERENCE"
            echo "canary_capability_intent_id=$PHYSIO_DEPLOY_CANARY_CAPABILITY_INTENT_ID"
            echo "canary_authority_reference=$PHYSIO_DEPLOY_CANARY_AUTHORITY_REFERENCE"
            echo "bootstrap_capability_intent_id=$PHYSIO_DEPLOY_BOOTSTRAP_CAPABILITY_INTENT_ID"
            echo "bootstrap_authority_reference=$PHYSIO_DEPLOY_BOOTSTRAP_AUTHORITY_REFERENCE"
            echo "stripe_webhook_capability_intent_id=$PHYSIO_DEPLOY_STRIPE_WEBHOOK_CAPABILITY_INTENT_ID"
            echo "stripe_webhook_authority_reference=$PHYSIO_DEPLOY_STRIPE_WEBHOOK_AUTHORITY_REFERENCE"
            echo "sentry_capability_intent_id=$PHYSIO_DEPLOY_SENTRY_CAPABILITY_INTENT_ID"
            echo "sentry_authority_reference=$PHYSIO_DEPLOY_SENTRY_AUTHORITY_REFERENCE"
            echo "upstream_artifact_metadata_sha256=$PHYSIO_UPSTREAM_ARTIFACT_METADATA_SHA256"
          } >>"$GITHUB_OUTPUT"
          unset GH_TOKEN

      - name: Build exact deploy phase runtime from the trusted workflow
        if: ${{ steps.deploy_resume.outputs.fly_completed != 'true' }}
        shell: bash
        env:
          APPLICATION_SHA: ${{ inputs.application_sha }}
          IMMUTABLE_IMAGE: ${{ inputs.immutable_image }}
          PUBLICATION_RECEIPT_SHA256: ${{ inputs.publication_receipt_sha256 }}
          CANARY_RECEIPT_SHA256: ${{ inputs.canary_receipt_sha256 }}
          PRODUCTION_BOOTSTRAP_RECEIPT_SHA256: ${{ inputs.production_bootstrap_receipt_sha256 }}
          STRIPE_WEBHOOK_RECEIPT_SHA256: ${{ env.PHYSIO_STRIPE_WEBHOOK_RECEIPT_SHA256 }}
          SENTRY_RELEASE_RECEIPT_SHA256: ${{ inputs.sentry_release_receipt_sha256 }}
          EXPECTED_VOLUME_ID: ${{ inputs.expected_volume_id }}
          CONFIG_SHA256: ${{ inputs.config_sha256 }}
          CAPABILITY_INTENT_ID: ${{ inputs.capability_intent_id }}
          AUTHORITY_REFERENCE: ${{ inputs.authority_reference }}
        run: |
          set -euo pipefail
          umask 077
          runtime="$RUNNER_TEMP/physio-deploy-phase-runtime.sh"
          static="$RUNNER_TEMP/physio-deploy-static.env"
          for name in APPLICATION_SHA IMMUTABLE_IMAGE PUBLICATION_RECEIPT_SHA256 CANARY_RECEIPT_SHA256 \
            PRODUCTION_BOOTSTRAP_RECEIPT_SHA256 STRIPE_WEBHOOK_RECEIPT_SHA256 SENTRY_RELEASE_RECEIPT_SHA256 \
            EXPECTED_VOLUME_ID CONFIG_SHA256 PHYSIO_UPSTREAM_ARTIFACT_METADATA_SHA256 CAPABILITY_INTENT_ID \
            AUTHORITY_REFERENCE PHYSIO_DEPLOY_PUBLICATION_CAPABILITY_INTENT_ID \
            PHYSIO_DEPLOY_PUBLICATION_AUTHORITY_REFERENCE PHYSIO_DEPLOY_CANARY_CAPABILITY_INTENT_ID \
            PHYSIO_DEPLOY_CANARY_AUTHORITY_REFERENCE PHYSIO_DEPLOY_BOOTSTRAP_CAPABILITY_INTENT_ID \
            PHYSIO_DEPLOY_BOOTSTRAP_AUTHORITY_REFERENCE PHYSIO_DEPLOY_STRIPE_WEBHOOK_CAPABILITY_INTENT_ID \
            PHYSIO_DEPLOY_STRIPE_WEBHOOK_AUTHORITY_REFERENCE PHYSIO_DEPLOY_SENTRY_CAPABILITY_INTENT_ID \
            PHYSIO_DEPLOY_SENTRY_AUTHORITY_REFERENCE; do
            value="${!name}"
            printf '%s=%q\n' "$name" "$value" >>"$static"
          done
          cat >"$runtime" <<'RUNTIME'
          set -euo pipefail
          set +x
          umask 077
          set -a
          source "$RUNNER_TEMP/physio-deploy-static.env"
          set +a
          DEPLOY_APP=assesssuite-physio-production
          DEPLOY_PACKET="$RUNNER_TEMP/physio-deploy-current"
          DEPLOY_WORK="$RUNNER_TEMP/physio-deploy-phase-work"
          install -d -m 0700 "$DEPLOY_WORK"

          deploy_contract_args() {
            DEPLOY_CONTRACT_ARGS=(
              --application-sha "$APPLICATION_SHA" --immutable-image "$IMMUTABLE_IMAGE"
              --publication-receipt-sha256 "$PUBLICATION_RECEIPT_SHA256"
              --canary-receipt-sha256 "$CANARY_RECEIPT_SHA256"
              --bootstrap-receipt-sha256 "$PRODUCTION_BOOTSTRAP_RECEIPT_SHA256"
              --stripe-webhook-receipt-sha256 "$STRIPE_WEBHOOK_RECEIPT_SHA256"
              --sentry-release-receipt-sha256 "$SENTRY_RELEASE_RECEIPT_SHA256"
              --config-sha256 "$CONFIG_SHA256"
              --upstream-artifact-metadata-sha256 "$PHYSIO_UPSTREAM_ARTIFACT_METADATA_SHA256"
              --expected-volume-id "$EXPECTED_VOLUME_ID"
              --capability-intent-id "$CAPABILITY_INTENT_ID" --authority-reference "$AUTHORITY_REFERENCE"
              --publication-capability-intent-id "$PHYSIO_DEPLOY_PUBLICATION_CAPABILITY_INTENT_ID"
              --publication-authority-reference "$PHYSIO_DEPLOY_PUBLICATION_AUTHORITY_REFERENCE"
              --canary-capability-intent-id "$PHYSIO_DEPLOY_CANARY_CAPABILITY_INTENT_ID"
              --canary-authority-reference "$PHYSIO_DEPLOY_CANARY_AUTHORITY_REFERENCE"
              --bootstrap-capability-intent-id "$PHYSIO_DEPLOY_BOOTSTRAP_CAPABILITY_INTENT_ID"
              --bootstrap-authority-reference "$PHYSIO_DEPLOY_BOOTSTRAP_AUTHORITY_REFERENCE"
              --stripe-webhook-capability-intent-id "$PHYSIO_DEPLOY_STRIPE_WEBHOOK_CAPABILITY_INTENT_ID"
              --stripe-webhook-authority-reference "$PHYSIO_DEPLOY_STRIPE_WEBHOOK_AUTHORITY_REFERENCE"
              --sentry-capability-intent-id "$PHYSIO_DEPLOY_SENTRY_CAPABILITY_INTENT_ID"
              --sentry-authority-reference "$PHYSIO_DEPLOY_SENTRY_AUTHORITY_REFERENCE"
            )
          }

          phase_index() {
            case "$1" in
              STARTED) echo 0;; SNAPSHOT_COMPLETED) echo 1;; LIVE_MUTATION_STARTED) echo 2;;
              LIVE_DEPLOY_COMPLETED) echo 3;; PRESNAPSHOT_MANIFEST_STARTED) echo 4;;
              PRESNAPSHOT_MANIFEST_COMPLETED) echo 5;; MACHINE_STOP_STARTED) echo 6;; MACHINE_STOPPED) echo 7;;
              POSTDEPLOY_SNAPSHOT_STARTED) echo 8;; POSTDEPLOY_SNAPSHOT_COMPLETED) echo 9;;
              RESTORE_VOLUME_CREATE_STARTED) echo 10;; RESTORE_VOLUME_CREATED) echo 11;;
              VERIFIER_MACHINE_CREATE_STARTED) echo 12;; VERIFIER_MACHINE_CREATED) echo 13;;
              RESTORE_VERIFY_STARTED) echo 14;; RESTORE_VERIFIED) echo 15;;
              VERIFIER_MACHINE_STOP_STARTED) echo 16;; VERIFIER_MACHINE_STOPPED) echo 17;;
              VERIFIER_MACHINE_DESTROY_STARTED) echo 18;; VERIFIER_MACHINE_DESTROYED) echo 19;;
              RESTORE_VOLUME_DESTROY_STARTED) echo 20;; RESTORE_VOLUME_DESTROYED) echo 21;;
              MACHINE_START_STARTED) echo 22;; MACHINE_STARTED) echo 23;; RESTART_STARTED) echo 24;;
              POST_RESTART_VERIFIED) echo 25;; DEPLOY_COMPLETED) echo 26;;
              SENTRY_ASSOCIATION_STARTED) echo 27;; COMPLETED) echo 28;; *) return 1;;
            esac
          }

          packet_fields() {
            PACKET="$DEPLOY_PACKET/deploy-effect-reconciliation.json" env -u FLY_API_TOKEN -u SENTRY_AUTH_TOKEN \
              node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const row = JSON.parse(fs.readFileSync(process.env.PACKET, 'utf8'));
          const event = row.provider_subeffects.at(-1) || {};
          process.stdout.write([row.phase,row.result,row.phase_ordinal,row.packet_ordinal,event.kind || '',event.state || '',
            event.effect_ordinal ?? '',event.effect_id || '',event.request_sha256 || '',event.intended_resource_id || '']
            .join('\t') + '\n');
          NODE
          }

          resource_for_kind() {
            PACKET="$DEPLOY_PACKET/deploy-effect-reconciliation.json" KIND="$1" env -u FLY_API_TOKEN -u SENTRY_AUTH_TOKEN \
              node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const row = JSON.parse(fs.readFileSync(process.env.PACKET, 'utf8'));
          const matches = row.provider_subeffects.filter((event) => event.kind === process.env.KIND &&
            ['COMPLETED','RECONCILED_COMPLETED'].includes(event.state));
          const value = matches.at(-1)?.observed_resource_id || matches.at(-1)?.intended_resource_id || '';
          process.stdout.write(value);
          NODE
          }

          operation_receipt_for_kind() {
            PACKET_ROOT="$DEPLOY_PACKET" KIND="$1" env -u FLY_API_TOKEN -u SENTRY_AUTH_TOKEN \
              node --input-type=module <<'NODE'
          import{createHash}from'node:crypto';import fs from'node:fs';import path from'node:path';
          const root=process.env.PACKET_ROOT;let found='';
          for(const name of fs.readdirSync(root).filter((n)=>/^deploy-readback-[0-9]{4}-/.test(n)).sort()){
            const row=JSON.parse(fs.readFileSync(path.join(root,name),'utf8'));
            if(row.operation_kind!==process.env.KIND||row.operation_disposition!=='APPLIED'||row.operation_receipt_sha256===null)continue;
            const ordinal=name.match(/^deploy-readback-([0-9]{4})-/)?.[1];const receipt=path.join(root,`deploy-operation-receipt-${ordinal}.bin`);
            if(!ordinal||!fs.existsSync(receipt)||createHash('sha256').update(fs.readFileSync(receipt)).digest('hex')!==row.operation_receipt_sha256)
              throw new Error('deploy operation receipt binding differs');
            found=receipt;
          }
          if(found)process.stdout.write(found);
          NODE
          }

          next_packet_path() {
            local next="$RUNNER_TEMP/physio-deploy-next-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}-${RANDOM}"
            [[ ! -e "$next" ]]
            printf '%s' "$next"
          }

          replace_packet() {
            local next="$1" old="$RUNNER_TEMP/physio-deploy-old-${RANDOM}-${RANDOM}"
            if [[ -d "$DEPLOY_PACKET" ]]; then mv -- "$DEPLOY_PACKET" "$old"; fi
            mv -- "$next" "$DEPLOY_PACKET"
            if [[ -d "$old" ]]; then find "$old" -depth -delete; fi
          }

          snapshot_provider() {
            local suffix="$1"
            [[ -n "${FLY_API_TOKEN:-}" ]]
            curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error --max-time 60 --max-redirs 0 \
              --max-filesize 4194304 --header "Authorization: Bearer $FLY_API_TOKEN" \
              --header 'Accept: application/json' \
              "https://api.machines.dev/v1/apps/$DEPLOY_APP/machines" >"$DEPLOY_WORK/machines-$suffix.json"
            timeout --signal=TERM --kill-after=10s 60s fly volumes list --app "$DEPLOY_APP" --json >"$DEPLOY_WORK/volumes-$suffix.json"
            timeout --signal=TERM --kill-after=10s 60s fly volumes snapshots list "$EXPECTED_VOLUME_ID" \
              --app "$DEPLOY_APP" --json >"$DEPLOY_WORK/snapshots-$suffix.json"
            for file in "$DEPLOY_WORK/machines-$suffix.json" "$DEPLOY_WORK/volumes-$suffix.json" \
              "$DEPLOY_WORK/snapshots-$suffix.json"; do
              [[ -s "$file" && ! -L "$file" && "$(wc -c <"$file")" -le 4194304 ]]
            done
          }

          classify_provider() {
            local kind="$1" suffix="$2" operation_receipt="${3:-}"
            PACKET_ROOT="$DEPLOY_PACKET" KIND="$kind" MACHINES="$DEPLOY_WORK/machines-$suffix.json" \
            VOLUMES="$DEPLOY_WORK/volumes-$suffix.json" SNAPSHOTS="$DEPLOY_WORK/snapshots-$suffix.json" \
            IMAGE="$IMMUTABLE_IMAGE" VOLUME="$EXPECTED_VOLUME_ID" SHA="$APPLICATION_SHA" \
            OPERATION_RECEIPT="$operation_receipt" env -u FLY_API_TOKEN -u SENTRY_AUTH_TOKEN node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          import { canonicalizePhysioFlyImageReference } from './scripts/physio-release-contract.mjs';
          import { classifyRestartReadback } from './scripts/physio-fly-restart-contract.mjs';
          const rows = (file, keys) => { const value=JSON.parse(fs.readFileSync(file,'utf8')); if(Array.isArray(value))return value;
            for(const key of keys)if(Array.isArray(value?.[key]))return value[key]; throw new Error('provider inventory differs'); };
          const machines=rows(process.env.MACHINES,['machines','Machines','data']);
          const volumes=rows(process.env.VOLUMES,['volumes','Volumes','data']);
          const snapshots=rows(process.env.SNAPSHOTS,['snapshots','Snapshots','data']);
          const mid=(row)=>String(row?.id??row?.ID??''); const vid=(row)=>String(row?.id??row?.ID??'');
          const sid=(row)=>String(row?.id??row?.snapshot_id??row?.snapshotId??'');
          const state=(row)=>String(row?.state??row?.State??'').toLowerCase();
          const metadata=(row)=>row?.config?.metadata??row?.Config?.metadata??row?.metadata??{};
          const mounts=(row)=>row?.config?.mounts??row?.Config?.mounts??[];
          const image=(row)=>canonicalizePhysioFlyImageReference(row?.config?.image??row?.Config?.image??row?.image_ref??row?.imageRef);
          const effect=JSON.parse(fs.readFileSync(path.join(process.env.PACKET_ROOT,'deploy-effect-reconciliation.json'),'utf8'));
          const pending=[...effect.provider_subeffects].reverse().find((row)=>
            ['STARTED','RETRY_STARTED','STARTED_UNRESOLVED'].includes(row.state));
          if(!pending||pending.kind!==process.env.KIND)throw new Error('pending provider effect differs');
          const sha=(bytes)=>createHash('sha256').update(bytes).digest('hex');
          let prestate=null;
          for(const name of fs.readdirSync(process.env.PACKET_ROOT)) if(/^deploy-readback-/.test(name)){
            const bytes=fs.readFileSync(path.join(process.env.PACKET_ROOT,name)); if(sha(bytes)===pending.prestate_sha256)prestate=JSON.parse(bytes);
          }
          if(!prestate)throw new Error('pending provider prestate is absent');
          const production=machines.filter((row)=>metadata(row)['assesssuite-restore-role']!=='physio-deploy-verifier');
          const verifier=machines.filter((row)=>metadata(row)['assesssuite-restore-role']==='physio-deploy-verifier');
          const restore=volumes.filter((row)=>String(row?.name??row?.Name??'')==='assesssuite_physio_restore_gate');
          const machineIds=machines.map(mid).sort(), volumeIds=volumes.map(vid).sort(), snapshotIds=snapshots.map(sid).sort();
          const same=(left,right)=>JSON.stringify(left)===JSON.stringify(right);
          let disposition='AMBIGUOUS',resource='';
          const snapshotKind=['PREDEPLOY_SNAPSHOT_CREATE','POSTDEPLOY_SNAPSHOT_CREATE'].includes(process.env.KIND);
          if(snapshotKind){const before=prestate.observed_snapshot_ids;const created=snapshotIds.filter((id)=>!before.includes(id));
            if(before.every((id)=>snapshotIds.includes(id))&&created.length===1){disposition='APPLIED';resource=created[0];}
            else if(same(snapshotIds,before))disposition='NOT_APPLIED';}
          else if(process.env.KIND==='LIVE_DEPLOY'){
            if(production.length===1&&image(production[0])===process.env.IMAGE&&mounts(production[0]).some((m)=>
              (m.volume??m.volume_id??m.source)===process.env.VOLUME)){disposition='APPLIED';resource=mid(production[0]);}
            else if(production.length===0&&same(volumeIds,prestate.observed_volume_ids))disposition='NOT_APPLIED';}
          else if(['PRESNAPSHOT_MANIFEST_EXEC','RESTORE_VERIFIER_EXEC'].includes(process.env.KIND)){
            if(process.env.OPERATION_RECEIPT&&fs.existsSync(process.env.OPERATION_RECEIPT)&&fs.statSync(process.env.OPERATION_RECEIPT).size>0)
              disposition='APPLIED'; else if(same(machineIds,prestate.observed_machine_ids))disposition='NOT_APPLIED';}
          else if(process.env.KIND==='PRODUCTION_MACHINE_STOP'){
            if(production.length===1&&state(production[0])==='stopped'){disposition='APPLIED';resource=mid(production[0]);}
            else if(production.length===1&&state(production[0])==='started'){disposition='NOT_APPLIED';resource=mid(production[0]);}}
          else if(process.env.KIND==='RESTORE_VOLUME_CREATE'){
            if(restore.length===1&&String(restore[0]?.region??restore[0]?.Region??'')==='syd'&&
              (restore[0]?.attached_machine_id??null)===null){disposition='APPLIED';resource=vid(restore[0]);}
            else if(restore.length===0&&same(volumeIds,prestate.observed_volume_ids))disposition='NOT_APPLIED';}
          else if(process.env.KIND==='RESTORE_VERIFIER_MACHINE_CREATE'){
            if(verifier.length===1&&metadata(verifier[0])['assesssuite-release-sha']===process.env.SHA&&image(verifier[0])===process.env.IMAGE){
              disposition='APPLIED';resource=mid(verifier[0]);}
            else if(verifier.length===0&&same(machineIds,prestate.observed_machine_ids))disposition='NOT_APPLIED';}
          else if(process.env.KIND==='RESTORE_VERIFIER_MACHINE_STOP'){
            if(verifier.length===1&&state(verifier[0])==='stopped'){disposition='APPLIED';resource=mid(verifier[0]);}
            else if(verifier.length===1&&state(verifier[0])==='started'){disposition='NOT_APPLIED';resource=mid(verifier[0]);}}
          else if(process.env.KIND==='RESTORE_VERIFIER_MACHINE_DESTROY'){
            if(!machineIds.includes(pending.intended_resource_id)){disposition='APPLIED';resource=pending.intended_resource_id||'';}
            else if(same(machineIds,prestate.observed_machine_ids)){disposition='NOT_APPLIED';resource=pending.intended_resource_id||'';}}
          else if(process.env.KIND==='RESTORE_VOLUME_DESTROY'){
            if(!volumeIds.includes(pending.intended_resource_id)){disposition='APPLIED';resource=pending.intended_resource_id||'';}
            else if(same(volumeIds,prestate.observed_volume_ids)){disposition='NOT_APPLIED';resource=pending.intended_resource_id||'';}}
          else if(process.env.KIND==='PRODUCTION_MACHINE_START'){
            if(production.length===1&&state(production[0])==='started'){disposition='APPLIED';resource=mid(production[0]);}
            else if(production.length===1&&state(production[0])==='stopped'){disposition='NOT_APPLIED';resource=mid(production[0]);}}
          else if(process.env.KIND==='PRODUCTION_MACHINE_RESTART'){
            const outcome=classifyRestartReadback({prestate,machines:production,applicationSha:process.env.SHA,
              effectId:pending.effect_id,machineId:pending.intended_resource_id,immutableImage:process.env.IMAGE,
              expectedVolumeId:process.env.VOLUME});
            disposition=outcome.disposition;resource=outcome.disposition==='APPLIED'?outcome.observed_machine_id:
              pending.intended_resource_id||'';}
          process.stdout.write([disposition,resource,production.length===1?mid(production[0]):'',
            restore.length===1?vid(restore[0]):'',verifier.length===1?mid(verifier[0]):''].join('\t')+'\n');
          NODE
          }

          make_request() {
            local kind="$1" resource="$2" argv="$3" output="$4" ordinal
            ordinal="$(PACKET="$DEPLOY_PACKET/deploy-effect-reconciliation.json" env -u FLY_API_TOKEN -u SENTRY_AUTH_TOKEN \
              node -e "const r=require(process.env.PACKET);process.stdout.write(String(r.provider_subeffect_requests.length))" 2>/dev/null || echo 0)"
            deploy_contract_args
            local args=(--output "$output" --kind "$kind" --effect-ordinal "$ordinal" --argv "$argv" "${DEPLOY_CONTRACT_ARGS[@]}")
            if [[ -n "$resource" ]]; then args+=(--intended-resource-id "$resource"); fi
            env -u FLY_API_TOKEN -u SENTRY_AUTH_TOKEN node scripts/physio-release-contract.mjs write-deploy-provider-request "${args[@]}" >/dev/null
          }

          make_readback() {
            local phase="$1" suffix="$2" result="$3" disposition="$4" kind="$5" effect_id="$6" request_sha="$7"
            local resource="$8" receipt="${9:-}" runtime_suffix="${10:-}" sentry_id_sha="${11:-}"
            local production restore verifier pre_snapshot post_snapshot
            production="$(KIND="$kind" MACHINES="$DEPLOY_WORK/machines-$suffix.json" env -u FLY_API_TOKEN -u SENTRY_AUTH_TOKEN node --input-type=module <<'NODE'
          import fs from'node:fs';const v=JSON.parse(fs.readFileSync(process.env.MACHINES,'utf8'));const a=Array.isArray(v)?v:v.machines||v.Machines||v.data||[];
          const p=a.filter(r=>(r?.config?.metadata??r?.Config?.metadata??r?.metadata??{})['assesssuite-restore-role']!=='physio-deploy-verifier');
          if(p.length>1)throw new Error('production machine inventory ambiguous');if(p.length===1)process.stdout.write(String(p[0].id??p[0].ID));
          NODE
            )"
            restore="$(VOLUMES="$DEPLOY_WORK/volumes-$suffix.json" env -u FLY_API_TOKEN -u SENTRY_AUTH_TOKEN node --input-type=module <<'NODE'
          import fs from'node:fs';const v=JSON.parse(fs.readFileSync(process.env.VOLUMES,'utf8'));const a=Array.isArray(v)?v:v.volumes||v.Volumes||v.data||[];
          const p=a.filter(r=>String(r?.name??r?.Name??'')==='assesssuite_physio_restore_gate');if(p.length>1)throw new Error('restore volume ambiguous');
          if(p.length===1)process.stdout.write(String(p[0].id??p[0].ID));
          NODE
            )"
            verifier="$(MACHINES="$DEPLOY_WORK/machines-$suffix.json" env -u FLY_API_TOKEN -u SENTRY_AUTH_TOKEN node --input-type=module <<'NODE'
          import fs from'node:fs';const v=JSON.parse(fs.readFileSync(process.env.MACHINES,'utf8'));const a=Array.isArray(v)?v:v.machines||v.Machines||v.data||[];
          const p=a.filter(r=>(r?.config?.metadata??r?.Config?.metadata??r?.metadata??{})['assesssuite-restore-role']==='physio-deploy-verifier');
          if(p.length>1)throw new Error('verifier machine ambiguous');if(p.length===1)process.stdout.write(String(p[0].id??p[0].ID));
          NODE
            )"
            pre_snapshot="$(resource_for_kind PREDEPLOY_SNAPSHOT_CREATE || true)"
            post_snapshot="$(resource_for_kind POSTDEPLOY_SNAPSHOT_CREATE || true)"
            if [[ "$kind" == PREDEPLOY_SNAPSHOT_CREATE && "$disposition" == APPLIED ]]; then pre_snapshot="$resource"; fi
            if [[ "$kind" == POSTDEPLOY_SNAPSHOT_CREATE && "$disposition" == APPLIED ]]; then post_snapshot="$resource"; fi
            local args=(--output "$DEPLOY_WORK/readback-$suffix.json" --phase "$phase" --result "$result"
              --machines "$DEPLOY_WORK/machines-$suffix.json" --volumes "$DEPLOY_WORK/volumes-$suffix.json"
              --snapshots "$DEPLOY_WORK/snapshots-$suffix.json" --operation-disposition "$disposition")
            if [[ "$disposition" != NONE ]]; then
              args+=(--operation-kind "$kind" --operation-effect-id "$effect_id" --operation-request-sha256 "$request_sha")
              if [[ -n "$resource" ]]; then args+=(--operation-resource-id "$resource"); fi
            fi
            if [[ -n "$production" ]]; then args+=(--observed-machine-id "$production"); fi
            if grep -q "\"$EXPECTED_VOLUME_ID\"" "$DEPLOY_WORK/volumes-$suffix.json"; then args+=(--observed-volume-id "$EXPECTED_VOLUME_ID"); fi
            if [[ -n "$restore" ]]; then args+=(--observed-restore-volume-id "$restore"); fi
            if [[ -n "$verifier" ]]; then args+=(--observed-verifier-machine-id "$verifier"); fi
            if [[ -n "$pre_snapshot" ]]; then args+=(--observed-predeploy-snapshot-id "$pre_snapshot"); fi
            if [[ -n "$post_snapshot" ]]; then args+=(--observed-postdeploy-snapshot-id "$post_snapshot"); fi
            if [[ -n "$receipt" ]]; then args+=(--operation-receipt "$receipt"); fi
            if [[ -n "$runtime_suffix" ]]; then
              args+=(--runtime-live "$DEPLOY_WORK/live-$runtime_suffix.json" --runtime-ready "$DEPLOY_WORK/ready-$runtime_suffix.json"
                --runtime-version "$DEPLOY_WORK/version-$runtime_suffix.json" --runtime-capabilities "$DEPLOY_WORK/capabilities-$runtime_suffix.json")
            fi
            if [[ -n "$sentry_id_sha" ]]; then args+=(--observed-sentry-deployment-id-sha256 "$sentry_id_sha"); fi
            env -u FLY_API_TOKEN -u SENTRY_AUTH_TOKEN node scripts/physio-release-contract.mjs write-deploy-provider-readback "${args[@]}" >/dev/null
          }

          advance_packet() {
            local source="$1" output="$2" phase="$3" result="$4" readback="$5" exit_code="$6" resource="$7" disposition="${8:-}"
            local operation_receipt="${9:-}"
            deploy_contract_args
            local args=(--source-packet "$source" --output-packet "$output" --phase "$phase" --result "$result"
              --provider-readback "$readback" "${DEPLOY_CONTRACT_ARGS[@]}")
            if [[ -n "$exit_code" ]]; then args+=(--provider-exit-code "$exit_code"); fi
            if [[ -n "$resource" ]]; then args+=(--observed-resource-id "$resource"); fi
            if [[ -n "$disposition" ]]; then args+=(--reconciliation-disposition "$disposition"); fi
            if [[ -n "$operation_receipt" ]]; then args+=(--operation-receipt "$operation_receipt"); fi
            env -u FLY_API_TOKEN -u SENTRY_AUTH_TOKEN node scripts/physio-release-contract.mjs advance-deploy-packet "${args[@]}" >/dev/null
          }

          prepare_operation() {
            local start_phase="$1" terminal_phase="$2" kind="$3" resource="$4" argv="$5"
            local suffix="prepare-${kind,,}-${RANDOM}" request="$DEPLOY_WORK/request-${kind,,}.json"
            snapshot_provider "$suffix"
            if [[ "$kind" == PRODUCTION_MACHINE_RESTART ]]; then
              local restart_ordinal restart_effect_id
              restart_ordinal="$(PACKET="$DEPLOY_PACKET/deploy-effect-reconciliation.json" env -u FLY_API_TOKEN \
                node -e "const r=require(process.env.PACKET);process.stdout.write(String(r.provider_subeffect_requests.length))")"
              restart_effect_id="deploy:${APPLICATION_SHA}:${restart_ordinal}:production_machine_restart"
              MACHINES="$DEPLOY_WORK/machines-$suffix.json" MACHINE_ID="$resource" SHA="$APPLICATION_SHA" \
                EFFECT_ID="$restart_effect_id" IMAGE="$IMMUTABLE_IMAGE" VOLUME="$EXPECTED_VOLUME_ID" \
                BODY="$DEPLOY_WORK/restart-update-request.json" ARGV="$argv" env -u FLY_API_TOKEN node --input-type=module <<'NODE'
          import fs from'node:fs';import{buildRestartUpdate}from'./scripts/physio-fly-restart-contract.mjs';
          const machines=JSON.parse(fs.readFileSync(process.env.MACHINES,'utf8'));
          if(!Array.isArray(machines)||machines.length!==1)throw new Error('restart prestate machine count differs');
          const built=buildRestartUpdate({machine:machines[0],applicationSha:process.env.SHA,effectId:process.env.EFFECT_ID,
            machineId:process.env.MACHINE_ID,immutableImage:process.env.IMAGE,expectedVolumeId:process.env.VOLUME});
          fs.writeFileSync(process.env.BODY,JSON.stringify(built.request,null,2)+'\n',{flag:'wx',mode:0o600});
          fs.writeFileSync(process.env.ARGV,[
            `POST https://api.machines.dev/v1/apps/assesssuite-physio-production/machines/${process.env.MACHINE_ID}`,
            `restart_intent_sha256=${built.restart_intent_sha256}`,`request_body_sha256=${built.request_sha256}`,''].join('\n'),
            {flag:'w',mode:0o600});
          NODE
            fi
            if [[ ! -d "$DEPLOY_PACKET" ]]; then
              [[ "$start_phase" == STARTED && "$terminal_phase" == SNAPSHOT_COMPLETED ]]
              make_request "$kind" "$resource" "$argv" "$request"
              readarray -t identity < <(REQUEST="$request" env -u FLY_API_TOKEN -u SENTRY_AUTH_TOKEN node --input-type=module <<'NODE'
          import{createHash}from'node:crypto';import fs from'node:fs';const r=JSON.parse(fs.readFileSync(process.env.REQUEST,'utf8'));
          const canonical=v=>Array.isArray(v)?`[${v.map(canonical).join(',')}]`:v&&typeof v==='object'?`{${Object.keys(v).sort().map(k=>`${JSON.stringify(k)}:${canonical(v[k])}`).join(',')}}`:JSON.stringify(v);
          process.stdout.write(`${r.effect_id}\n${createHash('sha256').update(canonical(r)+'\n').digest('hex')}\n`);
          NODE
              )
              make_readback "$start_phase" "$suffix" PASS PRESTATE "$kind" "${identity[0]}" "${identity[1]}" "$resource"
              deploy_contract_args
              env -u FLY_API_TOKEN -u SENTRY_AUTH_TOKEN node scripts/physio-release-contract.mjs write-deploy-started-packet \
                --output-packet "$DEPLOY_PACKET" --admission "$RUNNER_TEMP/physio-deploy-admission.json" \
                --config "$GITHUB_WORKSPACE/fly.physio.production.toml" --provider-readback "$DEPLOY_WORK/readback-$suffix.json" \
                --provider-request "$request" --prestate-sha256 "$(sha256sum "$DEPLOY_WORK/readback-$suffix.json"|awk '{print $1}')" \
                "${DEPLOY_CONTRACT_ARGS[@]}" >/dev/null
              echo 'upload=true' >>"$GITHUB_OUTPUT"; echo 'call_needed=true' >>"$GITHUB_OUTPUT"; echo 'unresolved=false' >>"$GITHUB_OUTPUT"
              return
            fi
            deploy_contract_args
            env -u FLY_API_TOKEN -u SENTRY_AUTH_TOKEN node scripts/physio-release-contract.mjs validate-deploy-resume-packet \
              --packet "$DEPLOY_PACKET" "${DEPLOY_CONTRACT_ARGS[@]}" >/dev/null
            IFS=$'\t' read -r current_phase current_result current_ordinal _ current_kind current_state _ effect_id request_sha intended < <(packet_fields)
            local terminal_ordinal start_ordinal
            terminal_ordinal="$(phase_index "$terminal_phase")"; start_ordinal="$(phase_index "$start_phase")"
            if (( current_ordinal > terminal_ordinal )) || [[ "$current_phase" == "$terminal_phase" && "$current_result" == COMPLETED ]]; then
              echo 'upload=false' >>"$GITHUB_OUTPUT"; echo 'call_needed=false' >>"$GITHUB_OUTPUT"; echo 'unresolved=false' >>"$GITHUB_OUTPUT"; return
            fi
            if [[ "$current_result" == COMPLETED && "$current_ordinal" == "$((start_ordinal-1))" ]]; then
              make_request "$kind" "$resource" "$argv" "$request"
              readarray -t identity < <(REQUEST="$request" env -u FLY_API_TOKEN -u SENTRY_AUTH_TOKEN node --input-type=module <<'NODE'
          import{createHash}from'node:crypto';import fs from'node:fs';const r=JSON.parse(fs.readFileSync(process.env.REQUEST,'utf8'));
          const canonical=v=>Array.isArray(v)?`[${v.map(canonical).join(',')}]`:v&&typeof v==='object'?`{${Object.keys(v).sort().map(k=>`${JSON.stringify(k)}:${canonical(v[k])}`).join(',')}}`:JSON.stringify(v);
          process.stdout.write(`${r.effect_id}\n${createHash('sha256').update(canonical(r)+'\n').digest('hex')}\n`);
          NODE
              )
              make_readback "$start_phase" "$suffix" PASS PRESTATE "$kind" "${identity[0]}" "${identity[1]}" "$resource"
              next="$(next_packet_path)"
              advance_packet "$DEPLOY_PACKET" "$next" "$start_phase" STARTED "$DEPLOY_WORK/readback-$suffix.json" '' ''
              replace_packet "$next"
              echo 'upload=true' >>"$GITHUB_OUTPUT"; echo 'call_needed=true' >>"$GITHUB_OUTPUT"; echo 'unresolved=false' >>"$GITHUB_OUTPUT"; return
            fi
            if [[ "$current_kind" != "$kind" || ! "$current_result" =~ ^(STARTED|STARTED_UNRESOLVED)$ ]]; then
              echo "deploy phase $current_phase/$current_result cannot enter $start_phase" >&2; return 1
            fi
            # STARTED_UNRESOLVED is continued only after an exact provider readback from machines, volumes, and snapshots.
            IFS=$'\t' read -r disposition observed _ _ _ < <(classify_provider "$kind" "$suffix")
            if [[ "$disposition" == APPLIED ]]; then
              make_readback "$terminal_phase" "$suffix" PASS APPLIED "$kind" "$effect_id" "$request_sha" "$observed"
              next="$(next_packet_path)"; advance_packet "$DEPLOY_PACKET" "$next" "$terminal_phase" COMPLETED \
                "$DEPLOY_WORK/readback-$suffix.json" 124 "$observed"; replace_packet "$next"
              echo 'upload=true' >>"$GITHUB_OUTPUT"; echo 'call_needed=false' >>"$GITHUB_OUTPUT"; echo 'unresolved=false' >>"$GITHUB_OUTPUT"; return
            fi
            if [[ "$current_result" == STARTED ]]; then
              make_readback "$terminal_phase" "$suffix" STARTED_UNRESOLVED AMBIGUOUS "$kind" "$effect_id" "$request_sha" "$intended"
              next="$(next_packet_path)"; advance_packet "$DEPLOY_PACKET" "$next" "$terminal_phase" STARTED_UNRESOLVED \
                "$DEPLOY_WORK/readback-$suffix.json" 124 "$intended"; replace_packet "$next"
            fi
            if [[ "$disposition" == NOT_APPLIED ]]; then
              make_readback "$terminal_phase" "$suffix" PASS NOT_APPLIED "$kind" "$effect_id" "$request_sha" "$intended"
              next="$(next_packet_path)"; advance_packet "$DEPLOY_PACKET" "$next" "$terminal_phase" STARTED \
                "$DEPLOY_WORK/readback-$suffix.json" '' "$intended" NOT_APPLIED; replace_packet "$next"
              echo 'upload=true' >>"$GITHUB_OUTPUT"; echo 'call_needed=true' >>"$GITHUB_OUTPUT"; echo 'unresolved=false' >>"$GITHUB_OUTPUT"; return
            fi
            echo 'upload=true' >>"$GITHUB_OUTPUT"; echo 'call_needed=false' >>"$GITHUB_OUTPUT"; echo 'unresolved=true' >>"$GITHUB_OUTPUT"
            return 1
          }

          complete_operation() {
            local terminal_phase="$1" kind="$2" exit_code="$3" operation_receipt="${4:-}" runtime_suffix="${5:-}"
            local suffix="terminal-${kind,,}-${RANDOM}"
            if [[ -n "$operation_receipt" && ! -s "$operation_receipt" ]]; then operation_receipt=''; fi
            snapshot_provider "$suffix"
            IFS=$'\t' read -r _ _ _ _ current_kind _ _ effect_id request_sha intended < <(packet_fields)
            [[ "$current_kind" == "$kind" ]]
            IFS=$'\t' read -r disposition observed _ _ _ < <(classify_provider "$kind" "$suffix" "$operation_receipt")
            if [[ "$disposition" == APPLIED ]]; then
              make_readback "$terminal_phase" "$suffix" PASS APPLIED "$kind" "$effect_id" "$request_sha" "$observed" \
                "$operation_receipt" "$runtime_suffix"
              next="$(next_packet_path)"; advance_packet "$DEPLOY_PACKET" "$next" "$terminal_phase" COMPLETED \
                "$DEPLOY_WORK/readback-$suffix.json" "$exit_code" "$observed" '' "$operation_receipt"; replace_packet "$next"
              echo 'terminal_result=COMPLETED' >>"$GITHUB_OUTPUT"; return
            fi
            make_readback "$terminal_phase" "$suffix" STARTED_UNRESOLVED AMBIGUOUS "$kind" "$effect_id" "$request_sha" "$intended"
            next="$(next_packet_path)"; advance_packet "$DEPLOY_PACKET" "$next" "$terminal_phase" STARTED_UNRESOLVED \
              "$DEPLOY_WORK/readback-$suffix.json" "$exit_code" "$intended"; replace_packet "$next"
            printf 'terminal_result=%s\n' STARTED_UNRESOLVED >>"$GITHUB_OUTPUT"
            return 1
          }
          RUNTIME
          chmod 0700 "$runtime"

      - name: Install checksum-verified flyctl 0.4.71
        if: ${{ steps.deploy_resume.outputs.fly_completed != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/flyctl_0.4.71_Linux_x86_64.tar.gz"
          bin_dir="$RUNNER_TEMP/flyctl-bin"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive" \
            'https://github.com/superfly/flyctl/releases/download/v0.4.71/flyctl_0.4.71_Linux_x86_64.tar.gz'
          printf '%s  %s\n' 'a782dceed173d215c000ab94e2b08623c22267edff6d90ebe3010b3f9b671dc2' "$archive" | sha256sum --check --strict
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" flyctl
          install -m 0755 "$bin_dir/flyctl" "$bin_dir/fly"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/fly" version | grep -F '0.4.71'

      - name: Select exactly one credential-bearing Fly transition for this workflow run
        id: select_transition
        if: ${{ steps.deploy_resume.outputs.fly_completed != 'true' }}
        shell: bash
        env:
          RESUME_PHASE: ${{ steps.deploy_resume.outputs.resume_phase }}
          RESUME_RESULT: ${{ steps.deploy_resume.outputs.resume_result }}
        run: |
          set -euo pipefail
          action="$(RESUME_PHASE="$RESUME_PHASE" RESUME_RESULT="$RESUME_RESULT" node --input-type=module <<'NODE'
          const phase = process.env.RESUME_PHASE;
          const result = process.env.RESUME_RESULT;
          const pairs = [
            ['STARTED','SNAPSHOT_COMPLETED','snapshot'],
            ['LIVE_MUTATION_STARTED','LIVE_DEPLOY_COMPLETED','live-deploy'],
            ['PRESNAPSHOT_MANIFEST_STARTED','PRESNAPSHOT_MANIFEST_COMPLETED','manifest'],
            ['MACHINE_STOP_STARTED','MACHINE_STOPPED','machine-stop'],
            ['POSTDEPLOY_SNAPSHOT_STARTED','POSTDEPLOY_SNAPSHOT_COMPLETED','postsnapshot'],
            ['RESTORE_VOLUME_CREATE_STARTED','RESTORE_VOLUME_CREATED','restore-volume'],
            ['VERIFIER_MACHINE_CREATE_STARTED','VERIFIER_MACHINE_CREATED','verifier-create'],
            ['RESTORE_VERIFY_STARTED','RESTORE_VERIFIED','restore-verify'],
            ['VERIFIER_MACHINE_STOP_STARTED','VERIFIER_MACHINE_STOPPED','verifier-stop'],
            ['VERIFIER_MACHINE_DESTROY_STARTED','VERIFIER_MACHINE_DESTROYED','verifier-destroy'],
            ['RESTORE_VOLUME_DESTROY_STARTED','RESTORE_VOLUME_DESTROYED','restore-volume-destroy'],
            ['MACHINE_START_STARTED','MACHINE_STARTED','machine-start'],
            ['RESTART_STARTED','POST_RESTART_VERIFIED','restart'],
          ];
          if (phase === 'FRESH' && result === 'FRESH') { process.stdout.write('prepare_snapshot'); process.exit(0); }
          for (let index = 0; index < pairs.length; index += 1) {
            const [started, terminal, key] = pairs[index];
            if (phase === started && result === 'STARTED') { process.stdout.write(`effect_${key}`); process.exit(0); }
            if (phase === terminal && result === 'STARTED') { process.stdout.write(`effect_${key}`); process.exit(0); }
            if (phase === terminal && result === 'STARTED_UNRESOLVED') {
              process.stdout.write(`prepare_${key}`); process.exit(0);
            }
            if (phase === terminal && result === 'COMPLETED') {
              if (index + 1 === pairs.length) { process.stdout.write('finalize_deploy'); process.exit(0); }
              process.stdout.write(`prepare_${pairs[index + 1][2]}`); process.exit(0);
            }
          }
          throw new Error(`unsupported durable deploy transition ${phase}/${result}`);
          NODE
          )"
          [[ "$action" =~ ^(prepare|effect)_[a-z0-9-]+$ || "$action" == finalize_deploy ]]
          echo "action=$action" >>"$GITHUB_OUTPUT"

