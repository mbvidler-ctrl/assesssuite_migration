            'secret_bundle_fingerprint_sha256',
            'fly_secret_prestate',
            'fly_secret_import_exit_code',
            'fly_secret_readback_sha256',
            'reconciled_prior_fly_webhook_secret_digest',
          ]);
          const forbiddenKey = /(?:^|_)(?:pan|cvc|cvv|card_number|secret)(?:_|$)/i;
          const visit = (value) => {
            if (Array.isArray(value)) return value.forEach(visit);
            if (!value || typeof value !== 'object') return;
            for (const [key, child] of Object.entries(value)) {
              if (forbiddenKey.test(key) && !allowedSecretKeys.has(key)) {
                throw new Error(`forbidden secret or payment-data key in webhook packet: ${key}`);
              }
              visit(child);
            }
          };
          const secretValues = [process.env.STRIPE_KEY, process.env.FLY_KEY].filter(Boolean);
          for (const name of fs.readdirSync(process.env.PACKET)) {
            const file = path.join(process.env.PACKET, name);
            if (!fs.statSync(file).isFile()) continue;
            const bytes = fs.readFileSync(file);
            const text = bytes.toString('utf8');
            if (/whsec_[A-Za-z0-9]+/.test(text) || secretValues.some((value) => text.includes(value))) {
              throw new Error(`raw provider credential found in webhook packet: ${name}`);
            }
            if (name.endsWith('.json')) visit(JSON.parse(text));
          }
          NODE
          (cd "$packet" && LC_ALL=C find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum >SHA256SUMS && sha256sum --check --strict SHA256SUMS)
          PACKET="$packet" APPLICATION_SHA="$APPLICATION_SHA" AUTHORITY="$AUTHORITY_REFERENCE" \
          BOOTSTRAP_SHA="$BOOTSTRAP_RECEIPT_SHA256" CANARY_SHA="$CANARY_RECEIPT_SHA256" \
          INTENT="$CAPABILITY_INTENT_ID" EFFECT_SHA="$(sha256sum "$reconciliation" | awk '{print $1}')" \
          env -u STRIPE_SECRET_KEY -u FLY_API_TOKEN node --input-type=module <<'NODE'
          import { validateCompletedStripeWebhookPacket } from './scripts/physio-stripe-webhook-evidence.mjs';
          validateCompletedStripeWebhookPacket(process.env.PACKET, {
            applicationSha: process.env.APPLICATION_SHA,
            authorityReference: process.env.AUTHORITY,
            bootstrapReceiptSha256: process.env.BOOTSTRAP_SHA,
            canaryReceiptSha256: process.env.CANARY_SHA,
            capabilityIntentId: process.env.INTENT,
            effectReceiptSha256: process.env.EFFECT_SHA,
          });
          NODE
          : >"$work/finalization-complete"
          echo "stripe_webhook_receipt_sha256=$(sha256sum "$packet/physio-production-stripe-webhook.json" | awk '{print $1}')" >>"$GITHUB_OUTPUT"

      - name: Scan bounded webhook provider effect evidence
        id: packet_scan
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/physio-stripe-webhook-evidence.mjs scan --root "$RUNNER_TEMP/physio-stripe-webhook"

      - name: Upload exact webhook provider effect evidence
        id: upload
        if: ${{ always() && steps.packet_scan.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physio-production-stripe-webhook-${{ inputs.application_sha }}
          path: ${{ runner.temp }}/physio-stripe-webhook
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
