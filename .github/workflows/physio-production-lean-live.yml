name: Physio production lean live deployment

on:
  workflow_dispatch:
    inputs:
      application_sha:
        description: Exact merged application SHA to deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY ASSESSSUITE PHYSIO LIVE NOW
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: assesssuite-physio-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Bootstrap and deploy isolated Physio production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: physio-production
    env:
      APP: assesssuite-physio-production
      APP_URL: https://physio.app.assesssuite.com
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PRICE_ID_MONTHLY: ${{ secrets.STRIPE_PRICE_ID_MONTHLY }}
      STRIPE_PRICE_ID_ANNUAL: ${{ secrets.STRIPE_PRICE_ID_ANNUAL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - name: Validate exact bounded deployment request
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.ref }}" == "refs/heads/main" ]]
          [[ "${{ inputs.application_sha }}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${{ inputs.confirmation }}" == "DEPLOY ASSESSSUITE PHYSIO LIVE NOW" ]]
          for name in FLY_API_TOKEN ADMIN_PASSWORD RESEND_API_KEY OPENAI_API_KEY STRIPE_SECRET_KEY STRIPE_PRICE_ID_MONTHLY STRIPE_PRICE_ID_ANNUAL SENTRY_DSN; do
            [[ -n "${!name:-}" ]]
          done

      - name: Check out exact merged application source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.application_sha }}
          persist-credentials: false

      - name: Install checksum-verified Fly CLI 0.4.71
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/flyctl_0.4.71_Linux_x86_64.tar.gz"
          bin_dir="$RUNNER_TEMP/flyctl-bin"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive" \
            'https://github.com/superfly/flyctl/releases/download/v0.4.71/flyctl_0.4.71_Linux_x86_64.tar.gz'
          printf '%s  %s\n' 'a782dceed173d215c000ab94e2b08623c22267edff6d90ebe3010b3f9b671dc2' "$archive" | sha256sum --check --strict
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" flyctl
          install -m 0755 "$bin_dir/flyctl" "$bin_dir/fly"
          echo "$bin_dir" >>"$GITHUB_PATH"
          "$bin_dir/flyctl" version | grep -F '0.4.71'

      - name: Create isolated app and volume if absent
        shell: bash
        run: |
          set -euo pipefail
          if ! flyctl status --app "$APP" --json >/tmp/physio-status.json 2>/tmp/physio-status.err; then
            flyctl apps create "$APP" --org personal
          fi
          volumes="$(flyctl volumes list --app "$APP" --json)"
          if [[ "$(jq '[.[] | select((.Name // .name) == "assesssuite_physio_data")] | length' <<<"$volumes")" == "0" ]]; then
            flyctl volumes create assesssuite_physio_data --app "$APP" --region syd --size 3 \
              --snapshot-retention 5 --scheduled-snapshots --yes
          fi
          [[ "$(flyctl volumes list --app "$APP" --json | jq '[.[] | select((.Name // .name) == "assesssuite_physio_data")] | length')" == "1" ]]

      - name: Stage exact production secrets
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          {
            printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD"
            printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY"
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_SECRET_KEY"
            printf 'STRIPE_PRICE_ID_MONTHLY=%s\n' "$STRIPE_PRICE_ID_MONTHLY"
            printf 'STRIPE_PRICE_ID_ANNUAL=%s\n' "$STRIPE_PRICE_ID_ANNUAL"
            printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN"
            printf 'APP_URL=%s\n' "$APP_URL"
            printf 'EXPECTED_APP_URL=%s\n' "$APP_URL"
          } >"$secrets_file"
          flyctl secrets import --app "$APP" --stage --dns-checks=false <"$secrets_file"

      - name: Build and deploy exact merged source
        shell: bash
        run: |
          set -euo pipefail
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          flyctl deploy --app "$APP" --config fly.physio.production.toml --remote-only --yes \
            --build-arg "RELEASE_SHA=${{ inputs.application_sha }}" \
            --build-arg "SOURCE_BRANCH=main" \
            --build-arg "BUILD_TIMESTAMP=$built_at" \
            --build-arg "SENTRY_DSN=$SENTRY_DSN"

      - name: Prove serving release and readiness
        shell: bash
        run: |
          set -euo pipefail
          origin="https://${APP}.fly.dev"
          for attempt in $(seq 1 30); do
            live="$(curl --fail --silent --show-error --max-time 15 "$origin/api/health/live" || true)"
            ready="$(curl --fail --silent --show-error --max-time 15 "$origin/api/health/ready" || true)"
            version="$(curl --fail --silent --show-error --max-time 15 "$origin/api/version" || true)"
            if jq -e '.status == "ok" or .status == "live"' <<<"$live" >/dev/null 2>&1 &&
               jq -e '.status == "ok" or .status == "ready"' <<<"$ready" >/dev/null 2>&1 &&
               jq -e --arg sha "${{ inputs.application_sha }}" 'tostring | contains($sha)' <<<"$version" >/dev/null 2>&1; then
              printf '%s\n' "$live" >physio-health-live.json
              printf '%s\n' "$ready" >physio-health-ready.json
              printf '%s\n' "$version" >physio-version.json
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Upload lean deployment receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physio-production-lean-live-${{ inputs.application_sha }}
          path: physio-*.json
          if-no-files-found: warn
          retention-days: 90
