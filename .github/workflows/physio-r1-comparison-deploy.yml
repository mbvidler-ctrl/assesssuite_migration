name: Physio R1 isolated comparison deployment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY PHYSIO R1 ISOLATED COMPARISON
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: assesssuite-physio-r1
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy immutable R1 comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: physio-production
    env:
      APP: assesssuite-physio-r1
      APP_URL: https://assesssuite-physio-r1.fly.dev
      R1_BASELINE_SHA: ba47570e3c09279cedb1ee37c9dfa374b6cba178
      R1_FOUNDATION_SHA: d17eac5627ed104bdb6cc79007c6c5e83df3fe11
      R1_ORIGIN_FIX_SHA: 2f0f3946c1a0f57d31f0f97fe04aed03e3a210fe
      R1_RUNTIME_FIX_SHA: 073d1914c8696a6fa4357752c1d30f670e4dc761
      R1_PRE_STAGE2_SHA: 8237e6518bd739db24711e1d4ee70b3e4c3f9d36
      R1_STAGE2_FOUNDATION_SHA: 68f277e6511440232ed299402cc42c598110ca65
      R1_STAGE2_FUNCTIONAL_SHA: 553b6ea49628d6e434eb852f61ce20c353d77eec
      R1_STAGE2_TEST_SHA: 27cec6656472788f491cdb447c996bcf4a0b4bb1
      R1_PRE_SHARED_SHA: e3957f34f0585209393237dca26c16755d4501f8
      R1_SHARED_FEATURE_SHA: a8c235662197d0ec92f476c0037aef3046701496
      R1_SHARED_QUOTA_SHA: e7de6d04cf42087971f414245604ed338d3722f7
      R1_SHARED_AI_SHA: e2923aec672406dbb63299ddd769759bf3e4f06a
      R1_PRE_AI_ENABLE_SHA: 71f3ca5ec2a0d3a35e8d908a80407fe6e6e3ca0b
      R1_COMPARISON_SHA: 3a3491e79c5de3916ff1d85b162028fadbf678ed
      R1_SNAPSHOT_ID: vs_lmk35KXxYQuw0gnzvz
      R1_SNAPSHOT_DIGEST: bc800957c63e2da2a03da240f60bba1810d3d6a31175fd0ff0aef0568cbc946d
      R1_VOLUME_ID: vol_vgn67klw1jq1km04
      R1_VOLUME_NAME: assesssuite_physio_r1_data
      R1_CATALOGUE_COUNT: "236"
      R1_CATALOGUE_CHECKSUM: c39fd9e75054857d7f642c8fc2210446781d247e44c751b04499db749bfaa56f
      # The production token is intentionally app-scoped. The isolated comparison
      # therefore uses its own least-privilege deploy token.
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_R1 }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - name: Validate immutable dispatch authority
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.ref }}" == "refs/heads/main" ]]
          [[ "${{ github.actor }}" == "mbvidler-ctrl" ]]
          [[ "${{ github.triggering_actor }}" == "mbvidler-ctrl" ]]
          [[ "${{ inputs.confirmation }}" == "DEPLOY PHYSIO R1 ISOLATED COMPARISON" ]]
          for name in FLY_API_TOKEN ADMIN_PASSWORD RESEND_API_KEY OPENAI_API_KEY SENTRY_DSN; do
            [[ -n "${!name:-}" ]]
          done
          [[ "$R1_BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$R1_FOUNDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$R1_ORIGIN_FIX_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$R1_RUNTIME_FIX_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$R1_PRE_STAGE2_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$R1_STAGE2_FOUNDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$R1_STAGE2_FUNCTIONAL_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$R1_STAGE2_TEST_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$R1_PRE_SHARED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$R1_SHARED_FEATURE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$R1_SHARED_QUOTA_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$R1_SHARED_AI_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$R1_PRE_AI_ENABLE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$R1_COMPARISON_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$R1_SNAPSHOT_ID" =~ ^vs_[A-Za-z0-9]+$ ]]
          [[ "$R1_SNAPSHOT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$R1_VOLUME_ID" =~ ^vol_[A-Za-z0-9]+$ ]]
          [[ "$R1_CATALOGUE_CHECKSUM" =~ ^[0-9a-f]{64}$ ]]

      - name: Check out exact reviewed R1 comparison commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.R1_COMPARISON_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove baseline ancestry and bounded comparison adapter
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$R1_COMPARISON_SHA" ]]
          actual_chain="$RUNNER_TEMP/r1-first-parent-chain.txt"
          expected_chain="$RUNNER_TEMP/r1-expected-first-parent-chain.txt"
          git rev-list --first-parent --reverse "$R1_BASELINE_SHA..$R1_COMPARISON_SHA" >"$actual_chain"
          cat >"$expected_chain" <<COMMITS
          $R1_FOUNDATION_SHA
          $R1_ORIGIN_FIX_SHA
          $R1_RUNTIME_FIX_SHA
          $R1_PRE_STAGE2_SHA
          $R1_STAGE2_FOUNDATION_SHA
          $R1_STAGE2_FUNCTIONAL_SHA
          $R1_STAGE2_TEST_SHA
          $R1_PRE_SHARED_SHA
          $R1_SHARED_FEATURE_SHA
          $R1_SHARED_QUOTA_SHA
          $R1_SHARED_AI_SHA
          $R1_PRE_AI_ENABLE_SHA
          $R1_COMPARISON_SHA
          COMMITS
          diff -u "$expected_chain" "$actual_chain"
          actual="$RUNNER_TEMP/r1-changed-files.txt"
          expected="$RUNNER_TEMP/r1-expected-files.txt"
          git diff --name-only "$R1_BASELINE_SHA..$R1_COMPARISON_SHA" | LC_ALL=C sort >"$actual"
          cat >"$expected" <<'FILES'
          .env.example
          .github/workflows/production-prepare-release.yml
          base44/entities/PhysioCareEpisode.jsonc
          base44/entities/TreatmentProtocol.jsonc
          docs/deployment/capability-manifest.md
          docs/deployment/flag-manifest.json
          e2e/physio-offline-journey/physio-offline-journey.spec.mjs
          e2e/physio-offline-journey/runtime-fixture.mjs
          e2e/physio-offline-journey/soap-ui-contract.test.mjs
          e2e/referral-uploader/vite.config.mjs
          fly.physio.production.toml
          fly.physio.r1-comparison.toml
          fly.production.toml
          fly.rollback.production.toml
          package-lock.json
          package.json
          packages/profession-config/professions/exercise-physiology.mjs
          packages/profession-config/professions/physiotherapy.mjs
          packages/profession-config/schema.mjs
          scripts/build-physio-runtime-tree.mjs
          scripts/physio-exact-image-canary.mjs
          scripts/physio-release-contract.mjs
          scripts/provision-physio-r1-comparison-access.mjs
          server/apiUsage.mjs
          server/capabilities.mjs
          server/capabilityFlags.mjs
          server/catalogue/generate-treatment-protocols.mjs
          server/clinicalEvidence.mjs
          server/data-import/treatmentprotocol-part-1.jsonl
          server/db.mjs
          server/functions/index.mjs
          server/functions/manageIntegrations.mjs
          server/functions/manageTranscriptionSession.mjs
          server/functions/searchEvidence.mjs
          server/functions/transcribeSession.mjs
          server/index.mjs
          server/integrations/credentialVault.mjs
          server/integrations/halaxy.mjs
          server/integrations/halaxySync.mjs
          server/llm.mjs
          server/productionBootstrap.mjs
          server/productionCatalogue.mjs
          server/productionPosture.mjs
          server/publicRequestOrigin.mjs
          server/runtimeStatus.mjs
          server/tests/api-usage-ledger.test.mjs
          server/tests/assessment-runner-registry.test.mjs
          server/tests/capability-flag-registry.test.mjs
          server/tests/clinical-evidence-cache.test.mjs
          server/tests/halaxy-sync.test.mjs
          server/tests/integration-connectors.test.mjs
          server/tests/integration-management-route.test.mjs
          server/tests/persistent-transcription-session.test.mjs
          server/tests/physio-care-episode-functional.test.mjs
          server/tests/physio-deployment-config.test.mjs
          server/tests/physio-exact-image-canary.test.mjs
          server/tests/physio-legacy-ai-isolation.test.mjs
          server/tests/physio-production-posture.test.mjs
          server/tests/physio-profession-language-contract.test.mjs
          server/tests/physio-profession-surface-contract.test.mjs
          server/tests/physio-public-entry.test.mjs
          server/tests/physio-r1-comparison-access.test.mjs
          server/tests/physio-r1-comparison-contract.test.mjs
          server/tests/physio-release-workflows.test.mjs
          server/tests/physio-runtime-tree.test.mjs
          server/tests/production-deploy-workflow-validator.test.mjs
          server/tests/production-startup.test.mjs
          server/tests/public-request-origin.test.mjs
          server/tests/reference-verification-badge.test.mjs
          server/tests/report-content-generation.test.mjs
          server/tests/run-assurance.mjs
          server/tests/runtime-status.test.mjs
          server/tests/soap-dissection-fail-closed.test.mjs
          server/tests/transcription-provider-contract.test.mjs
          server/tests/treatment-protocol-catalogue.test.mjs
          server/tests/treatment-protocol-hydration.test.mjs
          server/uploadRegistry.mjs
          src/App.jsx
          src/Layout.jsx
          src/components/assessments/AssessmentCard.jsx
          src/components/assessments/AssessmentLibraryModal.jsx
          src/components/assessments/assessmentRunnerAvailability.js
          src/components/calendar/SOAPNoteModal.jsx
          src/components/physio/SaveProtocolToEpisodeDialog.jsx
          src/components/reports/wizard-steps/SectionEditor.jsx
          src/components/transcription/PersistentTranscriptionDock.jsx
          src/lib/physio/careEpisode.js
          src/lib/referenceVerificationBadge.js
          src/lib/reports/reportContentGeneration.js
          src/lib/transcription/PersistentTranscriptionContext.jsx
          src/lib/transcription/localTranscriptionStore.js
          src/pages.config.js
          src/pages/AssessmentAudit.jsx
          src/pages/Customise.jsx
          src/pages/PhysioEpisodes.jsx
          src/pages/PhysioPublicLanding.jsx
          src/pages/Register.jsx
          src/pages/TreatmentProtocols.jsx
          FILES
          diff -u "$expected" "$actual"

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Prove complete R1 assessment and application test surface
        shell: bash
        env:
          # Test the immutable source in its deterministic, provider-neutral posture.
          # Real provider credentials remain available to the later staging and deploy
          # steps, but must not leak into unit-test expectations.
          OPENAI_API_KEY: ""
          RESEND_API_KEY: ""
          SENTRY_DSN: ""
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=high
          npm run flags:check
          npm run typecheck
          npm run lint
          # Several production-artifact and runtime-closure contracts intentionally
          # inspect dist, so build it before running the complete Physio suite.
          npm run build:physio
          npm run test:physio
          npx --no-install playwright install --with-deps chromium
          npm run test:physio-offline-journey

      - name: Install checksum-verified Fly CLI 0.4.71
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/flyctl_0.4.71_Linux_x86_64.tar.gz"
          bin_dir="$RUNNER_TEMP/flyctl-bin"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive" \
            'https://github.com/superfly/flyctl/releases/download/v0.4.71/flyctl_0.4.71_Linux_x86_64.tar.gz'
          printf '%s  %s\n' 'a782dceed173d215c000ab94e2b08623c22267edff6d90ebe3010b3f9b671dc2' "$archive" | sha256sum --check --strict
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" flyctl
          install -m 0755 "$bin_dir/flyctl" "$bin_dir/fly"
          echo "$bin_dir" >>"$GITHUB_PATH"
          "$bin_dir/flyctl" version | grep -F '0.4.71'

      - name: Prove isolated restored volume before deployment
        shell: bash
        run: |
          set -euo pipefail
          status="$(flyctl status --app "$APP" --json)"
          [[ "$(jq -r '.Name // .name' <<<"$status")" == "$APP" ]]
          volumes="$(flyctl volumes list --app "$APP" --json)"
          jq -e --arg id "$R1_VOLUME_ID" --arg name "$R1_VOLUME_NAME" '
            length == 1 and
            .[0].id == $id and
            .[0].name == $name and
            .[0].state == "created" and
            .[0].size_gb == 3 and
            .[0].region == "syd" and
            .[0].encrypted == true and
            .[0].auto_backup_enabled == true and
            .[0].snapshot_retention == 5
          ' <<<"$volumes" >/dev/null
          snapshots="$(flyctl volumes snapshots list "$R1_VOLUME_ID" --app "$APP" --json)"
          jq -e --arg id "$R1_SNAPSHOT_ID" --arg digest "$R1_SNAPSHOT_DIGEST" '
            [.[] | select(
              .id == $id and
              .digest == $digest and
              .status == "created" and
              .retention_days == 5 and
              .size > 0
            )] | length == 1
          ' <<<"$snapshots" >/dev/null
          attached_machine="$(jq -r '.[0].attached_machine_id // ""' <<<"$volumes")"
          if [[ -z "$attached_machine" ]]; then
            jq -e '(.Machines | length) == 0' <<<"$status" >/dev/null
          else
            jq -e --arg machine "$attached_machine" --arg target_sha "$R1_COMPARISON_SHA" \
              --arg upgrade_sha "$R1_PRE_SHARED_SHA" --arg volume "$R1_VOLUME_ID" '
              (.Machines | length) == 1 and
              .Machines[0].id == $machine and
              .Machines[0].state == "started" and
              (
                .Machines[0].image_ref.labels.ASSESSSUITE_SOURCE_SHA == $upgrade_sha or
                .Machines[0].image_ref.labels.ASSESSSUITE_SOURCE_SHA == $target_sha
              ) and
              .Machines[0].config.mounts[0].volume == $volume
            ' <<<"$status" >/dev/null
          fi
          printf '%s\n' "$volumes" >r1-volume-before.json
          printf '%s\n' "$snapshots" >r1-snapshots-before.json

      - name: Stage only non-billing R1 comparison secrets
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          {
            printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD"
            printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY"
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN"
            printf 'APP_URL=%s\n' "$APP_URL"
            printf 'EXPECTED_APP_URL=%s\n' "$APP_URL"
          } >"$secrets_file"
          flyctl secrets import --app "$APP" --stage --dns-checks=false <"$secrets_file"
          secret_names="$(flyctl secrets list --app "$APP" --json | jq -r '.[].name' | LC_ALL=C sort)"
          expected_names=$'ADMIN_PASSWORD\nAPP_URL\nASSESSSUITE_INTEGRATION_ENCRYPTION_KEY\nEXPECTED_APP_URL\nOPENAI_API_KEY\nRESEND_API_KEY\nSENTRY_DSN'
          [[ "$secret_names" == "$expected_names" ]]
          ! grep -Eq 'STRIPE|PAYMENT' <<<"$secret_names"

      - name: Deploy exact R1 comparison source onto restored volume
        shell: bash
        run: |
          set -euo pipefail
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          flyctl deploy --app "$APP" --config fly.physio.r1-comparison.toml --remote-only --yes \
            --label "ASSESSSUITE_SOURCE_SHA=$R1_COMPARISON_SHA" \
            --build-arg "RELEASE_SHA=$R1_COMPARISON_SHA" \
            --build-arg "SOURCE_BRANCH=feature/physio-r1-stage2-shared" \
            --build-arg "BUILD_TIMESTAMP=$built_at" \
            --build-arg "SENTRY_DSN=$SENTRY_DSN"

      - name: Prove exact live release, readiness, and isolation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            live="$(curl --fail --silent --show-error --max-time 15 "$APP_URL/api/health/live" || true)"
            ready="$(curl --fail --silent --show-error --max-time 15 "$APP_URL/api/health/ready" || true)"
            version="$(curl --fail --silent --show-error --max-time 15 "$APP_URL/api/version" || true)"
            if jq -e '.status == "ok" or .status == "live"' <<<"$live" >/dev/null 2>&1 &&
               jq -e '.status == "ok" or .status == "ready"' <<<"$ready" >/dev/null 2>&1 &&
               jq -e --arg sha "$R1_COMPARISON_SHA" 'tostring | contains($sha)' <<<"$version" >/dev/null 2>&1; then
              printf '%s\n' "$live" >r1-health-live.json
              printf '%s\n' "$ready" >r1-health-ready.json
              printf '%s\n' "$version" >r1-version.json
              break
            fi
            [[ "$attempt" -lt 36 ]]
            sleep 10
          done
          capabilities="$(curl --fail --silent --show-error --max-time 15 "$APP_URL/api/capabilities")"
          jq -e '
            .profession_id == "physio" and
            .production_posture_mode == "r1-comparison" and
            .required_dependencies_ready == true and
            .production_posture_ready == true and
            .production_deployment_ready == true and
            ([
              .capabilities.general_clinical_llm,
              .capabilities.physio_ai_tasks,
              .capabilities.transcription,
              .capabilities.document_extraction,
              .capabilities.transactional_email
            ] | all(.enabled == true and .required == true and .ready == true and .status == "ready")) and
            .capabilities.payments.enabled == false and
            .capabilities.payments.required == false and
            .capabilities.payments.ready == true and
            .capabilities.payments.status == "disabled"
          ' <<<"$capabilities" >/dev/null
          printf '%s\n' "$capabilities" >r1-capabilities.json
          jq -e --argjson count "$R1_CATALOGUE_COUNT" --arg checksum "$R1_CATALOGUE_CHECKSUM" '
            .catalogue.count == $count and
            .catalogue.expected_count == $count and
            .catalogue.checksum == $checksum and
            .catalogue.expected_checksum == $checksum and
            .catalogue.ready == true
          ' r1-version.json >/dev/null
          for attempt in $(seq 1 24); do
            flyctl status --app "$APP" --json >r1-fly-status.json
            if jq -e --arg sha "$R1_COMPARISON_SHA" --arg volume "$R1_VOLUME_ID" '
              .Deployed == true and
              .Status == "deployed" and
              ([.Machines[] | select(.state == "started")] | length) == 1 and
              .Machines[0].image_ref.labels.ASSESSSUITE_SOURCE_SHA == $sha and
              .Machines[0].config.mounts[0].volume == $volume
            ' r1-fly-status.json >/dev/null; then
              break
            fi
            [[ "$attempt" -lt 24 ]]
            sleep 5
          done
          flyctl volumes list --app "$APP" --json >r1-volumes-after.json
          jq -e --arg id "$R1_VOLUME_ID" '
            length == 1 and
            .[0].id == $id and
            .[0].attached_machine_id != null
          ' r1-volumes-after.json >/dev/null

      - name: Provision and prove restricted comparison access
        shell: bash
        run: |
          set -euo pipefail
          command="node scripts/provision-physio-r1-comparison-access.mjs --apply --maxwell-email mb.vidler@gmail.com --brenton-email brenton@primehealthclinics.com"
          flyctl ssh console --app "$APP" --command "$command" >r1-access-provisioning.json
          jq -e '
            .status == "applied" and
            .maxwell == "active-existing-identity" and
            (.brenton == "activation-required" or .brenton == "active-existing-identity") and
            (
              .brenton_activation_email == "sent" or
              .brenton_activation_email == "already-sent" or
              .brenton_activation_email == "not-required"
            )
          ' r1-access-provisioning.json >/dev/null

          command="node scripts/provision-physio-r1-comparison-access.mjs --inspect --maxwell-email mb.vidler@gmail.com --brenton-email brenton@primehealthclinics.com"
          flyctl ssh console --app "$APP" --command "$command" >r1-access-inspection.json
          jq -e '
            .all_access_paths_ready == true and
            (.targets | length) == 2 and
            ([.targets[].access_state] | all(. == "active" or . == "activation-email-sent"))
          ' r1-access-inspection.json >/dev/null

          register_status="$(curl --silent --show-error --output r1-register-response.json --write-out '%{http_code}' \
            --max-time 15 --request POST \
            --header 'Content-Type: application/json' \
            --data '{"email":"unauthorised-r1-probe@example.test","password":"NotARealPassword1!"}' \
            "$APP_URL/api/apps/local-assesssuite-physio/auth/register")"
          [[ "$register_status" == "403" ]]
          jq -e '(.message // .error) == "self-registration is disabled for this deployment"' r1-register-response.json >/dev/null

      - name: Write content-free R1 deployment receipt
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg application "$APP" \
            --arg application_sha "$R1_COMPARISON_SHA" \
            --arg baseline_sha "$R1_BASELINE_SHA" \
            --arg foundation_sha "$R1_FOUNDATION_SHA" \
            --arg pre_stage2_sha "$R1_PRE_STAGE2_SHA" \
            --arg stage2_foundation_sha "$R1_STAGE2_FOUNDATION_SHA" \
            --arg stage2_functional_sha "$R1_STAGE2_FUNCTIONAL_SHA" \
            --arg stage2_test_sha "$R1_STAGE2_TEST_SHA" \
            --arg pre_shared_sha "$R1_PRE_SHARED_SHA" \
            --arg shared_feature_sha "$R1_SHARED_FEATURE_SHA" \
            --arg shared_quota_sha "$R1_SHARED_QUOTA_SHA" \
            --arg shared_ai_sha "$R1_SHARED_AI_SHA" \
            --arg pre_ai_enable_sha "$R1_PRE_AI_ENABLE_SHA" \
            --arg snapshot_id "$R1_SNAPSHOT_ID" \
            --arg snapshot_digest "$R1_SNAPSHOT_DIGEST" \
            --arg volume_id "$R1_VOLUME_ID" \
            --arg url "$APP_URL" \
            --argjson catalogue_count "$R1_CATALOGUE_COUNT" \
            --arg catalogue_checksum "$R1_CATALOGUE_CHECKSUM" \
            '{
              contract_version: "assesssuite-physio-r1-comparison-deploy/1.3.0",
              result: "PASS",
              application: $application,
              application_sha: $application_sha,
              baseline_sha: $baseline_sha,
              foundation_sha: $foundation_sha,
              pre_stage2_sha: $pre_stage2_sha,
              stage2_foundation_sha: $stage2_foundation_sha,
              stage2_functional_sha: $stage2_functional_sha,
              stage2_test_sha: $stage2_test_sha,
              pre_shared_sha: $pre_shared_sha,
              shared_feature_sha: $shared_feature_sha,
              shared_quota_sha: $shared_quota_sha,
              shared_ai_sha: $shared_ai_sha,
              pre_ai_enable_sha: $pre_ai_enable_sha,
              source_snapshot_id: $snapshot_id,
              source_snapshot_digest: $snapshot_digest,
              isolated_volume_id: $volume_id,
              public_url: $url,
              catalogue_count: $catalogue_count,
              catalogue_checksum: $catalogue_checksum,
              open_registration: false,
              payments_enabled: false,
              restricted_access_ready: true
            }' >physio-r1-comparison-deploy.json

      - name: Upload R1 deployment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physio-r1-comparison-${{ env.R1_COMPARISON_SHA }}
          path: |
            physio-r1-comparison-deploy.json
            r1-health-live.json
            r1-health-ready.json
            r1-version.json
            r1-capabilities.json
            r1-fly-status.json
            r1-access-provisioning.json
            r1-access-inspection.json
            r1-register-response.json
            r1-volume-before.json
            r1-snapshots-before.json
            r1-volumes-after.json
          if-no-files-found: warn
          retention-days: 90
